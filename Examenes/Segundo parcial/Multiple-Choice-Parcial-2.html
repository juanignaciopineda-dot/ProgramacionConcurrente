<script>
const CONF = {"TITULO":"Multiple choice del segundo parcial","BAJADA":"121 preguntas de opción múltiple. 57 salieron en parciales viejos y 64 están armadas con el apunte. El examen saca 20 al azar y se corrige al entregar. En la práctica, cada respuesta se corrige en el momento. Cada opción trae la explicación de por qué es correcta o no, y abajo está la respuesta desarrollada, la misma del cuestionario escrito.","KEY":"pc-mc-parcial2-hist","EXAMEN":20,"BLOQUES":null};
const T = {
 "RDP": "RdP: elementos, disparo y tipos de red",
 "CLA": "Clases de redes",
 "PROP": "Propiedades: acotada, viva, home state",
 "CONF": "Conflicto, concurrencia y prioridades",
 "ANA": "Análisis: grafo, invariantes, sifones",
 "IMPL": "Del modelo al programa",
 "MON": "Monitores",
 "TIEM": "RdP con tiempo",
 "SINC": "Sincronizadores y Executors",
 "ESTR": "Estructurales, reducción y composición",
 "LOG": "Regex: verificar T-invariantes en el log"
};
const BANCO = [
{"id":"fenomenos","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), 2021, recup. 2021, 2023","ex":true,"q":"¿Qué tipo de fenómenos de control e informáticos modelan (o permiten visualizar) las Redes de Petri?","o":[["Sincronización, compartir datos, paralelismo y concurrencia.","Correcta: es la respuesta que acepta la cátedra."],["P-invariantes y T-invariantes.","No: son herramientas de análisis. Esta respuesta sacó 0 en 2021."],["Sólo sistemas secuenciales con un único estado activo.","No: eso lo hace un autómata. La RdP justamente expresa concurrencia."],["Únicamente el tiempo de ejecución de los procesos.","No: las RdP autónomas ni siquiera tienen tiempo."]],"c":0,"r":"**Sincronización**, **compartir datos (recursos)**, **paralelismo** y **concurrencia**.\n\nCon esas piezas se modelan también la exclusión mutua (un lugar con una ficha compartido por dos regiones críticas), los conflictos (un lugar con varias transiciones de salida), la capacidad limitada (buffers) y la comunicación entre procesos.","n":"En 2021 respondieron \"p invariantes\" y sacaron 0: los invariantes son una herramienta de análisis, no un fenómeno que se modela. La respuesta que aceptó la cátedra en 2021, 2023 y el recuperatorio es literalmente \"sincronización y compartir datos, paralelismo y concurrencia\"."},
{"id":"adecuadas","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), capturas","ex":true,"q":"¿Son adecuadas las RdP para modelar sistemas con concurrencia y sincronización? ¿Qué más permiten visualizar?","o":[["Sí, y además permiten visualizar el paralelismo y la compartición de recursos.","Y sobre el modelo se verifican acotación, vivacidad o exclusión mutua."],["Sí, pero sólo la concurrencia, no la sincronización.","Las dos se modelan. La sincronización, con transiciones de varias entradas."],["No, sirven sólo para sistemas secuenciales.","Justamente se usan para sistemas concurrentes."],["No, para eso hacen falta autómatas finitos.","Un autómata finito no expresa la concurrencia de forma directa."]],"c":0,"r":"**Sí.** Además de la concurrencia y la sincronización permiten visualizar el **paralelismo** y el **intercambio (compartición) de recursos**.\n\nY una vez modelado, sobre la red se pueden verificar propiedades como acotación, vivacidad, ausencia de interbloqueo o exclusión mutua.","n":"En una captura respondieron que son adecuadas \"porque permiten visualizar las relaciones entre distintos estados...\" y sacaron 0. El comentario fue \"Paralelismo e intercambio de recursos\": eso es lo que hay que nombrar."},
{"id":"marcado-plaza","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"¿Qué representa el marcado de una plaza en una Red de Petri?","o":[["El estado local de la parte del sistema que esa plaza representa.","Correcta: es el comentario de la cátedra."],["El estado global de todo el sistema.","No: eso es el marcado de toda la red, no el de una plaza."],["La cantidad de veces que se disparó la transición de salida.","No: eso es el vector característico de una secuencia."],["El tiempo que lleva sensibilizada la transición.","No: eso es información temporal, no el marcado."]],"c":0,"r":"El **estado local** de la parte del sistema que esa plaza representa: por ejemplo, cuántos recursos libres hay, cuántos elementos tiene un buffer, o si un proceso está en su sección crítica.\n\nEl marcado de **toda** la red (el vector con las fichas de cada plaza) es el **estado global** del sistema.","n":"En 2021 respondieron \"el estado del sistema en un determinado momento; cuántos tokens tiene cada plaza\" y les dieron 1, pero el comentario corrige: \"el marcado de una plaza representa el estado local de la parte del sistema que representa\". Distinguí plaza (local) de red (global)."},
{"id":"dinamica","tema":"RdP: elementos, disparo y tipos de red","src":"recup. 2021","ex":true,"q":"¿Cómo se representa la dinámica de un sistema descripto por una Red de Petri?","o":[["Con la evolución del marcado a medida que se disparan las transiciones.","Correcta."],["Con la matriz de incidencia, que cambia en cada disparo.","No: la matriz de incidencia es fija, describe la estructura. Lo que cambia es el marcado."],["Con la cantidad de plazas, que crece a medida que el sistema avanza.","No: la estructura de la red no cambia."],["Con los pesos de los arcos, que se ajustan en cada disparo.","No: los pesos son parte de la estructura y no cambian."]],"c":0,"r":"Con la **evolución del marcado** a medida que se **disparan** las transiciones sensibilizadas. Cada disparo saca fichas de los lugares de entrada y pone en los de salida, y el nuevo marcado es el nuevo estado.\n\nAlgebraicamente es la **ecuación de estado**: M_{k+1} = M_{k} + C · σ, con C la matriz de incidencia y σ el vector de disparo."},
{"id":"sensibilizada-ordinaria","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2)","ex":true,"q":"En una Red de Petri **ordinaria**, ¿cuál es la condición para que una transición esté sensibilizada?","o":[["Cada una de sus plazas de entrada tiene al menos una marca.","Correcta: en una ordinaria los pesos valen 1."],["Alguna de sus plazas de entrada tiene al menos una marca.","No: tienen que ser todas."],["Sus plazas de salida están vacías.","No: las plazas de salida no intervienen en la sensibilización (salvo que estén acotadas o haya arcos especiales)."],["Cada plaza de entrada tiene exactamente tantas marcas como arcos salen de ella.","No: alcanza con una marca, el peso es 1."]],"c":0,"r":"En una red ordinaria **todos los arcos tienen peso 1**. Entonces una transición está sensibilizada cuando **cada una de sus plazas de entrada tiene al menos una marca**.\n\nEn general (red no ordinaria): t está sensibilizada en M si para toda plaza p, M(p) ≥ Pre(p, t).","n":"En 2020 respondieron \"que las plazas tengan la cantidad de tokens que solicita el peso del arco\" y el comentario fue \"¿Ordinaria? ¿peso?\". En una ordinaria no hace falta hablar de pesos: valen 1. Decí \"al menos una marca en cada plaza de entrada\"."},
{"id":"disparo-salida","tema":"RdP: elementos, disparo y tipos de red","src":"2020","ex":true,"q":"Cuando una transición se dispara, ¿qué pasa con los tokens de las plazas que tienen arcos que **salen** de la transición?","o":[["Se les agregan tantas marcas como el peso del arco transición→plaza.","Correcta."],["Se les quitan marcas.","No: las marcas se quitan de las plazas de entrada."],["No cambian: sólo cambian las de entrada.","No: el disparo consume de las entradas y produce en las salidas."],["Se les agrega una única marca, sin importar el peso.","No: en una red no ordinaria cuenta el peso del arco."]],"c":0,"r":"A cada plaza de salida se le **agregan** tantas marcas como el **peso** del arco que va de la transición a esa plaza (Post(p, t)). En una red ordinaria, una marca por plaza.\n\nEl disparo es **atómico**: en un mismo paso indivisible se quitan las marcas de las entradas y se ponen en las salidas."},
{"id":"disparo-entrada","tema":"RdP: elementos, disparo y tipos de red","src":"recup. 2021","ex":true,"q":"Cuando una transición se dispara, ¿qué pasa con los tokens de las plazas que tienen arcos que **llegan** a la transición?","o":[["Con arcos comunes se consumen según el peso; con lectores e inhibidores no se consume nada.","Correcta."],["Se consumen siempre, sin importar el tipo de arco.","No: los arcos lectores e inhibidores no consumen."],["Pasan directamente a las plazas de salida.","No: las marcas se consumen y se crean otras en las salidas; no \"viajan\"."],["Se duplican.","No."]],"c":0,"r":"Depende del tipo de arco:\n- **Arco común**: se **consumen** tantas marcas como el **peso** del arco.\n- **Arco lector**: la plaza tiene que tener marca para que la transición esté sensibilizada, pero el disparo **no la consume**.\n- **Arco inhibidor**: la plaza tiene que estar **vacía** para que la transición esté sensibilizada, y el disparo **no consume** nada.\n- **Arco reset**: el disparo **vacía** la plaza (le saca todas las marcas)."},
{"id":"lector-disparo","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"Al dispararse una transición, ¿qué pasa con los tokens de una plaza unida a ella por un arco lector?","o":[["Nada, el arco lector exige que haya marca pero no la consume.","Es un test de presencia."],["Se consumen, igual que con un arco común.","El lector no consume."],["Se vacía la plaza.","Eso hace un arco reset."],["Se agrega un token a la plaza.","El arco lector no deposita marcas."]],"c":0,"r":"**Nada.** Un arco lector exige que haya marca en la plaza para que la transición esté sensibilizada, pero **no la consume**: el disparo no cambia el marcado de esa plaza. Es un **test de presencia**.","n":"En 2021 respondieron \"los tokens pasan a la siguiente plaza\" y sacaron 0. Comentario: \"Nada, un arco lector no consume tokens\"."},
{"id":"autonoma","tema":"RdP: elementos, disparo y tipos de red","src":"2020, 2021","ex":true,"q":"¿Qué tipo de red evoluciona por los disparos de sus transiciones que cumplen con la condición de sensibilidad?","o":[["Autónoma.","Correcta."],["No autónoma.","No: en una no autónoma, además de estar sensibilizada, la transición espera un evento o un tiempo."],["Sensibilizada.","No: esa respuesta sacó 0 en 2021."],["Temporizada.","No: es un caso de no autónoma, condicionada por el tiempo."]],"c":0,"r":"Es una red que evoluciona **por sí sola**: sus transiciones se disparan sólo porque están **sensibilizadas**, sin depender de eventos externos ni del tiempo. Los instantes de disparo son desconocidos o no están indicados: la red dice **qué** puede pasar, no **cuándo**. Describe el comportamiento de forma **cualitativa**.\n\nEjemplo de la filmina: el ciclo de las estaciones. Con la ficha en primavera, la única transición sensibilizada lleva a verano, pero no se sabe cuándo.","n":"En 2021 respondieron \"una red de Petri sensibilizada\" y sacaron 0. La respuesta es \"autónoma\"."},
{"id":"no-autonoma","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), 2023","ex":true,"q":"Defina una Red de Petri **no autónoma**.","o":[["Una red cuyas transiciones sensibilizadas disparan recién cuando ocurre un evento externo o pasa un tiempo.","Correcta."],["Una red que no tiene marcado inicial.","No: eso sería una red no marcada."],["Una red en la que ninguna transición puede dispararse.","No: eso es un deadlock."],["Una red cuyas transiciones disparan aunque no estén sensibilizadas.","No: la sensibilización sigue siendo necesaria."]],"c":0,"r":"Es una red cuyo disparo depende, además de la sensibilización, de **eventos externos** o del **tiempo**:\n- **Sincronizada**: la transición sensibilizada dispara cuando ocurre un **evento externo**. Ejemplo: un motor detenido que arranca cuando llega la orden de inicio.\n- **Temporizada**: la transición dispara cuando pasa un **tiempo**. Ejemplo: el semáforo vial que pasa de verde a amarillo 60 s después de haberse sensibilizado.\n\nLas guardas y las colas de eventos asociadas a las transiciones son las que conectan la red con el medio y la hacen no autónoma."},
{"id":"evento-externo","tema":"RdP: elementos, disparo y tipos de red","src":"2020","ex":true,"q":"¿Qué tipo de red evoluciona por el disparo de transiciones sensibilizadas asociadas a un evento externo?","o":[["Una red no autónoma, en particular sincronizada.","Para disparar, la transición tiene que estar sensibilizada y tiene que ocurrir el evento."],["Una red autónoma.","En una autónoma el disparo no depende de nada externo."],["Una red coloreada.","Los colores son identidades en las fichas, no eventos."],["Una red pura.","Ser pura es no tener auto-loops, no tiene que ver con eventos."]],"c":0,"r":"Una red **no autónoma**, en particular **sincronizada**: la transición tiene que estar sensibilizada **y** tiene que ocurrir el evento externo asociado para que dispare."},
{"id":"pura","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"¿Qué es una Red de Petri pura?","o":[["Una red sin auto-loops: ninguna plaza es entrada y salida de la misma transición.","Correcta."],["Una red sin conflictos.","No: esa es la red libre de conflicto, otra clase."],["Una red en la que todos los arcos tienen peso 1.","No: esa es la red ordinaria."],["Una red con un solo token.","No: el marcado no tiene que ver con la pureza."]],"c":0,"r":"Una red **sin auto-loops** (bucles propios): ninguna plaza es a la vez **entrada y salida de una misma transición**.\n\nImporta porque, en una red pura, la **matriz de incidencia** C = Post − Pre alcanza para reconstruir la red. Con un auto-loop, Pre(p, t) = Post(p, t) y la columna de C da 0, así que el arco desaparece de la matriz.","n":"En 2021 respondieron \"una red libre de conflictos y sin bucles\" y les dieron 1. Lo que define a la pura es \"sin bucles\" (auto-loops); \"libre de conflictos\" no tiene nada que ver. Mejor no agregarlo."},
{"id":"impura-pura","tema":"RdP: elementos, disparo y tipos de red","src":"2021, recup. 2021","ex":true,"q":"¿Se puede convertir una RdP impura en pura? ¿Cómo?","o":[["Sí, agregando una plaza y una transición por cada auto-loop, o sea partiendo la transición en dos.","La primera mitad consume de la plaza y deposita en la nueva, y la segunda devuelve la marca."],["No, una red impura nunca se puede convertir.","Toda RdP impura se puede convertir en pura."],["Sí, eliminando las plazas del auto-loop.","Eso cambiaría el comportamiento de la red."],["Sí, agregando un arco inhibidor.","No hace falta ninguna extensión."]],"c":0,"r":"**Sí** (Propiedad 1.1: toda RdP impura se puede convertir en una pura), **agregando una plaza y una transición**.\n\nLa transición del auto-loop T_{j} se parte en dos: T_{j}' consume de la plaza P_{i} y deposita en una plaza nueva, y T_{j}'' consume de la plaza nueva y devuelve la marca a P_{i}. Así ninguna plaza es entrada y salida de la misma transición."},
{"id":"arcos-tipos","tema":"RdP: elementos, disparo y tipos de red","src":"filmina (paper ecuación generalizada)","ex":false,"q":"Una transición tiene un arco inhibidor desde la plaza P, y P tiene 2 marcas. ¿Puede dispararse?","o":[["No: con marcas en P, la transición no está sensibilizada.","Correcta."],["Sí, y consume las 2 marcas de P.","No: así se comporta un arco reset, y además el inhibidor la deshabilita."],["Sí, y consume una marca de P.","No: el inhibidor no consume."],["Sí, sin tocar las marcas de P.","No: así sería un arco lector."]],"c":0,"r":"Los tres unen una plaza con una transición y aumentan la capacidad de expresión de la red:\n- **Inhibidor**: si hay marca en la plaza, la transición **no** está sensibilizada (exige plaza vacía). No consume.\n- **Lector**: si **no** hay marca en la plaza, la transición no está sensibilizada. El disparo no consume.\n- **Reset**: al dispararse la transición se retiran **todas** las marcas de la plaza (la pone en cero).\n\nLos inhibidores y lectores permiten modelar **prioridades**."},
{"id":"guardas-eventos","tema":"RdP: elementos, disparo y tipos de red","src":"filmina (paper ecuación generalizada)","ex":false,"q":"¿Qué son las guardas y los eventos asociados a una transición? ¿Qué tipo de red producen?","o":[["Condiciones externas al marcado que se suman a la sensibilización; hacen a la red no autónoma.","Correcta."],["Arcos especiales que consumen todos los tokens.","No: eso es el arco reset."],["Plazas extra que se agregan para hacer pura a la red.","No."],["Prioridades fijas de las transiciones.","No: las prioridades son otra extensión."]],"c":0,"r":"- Una **guarda** es una variable lógica asociada a una transición: para dispararla, además de estar sensibilizada, la guarda tiene que ser verdadera.\n- Un **evento** se guarda en una **cola** (un contador) asociada a la transición: se incrementa cuando llega un evento y se decrementa cuando la transición dispara. Para estar sensibilizada, la cola tiene que tener al menos un evento.\n\nLas dos comunican la red con el medio, así que la hacen **no autónoma**."},
{"id":"rdp-def","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Por qué se dice que una RdP es un grafo bipartito?","o":[["Porque sus nodos son de dos clases (lugares y transiciones) y cada arco une un nodo de cada clase.","Correcta."],["Porque siempre tiene dos componentes conexas.","No."],["Porque cada transición tiene exactamente dos arcos.","No: puede tener cualquier cantidad."],["Porque se puede dibujar en dos colores.","No."]],"c":0,"r":"Es un **grafo bipartito dirigido**: lugares y transiciones se alternan en cualquier camino, y cada arco une un lugar con una transición (o al revés). Formalmente:\n\nR = ⟨P, T, Pre, Post⟩\n\ncon P el conjunto finito de **lugares** (condiciones o estados locales), T el de **transiciones** (eventos o acciones), y Pre, Post: P × T → ℕ los pesos de los arcos de entrada y de salida. La **matriz de incidencia** es C = Post − Pre. Una **red marcada** es el par ⟨R, M_{0}⟩: las **fichas** indican que una condición se cumple o cuántos recursos hay, y el **marcado** M es el estado de la red."},
{"id":"disparo-props","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"Si una transición está sensibilizada, ¿qué se puede asegurar?","o":[["Que puede dispararse, no que vaya a dispararse.","Sólo se sabe que el próximo cambio de marcado será el disparo de alguna de las sensibilizadas."],["Que se dispara inmediatamente.","El disparo no es obligatorio, y en una red autónoma es no determinista cuál dispara."],["Que es la única que puede dispararse.","Puede haber varias sensibilizadas a la vez."],["Que la red es viva.","La vivacidad es una propiedad de toda la red y de todas sus marcas alcanzables."]],"c":0,"r":"Sensibilizada significa que **puede** dispararse: cada lugar de entrada tiene al menos tantas fichas como el peso de su arco. Tres propiedades:\n- **Sensibilizada no significa que va a disparar.** Sólo sabemos que el próximo cambio de marcado será el disparo de alguna de las sensibilizadas (no determinismo acotado).\n- **El disparo es indivisible**: no hay estados intermedios.\n- **Duración cero**: en una red no temporizada lo que lleva tiempo es la espera en los lugares, no el disparo."},
{"id":"fuente-sumidero","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Qué es una transición fuente?","o":[["Una transición sin lugares de entrada, que está siempre sensibilizada.","Correcta: es la definición de transición fuente."],["Una transición sin lugares de salida.","No: esa es la transición sumidero."],["Una transición con un auto-loop.","No."],["La primera transición que dispara desde M0.","No."]],"c":0,"r":"- **Fuente** (source): no tiene lugares de entrada. Está **siempre sensibilizada** y genera fichas de la nada: modela la llegada de clientes, pedidos o eventos del exterior.\n- **Sumidero** (sink): no tiene lugares de salida. Consume fichas y no produce nada: modela la salida del sistema.\n\nUna transición fuente que deposita en un lugar del que nada saca lo hace crecer sin límite: la red **no está acotada**."},
{"id":"coloreadas","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Las redes de Petri coloreadas agregan poder expresivo?","o":[["No, una coloreada con un número finito de colores se puede desplegar en una ordinaria equivalente.","Son una abreviatura, que escribe lo mismo de forma más compacta."],["Sí, modelan sistemas que ninguna red ordinaria puede modelar.","Con colores finitos, el despliegue da una ordinaria equivalente."],["Sí, porque agregan tiempo a las transiciones.","El tiempo lo agregan las redes temporizadas, no los colores."],["No, porque no se pueden usar con más de un proceso.","Justamente sirven para muchos procesos idénticos."]],"c":0,"r":"En una red coloreada cada **ficha lleva un color** (una identidad, que puede ser una n-tupla), y las condiciones de disparo se definen con **funciones asociadas a los arcos**. Sirven cuando hay muchos procesos idénticos: en lugar de copiar el mismo subgrafo, se pone la identidad en la ficha.\n\n- **Plegado** (folding): fusionar varios lugares o transiciones en uno coloreado.\n- **Despliegue** (unfolding): la operación inversa.\n\nEl despliegue completo de una red coloreada da una **única red ordinaria**. Por lo tanto **no agregan poder expresivo**, agregan **compacidad**."},
{"id":"orden-parcial","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre la semántica de interleaving y la semántica de orden parcial de una red concurrente?","o":[["En orden parcial, dos disparos independientes simplemente no se ordenan; en interleaving se enumeran todas sus intercalaciones.","Correcta."],["El interleaving sólo vale para monoprocesadores y el orden parcial sólo para multiprocesadores.","No: son dos formas de dar semántica, no dependen del hardware."],["En orden parcial no puede haber conflictos.","No: los conflictos siguen existiendo."],["Son lo mismo con distinto nombre.","No."]],"c":0,"r":"- **Interleaving**: se impone un orden **total** a los disparos. La concurrencia se representa como todas las intercalaciones posibles, y eso hace explotar el espacio de estados.\n- **Orden parcial** (true concurrency): dos disparos que no compiten por fichas **no están ordenados** entre sí; son incomparables. No hace falta enumerar las n! intercalaciones equivalentes.\n\nPor eso la RdP es un formalismo de concurrencia y no sólo un autómata dibujado distinto: puede decir \"estos dos eventos son independientes\"."},
{"id":"abrev-ext","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Cuál de estas es una abreviatura (no agrega poder de modelado)?","o":[["Una red generalizada, con pesos en los arcos.","Correcta: toda red generalizada se puede transformar en una ordinaria equivalente."],["Una red con arcos inhibidores.","No: es una extensión. Con inhibidores la red alcanza el poder de una máquina de Turing."],["Una red con prioridades entre transiciones.","No: en general las prioridades, igual que los inhibidores, aumentan el poder de modelado."],["Una red temporizada.","No: es no autónoma, y no se puede convertir en una ordinaria."]],"c":0,"r":"- **Abreviaturas**: permiten escribir lo mismo de forma más compacta, **sin** agregar poder de modelado. Se mantienen las propiedades de las redes ordinarias, con algunas adaptaciones. Ejemplos: las redes **generalizadas** (arcos con peso) y las **coloreadas** con un número finito de colores. Las dos se pueden convertir en una red ordinaria equivalente, aunque para las generalizadas la transformación es sumamente compleja.\n- **Extensiones**: reglas nuevas que **sí** aumentan el poder de modelado. A cambio, **no todas** las propiedades de las ordinarias se mantienen. Ejemplos: los **arcos inhibidores** (con ellos la red alcanza el poder de una máquina de Turing, y la acotación o la alcanzabilidad dejan de ser decidibles en general) y las **prioridades**.\n\nLas **no autónomas** (sincronizadas o temporizadas) son las que se implementan, y **no** se pueden convertir en ordinarias: el evento o el reloj externos no se representan con fichas."},
{"id":"test-cero","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Por qué una red ordinaria no puede modelar \"abrir la puerta cuando no queda nadie adentro\"?","o":[["Porque una transición sólo se habilita por la presencia de fichas, nunca por su ausencia.","Correcta: es un test a cero, y para eso está el arco inhibidor."],["Porque la red tendría que ser no acotada.","No: el problema no es la acotación."],["Porque hace falta tiempo para saber cuándo salió el último cliente.","No: alcanza con mirar el marcado, con un arco inhibidor."],["Sí puede: alcanza con un arco de peso 0.","No: en una red ordinaria todos los arcos pesan 1."]],"c":0,"r":"\"Abrir cuando el lugar clientes adentro está vacío\" es un **test a cero**, y una red ordinaria **no puede** expresarlo: una transición se habilita por la **presencia** de fichas, nunca por su ausencia.\n\nHace falta un **arco inhibidor** desde clientes adentro hacia la transición abrir puerta. Se dibuja con un círculo en la punta y habilita la transición **sólo si el lugar tiene 0 fichas** (en general, menos fichas que el peso del arco).\n\nPara la variante alcanza con un arco inhibidor de **peso 3**: la puerta puede abrirse mientras haya menos de 3 clientes adentro."},
{"id":"continuas","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Qué caracteriza a una red de Petri continua?","o":[["El marcado de cada lugar es un número real, no un entero.","Se usa para flujos continuos o cuando hay demasiadas fichas para contarlas."],["Que sus transiciones disparan continuamente, sin parar.","Lo continuo es el marcado, no el disparo."],["Que es fuertemente conexa.","Es otro concepto, de teoría de grafos."],["Que cada lugar tiene a lo sumo una ficha.","Eso es ser segura, y en una continua ni siquiera tiene sentido."]],"c":0,"r":"- En una RdP **continua** el marcado de cada lugar es un **número real** positivo, no un entero. Se usa cuando el sistema tiene un **flujo** continuo, o cuando hay tantas fichas que no tiene sentido contarlas de a una.\n- Una RdP **híbrida** combina una parte **discreta** (marcado entero) y una **continua**.\n\nAlgunas propiedades no se aplican a las continuas: por ejemplo, ser **segura**, justamente porque el marcado no es entero."},
{"id":"maquina-estado","tema":"Clases de redes","src":"2020 (x2), capturas","ex":true,"q":"¿Qué caracteriza a una Red de Petri para que se comporte como una máquina de estado?","o":[["Cada transición tiene una sola entrada y una sola salida, y la red tiene una única marca.","Correcta: estructura y marcado."],["Cada transición tiene una sola entrada y una sola salida, con cualquier marcado.","Incompleta: sacó 0 con el comentario \"¿Y el marcado?\"."],["Cada plaza tiene una sola transición de entrada y una de salida.","No: ese es el grafo de eventos (grafo marcado)."],["La red no tiene conflictos.","No: una máquina de estado puede tener conflictos (un estado con varias salidas)."]],"c":0,"r":"Estructura: **cada transición tiene exactamente una plaza de entrada y una de salida** (es un grafo de estado).\n\nMarcado: **una sola marca** en toda la red. Con un único token, la red está en un solo estado a la vez (la plaza que tiene el token) y se comporta como un autómata clásico.\n\nCon más de una marca ya no es equivalente: 3 plazas con 2 tokens generan 6 marcados distintos, que un autómata de 3 estados no representa.","n":"En una captura respondieron \"que cada transición tenga solamente una entrada y un lugar de salida\" y sacaron 0, con el comentario \"¿Y el marcado?\". Hay que decir las dos cosas: la estructura **y** un solo token."},
{"id":"grafo-marcado-conflicto","tema":"Clases de redes","src":"2020 (x2), 2021 (x2)","ex":true,"q":"¿Puede tener conflicto una RdP que es un grafo marcado (grafo de eventos)?","o":[["No, cada plaza tiene una sola transición de salida, y el conflicto necesita una plaza con dos o más.","Sí puede tener sincronizaciones."],["Sí, siempre que tenga más de un token.","La cantidad de tokens no cambia la estructura."],["Sí, porque toda red con ciclos tiene conflictos.","Los ciclos no generan conflictos por sí mismos."],["Sólo si es no acotada.","La acotación no tiene relación con los conflictos."]],"c":0,"r":"**No.** En un grafo marcado (o grafo de eventos) **cada plaza tiene exactamente una transición de entrada y una de salida**. Para que haya conflicto hace falta una plaza con dos o más transiciones de salida, y eso no existe.\n\nPuede haber **sincronizaciones** (transiciones con varias entradas), pero no conflictos: no hay elecciones, sólo distintas planificaciones.","n":"No confundas \"**grafo marcado**\" (una clase de RdP: el grafo de eventos) con el \"**grafo de marcado**\" o de marcas (el grafo de accesibilidad). En 2021 contestaron describiendo el grafo de accesibilidad y sacaron 0. Ojo: la cátedra usa \"grafo de marcado\" para las dos cosas; acá \"una red **que es** un grafo de marcado\" es la clase de red."},
{"id":"libre-eleccion-ext","tema":"Clases de redes","src":"resumen","ex":true,"q":"¿Qué caracteriza a una Red de Petri de libre elección extendida? (relación plaza-transición, conflicto)","o":[["Las transiciones en conflicto tienen el mismo conjunto de plazas de entrada.","Correcta."],["No tiene conflictos.","No: esa es la red libre de conflicto."],["Cada transición tiene una sola entrada y una sola salida.","No: esa es la máquina de estado."],["Cada transición participa en a lo sumo un conflicto.","No: esa es la red simple."]],"c":0,"r":"**Para cada conflicto, las transiciones en conflicto tienen el mismo conjunto de plazas de entrada.** Formalmente: si p_{1}• ∩ p_{2}• ≠ ∅, entonces p_{1}• = p_{2}•.\n\nConsecuencia: si se habilita una de las transiciones del conflicto, **se habilitan todas**. La elección es \"libre\" porque no depende de otra parte del marcado. Es la clase donde se aplica el teorema de Commoner."},
{"id":"clases-inclusion","tema":"Clases de redes","src":"apunte","ex":false,"q":"Una red tiene una transición con dos plazas de entrada (una sincronización). ¿Puede ser una máquina de estado?","o":[["No: en una máquina de estado cada transición tiene una sola entrada.","Correcta."],["Sí, si tiene un solo token.","No: la estructura ya la descarta."],["Sí, siempre que no tenga conflictos.","No."],["Sólo si es pura.","No."]],"c":0,"r":"- **Máquina de estado** (cada transición, una entrada y una salida): puede tener **conflictos**, no **sincronizaciones**.\n- **Grafo de eventos** (cada plaza, una entrada y una salida): puede tener **sincronizaciones**, no **conflictos**.\n\nLas clases se obtienen restringiendo la estructura; a cambio de modelar menos, se pueden demostrar más propiedades:\n\nGrafos de eventos ⊂ Libres de conflicto ⊂ Libre elección ⊂ Simples ⊂ Ordinarias, y Máquinas de estado ⊂ Libre elección."},
{"id":"grafo-estado-token","tema":"Clases de redes","src":"apunte","ex":false,"q":"¿Cuándo un grafo de estado de 3 lugares es equivalente a un autómata de 3 estados?","o":[["Sólo cuando está marcado con un único token.","Con más fichas hay más marcados posibles que estados del autómata."],["Siempre, con cualquier marcado.","Con 2 fichas en 3 lugares ya hay 6 marcados posibles."],["Nunca, son modelos incomparables.","Con un token son equivalentes."],["Sólo cuando no tiene conflictos.","Un grafo de estado puede tener conflictos y seguir siendo equivalente a un autómata."]],"c":0,"r":"**Sólo si está marcado con un único token.** Con una ficha, la red está en un solo lugar a la vez y cada transición corresponde a un arco del diagrama de estados: es un autómata clásico.\n\nCon **más de un token** deja de ser equivalente: con 3 lugares y 2 fichas hay 6 marcados posibles, que un autómata de 3 estados no representa. El autómata guarda **un** estado global; la red guarda una **distribución** de fichas."},
{"id":"plaza-limitada","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Cómo define una plaza limitada (acotada) de una Red de Petri?","o":[["Para todo marcado alcanzable desde M0, la cantidad de marcas en la plaza no supera una constante k.","Correcta."],["Una plaza con un arco inhibidor.","No: esa respuesta sacó 0 en el recuperatorio 2021."],["Una plaza que en M0 tiene k marcas.","No: lo que importa es todo marcado alcanzable, no sólo el inicial."],["Una plaza que nunca se vacía.","No: eso tiene que ver con las trampas, no con la acotación."]],"c":0,"r":"Una plaza p es **k-limitada** para el marcado inicial M_{0} si, para **cualquier** marcado M alcanzable desde M_{0}, el número de marcas en p es **menor o igual que k**: M(p) ≤ k.\n\nLa cota depende del marcado inicial.","n":"En el recuperatorio 2021 respondieron \"mediante un arco inhibidor\" y sacaron 0. La pregunta pide la **definición** de plaza limitada, no cómo limitarla."},
{"id":"red-limitada","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Qué relación hay entre una red segura y una red acotada?","o":[["Toda red segura es acotada, pero no toda red acotada es segura.","Segura es 1-limitada, y una red puede ser 3-limitada sin ser segura."],["Son lo mismo.","Segura es el caso particular k = 1."],["Toda red acotada es segura.","Una red 2-limitada es acotada y no es segura."],["No tienen relación.","Segura es un caso particular de acotada."]],"c":0,"r":"Una RdP está **limitada** (acotada) para M_{0} si **todas sus plazas están limitadas** para esa marca inicial. Es **k-limitada** si todas las plazas son k-limitadas.\n\nUna red es **segura** si es 1-limitada: ninguna plaza tiene nunca más de una marca. Toda red segura es acotada, pero no al revés.\n\nLa acotación depende de M_{0}. Una red es **estructuralmente acotada** si está acotada para cualquier marcado inicial."},
{"id":"vivacidad-marcado","tema":"Propiedades: acotada, viva, home state","src":"2021, recup. 2021, capturas","ex":true,"q":"Si una red es viva para M_{0}, ¿sigue siendo viva para cualquier marcado mayor?","o":[["No en general, porque agregar fichas puede habilitar una secuencia que termine en deadlock.","La vivacidad no es monótona. Sí se conserva en clases como las libres de conflicto."],["Sí, siempre, porque más fichas sólo habilitan más disparos.","Esos disparos de más pueden llevar a una marca muerta."],["Sí, si la red es acotada.","La acotación no garantiza que se conserve la vivacidad."],["No, agregar fichas siempre la vuelve no viva.","Tampoco es siempre así. Simplemente no está garantizado."]],"c":0,"r":"**No.** La vivacidad y la ausencia de interbloqueo dependen del marcado inicial y **no son monótonas**: agregar fichas puede habilitar una secuencia que termine en un deadlock, o desbalancear un conflicto de modo que una transición nunca vuelva a habilitarse.\n\nEn cambio, sí se mantiene la quasi-vivacidad (más fichas no le quitan a una transición la posibilidad de disparar alguna vez), y la falta de acotación (agregar fichas no la arregla)."},
{"id":"libre-interbloqueo-m","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"Si una RdP está libre de interbloqueo para m_{0}, ¿es libre de interbloqueo para un marcado m > m_{0}? ¿Por qué?","o":[["No necesariamente: más fichas pueden habilitar una secuencia que termina en un deadlock.","Correcta."],["Sí: con más fichas siempre hay más transiciones sensibilizadas.","No: puede haber más transiciones sensibilizadas en el camino y aun así llegar a una marca muerta."],["Sí, si la red es acotada.","No: la acotación no garantiza esto."],["No: con más fichas siempre aparece un deadlock.","No: puede aparecer, no siempre aparece."]],"c":0,"r":"**No necesariamente.** Con cierta marca puede no habilitarse nunca una transición que lleva a un deadlock, y al agregar fichas sí se puede disparar, y desde ese estado la red no evoluciona más.\n\nEjemplo: una plaza P con 1 ficha, un ciclo P → t_{1} → Q → t_{2} → P, y una transición t_{3} que necesita **2** fichas de P y las manda a una plaza sin salida. Con 1 ficha, t_{3} nunca se habilita y la red cicla para siempre. Con 2 fichas, t_{3} puede dispararse, se lleva las dos fichas y la red queda en deadlock."},
{"id":"quasi-viva-veces","tema":"Propiedades: acotada, viva, home state","src":"2020 (x2), 2021, capturas","ex":true,"q":"¿Cuántas veces se puede disparar una transición quasi viva?","o":[["Al menos una vez.","Correcta."],["Infinitas veces.","No: eso lo garantiza una transición viva."],["Exactamente una vez.","No: puede dispararse más, pero lo garantizado es al menos una."],["Ninguna.","No: esa sería una transición muerta."]],"c":0,"r":"**Al menos una vez.** Una transición es quasi viva si existe **alguna** secuencia de disparos desde M_{0} en la que dispara al menos una vez. No garantiza que pueda volver a dispararse después.\n\nQue todas las transiciones sean quasi vivas dice que el diseño no tiene partes \"de adorno\" que nunca se usan.","n":"En una captura respondieron \"no se sabe cuántas veces se puede disparar\" y sacaron 0. Comentario: \"Al menos una vez\"."},
{"id":"seudo-viva-bloqueo","tema":"Propiedades: acotada, viva, home state","src":"2020, resumen","ex":true,"q":"¿Puede bloquearse totalmente una red seudo viva?","o":[["No, tiene alguna transición viva, que siempre puede volver a dispararse.","Lo que sí puede pasar es que otras transiciones mueran."],["Sí, seudo viva significa que puede llegar a un deadlock.","Si llegara a un deadlock, ninguna transición sería viva."],["Sí, si tiene transiciones quasi vivas.","Que haya quasi vivas no cambia que alguna sea viva."],["Depende de si es segura.","La seguridad no tiene relación con el bloqueo."]],"c":0,"r":"**No.** Una red seudo viva tiene **algunas transiciones vivas** (no necesariamente todas). Una transición viva siempre puede volver a dispararse desde cualquier marca alcanzable, así que la red **nunca se bloquea totalmente**: alguna actividad sigue siendo posible. Lo que sí puede pasar es que otras transiciones dejen de estar disponibles para siempre."},
{"id":"viva-alcanzar","tema":"Propiedades: acotada, viva, home state","src":"2020, 2023","ex":true,"q":"Si una RdP es viva, ¿qué se puede garantizar desde cualquier marca alcanzable? (respuesta que acepta la cátedra)","o":[["Que existe una secuencia de disparos que contiene a cualquier transición de la red.","Ninguna capacidad del sistema se pierde nunca. La cátedra lo acepta como \"sí, se puede llegar\"."],["Que siempre se vuelve a la marca inicial.","Eso es la reversibilidad."],["Que la red es acotada.","La vivacidad no implica acotación."],["Que no hay conflictos.","Una red viva puede tener conflictos."]],"c":0,"r":"Respuesta que acepta la cátedra: **Sí**, porque si la red es viva, desde **cualquier** marca M_{i} alcanzable siempre existe una secuencia de disparos que contiene a cualquier transición T_{j}: ninguna capacidad del sistema se pierde nunca.","n":"La cátedra le dio 1 al \"Sí\" en 2020 y en 2023. Pero ojo, formalmente vivacidad **no** es lo mismo que poder alcanzar cualquier marca: eso es la **reversibilidad** (o tener home state). Una red viva puede tener marcas transitorias a las que no se vuelve. Si te la toman, contestá \"Sí\" con la justificación de arriba (siempre se puede volver a disparar cualquier transición); no la mezcles con la definición de reversible. Comparala con la variante \"seudo viva y quasi viva\", donde la respuesta es \"No\"."},
{"id":"seudo-quasi-alcanzar","tema":"Propiedades: acotada, viva, home state","src":"2021 (x2)","ex":true,"q":"Si una red es seudo viva y todas sus transiciones son quasi vivas, ¿desde cualquier marca se puede llegar a cualquier otra?","o":[["No, puede haber transiciones que después de disparar no se habiliten más, y marcas a las que no se puede volver.","Quasi viva sólo garantiza que cada transición dispara al menos una vez."],["Sí, porque todas las transiciones pueden dispararse.","Poder dispararse una vez no alcanza."],["Sí, si además es acotada.","La acotación no garantiza volver a cualquier marca."],["Sí, porque seudo viva implica reversible.","No implica reversibilidad."]],"c":0,"r":"**No.** Quasi viva sólo garantiza que cada transición dispara **al menos una vez** en alguna secuencia, y seudo viva sólo que **algunas** transiciones son vivas. Puede haber transiciones que, después de dispararse, no se habiliten nunca más, y marcas a las que no se puede volver. Para esa garantía la red tiene que ser **viva** (según la cátedra).","n":"En 2021 respondieron \"Sí se puede garantizar\" y sacaron 0; el mismo año, \"No se puede garantizar\" sacó 1."},
{"id":"reversible","tema":"Propiedades: acotada, viva, home state","src":"2020, 2021","ex":true,"q":"¿Qué significa que una red sea reversible para m_{0}?","o":[["Que desde cualquier marca alcanzable existe una secuencia que vuelve a m_{0}.","O sea, m_{0} es un home state."],["Que se pueden disparar las transiciones al revés.","No se invierte el sentido de los disparos."],["Que es viva y acotada.","Eso es comportarse bien."],["Que desde m_{0} se puede llegar a cualquier marca.","Es al revés. Se pide poder volver a m_{0}."]],"c":0,"r":"**Sí.** Esa es la definición: una red es **reversible** (o reinicializable) si desde **cualquier marca alcanzable** desde m_{0} existe una secuencia de disparos que vuelve a m_{0}. Es decir, m_{0} es un **home state**: siempre se puede volver al estado de arranque."},
{"id":"home-state","tema":"Propiedades: acotada, viva, home state","src":"2020 (x2)","ex":true,"q":"¿Qué es un home state m_{h}?","o":[["Una marca a la que se puede llegar desde cualquier marca alcanzable.","Si el home state es m_{0}, la red es reversible."],["La marca inicial de la red.","Puede ser la inicial, pero no tiene por qué serlo."],["Una marca desde la que no se puede disparar nada.","Eso es una marca muerta, un deadlock."],["La marca con más tokens del grafo.","No depende de la cantidad de tokens."]],"c":0,"r":"**Sí.** Una marca m_{h} es un **home state** si desde **cualquier** marca alcanzable existe una secuencia de disparos que llega a m_{h}. Si el home state es la marca inicial m_{0}, la red es **reversible**."},
{"id":"tipo-home","tema":"Propiedades: acotada, viva, home state","src":"2021","ex":true,"q":"Si una Red de Petri tiene una marca m_{h} que se puede alcanzar desde cualquier estado, ¿qué tipo de red es?","o":[["Una red con home state.","Correcta."],["Una red reversible.","No: sólo si mh es la marca inicial. Esta respuesta sacó 0 en 2021."],["Una red viva.","No: tener un home state no implica que todas las transiciones estén vivas."],["Una red segura.","No: no tiene que ver con la cantidad de fichas por plaza."]],"c":0,"r":"Es una **RdP con home state** (m_{h} es un home state).\n\nSólo sería **reversible** si m_{h} fuera la marca inicial m_{0}.","n":"En 2021 respondieron \"es una red reversible\" y sacaron 0. Comentario: \"RdP con home state\". Reversible es el caso particular en que el home state es m0."},
{"id":"estructura-comportamiento","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Se puede determinar todo el comportamiento de una RdP sólo con su estructura?","o":[["No, además hace falta el marcado inicial. La misma red puede ser viva con un M_{0} y no serlo con otro.","Con la estructura sola se ven las propiedades estructurales."],["Sí, la estructura determina todo.","La vivacidad o la acotación dependen del marcado."],["Sí, si la red es pura.","Ser pura no hace al comportamiento independiente del marcado."],["No, además hace falta el código que la implementa.","El comportamiento de la red queda definido por la estructura y el marcado."]],"c":0,"r":"**No.** Además de la estructura hace falta el **marcado** (inicial). La misma red puede ser viva y acotada con un M_{0} y no serlo con otro.\n\nCon la estructura sola se ven las propiedades **estructurales**: conflictos estructurales, componentes conservadores (P-invariantes), sifones y trampas. Las de **comportamiento** (vivacidad, acotación, interbloqueo, home state) dependen también del marcado.","n":"En el recuperatorio 2021 respondieron \"sí, porque por la estructura podemos ver si tiene home state, si tiene conflictos...\" y sacaron 0. Comentario: \"No, es necesario además de la estructura el marcado\"."},
{"id":"well-behaved","tema":"Propiedades: acotada, viva, home state","src":"apunte","ex":false,"q":"¿Cuál de estas afirmaciones es verdadera?","o":[["Toda red viva es libre de deadlock.","Correcta: una marca muerta impediría que cualquier transición vuelva a disparar."],["Toda red libre de deadlock es viva.","No: puede no trabarse nunca y aun así tener una transición que dejó de estar disponible."],["Toda red quasi viva es libre de deadlock.","No: cada transición puede disparar una vez y después trabarse todo."],["Una red bien comportada es la que es segura y reversible.","No: es la que es viva y acotada."]],"c":0,"r":"- **Quasi-vivacidad y libertad de deadlock son independientes**: una red puede ser quasi viva y tener un deadlock (cada transición disparó su vez y después todo se trabó), y puede ser libre de deadlock sin ser quasi viva (una transición nunca dispara, pero el resto funciona para siempre).\n- **Viva implica libre de deadlock**: si hubiera una marca muerta, ninguna transición podría volver a dispararse desde ahí. La recíproca no vale.\n\nUna red es **bien comportada** (well-behaved) si es **viva y acotada**: sin acotación no es implementable con recursos finitos, y sin vivacidad puede perder funcionalidad para siempre."},
{"id":"bien-formada","tema":"Propiedades: acotada, viva, home state","src":"apunte","ex":false,"q":"Una red no marcada Q está bien formada si...","o":[["Existe algún marcado inicial con el que es viva y acotada.","Correcta."],["Es viva y acotada para todo marcado inicial.","No: alcanza con que exista uno."],["Es viva con el marcado vacío.","No: con el marcado vacío en general no dispara nada."],["No tiene conflictos estructurales.","No: esa es la red libre de conflicto."]],"c":0,"r":"- Una red **marcada** ⟨Q, m_{0}⟩ **se comporta bien** (well-behaved) si es **viva y acotada**.\n- Una red **no marcada** Q está **bien formada** si **existe** algún m_{0} con el que se comporta bien.\n\nSobre agregar fichas: en general la vivacidad **no** se hereda. Para algunas clases sí: en las redes **libres de conflicto** (y sus extendidas), si ⟨Q, m_{0}⟩ es viva, también lo es con cualquier marcado mayor o igual que m_{0}.\n\nY una red **persistente** es viva si y sólo si hay un marcado alcanzable desde el que se puede aplicar una secuencia repetitiva **completa**, con todas las transiciones. La persistencia sola no garantiza vivacidad."},
{"id":"conflicto-estr-vs-efec","tema":"Conflicto, concurrencia y prioridades","src":"recup. 2021 (x2)","ex":true,"q":"Explique la diferencia entre conflicto estructural y conflicto efectivo.","o":[["El estructural depende sólo de que compartan una plaza de entrada; el efectivo además requiere que, con el marcado actual, no alcancen las marcas para dispararlas a todas.","Correcta."],["El estructural depende del marcado y el efectivo no.","No: es al revés."],["El efectivo se da cuando dos transiciones no comparten plazas.","No: sin plaza compartida no hay conflicto."],["Son sinónimos.","No."]],"c":0,"r":"- **Conflicto estructural**: dos o más transiciones **comparten al menos una plaza de entrada** (la plaza tiene más de una transición de salida). Depende **sólo de la estructura**, no del marcado.\n- **Conflicto efectivo**: hay conflicto estructural **y además**, para un marcado dado, las transiciones están sensibilizadas pero las marcas de la plaza compartida **no alcanzan para dispararlas a todas**. Disparar una deshabilita a la otra.\n\nSi las marcas alcanzan para todas, el conflicto no es efectivo: las transiciones son concurrentes."},
{"id":"concurrencia-conflicto","tema":"Conflicto, concurrencia y prioridades","src":"2021","ex":true,"q":"¿Qué entiende por concurrencia (conflicto) en una Red de Petri?","o":[["Cuando dos transiciones en conflicto pueden dispararse en cualquier secuencia o simultáneamente.","Correcta: es el comentario textual de la cátedra."],["Cuando no pueden realizarse transiciones de tokens hacia otra plaza.","No: sacó 0 en 2021."],["Cuando disparar una transición deshabilita a la otra.","No: eso es el conflicto efectivo."],["Cuando ninguna transición está sensibilizada.","No: eso es un deadlock."]],"c":0,"r":"Cuando **dos transiciones en conflicto pueden ser disparadas en cualquier secuencia o simultáneamente**: comparten plaza de entrada, pero hay marcas suficientes para las dos (conflicto **no efectivo**). Son causalmente independientes: una puede dispararse antes, después o al mismo tiempo que la otra, y el resultado es el mismo (disparo múltiple [T_{1}T_{2}]).","n":"En 2021 respondieron \"cuando no pueden realizarse transiciones de tokens hacia otra plaza\" y sacaron 0. El comentario es la respuesta textual: \"Cuando dos transiciones en conflicto pueden ser disparadas en cualquier secuencia o simultáneamente\"."},
{"id":"persistencia","tema":"Conflicto, concurrencia y prioridades","src":"2023","ex":true,"q":"¿Qué entiende por persistencia (conflicto) en una Red de Petri?","o":[["Que el disparo de una transición habilitada nunca deshabilita a otra habilitada.","Correcta."],["Que una transición, una vez habilitada, dispara infinitas veces.","No: eso se parece a la vivacidad."],["Que el marcado de una plaza nunca cambia.","No: eso sería un invariante trivial."],["Que la red vuelve siempre al marcado inicial.","No: eso es reversibilidad."]],"c":0,"r":"Una red es **persistente** si, para cada marca alcanzable, dos transiciones habilitadas cualesquiera pueden dispararse **en cualquier secuencia**: el disparo de una **no deshabilita** a la otra. Una transición habilitada sólo deja de estarlo **por su propio disparo**.\n\nLa respuesta que aceptó la cátedra en 2023 fue: \"Cuando dos transiciones pueden ser disparadas en cualquier secuencia o simultáneamente\".\n\nUna red sin conflicto estructural es persistente para cualquier M_{0}."},
{"id":"conflicto-efectivo-solucion","tema":"Conflicto, concurrencia y prioridades","src":"2020, 2023, capturas","ex":true,"q":"¿Cómo solucionamos el problema del conflicto efectivo en un conjunto de transiciones?","o":[["Con una política de prioridades que resuelva el orden de disparo de esas transiciones.","Correcta: es el comentario de la cátedra."],["Con un arco inhibidor.","No: esa respuesta sacó 0 en 2023."],["Agregando más marcas hasta que alcancen para todas.","No: eso cambia el modelo y puede romper otras propiedades."],["No tiene solución: el conflicto efectivo es un deadlock.","No: un conflicto no es un deadlock."]],"c":0,"r":"Con una **política** que decida cuál de las transiciones en conflicto se dispara: por ejemplo, una **política de prioridades** que resuelva el orden de ejecución de ese conjunto. También puede ser por turnos o probabilidades.\n\nEn la implementación, es lo que hacen las políticas de las colas de condición del monitor: entre las transiciones sensibilizadas con hilos esperando, eligen a cuál despertar.","n":"En 2023 respondieron \"mediante un arco inhibidor\" y sacaron 0. Comentario: \"Se puede establecer una política de prioridades que resuelva el orden de ejecución de este conjunto de transiciones\". Aunque un inhibidor puede modelar una prioridad, lo que espera la cátedra es \"política de prioridades\"."},
{"id":"prioridades-cuando","tema":"Conflicto, concurrencia y prioridades","src":"2020, resumen","ex":true,"q":"¿Cuándo usamos prioridades para el disparo de un conjunto de transiciones?","o":[["Cuando varias transiciones en conflicto están sensibilizadas y hay que elegir cuál dispara.","Correcta."],["Cuando ninguna transición está sensibilizada.","No: en ese caso no hay nada que elegir (es un deadlock)."],["Siempre, en cualquier red.","No: sin conflicto no hace falta."],["Cuando la red no está acotada.","No: la prioridad no resuelve la acotación."]],"c":0,"r":"Cuando hay **varias transiciones sensibilizadas a la vez y en conflicto** (efectivo), y hay que **elegir cuál** de ellas se dispara. La prioridad reduce el no determinismo: de entre las que cumplen la condición de sensibilización, dispara **la de mayor prioridad**."},
{"id":"prioridad-orden","tema":"Conflicto, concurrencia y prioridades","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"En una RdP con prioridades, ¿qué transiciones necesitan estar ordenadas entre sí?","o":[["Las que pueden estar en conflicto, porque compiten por las mismas fichas.","Correcta: por eso alcanza con un orden parcial."],["Todas: la prioridad es un orden total sobre las transiciones.","No: no tiene sentido ordenar transiciones que nunca compiten."],["Sólo las transiciones fuente.","No."],["Las que están en un mismo T-invariante.","No: estar en el mismo ciclo no las pone en conflicto."]],"c":0,"r":"Una RdP con prioridades es una red de Petri más una **relación de orden parcial** sobre sus transiciones. Cuando varias transiciones de un mismo conflicto están habilitadas, dispara la de **mayor** prioridad.\n\nEs parcial porque sólo hace falta comparar las transiciones que **compiten**. En el ejemplo de la filmina hay dos conflictos, ⟨P_{1}, {T_{1}, T_{2}}⟩ y ⟨P_{2}, {T_{2}, T_{3}, T_{4}}⟩, y se ordena dentro de cada uno: T_{2} < T_{1} y T_{4} < T_{2} < T_{3}. No tiene sentido ordenar transiciones que nunca están en conflicto.\n\nEn el **puente de una sola mano** entra un auto por vez. El lugar puente libre es un recurso con un conflicto entre entra desde L y entra desde R, y la prioridad se la da a los que esperan en L. Ahí se puede dibujar una red equivalente sin prioridades, agregando lugares de control. Pero en general las prioridades sí aumentan el poder de modelado."},
{"id":"inhibidor-prod-mas","tema":"Conflicto, concurrencia y prioridades","src":"2021 (x2)","ex":true,"q":"Con un arco inhibidor, ¿puede controlar la prioridad en una red que comparte un recurso? Explique cómo controla la prioridad para que un **productor** tenga **más** prioridad que un **consumidor**.","o":[["Con un arco inhibidor desde la plaza del productor que espera hacia la transición de entrada del consumidor.","Correcta."],["Con un arco inhibidor desde la plaza del consumidor hacia la transición de entrada del productor.","No: \"justamente al revés\"; así tiene más prioridad el consumidor."],["Con un arco inhibidor desde el buffer hacia el productor.","No: así se bloquearía al productor cuando hay elementos."],["No se puede: los inhibidores no sirven para prioridades.","No: los inhibidores y los lectores permiten modelar prioridades."]],"c":0,"r":"**Sí.** Se coloca un **arco inhibidor desde la plaza del productor** (la que indica que el productor está esperando para tomar el recurso) **hacia la transición de entrada del consumidor**.\n\nMientras haya un productor esperando (marca en su plaza), la transición del consumidor **no está sensibilizada**: el recurso se lo lleva el productor. El consumidor sólo puede entrar cuando no hay productores esperando.","n":"En 2021 respondieron \"de la plaza del consumidor a la transición de entrada del productor\" y el comentario fue \"**Justamente al revés**\": así se le da más prioridad al consumidor. Otra respuesta que sólo explicaba la idea sacó 1 con el comentario \"¿Y cómo lo implemento?\": nombrá de qué plaza a qué transición va el arco."},
{"id":"inhibidor-prod-menos","tema":"Conflicto, concurrencia y prioridades","src":"2020 (x2)","ex":true,"q":"Con un arco inhibidor, ¿puede controlar la prioridad en una red que comparte un recurso? Explique cómo controla la prioridad para que un **productor** tenga **menos** prioridad que un **consumidor**.","o":[["Con un arco inhibidor desde la plaza del consumidor hacia la transición de entrada del productor.","Correcta."],["Con un arco inhibidor desde la plaza del productor hacia la transición de entrada del consumidor.","No: así el que tiene prioridad es el productor."],["Con un arco lector desde el buffer hacia el consumidor.","No: eso no le quita el recurso al productor."],["Aumentando el peso del arco del productor.","No: el peso no establece prioridad."]],"c":0,"r":"**Sí.** En un productor/consumidor se coloca un **arco inhibidor desde la plaza del consumidor** (consumidor esperando) **hacia la transición de entrada del productor**.\n\nMientras haya un consumidor esperando, el productor no puede tomar el recurso: el consumidor tiene prioridad.","n":"En 2020 la respuesta sacó 1, pero el comentario aclaró: \"en un productor consumidor se coloca un arco inhibidor entre la plaza del consumidor a la transición de entrada del productor\". Es la versión simétrica de la pregunta de 2021."},
{"id":"lector-prioridad","tema":"Conflicto, concurrencia y prioridades","src":"2021","ex":true,"q":"¿Se puede controlar la prioridad con un arco lector?","o":[["Sí, con una plaza de control unida por un arco lector a la transición que se quiere priorizar.","La plaza funciona como un permiso que no se consume."],["No, para eso hace falta un arco inhibidor.","El inhibidor es una opción, pero el lector también sirve."],["No, el arco lector no afecta la sensibilización.","Sí la afecta, porque exige que haya marca en la plaza."],["Sí, porque el lector vacía la plaza de las otras transiciones.","El que vacía es el arco reset."]],"c":0,"r":"**Sí**, colocando una **plaza de control con un arco lector asociado a la transición que se quiere priorizar**. El arco lector condiciona el disparo a la presencia de una marca en la plaza de control **sin consumirla**, así que esa plaza funciona como un permiso o turno que el resto de la red administra.\n\nComo el inhibidor, el arco lector es una de las extensiones que permiten modelar prioridades.","n":"En 2021 respondieron \"No, porque sensibilizaría a ambas transiciones... se necesita un arco inhibidor\" y sacaron 0. Comentario: \"Sí, colocando una plaza de control con un arco lector asociado a la transición que deseamos priorizar\"."},
{"id":"confusion","tema":"Conflicto, concurrencia y prioridades","src":"apunte","ex":false,"q":"¿Qué describe la confusión en una RdP?","o":[["Cuando el orden entre transiciones concurrentes cambia qué conflictos aparecen.","Correcta: es la confusión (en este caso, asimétrica)."],["Cuando dos transiciones comparten un lugar de salida.","No: compartir un lugar de salida no genera conflicto."],["Cuando la red tiene arcos inhibidores y lectores a la vez.","No."],["Cuando dos plazas tienen el mismo nombre.","No."]],"c":0,"r":"Es la **mezcla de conflicto y concurrencia**, que hace difícil razonar sobre cada uno por separado.\n- **Simétrica**: t_{1} y t_{3} son concurrentes, y las dos están en conflicto con una t_{2} que comparte un lugar con cada una. Disparar t_{1} deshabilita a t_{2}, aunque t_{1} y t_{3} \"no tenían nada que ver\".\n- **Asimétrica**: t_{1} es concurrente con t_{2}, y t_{2} entra en conflicto con t_{3} sólo si t_{1} dispara antes. El **orden** entre dos transiciones concurrentes cambia qué conflictos aparecen."},
{"id":"grafo-acotada","tema":"Análisis: grafo, invariantes, sifones","src":"2020, 2021, 2023","ex":true,"q":"Sobre el grafo de marcado, ¿cómo se verifica que la red es acotada?","o":[["Se busca, en todos los nodos, el máximo de marcas de cada plaza: si existe una cota, es acotada.","Correcta."],["Se cuenta la cantidad de arcos del grafo.","No: los arcos son disparos, no dicen cuántas marcas hay."],["Se verifica que no haya ciclos.","No: una red acotada puede tener ciclos."],["No se puede: el grafo de marcado no sirve para eso.","No: la respuesta \"No\" sacó 0 en 2020."]],"c":0,"r":"**Sí.** El grafo de marcado (de accesibilidad) contiene todas las marcas alcanzables y todos los disparos posibles, así que sobre él se leen las propiedades de comportamiento.\n\n**Acotada**: se recorren **todos los nodos** (marcas) y, para cada plaza, se busca el **máximo** número de marcas. Si el grafo es finito y ese máximo existe para todas las plazas, la red es **k-acotada**, con k el mayor de esos máximos. (Si al construirlo aparece ω en el árbol de cobertura, la red no está acotada.)","n":"En 2020 respondieron \"No, porque sólo sabemos que la cantidad de arcos de entrada y salida de una plaza es uno\" y sacaron 0, con el comentario \"Sí, se realiza la suma de token para todos los estados y se verifica que no supere un valor\". En 2023, una respuesta con la definición de acotada sacó 1, pero con el comentario \"¿Y cómo veo si es acotada en el grafo?\": decí el procedimiento sobre los nodos del grafo."},
{"id":"grafo-segura","tema":"Análisis: grafo, invariantes, sifones","src":"2020 (x2), 2021","ex":true,"q":"¿Cómo se verifica con el grafo de marcado que una red es segura?","o":[["Comprobando que en ninguna marca del grafo una plaza tiene más de una marca.","El grafo contiene todas las marcas alcanzables."],["Comprobando que el grafo no tiene ciclos.","Una red segura puede tener ciclos."],["Buscando un nodo sin arcos de salida.","Eso detecta un interbloqueo."],["No se puede, hace falta el árbol de cobertura.","Si la red es acotada, el grafo de marcado alcanza."]],"c":0,"r":"**Sí.** El grafo de marcado contiene todas las marcas alcanzables.\n\n**Segura**: se recorren todos los nodos y se verifica que **en ninguna marca alguna plaza tenga más de una marca** (todas las componentes de todas las marcas son 0 o 1)."},
{"id":"grafo-interbloqueo","tema":"Análisis: grafo, invariantes, sifones","src":"2021","ex":true,"q":"¿Cómo aparece un interbloqueo en el grafo de marcado?","o":[["Como un nodo alcanzable sin arcos de salida.","Desde esa marca no se puede disparar ninguna transición."],["Como un ciclo en el grafo.","Un ciclo indica que se puede repetir una secuencia, no que se traba."],["Como un nodo con muchos arcos de entrada.","Que se llegue de muchas formas no lo traba."],["Como una marca con todos los tokens en una sola plaza.","Puede ser una marca muerta o no, depende de las transiciones."]],"c":0,"r":"**Sí.** Un interbloqueo es una marca desde la que no se puede disparar ninguna transición: en el grafo es un **nodo sin arcos de salida** (un punto muerto, o marca sumidero). Si existe un nodo alcanzable así, la red tiene deadlock; si ningún nodo lo es, la red es libre de interbloqueo."},
{"id":"grafo-tinv","tema":"Análisis: grafo, invariantes, sifones","src":"2020, capturas","ex":true,"q":"¿Cómo se ve un invariante de transición en el grafo de marcado?","o":[["Como un ciclo: una secuencia de disparos que vuelve al mismo nodo.","Correcta."],["Como un nodo sin arcos de salida.","No: eso es un interbloqueo."],["Como el nodo con más marcas.","No: eso sirve para la acotación."],["No se puede ver en el grafo.","No: la respuesta \"No\" sacó 0."]],"c":0,"r":"**Sí.** Un invariante de transición es un conjunto de disparos que **devuelve la red a la misma marca**. En el grafo se ve como un **ciclo**: un camino que sale de un nodo y vuelve a él. Contando cuántas veces se dispara cada transición a lo largo del ciclo se obtiene el vector del T-invariante (y cumple C · y = 0).","n":"En una captura respondieron \"No, porque sólo sabemos que el total de arcos de entrada como de salida es uno\" y sacaron 0. El comentario fue sólo \"Si\"."},
{"id":"cobertura-w","tema":"Análisis: grafo, invariantes, sifones","src":"recup. 2021 (x2)","ex":true,"q":"En el grafo (árbol) de cobertura, ¿qué representa ω?","o":[["El marcado de una plaza que puede crecer indefinidamente.","Correcta."],["Un vértice del grafo.","No: esa respuesta sacó 0."],["Una marca muerta.","No: un deadlock es un nodo sin sucesores."],["El marcado inicial.","No."]],"c":0,"r":"El **marcado de una plaza que crece indefinidamente** (no acotada). Cuando al construir el árbol aparece una marca que **cubre estrictamente** a una anterior del mismo camino (M' > M), las componentes que crecieron se reemplazan por ω, porque repitiendo ese ciclo pueden crecer sin límite.\n\nGracias a ω el árbol de cobertura **siempre es finito**, incluso si la red no es acotada. Si aparece ω, la red no está acotada.","n":"En el recuperatorio 2021 respondieron \"representa el vértice del grafo\" y sacaron 0."},
{"id":"constante-pinv","tema":"Análisis: grafo, invariantes, sifones","src":"2020 (x2), 2021","ex":true,"q":"La **constante de marcado** de un invariante de plaza (componente conservador), ¿depende de la marca, de la estructura de la red o de ambas?","o":[["De ambas: los pesos salen de la estructura y el valor, de la marca inicial.","Correcta."],["Sólo de la estructura.","No: eso vale para la existencia del invariante, no para el valor de la constante."],["Sólo de la marca inicial.","No: los pesos del invariante salen de la estructura."],["De ninguna: es siempre 1.","No: vale 1 sólo en casos como la exclusión mutua."]],"c":0,"r":"**De ambas.** El invariante es x^{T} · M = x^{T} · M_{0}: la constante es x^{T} · M_{0}. Los pesos x salen de la **estructura** (x^{T} · C = 0), y M_{0} es la **marca inicial**. Con la misma red y otro marcado inicial, el invariante sigue existiendo pero la constante cambia.","n":"No la confundas con la otra pregunta, casi igual: \"**un invariante de plaza** (componente conservador), ¿es dependiente de la marca inicial, de la estructura o de ambas?\". Ahí la respuesta es \"de la estructura\". Acá preguntan por la **constante**, que depende de las dos."},
{"id":"pinv-estructural","tema":"Análisis: grafo, invariantes, sifones","src":"2020, 2021, recup. 2021","ex":true,"q":"Un **invariante de plaza** (componente conservador), ¿es dependiente de la marca inicial, de la estructura de la red o de ambas?","o":[["De la estructura: es una propiedad estructural (x^T · C = 0); el valor de la constante sí depende de M0.","Correcta."],["De la marca inicial.","No: la existencia del invariante no depende de M0."],["De ambas.","Esa es la respuesta para la constante de marcado, no para el invariante."],["De la cantidad de transiciones.","No."]],"c":0,"r":"Depende **exclusivamente de la estructura**: ser componente conservador es una **propiedad estructural**, porque sólo exige que exista un vector x > 0 con x^{T} · C = 0, y C es la matriz de incidencia. Es independiente de la marca inicial.\n\nEl **valor numérico** de la constante sí varía con la marca inicial.","n":"Es la contracara de la pregunta sobre la **constante** de marcado (que depende de ambas). La mejor respuesta, que sacó 1 en el recuperatorio 2021: \"Depende exclusivamente de la estructura de la red. El valor numérico sí variará según la marca inicial, pero la propiedad es de la estructura\"."},
{"id":"cuatro-estaciones","tema":"Análisis: grafo, invariantes, sifones","src":"2020, recup. 2021, capturas","ex":true,"q":"En la red de las cuatro estaciones, ¿qué significa que la suma de marcas de todas las plazas sea siempre 1?","o":[["Que sólo se puede estar en una estación a la vez.","Es una máquina de estado con un único token, y la plaza marcada es la estación actual."],["Que la red tiene un deadlock.","El invariante no dice nada de bloqueos."],["Que cada estación dura lo mismo.","La red no tiene tiempo."],["Que la red no es acotada.","Es al revés. El invariante prueba que es acotada, y además segura."]],"c":0,"r":"Que **sólo se puede estar en una estación a la vez**.\n\nLa red es una máquina de estado con un único token: M(primavera) + M(verano) + M(otoño) + M(invierno) = 1 es un componente conservador, y la plaza que tiene el token es la estación actual.","n":"En una captura respondieron \"componente conservador, el sistema tiene un único estado\" y les dieron 1, pero el comentario fue: \"Que se puede estar en solo una estación a la vez\". Decilo con esas palabras."},
{"id":"matriz-incidencia","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"En una red con plazas P1, P2 y una transición t1 que saca una marca de P1 y pone una en P2, la columna de t1 en C es (−1, +1). Si M = (1, 0), ¿cuál es el marcado después de disparar t1?","o":[["(0, 1)","Correcta: M + C·σ = (1, 0) + (−1, +1)."],["(1, 1)","No: también se resta la marca de P1."],["(2, −1)","No: se sumó la columna con el signo invertido."],["(0, 0)","No: la marca se mueve a P2, no desaparece."]],"c":0,"r":"Es la matriz C = Post − Pre, con una fila por plaza y una columna por transición: C(p, t) es el cambio neto de marcas en p cuando t se dispara (negativo si consume, positivo si produce).\n\nLa **ecuación de estado** da el marcado siguiente: M' = M + C · σ, donde σ es el vector de disparo (un 1 en la transición que se dispara). Para una secuencia completa, σ es el **vector característico**, que cuenta cuántas veces se disparó cada transición.\n\nLa matriz representa al sistema en sí: es lo que se implementa en el monitor (y en el IP-Core de la cátedra)."},
{"id":"ecuacion-vector","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"Si m_{k} = m_{0} + C · s tiene una solución s entera y no negativa, ¿m_{k} es alcanzable?","o":[["No necesariamente, porque la ecuación de estado es una condición necesaria pero no suficiente.","En cada paso la transición tiene que estar efectivamente sensibilizada."],["Sí, siempre.","La aritmética puede cerrar sin que exista una secuencia real."],["Sí, si la red es acotada.","Tampoco alcanza con la acotación."],["No, nunca es alcanzable.","Puede serlo. Simplemente no está garantizado."]],"c":0,"r":"**No necesariamente.** La ecuación de estado es una condición **necesaria** pero no suficiente: que la aritmética cierre no garantiza que exista una secuencia real, porque en cada paso la transición tiene que estar efectivamente sensibilizada.\n\nOtras propiedades del vector característico: secuencias distintas con el **mismo** vector llevan a la **misma** marca; pero dos secuencias que llegan a la misma marca pueden tener vectores distintos."},
{"id":"pinv-calculo","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"En la red de exclusión mutua, el P-invariante M(P2) + M(P4) + M(mutex) = 1, ¿qué prueba?","o":[["Que nunca hay dos procesos a la vez en la sección crítica.","Correcta: M(P2) + M(P4) ≤ 1."],["Que la red está libre de deadlock.","No: un P-invariante prueba seguridad, no ausencia de deadlock."],["Que ningún proceso sufre inanición.","No: es una propiedad de progreso."],["Que la red es reversible.","No."]],"c":0,"r":"Es un vector de pesos x ≥ 0 sobre las plazas tal que **x^{T} · C = 0**. Por la ecuación de estado, implica x^{T} · M = x^{T} · M_{0} para **toda** marca alcanzable: una suma pesada de marcas que **nunca cambia**. Las plazas con peso positivo forman el **soporte** (componente conservador).\n\nSirve para **probar propiedades de seguridad sin construir el grafo**. En la exclusión mutua, M(P_{2}) + M(P_{4}) + M(mutex) = 1 implica M(P_{2}) + M(P_{4}) ≤ 1: nunca hay dos procesos en la sección crítica. Eso es verificación, no testing."},
{"id":"tinv","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Qué es un T-invariante?","o":[["Un vector de disparos que, aplicado, devuelve la red a la misma marca.","Correcta."],["Un vector de pesos sobre las plazas cuya suma pesada no cambia.","No: ese es el P-invariante."],["Una transición que nunca se dispara.","No: esa es una transición muerta."],["El conjunto de transiciones sensibilizadas en M0.","No."]],"c":0,"r":"Un **T-invariante** es un vector y ≥ 0 sobre las transiciones con **C · y = 0**: disparar cada transición y_{j} veces deja el marcado **igual** que al empezar.\n\nSi además existe una secuencia disparable con ese vector característico, el conjunto de transiciones con y_{j} > 0 es un **componente repetitivo**: un ciclo que el sistema puede repetir indefinidamente.\n\nLa existencia de un T-invariante es una condición **necesaria, no suficiente**: el álgebra da candidatos, pero hay que verificar que haya una secuencia real."},
{"id":"sifon-trampa","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"Un sifón de una red queda sin marcas. ¿Qué pasa?","o":[["Queda vacío para siempre, y sus transiciones de salida no vuelven a habilitarse.","Correcta."],["Se vuelve a llenar en cuanto dispare alguna transición de entrada.","No: toda transición de entrada del sifón es también de salida, y necesita marcas del propio sifón."],["Se convierte en una trampa.","No."],["Nada: un sifón vacío no afecta a la red.","No: deja muertas sus transiciones de salida."]],"c":0,"r":"Son conjuntos de plazas, y son conceptos **estructurales**:\n- **Sifón**: •P' ⊆ P'• (toda transición que le da marcas al conjunto también le saca). **Sólo puede perder marcas**: si se vacía, queda vacío **para siempre**, y sus transiciones de salida no vuelven a habilitarse. Un sifón vacío es un problema de diseño permanente.\n- **Trampa**: P'• ⊆ •P' (toda transición que le saca marcas también le da). **Sólo puede ganar marcas**: si tiene al menos una, la conserva para siempre.\n\nLa unión de sifones es un sifón, y la de trampas es una trampa."},
{"id":"commoner","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Qué dice el teorema de Commoner?","o":[["Que una red de libre elección extendida es viva si cada sifón contiene una trampa marcada.","Así ningún sifón puede vaciarse del todo."],["Que toda red acotada es viva.","La acotación no implica vivacidad."],["Que toda trampa contiene un sifón vacío.","No es el enunciado, y además invierte los papeles."],["Que una red es viva si tiene un T-invariante.","Tener un T-invariante no alcanza para que la red sea viva."]],"c":0,"r":"Una red ordinaria de **libre elección extendida** es **viva** si **cada sifón contiene una trampa marcada** (no deficiente) en el marcado inicial.\n\nLa idea: si todo sifón tiene adentro una trampa que nunca se queda sin marcas, ningún sifón puede vaciarse del todo, y la red nunca pierde la posibilidad de disparar sus transiciones."},
{"id":"grafo-vs-cobertura","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Por qué el árbol de cobertura pierde información respecto del grafo de marcas?","o":[["Porque ω agrupa infinitas marcas distintas, y no siempre se puede saber si una marca exacta es alcanzable.","Correcta."],["Porque no incluye el marcado inicial.","No."],["Porque sólo sirve para redes seguras.","No: justamente sirve para las no acotadas."],["Porque elimina los ciclos.","No."]],"c":0,"r":"El **grafo de marcas** (de accesibilidad) es exacto, pero sólo es finito si la red es **acotada**; si no, tiene infinitos nodos.\n\nPara redes potencialmente **no acotadas** se usa el **árbol de cobertura**: las componentes que crecen sin límite se marcan con ω, y el árbol **siempre es finito**. El precio es que **pierde información**: no siempre permite responder si una marca exacta es alcanzable. Para una red acotada, el árbol de cobertura coincide con el grafo de marcas.\n\nModelar con redes no elimina la explosión de estados: la **posterga**, porque los invariantes permiten razonar sin construir el grafo."},
{"id":"acotada-buffer","tema":"Del modelo al programa","src":"2020 (x2), 2023","ex":true,"q":"¿Qué relación tiene que una RdP que modela un sistema sea acotada (o tenga una plaza limitada que modela el buffer) con los buffers del programa que implementa el modelo?","o":[["El buffer que modela esa plaza tiene una capacidad máxima finita, igual a la cota de la plaza.","Correcta."],["Ninguna: la acotación es una propiedad sólo del modelo.","No: es justamente lo que hace implementable al programa."],["El buffer nunca se vacía.","No: acotada dice que no se pasa de un máximo, no que no se vacíe."],["Hay que usar un hilo por cada elemento del buffer.","No."]],"c":0,"r":"Si la red es acotada, todas las plazas tienen una cota k. La plaza que modela un buffer nunca supera k marcas, así que **el buffer del programa no es infinito: tiene una capacidad máxima**, igual a la cota de la plaza. Se puede implementar con memoria finita (por ejemplo, un arreglo de tamaño k) sin desbordarse, y el productor se bloquea cuando se llena.\n\nSi la red no fuera acotada, el buffer crecería sin límite: el modelo no sería implementable con recursos finitos."},
{"id":"segura-hilos","tema":"Del modelo al programa","src":"2020","ex":true,"q":"Si una RdP es segura y se instancia un hilo por plaza, ¿qué se puede asegurar?","o":[["Que un hilo por plaza alcanza, porque nunca hay dos actividades pendientes en la misma plaza.","No hace falta código reentrante para la acción de una plaza."],["Que el programa no tiene condiciones de carrera.","La seguridad de la red no protege los datos compartidos del código."],["Que hay que crear dos hilos por plaza.","Con a lo sumo una marca por plaza, alcanza con uno."],["Que el programa termina.","La seguridad no dice nada de la terminación."]],"c":0,"r":"Si la red es segura, cada plaza tiene **a lo sumo una marca**. Si cada plaza la atiende un hilo, nunca hay más de una \"actividad\" pendiente en esa plaza, así que **un hilo por plaza alcanza**: nunca se necesitan dos ejecuciones simultáneas de la misma acción (no hace falta código reentrante) y ningún trabajo queda esperando a un hilo libre.\n\nSi la red fuera k-acotada con k > 1, esa plaza podría tener k marcas a la vez: para aprovechar ese paralelismo harían falta hasta k hilos, o el hilo tendría que procesar las marcas de a una.","n":"Esta pregunta quedó sin contestar en el parcial de 2020 que hay en la carpeta, así que no hay comentario de la cátedra: la respuesta modelo está razonada desde la definición de red segura."},
{"id":"secuencia-infinita","tema":"Del modelo al programa","src":"2021, recup. 2021, capturas","ex":true,"q":"¿Qué relación tiene que una RdP que modela un sistema tenga una **secuencia de disparos infinita** con el programa que implementa el modelo?","o":[["El programa no termina: es reactivo (como un SO) y siempre tiene al menos una transición que puede disparar.","Correcta."],["El programa tiene un error: toda secuencia de disparos debe ser finita.","No: los sistemas reactivos no terminan, y eso es lo esperado."],["El buffer del programa es infinito.","No: eso tiene que ver con la acotación, no con la longitud de la secuencia."],["El programa usa infinitos hilos.","No: unos pocos hilos en bucle alcanzan."]],"c":0,"r":"Que el programa **no termina**: es un sistema reactivo, como un sistema operativo o un servidor, cuyos hilos corren en un **bucle infinito**. Para que eso sea posible, **siempre tiene que poder dispararse al menos una transición** (la red no tiene deadlock: hay al menos una transición viva) y la red tiene que tener **ciclos** (T-invariantes) que la devuelvan a marcas ya visitadas.\n\nSi además es acotada, el programa puede correr para siempre con memoria finita.","n":"En el recuperatorio 2021 respondieron sólo \"si o si debe dispararse aunque sea una transición\" y sacaron 0. La misma idea **con el ejemplo del sistema operativo** (\"tiene secuencia de disparos infinita, lo cual implica que sí o sí tiene al menos una transición...\") sacó 1. Desarrollala: programa que no termina, ejemplo, al menos una transición disparable."},
