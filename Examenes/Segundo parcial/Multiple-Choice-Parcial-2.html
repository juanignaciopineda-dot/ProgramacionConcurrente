{"id":"mutex-semaforo","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Qué representa en Java un lugar con N fichas que es entrada de las secciones críticas y salida de sus finales?","o":[["El lugar es el semáforo; tomar una ficha es `acquire()` y devolverla es `release()`.","Correcta."],["El lugar es un hilo y las fichas son sus estados.","No."],["El lugar es un `CountDownLatch`.","No: el latch sólo decrementa y no se puede reutilizar."],["No hay relación: las RdP no modelan semáforos.","No: es el ejemplo central del apunte."]],"c":0,"r":"Son el mismo objeto: `new Semaphore(N)` es un lugar con **N fichas**; `acquire()` es la transición de **entrada** (consume una ficha, y no puede dispararse si no hay), y `release()` la de **salida** (devuelve la ficha).\n\nCon N = 1 es la exclusión mutua: el lugar mutex. El P-invariante M(SC_{1}) + M(SC_{2}) + M(recursos) = N es la **prueba** de que el semáforo nunca deja más de N hilos adentro."},
{"id":"buffer-rdp","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Cómo se modela un buffer acotado de capacidad N?","o":[["Con dos lugares, libres y ocupados, cuya suma es siempre la capacidad.","Correcta."],["Con una transición fuente que produce sin límite.","No: así el buffer no estaría acotado."],["Con un arco reset sobre el buffer.","No."],["Con un solo lugar con N fichas y sin restricciones.","No: falta el lugar complementario que bloquea al productor."]],"c":0,"r":"Con dos lugares complementarios, **libres** y **ocupados**, cuya suma es constante e igual a la capacidad N: M(libres) + M(ocupados) = N. La transición **producir** tiene a \"libres\" como entrada (no puede disparar con el buffer lleno) y **consumir** tiene a \"ocupados\" como entrada (no puede disparar con el buffer vacío).\n\nEl bloqueo del productor y del consumidor **sale solo del modelo**, sin escribir una línea de control. En Java es el `EventStorage` con `wait()`/`notifyAll()`, o dos semáforos (vacíos y llenos) más un mutex."},
{"id":"filosofos","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"En la versión correcta (tomar los dos tenedores en un solo disparo), ¿qué problema puede seguir habiendo?","o":[["Inanición: dos vecinos pueden turnarse para siempre.","Correcta: para eso hace falta una política."],["Deadlock: todos con un tenedor.","No: el disparo atómico lo impide."],["Dos vecinos comiendo a la vez.","No: lo impide el P-invariante del tenedor compartido."],["Que la red no esté acotada.","No: los invariantes la acotan."]],"c":0,"r":"- **Ingenua** (tomar los tenedores de a uno): si los cinco toman el izquierdo antes de que alguno tome el derecho, queda una marca con cinco fichas en \"con uno\" y **ningún tenedor libre**: ninguna transición está sensibilizada. Es un **deadlock** alcanzable, y el grafo de marcados lo encuentra.\n- **Correcta** (tomar los dos a la vez): una sola transición con tres entradas (pensando, tenedor izq., tenedor der.). Como el disparo es **atómico**, nadie se queda con un tenedor a medias. Los P-invariantes prueban que dos vecinos nunca comen a la vez, y la red no tiene deadlock.\n\nPero **no evita la inanición**: dos vecinos pueden turnarse para siempre. Para eso hace falta una **política** (prioridades, turnos, un monitor)."},
{"id":"barberia","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Qué método de `Semaphore` modela al cliente que se va si no hay banco libre?","o":[["`tryAcquire()`, que no bloquea y devuelve `false` si no hay permiso.","Correcta."],["`acquire()`.","No: el cliente se quedaría esperando un banco."],["`release()`.","No: eso libera un banco."],["`acquireUninterruptibly()`.","No: también bloquea."]],"c":0,"r":"Dos componentes conservadores:\n- M(bancos) + M(esperando) = m: nunca hay más de m clientes esperando. La regla \"si no hay banco, se va\" no es un `if`: es estructural, porque con `bancos` en 0 no se puede sentar.\n- M(barberos libres) + M(cortando) + M(barbero en caja) = n: cobrar le saca un barbero a la tarea de cortar.\n\nEn Java: sala de espera `new Semaphore(m)`, sillones `new Semaphore(n)`, caja `new Semaphore(1)`, y el cliente rechazado con `if (!salaDeEspera.tryAcquire()) { irse(); return; }`."},
{"id":"sensibilizado-extendido","tema":"Del modelo al programa","src":"filmina (paper ecuación generalizada)","ex":false,"q":"En la ecuación de estado generalizada de la cátedra, ¿cómo se decide si una transición puede dispararse cuando hay arcos inhibidores, lectores, guardas, eventos y tiempo?","o":[["Con la conjunción (AND) de los vectores de sensibilizado por marcado, inhibidores, lectores, guardas, eventos y tiempo.","Correcta."],["Sumando a la matriz de incidencia una matriz por cada tipo de arco.","No: los arcos especiales no se meten en C; se evalúan con matrices aparte y se combinan con AND."],["Disparando todas las transiciones sensibilizadas a la vez.","No: se usa la política de servidor único, de a un disparo."],["Con la disyunción (OR) de las condiciones.","No: tienen que cumplirse todas."]],"c":0,"r":"Se calcula un **vector de sensibilizado extendido** como la **conjunción lógica** (AND) de varios vectores binarios, uno por cada condición:\n- E: sensibilizada por marcado (la ecuación de estado clásica).\n- B: no inhibida por arcos inhibidores.\n- L: habilitada por arcos lectores.\n- G: guardas verdaderas.\n- V: hay eventos en la cola de la transición.\n- Z: el tiempo transcurrido está dentro de la ventana [α, β].\n\nSólo puede dispararse una transición con 1 en todos. El disparo se hace con la ecuación original (salvo el arco reset), y la ventaja es que se implementa como un circuito combinacional (IP-Core en FPGA)."},
{"id":"servidor-unico","tema":"Del modelo al programa","src":"filmina (paper ecuación generalizada)","ex":false,"q":"¿Qué es la política de servidor único?","o":[["Calcular el nuevo estado considerando un solo disparo por vez, y si hacen falta más, una secuencia.","Evita conflictos en el cálculo del estado."],["Tener un solo hilo para toda la red.","Habla de los disparos, no de los hilos."],["Que cada transición tenga un solo arco de entrada.","Es una restricción de estructura, no una política de disparo."],["Disparar todas las transiciones sensibilizadas a la vez.","Es lo contrario."]],"c":0,"r":"Calcular el nuevo estado considerando **un solo disparo de una transición** por vez. Si hacen falta más, se hace una **secuencia** de disparos.\n\nSe usa para **evitar conflictos** en el cálculo: nunca se aplican dos disparos \"a la vez\" que compitan por las mismas marcas. Para que el sistema sea determinístico hacen falta además políticas de selección: prioridades, probabilidades, arcos inhibidores o lectores."},
{"id":"monitor-def","tema":"Monitores","src":"resumen","ex":true,"q":"¿Qué es un monitor?","o":[["Un módulo de alto nivel que encapsula el estado de un recurso compartido y sus procedimientos, ejecutados en exclusión mutua y con sincronización por condición.","Correcta."],["Un contador entero con dos operaciones, wait y signal.","No: eso es un semáforo."],["Un hilo que vigila a los demás hilos.","No."],["Una plaza de una red de Petri.","No."]],"c":0,"r":"Un **mecanismo de software de alto nivel** para el control de la concurrencia: un módulo de abstracción que **encapsula** los datos (las variables que representan el estado del recurso) y los procedimientos necesarios para asignar un recurso o grupo de recursos compartidos, reutilizables en serie.\n\nSe cumple que **todos sus métodos se ejecutan en exclusión mutua**, y define la **sincronización por condición** de cada método (bloquear al proceso hasta que se cumpla la condición y avisarle cuando puede seguir). Lo presentó Dijkstra (1971) y lo refinaron Brinch Hansen (1973) y Hoare (1974)."},
{"id":"elementos-monitor","tema":"Monitores","src":"resumen","ex":true,"q":"¿Cuáles son los elementos que componen un monitor?","o":[["Variables permanentes, código de inicialización, procedimientos internos y procedimientos exportados.","Correcta."],["Un contador, una cola y dos operaciones atómicas.","No: eso describe un semáforo."],["Plazas, transiciones y arcos.","No: son los elementos de una RdP."],["Sólo métodos `synchronized`.","No."]],"c":0,"r":"- Las **variables locales permanentes**, que almacenan el estado interno del recurso.\n- El **código de inicialización** (constructor).\n- Los **procedimientos internos**, que manejan las variables permanentes.\n- La declaración de los **procedimientos exportados**, que son los que pueden llamar los procesos activos.\n\nPara funcionar, además, usa una **cola de entrada** (mutex) y **variables de condición** con sus colas."},
{"id":"metodos-monitor","tema":"Monitores","src":"recup. 2021","ex":true,"q":"¿Cómo deben ejecutarse los métodos de un monitor?","o":[["En exclusión mutua.","Correcta."],["Dentro del monitor y no fuera.","No: esa respuesta sacó 0."],["En paralelo, para aprovechar los núcleos.","No: se excluyen entre sí."],["En el orden en que fueron declarados.","No."]],"c":0,"r":"**En exclusión mutua**: un solo proceso a la vez puede estar ejecutando un método del monitor (cualquiera de ellos). Si otro proceso intenta entrar, el código de acceso lo bloquea y lo manda a la **cola de entrada**; cuando el proceso activo sale, el monitor desbloquea al primero de la cola.\n\nAdemás, cada método tiene su **sincronización por condición**: si no se cumple, el proceso se bloquea en una cola de condición y libera el monitor.","n":"En el recuperatorio 2021 respondieron \"deben ejecutarse dentro del mismo y no fuera\" y sacaron 0. La palabra clave es **exclusión mutua**."},
{"id":"acciones-afuera","tema":"Monitores","src":"2021 (x2)","ex":true,"q":"Las acciones que implementan operaciones sobre los recursos, ¿se realizan adentro o afuera del monitor? ¿Por qué?","o":[["Afuera, para liberar el monitor y no serializar todas las acciones.","Correcta: es el comentario textual de la cátedra."],["Adentro, porque el monitor administra los recursos.","No: sacó 0 en 2021."],["Adentro, para garantizar la exclusión mutua de la acción.","No: el monitor garantiza el acceso; la acción va afuera."],["Es indistinto.","No."]],"c":0,"r":"**Afuera** del monitor, con el fin de **liberar el monitor** permitiendo el acceso a otros hilos y **no serializar todas las acciones** posibles.\n\nEl monitor sólo decide si el hilo puede avanzar (dispara la transición, actualiza el estado) y lo deja salir. La acción en sí (imprimir, producir, usar el recurso) se hace fuera; si se hiciera adentro, mientras un hilo trabaja nadie más podría ni siquiera consultar el estado, y se perdería todo el paralelismo.","n":"En 2021 respondieron \"adentro, porque el monitor es el que administra los recursos\" y sacaron 0. El comentario es la respuesta textual: \"Se realizan afuera del monitor, con el fin de liberar el monitor permitiendo el acceso y no serializar todas las acciones posibles\"."},
{"id":"variables-condicion","tema":"Monitores","src":"2021, 2023, capturas","ex":true,"q":"¿Qué función cumplen las variables de condición en un monitor?","o":[["Hacer esperar a un proceso hasta que se cumpla una condición del monitor, y despertar a los que esperaban por ella.","Correcta."],["Indicar si el proceso tiene que dormirse o ejecutarse.","No: esa respuesta sacó 0 en 2021."],["Garantizar la exclusión mutua de los métodos.","No: eso lo hace la cola de entrada (el mutex)."],["Guardar el estado del recurso.","No: eso lo hacen las variables permanentes."]],"c":0,"r":"Dos funciones:\n- **Hacer esperar** a un proceso hasta que se cumpla una condición sobre el estado del monitor. Con `wait`, el proceso queda dormido en la cola asociada a la variable y **libera el monitor**.\n- **Despertar** a un proceso que estaba esperando por esa condición. Con `signal`, si la cola no está vacía se despierta al primero (qué pasa después depende de la política); si está vacía, no pasa nada.\n\nSon \"contenedores\" de hilos que esperan una determinada condición.","n":"En 2021, \"nos indica si el proceso tiene que irse a dormir a una cola asociada o se debe ejecutar\" sacó 0. En 2023, \"hacer esperar a un proceso hasta que una condición del estado del monitor se cumpla; también despierta a procesos que estaban esperando por su causa\" sacó 1. Nombrá las **dos** funciones."},
{"id":"transiciones-varcond","tema":"Monitores","src":"recup. 2021","ex":true,"q":"¿Cómo se relacionan las transiciones (de la RdP) con las variables de condición en un monitor?","o":[["Hay una relación biunívoca: cada transición tiene su variable de condición.","Correcta."],["Cada variable de condición representa una plaza.","No: representa una transición."],["No tienen relación.","No."],["Todas las transiciones comparten una única variable de condición.","No: eso es lo que pasa con `wait`/`notify` de Java, y por eso hace falta `notifyAll`."]],"c":0,"r":"Es posible establecer una **relación biunívoca**: una representa a la otra. Cada transición tiene su variable de condición (su cola). Un hilo que quiere disparar una transición que no está sensibilizada se duerme en la cola de **esa** transición; cuando la transición se sensibiliza, el monitor despierta a un hilo de esa cola.","n":"En el recuperatorio 2021 se explicó la analogía entre recursos y sensibilización y sacó 0. Lo que pedía la cátedra es la palabra **biunívoca**: una representa a la otra."},
{"id":"politicas-reactivacion","tema":"Monitores","src":"2021 (x2), recup. 2021, 2023","ex":true,"q":"¿Qué resuelven las políticas de reactivación de un monitor (entrada, waiting, cortesía)?","o":[["La secuencia de acceso al monitor.","Correcta."],["Los conflictos modelados por la RdP.","No: eso lo resuelven las políticas de las colas de condición. Sacó 0 acá."],["La concurrencia y los conflictos.","No: sacó 0 en 2021."],["El tamaño de las colas.","No."]],"c":0,"r":"Resuelven **la secuencia de acceso al monitor**: cuando el monitor se libera, a quién se le da entre los hilos de la **cola de entrada**, los de las **colas de condición** (waiting) que fueron señalizados y el de la **cola de cortesía** (urgente). Se definen por las prioridades relativas de esas colas.","n":"Atención: \"resuelven los conflictos modelados por la RdP\" sacó 0 (recuperatorio 2021) y \"resuelven la concurrencia y los conflictos\" también (2021). Eso es lo que resuelven las políticas de las **colas de condición**. Las de **reactivación** resuelven **la secuencia de acceso al monitor**."},
{"id":"politicas-condicion","tema":"Monitores","src":"2021","ex":true,"q":"¿Qué resuelven las políticas de las colas de condición (transiciones) en un monitor?","o":[["Los conflictos modelados por la RdP.","Correcta."],["La secuencia de acceso al monitor.","No: eso lo resuelven las políticas de reactivación."],["El deadlock de la red.","No: una política no arregla un deadlock del modelo."],["La acotación de las plazas.","No."]],"c":0,"r":"Resuelven **los conflictos modelados por la RdP**. Cuando hay varias transiciones sensibilizadas con hilos esperando en sus colas, la política **elige cuál disparar**, es decir, a qué hilo despertar.","n":"Es la contracara de las políticas de **reactivación** (entrada-waiting-cortesía), que resuelven la secuencia de acceso al monitor. No las confundas."},
{"id":"cola-cortesia","tema":"Monitores","src":"recup. 2021, capturas","ex":true,"q":"¿Cuál es el objetivo de implementar una cola de cortesía en un monitor?","o":[["Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado, por encontrarse urgido.","Correcta: es la frase de la cátedra."],["Encolar a los hilos que llegan mientras hay uno activo.","No: esa es la cola de entrada. Sacó 0."],["Dormir a los hilos cuya transición no está sensibilizada.","No: esas son las colas de condición."],["Darles prioridad a los hilos nuevos.","No: es al revés."]],"c":0,"r":"**Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado, por encontrarse urgido.**\n\nCuando el hilo que está en el monitor despierta a otro (signal), le cede el monitor y se queda esperando en la cola de cortesía, que tiene **prioridad sobre la cola de entrada**. Así el despertado encuentra la condición tal como se la dejaron, y no se la gana un hilo nuevo (lo que podría postergarlo indefinidamente).","n":"En una captura describieron la cola de entrada (bloquear al que llega mientras hay un proceso activo) y sacaron 0. El comentario es la frase textual: \"Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado por encontrarse urgido\"."},
{"id":"semaforo-debilidades","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Cuál es la principal crítica a los semáforos que motiva los monitores?","o":[["Que las primitivas quedan esparcidas por el código y olvidar una puede corromper el sistema.","Correcta."],["Que son más lentos que cualquier otro mecanismo.","No: la crítica es de diseño, no de velocidad."],["Que no sirven para la exclusión mutua.","No: sí sirven (semáforo binario)."],["Que sólo permiten un hilo a la vez.","No: un semáforo de N permisos deja pasar N."]],"c":0,"r":"- La **omisión** de una primitiva (un `signal` olvidado) puede corromper todo el sistema.\n- El control de la concurrencia es **responsabilidad del programador**.\n- Las primitivas quedan **esparcidas** por todo el sistema: el código de sincronización está repartido entre los procesos, y es difícil de mantener.\n- La sección crítica y la sincronización usan **las mismas primitivas**, y cuesta distinguirlas.\n- No se puede restringir el tipo de operación sobre el recurso.\n\nEl monitor **centraliza** todo en una sola estructura de alto nivel."},
{"id":"signal-politicas","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿En qué política el proceso que señaliza se bloquea, pero es el primero en recuperar el mutex cuando lo libera el despertado?","o":[["Signal and Urgent Wait.","Correcta: es la que usa la cola de cortesía (urgente)."],["Signal and Continue.","No: ahí el que señaliza no se bloquea."],["Signal and Wait.","No: ahí compite de nuevo, sin prioridad."],["Signal and Exit.","No: ahí el que señaliza sale del método."]],"c":0,"r":"- **Signal and Continue (SC)**: el que señaliza **mantiene** el mutex y sigue; el despertado compite por el mutex. No hace falta cola de cortesía.\n- **Signal and Wait (SW)**: el que señaliza se **bloquea** y compite de nuevo por el mutex; el despertado lo toma y sigue.\n- **Signal and Urgent Wait (SU)**: el que señaliza se bloquea, pero es **el primero** en conseguir el mutex cuando el despertado lo libera (cola de cortesía o urgente).\n- **Signal and Exit (SX)**: el que señaliza **sale** del método, y el despertado toma directamente el mutex."},
{"id":"signal-continue","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"Con la política Signal and Continue, ¿hace falta una cola de cortesía?","o":[["No, el que señaliza sigue ejecutando, así que nunca queda esperando.","Los señalizados pasan a la cola de entrada."],["Sí, para el hilo que señaliza.","El que señaliza no pierde el monitor."],["Sí, para los hilos señalizados.","Los señalizados van a la cola de entrada, no a una de cortesía."],["Sólo si hay más de una variable de condición.","La cantidad de condiciones no cambia la respuesta."]],"c":0,"r":"**No.** La señalización no hace que el hilo que señaliza pierda el monitor: sigue ejecutando. Los hilos señalizados se mueven a la **cola de entrada**, con más prioridad que los que esperaban para entrar. Como el que señaliza nunca queda esperando, no hay nadie a quien poner en una cola de cortesía."},
{"id":"monitor-prioridad-espera","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Por qué el monitor debe darle prioridad a un proceso que esperaba un recurso sobre los procesos nuevos que piden entrar?","o":[["Para evitar que lo posterguen indefinidamente.","Correcta."],["Para garantizar la exclusión mutua.","No: la exclusión mutua la da el mutex, sin importar el orden."],["Para que la red sea acotada.","No."],["Para que el monitor ejecute más rápido.","No."]],"c":0,"r":"Para asegurar que el proceso que espera **obtenga** el recurso. Si los procesos nuevos de la cola de entrada pudieran tomarlo antes, el que esperaba podría ser postergado una y otra vez: **postergación indefinida** (inanición). Por eso las colas de condición y de cortesía tienen prioridad sobre la de entrada."},
{"id":"gestor-monitor","tema":"Monitores","src":"filmina (diagrama de secuencia del monitor)","ex":false,"q":"En el monitor de la cátedra, ¿qué representa m = Vs AND Vc?","o":[["Las transiciones que están sensibilizadas y además tienen hilos esperando en su cola.","Correcta."],["Las transiciones que acaban de dispararse.","No."],["Los hilos que están en la cola de entrada.","No: Vc es por transición, de las colas de condición."],["El nuevo marcado de la red.","No: el marcado se actualiza con la ecuación de estado."]],"c":0,"r":"1. El hilo toma el **mutex** del monitor (`acquire`).\n2. Intenta **disparar** la transición en la RdP: k = rdp.disparar(t).\n3. **Si disparó** (k verdadero): calcula Vs (transiciones **sensibilizadas**) y Vc (transiciones con **hilos esperando** en sus colas), y m = **Vs AND Vc**.\n   - Si m ≠ 0, la **política** elige cuál (`cual()`), despierta a un hilo de esa cola (`release`) y el hilo actual **sale del monitor sin liberar el mutex**: lo hereda el despertado. Es **Signal and Exit**: el mutex pasa de mano en mano y nadie de la cola de entrada se cuela.\n   - Si m = 0, nadie puede avanzar: k = false y sale.\n4. **Si no pudo disparar**: libera el mutex y se **duerme en la cola de esa transición** (`acquire` de la cola). Cuando lo despiertan, ya tiene el monitor y vuelve al paso 2.\n5. Al salir del loop, libera el mutex.\n\nLa **lógica** está en la RdP; la **política**, en la clase Políticas; las acciones se hacen afuera."},
{"id":"monitor-logica-politica","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Qué separa (identifica y gestiona por separado) el monitor que propone la cátedra, y qué decisiones de diseño hay que tomar?","o":[["La lógica (la RdP), la política (las colas) y las acciones.","Correcta."],["Los hilos, los procesos y los núcleos.","No."],["La lectura y la escritura, como un `ReadWriteLock`.","No."],["El código Java y el diagrama UML.","No."]],"c":0,"r":"Separa:\n- La **lógica del sistema** (la RdP: qué puede pasar).\n- La **política del sistema**, que emerge de la relación entre las colas de entrada, de condición y de cortesía, y de las propias colas de condición (qué pasa cuando hay conflicto).\n- Las **acciones** que se ejecutan (fuera del monitor).\n\nDecisiones de diseño: (1) una estructura general para los métodos que implementan las acciones del recurso compartido, (2) qué condición en las colas se requiere para bloquear, y (3) una estrategia para desbloquear cuando hay varios hilos candidatos."},
{"id":"rdpt-semantica","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Por qué se elige la semántica de tiempo de sensibilización?","o":[["Porque la de tiempo de disparo no permite modelar actividades interrumpibles, como un timeout.","Correcta."],["Porque es la única en la que el disparo tiene duración.","No: es al revés, en la de sensibilización el disparo es instantáneo."],["Porque elimina todos los conflictos.","No."],["Porque no necesita marcado.","No."]],"c":0,"r":"- **Tiempo de sensibilización** (enabling time): el parámetro temporal es el tiempo que pasa desde que la transición queda sensibilizada hasta que se dispara. La retirada y colocación de marcas es **atómica e instantánea**.\n- **Tiempo de disparo** (firing time, semántica de duración): el tiempo pasa **entre** retirar las marcas de entrada y poner las de salida; el disparo no es atómico, tiene duración.\n\nSe elige la de **sensibilización** porque la de disparo **no permite modelar actividades interrumpibles** (timeouts, transferencia asíncrona de control), y eso la descarta para sistemas de tiempo real."},
{"id":"rdpt-intervalo","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"Una transición con intervalo [2, 5] queda sensibilizada en t = 10. ¿Cuándo puede dispararse?","o":[["Entre t = 12 y t = 15.","Correcta: entre wi + α y wi + β."],["Entre t = 2 y t = 5.","No: el intervalo se cuenta desde que se sensibiliza."],["En cualquier momento después de t = 10.","No: no antes de 12."],["Exactamente en t = 15.","No: eso sería un intervalo puntual."]],"c":0,"r":"Cada transición tiene un **intervalo estático** [α, β]. Si t_{i} empieza a estar sensibilizada en el instante w_{i} y sigue sensibilizada, el disparo se produce **no antes de w_{i} + α y no más tarde de w_{i} + β**.\n- α es el instante de disparo más cercano (**EFT**, earliest firing time).\n- β es el más lejano (**LFT**, latest firing time).\n\nCasos particulares: intervalo puntual [a, a] (tiempo fijo) e intervalo sin restricción [0, ∞), que equivale al formalismo autónomo. Las marcas permanecen en los lugares de entrada durante la espera, y el disparo es instantáneo."},
{"id":"rdpt-debil-fuerte","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Qué diferencia hay entre la semántica de tiempo débil y la fuerte?","o":[["En la fuerte la transición debe dispararse dentro del intervalo. En la débil no está obligada, pero si dispara, lo hace dentro del intervalo.","La fuerte es la apropiada para tiempo real."],["En la débil la transición está obligada a dispararse.","Es al revés."],["En la débil no hay intervalos de tiempo.","Las dos tienen intervalo. Lo que cambia es si el disparo es obligatorio."],["Son iguales, sólo cambia el nombre.","Difieren en si el disparo es obligatorio."]],"c":0,"r":"- **Fuerte** (strong): hay que indicar específicamente en qué momento y con qué condiciones **se debe** realizar el disparo. Es la apropiada para tiempo real.\n- **Débil** (weak): la transición **no está obligada** a disparar, pero si lo hace, tiene que ser dentro del intervalo. Sirve para acciones que sólo pueden ocurrir en un período, pero que no necesariamente ocurren.\n\nLa débil se puede modelar con la fuerte agregando una transición en conflicto que aborte la ejecución."},
{"id":"rdpt-tipos","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Qué tipo de transición modela un timeout?","o":[["TIME.","Correcta."],["CODE.","No: CODE modela la ejecución de un código."],["SYCO.","No: SYCO es de disparo inmediato, sin significado temporal."],["Una transición fuente.","No."]],"c":0,"r":"- **CODE**: representan la ejecución de un código o actividad, que empieza cuando la transición se sensibiliza; la etiqueta [α, β] es el tiempo mínimo y máximo de ejecución. Modelan la parte operativa.\n- **TIME**: asociadas a una actividad temporal, como un **timeout** o una activación periódica. Modelan el control y la supervisión temporal.\n- **SYCO**: el resto. No tienen significado temporal: disparo inmediato (intervalo [0, 0]). Modelan sincronizaciones, eventos no temporales y excepciones."},
{"id":"rdpt-estado","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Cuál es el estado de una RdP con tiempo?","o":[["El par (M, I), formado por el marcado y los intervalos de disparo de las transiciones sensibilizadas.","Importa cuánto tiempo pasó desde que cada transición se sensibilizó."],["Sólo el marcado.","Con el marcado solo no se sabe si ya se puede disparar."],["Sólo el reloj global.","Falta el marcado."],["El conjunto de transiciones que ya dispararon.","El historial no es el estado."]],"c":0,"r":"Es el par **(M, I)**: el marcado M y el vector I de los intervalos de disparo posibles de todas las transiciones sensibilizadas por M.\n\nNo alcanza con el marcado porque para decidir si una transición puede dispararse importan dos cosas: que esté sensibilizada **y** cuánto tiempo pasó desde que se sensibilizó.\n\nPor eso el grafo de estados de una RdP con tiempo puede ser enorme, o infinito en tiempo continuo. Se resuelve con discretización o con el **grafo de clases de estados** (State Class Graph)."},
{"id":"monitor-tiempo","tema":"RdP con tiempo","src":"filmina (diagrama de secuencia monitor con tiempo)","ex":false,"q":"En el monitor con tiempo de la cátedra, ¿qué hace un hilo que quiere disparar una transición temporal antes de que se abra su ventana de tiempo?","o":[["Libera el mutex, se marca como esperando y duerme hasta que se abra la ventana; después reintenta.","Correcta."],["Dispara igual, porque la transición está sensibilizada.","No: en una RdP con tiempo, además hay que respetar la ventana."],["Duerme dentro del monitor, sin liberar el mutex.","No: bloquearía a todos los demás hilos."],["Descarta la transición para siempre.","No: sólo pasa eso si la ventana ya se cerró."]],"c":0,"r":"Al intentar disparar se verifica la **ventana de tiempo**: α < (ahora − timeStamp) < β, donde timeStamp es el instante en que la transición se sensibilizó.\n- Si está **dentro** de la ventana (y nadie más está esperando esa transición), dispara.\n- Si llegó **antes** de la ventana: **libera el mutex**, se marca como esperando y **duerme** `sleep(timeStamp + α − ahora)`, fuera del monitor. Después vuelve a intentarlo.\n- Si la ventana ya pasó: no dispara (k = false).\n\nDespués de cada disparo se actualizan los timeStamps de las transiciones que quedaron sensibilizadas.","n":"El detalle que importa: el `sleep` se hace **habiendo liberado el mutex**. Si un hilo durmiera dentro del monitor, bloquearía a todos los demás durante la espera."},
{"id":"phaser-init","tema":"Sincronizadores y Executors","src":"2023","ex":true,"q":"¿Con qué valor debe ser inicializada la primitiva PHASER?","o":[["Con la cantidad de participantes que se sincronizan en cada fase.","Correcta."],["Con la cantidad de fases que va a tener.","No: las fases se cuentan solas, a partir de 0."],["Con el tiempo máximo de espera.","No: eso es un parámetro de algunos métodos de espera, no del constructor."],["Con 1, como un semáforo binario.","No: no es un semáforo."]],"c":0,"r":"Con la **cantidad de participantes** (parties) que se sincronizan en cada fase: `new Phaser(n)`. La fase avanza cuando **todos** los participantes registrados llegaron.\n\nTambién se puede crear con 0 y registrar participantes dinámicamente con `register()` (o `bulkRegister(n)`). Cada participante llama a `arriveAndAwaitAdvance()` al terminar su fase, o a `arriveAndDeregister()` para dejar de participar.","n":"En 2023 la dejaron sin responder (un punto) y sacaron 0. Es la única pregunta de Java de los segundos parciales que hay en la carpeta."},
{"id":"phaser-metodos","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"Un participante de un `Phaser` terminó su trabajo y no va a participar en las fases siguientes. ¿Qué método llama?","o":[["`arriveAndDeregister()`.","Correcta."],["`arriveAndAwaitAdvance()`.","No: con ese seguiría registrado y las próximas fases lo esperarían."],["`register()`.","No: eso suma un participante."],["`countDown()`.","No: es un método del `CountDownLatch`."]],"c":0,"r":"- `arriveAndAwaitAdvance()`: el participante avisa que terminó la fase y **espera** a los demás.\n- `arrive()`: avisa que llegó, **sin esperar**.\n- `arriveAndDeregister()`: avisa y **deja de participar**; las fases siguientes esperan a uno menos.\n- `register()` / `bulkRegister(n)`: suma participantes.\n- `getPhase()`: número de fase actual.\n- `onAdvance(phase, registeredParties)`: se ejecuta al cambiar de fase; si devuelve `true`, el phaser **termina**. Por defecto termina cuando no quedan participantes registrados.\n\nA diferencia del `CountDownLatch`, se **reutiliza** fase tras fase, y la cantidad de participantes puede cambiar."},
{"id":"cyclicbarrier","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"¿Qué distingue a un `CyclicBarrier` de un `CountDownLatch`?","o":[["Que es reutilizable y los hilos que llegan son los mismos que esperan.","Correcta."],["Que protege una sección crítica.","No: ninguno de los dos es exclusión mutua."],["Que no tiene un número fijo de participantes.","No: eso es una característica del `Phaser`."],["Que se decrementa con `countDown()`.","No: eso es del `CountDownLatch`."]],"c":0,"r":"Es un punto de encuentro para **N hilos**: `new CyclicBarrier(n, accion)`. Cada hilo llama a `await()` y se duerme hasta que llegaron los n; entonces se ejecuta la **acción de barrera** (un `Runnable` opcional) y se liberan todos.\n\nDiferencias con el `CountDownLatch`:\n- Es **reutilizable** (cíclica): después de liberar, vuelve a esperar a n hilos.\n- En la barrera **esperan los mismos hilos que llegan**; en el latch, unos esperan (`await`) y otros cuentan (`countDown`).\n- Si un hilo que espera es interrumpido o vence su plazo, la barrera se **rompe** y los demás reciben `BrokenBarrierException`."},
{"id":"exchanger","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"¿Para qué sirve un `Exchanger`?","o":[["Para que dos hilos se esperen e intercambien un objeto.","Correcta."],["Para que N hilos esperen a que ocurran N eventos.","No: eso es el `CountDownLatch`."],["Para cambiar la prioridad de un hilo.","No."],["Para pasar tareas a un pool de hilos.","No: eso es un executor."]],"c":0,"r":"Para que **dos hilos intercambien datos** en un punto de sincronización. Cada uno llama a `exchange(objeto)`: el primero que llega se bloquea hasta que llega el otro, y entonces cada uno recibe el objeto del otro.\n\nEjemplo típico: un productor y un consumidor que intercambian buffers (el productor entrega el lleno y recibe el vacío)."},
{"id":"executor","tema":"Sincronizadores y Executors","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre `shutdown()` y `shutdownNow()`?","o":[["`shutdown()` termina las tareas que ya tiene; `shutdownNow()` descarta las pendientes e interrumpe las que corren.","Correcta."],["`shutdown()` bloquea al que llama hasta que todo termina.","No: no bloquea; para esperar está `awaitTermination()`."],["`shutdownNow()` mata los hilos con `stop()`.","No: los interrumpe; terminan si su código responde a la interrupción."],["Son iguales.","No."]],"c":0,"r":"Es un administrador de un **pool de hilos**. El programador sólo crea las tareas (`Runnable`) y las envía con `execute()`; el executor crea, **reutiliza** y administra los hilos. Con `Executors.newFixedThreadPool(n)` hay como máximo n hilos; si están todos ocupados, la tarea **espera en una cola**. Se ahorra el costo de crear un hilo por tarea y se acota la cantidad de hilos vivos.\n\nHay que **finalizarlo** explícitamente: si no, sigue esperando tareas y el programa no termina.\n- `shutdown()`: no acepta tareas nuevas, termina las que tiene (corriendo y encoladas) y se cierra. No bloquea.\n- `shutdownNow()`: no ejecuta las pendientes (las devuelve en una lista) e interrumpe a las que están corriendo.\n\nUna tarea enviada después del `shutdown()` se rechaza y va al `RejectedExecutionHandler`."},
{"id":"threadfactory","tema":"Sincronizadores y Executors","src":"apunte","ex":false,"q":"¿Qué es una `ThreadFactory` y qué ventajas da?","o":[["Una interfaz con un método `newThread(Runnable)` que centraliza la creación de hilos.","Correcta."],["Un pool que reutiliza hilos.","No: eso es un executor (que usa una fábrica por dentro)."],["Una clase que hereda de `Thread`.","No: es una interfaz."],["Un sincronizador como el `Phaser`.","No."]],"c":0,"r":"Es la interfaz de Java para aplicar el **patrón Factory** (creacional) a la creación de hilos. Tiene un solo método, `Thread newThread(Runnable r)`, que recibe la tarea y devuelve el hilo que la va a ejecutar.\n\nCentralizar la creación permite crear hilos **personalizados** (nombre, prioridad, daemon, handler de excepciones), **guardar estadísticas** y **validar o limitar** la cantidad de hilos creados. Hay que asegurarse de que **todos** los hilos del programa se creen con la fábrica.\n\nLos executors usan internamente una `ThreadFactory`, y se les puede pasar una propia."},
{"id":"estr-tabla","tema":"Estructurales, reducción y composición","src":"apunte (filmina de propiedades estructurales)","ex":false,"q":"¿Qué criterio algebraico caracteriza a una red consistente?","o":[["Existe Y > 0 con C · Y = 0.","Correcta: una secuencia con todas las transiciones vuelve exactamente a la marca de partida."],["Existe Y > 0 con C · Y ≥ 0.","No: esa es la repetitiva; puede no volver exactamente a la misma marca."],["Existe X > 0 con X^{T} · C = 0.","No: esa es la conservadora."],["Existe X > 0 con X^{T} · C ≤ 0.","No: esa es la estructuralmente acotada."]],"c":0,"r":"Dependen sólo de la red no marcada (de C), no de M_{0}. X > 0 e Y > 0 significan **todas** las componentes estrictamente positivas.\n- **Estructuralmente acotada**: acotada para **cualquier** M_{0}. Criterio: ∃ X > 0 con **X^{T} C ≤ 0**.\n- **Conservadora**: una suma pesada X^{T} M con X > 0 constante para todo M_{0}. Criterio: ∃ X > 0 con **X^{T} C = 0**. Todos los lugares están cubiertos por P-invariantes, y por eso es acotada.\n- **Repetitiva**: existe M_{0} y una secuencia en la que **cada** transición aparece infinitas veces. Criterio: ∃ Y > 0 con **C Y ≥ 0**.\n- **Consistente**: existe M_{0} y una secuencia con todas las transiciones que vuelve a M_{0}. Criterio: ∃ Y > 0 con **C Y = 0**.\n\nIntuición: si X^{T} C ≤ 0, por la ecuación fundamental X^{T} M ≤ X^{T} M_{0}, así que cada lugar cumple m_{i} ≤ X^{T} M_{0} / x_{i}.","n":"El apunte avisa que la tabla de la filmina tiene signos mal y la reproduce corregida. Si estudiás de la filmina, guiate por la intuición: en la acotada la suma pesada nunca crece (≤ 0) y en la repetitiva la secuencia no le quita fichas a ningún lugar (≥ 0)."},
{"id":"estr-implicaciones","tema":"Estructurales, reducción y composición","src":"apunte (filmina de propiedades estructurales)","ex":false,"q":"¿Qué se puede afirmar de una red viva y estructuralmente acotada?","o":[["Que es conservadora y consistente.","Combina una condición de comportamiento con una estructural."],["Que es segura.","Acotada no significa 1-limitada."],["Que no tiene conflictos.","Puede tener conflictos."],["Que no tiene T-invariantes.","Al contrario, es consistente, así que tiene un T-invariante con todas las transiciones."]],"c":0,"r":"- Toda red **viva** es **repetitiva**.\n- Toda red **viva y acotada** (o viva con un home state) es **consistente**.\n- Toda red **conservadora** es acotada.\n- Una red **viva y estructuralmente acotada** es **conservadora y consistente**."},
{"id":"farkas","tema":"Estructurales, reducción y composición","src":"apunte (filmina de cálculo de invariantes)","ex":false,"q":"En el ejemplo, ¿qué P-invariante prueba que nunca hay dos procesos en P_{2}?","o":[["m_{2} + m_{3} = 1","Correcta: como m_{3} ≥ 0, m_{2} ≤ 1."],["m_{1} + m_{2} = 2","No: ese invariante permite m_{2} = 2."],["m_{1} + m_{3} = 3","No: ni siquiera es invariante, T_{1} le saca dos fichas a esa suma."],["El T-invariante (1, 1).","No: un T-invariante no acota lugares."]],"c":0,"r":"Eliminación de **Farkas**:\n- Se arma **[I | C]**: la identidad (una fila por lugar) y la matriz de incidencia.\n- Para cada columna de C se combinan, con coeficientes **positivos**, los pares de filas de **signo opuesto** en esa columna, para anularla.\n- Se **eliminan** las filas con valor distinto de cero en esa columna.\n- Al final, la parte izquierda de cada fila es un P-invariante. Se quedan los de soporte mínimo. Para los T-invariantes se hace lo mismo con C^{T}.\n\nEn el ejemplo, C tiene filas P_{1}: (−1, +1), P_{2}: (+1, −1), P_{3}: (−1, +1). En la columna T_{1} se combinan P_{1} + P_{2} y P_{2} + P_{3}:\n- **m_{1} + m_{2} = 2**: la cantidad de procesos es constante.\n- **m_{2} + m_{3} = 1**: el recurso. Implica m_{2} ≤ 1, o sea exclusión mutua.\n\nEl T-invariante es y = (1, 1)."},
{"id":"invariantes-props","tema":"Estructurales, reducción y composición","src":"apunte (filmina de cálculo de invariantes)","ex":false,"q":"Si x1 y x2 son P-invariantes de una red, ¿cuál de estos vectores es necesariamente un P-invariante?","o":[["2·x1 + 3·x2","Correcta: toda combinación lineal con coeficientes no negativos es un P-invariante."],["x1 − x2","No necesariamente: sólo si x1 − x2 ≥ 0 en todas las componentes."],["x1 · x2, componente a componente","No: el producto no es una operación lineal."],["−x1","No: un P-invariante tiene componentes no negativas."]],"c":0,"r":"- Si x_{1} y x_{2} son P-invariantes y α, β son enteros no negativos, **α x_{1} + β x_{2}** también lo es. Si α, β > 0, su soporte es la unión de los soportes. Si x_{1} − x_{2} ≥ 0, también es un P-invariante.\n- **Todo P-invariante es combinación lineal no negativa de P-invariantes mínimos**: los mínimos son una base.\n- En sistemas reales cada P-invariante mínimo suele tener un **significado físico** (un recurso, una estrategia de control), y muchas veces se encuentra **a ojo**.\n\nPara los T-invariantes vale lo mismo. Un **T-invariante mínimo** corresponde a un **proceso que puede repetirse para siempre**, y se identifica ignorando los recursos. Si una secuencia vuelve de M_{0} a M_{0}, su vector de conteo es un T-invariante."},
{"id":"reduccion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de métodos de reducción)","ex":false,"q":"¿Qué conserva una red obtenida por métodos de reducción?","o":[["Algunas propiedades, como vivacidad, acotación y home state, pero no es equivalente a la original.","No hay que buscarle semántica a la red reducida."],["Todo, es equivalente a la original.","Sólo conserva algunas propiedades."],["Nada, sólo sirve para dibujarla más chica.","Si no conservara propiedades, no serviría para el análisis."],["Sólo la cantidad de lugares.","Justamente elimina lugares."]],"c":0,"r":"Transforman la red en otra **más simple** que **conserva algunas propiedades**: **vivacidad, acotación y home state**. La reducida **no es equivalente**: no hay que buscarle semántica.\n- **Sustitución de un lugar**: se elimina un lugar \"de paso\" fusionando su transición de entrada con la de salida. La condición principal: la **transición de salida no tiene otro lugar de entrada**, así que la ficha siempre sigue de largo.\n- **Lugar implícito**: su marca **nunca** impide el disparo de sus transiciones de salida y se **deduce** del marcado de otros lugares. Se elimina.\n\nSi reduciendo se llega a una red trivial viva, acotada y con home state, la original también lo es."},
{"id":"ge-fuertemente-conexo","tema":"Estructurales, reducción y composición","src":"apunte (filmina de grafos de eventos)","ex":false,"q":"Un grafo de eventos fuertemente conexo tiene dos secuencias repetitivas mínimas: T1 T2 T3 T4 y T1 T3 T2 T4. ¿Cuántos T-invariantes mínimos tiene?","o":[["Uno, (1, 1, 1, 1): las dos secuencias tienen el mismo vector de conteo.","Correcta."],["Dos, uno por secuencia.","No: el T-invariante cuenta disparos, no el orden."],["Ninguno, porque T2 y T3 son concurrentes.","No: la concurrencia no impide volver al marcado."],["Uno por circuito elemental.","No: eso vale para los P-invariantes del grafo de eventos."]],"c":0,"r":"- A cada **circuito elemental** le corresponde un **P-invariante mínimo**: la suma de las fichas de sus lugares es constante.\n- El **único T-invariante mínimo** es **(1, 1, …, 1)**: toda secuencia repetitiva mínima dispara cada transición la misma cantidad de veces.\n- Es **vivo si y sólo si cada circuito elemental tiene al menos una ficha**.\n\nUn grafo de estado fuertemente conexo tiene las propiedades **duales**: un T-invariante por circuito elemental, un único P-invariante (1, …, 1) y es vivo con al menos una ficha."},
{"id":"refinamiento-composicion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de estructuración)","ex":false,"q":"Dos subsistemas se sincronizan en una transición común. ¿Cómo se arma el modelo global?","o":[["Fusionando la transición común: es la composición por rendez-vous.","Correcta."],["Fusionando los lugares que representan recursos.","No: esa es la composición por lugares compartidos."],["Reemplazando la transición por un bloque bien formado.","No: eso es refinamiento."],["Agregando un arco inhibidor entre las dos subredes.","No."]],"c":0,"r":"Una sola red armada \"de un tirón\" para un sistema real queda tan grande que se vuelve inutilizable. Se estructura la especificación y se analiza en cada etapa, garantizando que los resultados valgan para el modelo completo.\n- **Refinamiento sucesivo** (descendente): se describe el sistema con una red **simple**, donde cada transición es una operación compleja, y se la analiza. Después se reemplaza cada transición por un **bloque bien formado** (por ejemplo, \"secuencia\" o \"si-entonces-si no\") que **preserva** acotación, vivacidad, etc. El modelo final hereda las propiedades.\n- **Composición por lugares compartidos**: cuando no se puede refinar de arriba hacia abajo, se modelan las partes y se **fusionan** los lugares comunes, típicamente recursos. Según la filmina, mantiene la vivacidad.\n- **Composición por rendez-vous**: se **fusionan** las transiciones comunes que sincronizan a los subsistemas. Según la filmina, mantiene la vivacidad y la acotación.\n\nLa idea de fondo es poder verificar cada pieza por separado."},
{"id":"validacion-pipe","tema":"Estructurales, reducción y composición","src":"apunte (filmina de software de análisis)","ex":false,"q":"¿Cuáles son los tres métodos de análisis que usa un software de análisis de RdP?","o":[["Grafo de marcas (o árbol de cobertura), álgebra lineal y reducción.","Correcta."],["Testing, simulación y depuración.","No: esos no prueban propiedades para todas las ejecuciones."],["Sólo el grafo de marcas.","No: también usa invariantes y reducción."],["Expresiones regulares sobre el código.","No: las regex se usan sobre el log de una ejecución, no para validar el modelo."]],"c":0,"r":"La **validación** es el análisis que comprueba las propiedades principales (acotada, viva, reversible…) y propiedades específicas, como la exclusión mutua o los límites de recursos.\n\nUn software de análisis tiene dos partes:\n- **Edición** del modelo, textual o gráfica. La gráfica es más cómoda, pero sólo viable para modelos chicos.\n- **Análisis** con los métodos de la materia: **grafo de marcas** (o árbol de cobertura), **álgebra lineal** (invariantes) y **reducción**.\n\nSuelen traer una **biblioteca** de modelos básicos. La cátedra usa **PIPE**, que clasifica la red (state machine, marked graph, free choice…), analiza el espacio de estados (bounded, safe, deadlock) y calcula los invariantes."},
{"id":"grafo-eventos-simulacion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de software de análisis)","ex":false,"q":"En un grafo de eventos para simulación (Schruben), ¿qué representa un arco?","o":[["Que la ocurrencia de un evento programa otro, con una condición y/o un retardo opcionales.","Correcta."],["Un lugar con una transición de entrada y una de salida.","No: esa es la subclase de RdP, que es otra cosa."],["El movimiento físico de un cliente entre dos estaciones.","No: el grafo representa la relación de programación entre eventos, no el movimiento."],["Una ficha que pasa de un lugar a otro.","No: este grafo no tiene fichas."]],"c":0,"r":"**No**: es otro uso de la misma expresión, y no hay que confundirlo con la subclase de RdP (cada lugar con una entrada y una salida).\n\nEl grafo de eventos de simulación representa la **lista de eventos futuros** de un modelo de eventos discretos:\n- Cada **nodo** es un **evento**, una transición de estado.\n- Cada **arco** es la **programación** de otro evento, con una **condición** booleana y/o un **retardo** opcionales: \"A programa B dentro de t, si la condición es verdadera\".\n\nPara arrancar hace falta un evento **Run** que inicializa las variables y programa el primer arribo. El problema central son los **eventos simultáneos**: según el orden aparecen trayectorias inválidas, y por eso se pueden **priorizar arcos**."},
{"id":"grafos-conceptos","tema":"Estructurales, reducción y composición","src":"apunte (filmina de teoría de grafos)","ex":false,"q":"Un grafo conexo tiene 9 arcos y 6 vértices. ¿Cuántos ciclos elementales independientes tiene?","o":[["4","Correcta: 9 − 6 + 1 = 4."],["3","No: 9 − 6 = 3, falta sumar 1."],["15","No: no se suman arcos y vértices."],["6","No: no depende sólo de los vértices."]],"c":0,"r":"- **Cadena**: secuencia de arcos, cada uno con un extremo común con el siguiente, **sin** importar la orientación.\n- **Camino**: cadena que **respeta la orientación**: el extremo final de cada arco es el inicial del siguiente.\n- **Ciclo**: cadena que vuelve al vértice inicial. **Circuito**: camino que vuelve al vértice inicial. Todo circuito es un ciclo, no al revés.\n- **Elemental**: que no repite vértices, salvo el primero, que es también el último.\n- **Conexo**: entre todo par de vértices hay una **cadena**. **Fuertemente conexo**: entre todo par hay un **camino**. Un grafo es fuertemente conexo si y sólo si hay un circuito que pasa por todos los vértices.\n\nEn un grafo conexo, el número de ciclos elementales independientes (el **número ciclomático**) es **|U| − |X| + 1**: arcos menos vértices más uno. Forman una base de la que se obtienen los demás."},
{"id":"greedy-lazy","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Qué devuelve `re.search(r\"<.*?>\", \"<a>b<c>\")`?","o":[["`<a>`","Correcta: el perezoso se detiene en el primer `>`."],["`<a>b<c>`","No: eso lo devuelve la versión codiciosa."],["`<c>`","No: la búsqueda empieza por la izquierda."],["Nada: el `?` vuelve opcional el patrón.","No: después de un cuantificador, `?` lo vuelve perezoso."]],"c":0,"r":"Los cuantificadores son **codiciosos**: coinciden con la **mayor** cantidad posible. Con un `?` **después** del cuantificador pasan a ser **perezosos**: coinciden con la **menor**.\n- `<.*>` devuelve **toda** la cadena `<a>b<c>`.\n- `<.*?>` devuelve `<a>`.\n\nEn el log, los huecos entre transiciones tienen que ser perezosos, `(.*?)`: uno codicioso salta invariantes enteros.\n\nEn Python `+` es **una o más veces** (cierre positivo) y la alternativa es `|`. En JFLAP, `+` era la unión."},
{"id":"regex-metacaracteres","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"En Python, ¿qué cadenas reconoce `(ab)+`?","o":[["`ab`, `abab`, `ababab`…: una o más veces `ab`.","Correcta: `+` es el cierre positivo."],["`ab` o la cadena vacía.","No: eso sería `(ab)?`."],["`a` o `b`.","No: en Python la alternativa es `|`. Esa lectura es la del `+` de JFLAP."],["`ab+` literal, con el signo más.","No: para un `+` literal habría que escaparlo con `\\+`."]],"c":0,"r":"- `[abc]`: **un** carácter de la lista en esa posición; `[a-z]` es un rango. `[^ab]`: un carácter que **no** esté en la lista.\n- `{n}`, `{n,}`, `{n,m}`: repetición exacta, al menos n veces, entre n y m veces.\n- `.`: cualquier carácter salvo el salto de línea.\n- `|`: alternativa, el \"o\".\n- `( )`: agrupa y **captura** lo que coincidió.\n- `\\`: escapa un metacarácter; `\\.` es un punto literal.\n- `^` y `$`: comienzo y fin de la cadena o de la línea.\n\nLos cuantificadores son `?` (cero o una vez), `*` (cero o más) y `+` (**una o más**). Ojo con el cambio de notación: en JFLAP y en la teoría, `+` era la **unión**."},
{"id":"re-funciones","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Qué devuelve `re.match(r\"T1\", \"T0T1\")`?","o":[["`None`: `match` sólo busca al principio, y la cadena empieza con `T0`.","Correcta."],["Una coincidencia con `T1`.","No: eso lo haría `re.search`."],["El número de coincidencias, 1.","No: lo que cuenta es `re.subn`, y cuenta reemplazos."],["La cadena `T0`.","No."]],"c":0,"r":"- `re.match`: busca una coincidencia sólo al **principio** de la cadena.\n- `re.search`: devuelve la **primera** coincidencia en **cualquier** posición.\n- `re.sub`: **reemplaza** todas las coincidencias, sin solaparse.\n- `re.subn`: igual que `sub`, pero devuelve además **cuántos** reemplazos hizo.\n\nPara el log conviene `re.subn`: cada invariante completo se reemplaza por las transiciones intercaladas que capturaron los grupos, y la cuenta dice cuántos invariantes se quitaron en esa pasada. Se repite **hasta que la cuenta sea 0**."},
{"id":"log-tinv","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Después de quitar todos los invariantes completos del log, ¿qué resto es aceptable?","o":[["Transiciones de invariantes que quedaron a medias al cortar la ejecución.","Correcta."],["Cualquier resto más corto que un invariante.","No: si no es el comienzo de un ciclo en curso, hubo un disparo fuera de lugar."],["Sólo el vacío.","No: al cortar la ejecución es normal que haya ciclos en curso."],["Cualquiera: sólo importa cuántos invariantes se quitaron.","No: el resto es lo que hay que explicar."]],"c":0,"r":"Por la ecuación fundamental, si el log se puede **descomponer en invariantes completos**, la red volvió al marcado inicial.\n- Un script lee el log (`T0T1T3T0T4...`) y aplica una regex que reconoce un invariante **completo** aunque esté **intercalado** con otros.\n- Lo intercalado se captura con grupos perezosos `(.*?)` y se **conserva**. El invariante reconocido se **borra** con `re.subn`, que también dice cuántos reemplazos hizo.\n- Se repite hasta que no haya más coincidencias.\n- El **resto** tiene que explicarse: sólo invariantes a medias al cortar la ejecución. Cualquier otra cosa es un disparo fuera de lugar.\n\nSi hay **varios** T-invariantes, van todos en **una sola** regex."},
{"id":"una-sola-regex","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Si una red tiene varios T-invariantes, ¿cómo se arma la verificación del log?","o":[["Con una sola regex que tenga todos los invariantes como alternativas.","Correcta."],["Con una regex por invariante, aplicadas de la más larga a la más corta.","No: igual pueden robarse transiciones y dar falsos errores."],["Con una regex por invariante, en paralelo con hilos.","No: el problema es el emparejamiento, no la velocidad."],["Contando cuántas veces aparece cada transición.","No alcanza: el conteo no ve el orden dentro de cada invariante."]],"c":0,"r":"El log es válido: el invariante 2 con un invariante 1 completo (`T0T1T2`) intercalado.\n\nCon regex **separadas**, `T0(.*?)T1(.*?)T2` toma el **primer** `T0`, salta hasta el `T1` y se lleva el `T2` siguiente: le **roba** el `T0` al invariante 2. Queda `T2T0T3`, que la otra regex no reconoce: un **error que no existe**.\n\nCon **una sola**, `T0(.*?)(?:T1(.*?)T2|T2(.*?)T3)`, el motor prueba las dos alternativas a cada largo del hueco: reconoce primero el invariante 2 y después el 1. Resto vacío."},
{"id":"combinaciones-invariante","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Por qué en la regex del productor/consumidor T3 nunca va antes que T1?","o":[["Porque T3 consume de \"productos\", y la única transición que le pone fichas es T1.","Correcta."],["Porque el mutex impide que el consumidor corra antes que el productor.","No: el mutex protege el buffer, no impone un orden."],["Porque la regex es perezosa.","No: la pereza afecta el largo de los huecos."],["Porque los consumidores se crean después que los productores.","No: el orden de creación no garantiza nada."]],"c":0,"r":"El consumidor puede arrancar apenas hay un producto, después de **T1**. El T2 del productor puede quedar antes, entre o después de T3, T4 y T5:\n- T0 T1 T2 T3 T4 T5\n- T0 T1 T3 T2 T4 T5\n- T0 T1 T3 T4 T2 T5\n- T0 T1 T3 T4 T5 T2\n\nLa regex incluye **todas** como alternativas, con huecos perezosos.\n\nNo hace falta T3 antes de T1 porque la entrada de T3 es \"productos\" y la **única** transición que le pone fichas es **T1**: si arranca vacío, cada T3 tiene antes un T1 con el que emparejarse."},
{"id":"log-mutex-limite","tema":"Regex: verificar T-invariantes en el log","src":"apunte (actividad de la filmina de expresiones regulares)","ex":false,"q":"En la exclusión mutua con dos procesos, la regex `T0(.*?)T1|T2(.*?)T3` encuentra 2 invariantes y resto vacío en el log `T0T2T1T3`. ¿Qué significa?","o":[["Que el log se descompone en ciclos completos, aunque es imposible porque los dos procesos estarían juntos en la sección crítica.","Quitar T-invariantes no verifica los P-invariantes. Es una condición necesaria, no suficiente."],["Que la ejecución respetó la exclusión mutua.","El log viola la exclusión mutua y aun así se descompone."],["Que hay un error en la regex.","La regex hace lo que tiene que hacer. El que tiene ese límite es el método."],["Que el proceso 2 terminó antes que el 1.","En el log, el proceso 1 sale antes de que salga el 2."]],"c":0,"r":"Para los **dos** logs informa **2 invariantes y resto vacío**. Pero **ninguno es posible**: en `T0T2T1T3` los dos procesos están juntos en la sección crítica, y en `T0T0T1T1` el proceso 1 entra dos veces sin salir.\n\nQuitar T-invariantes del log verifica que la ejecución se descomponga en ciclos completos, pero **no** verifica los P-invariantes (la exclusión mutua) ni que cada disparo estuviera sensibilizado. Es una verificación **necesaria, no suficiente**.","n":"El apunte deja esto como actividad sin respuesta. La respuesta es propia y está probada en Python con el script del apunte."},
{"id":"log-cuidados","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Una red tiene 12 transiciones y el log es `T0T1T10T2...`. ¿Qué problema tiene buscar `T1`?","o":[["Que también coincide con el comienzo de `T10` y `T11`.","Correcta: hay que separar las transiciones o usar `T1(?!\\d)`."],["Ninguno: el motor distingue los números.","No: compara caracteres, no números."],["Que coincide con `T0`.","No."],["Que hay que escribirla en minúsculas.","No."]],"c":0,"r":"- Huecos **perezosos** en todos lados, nunca `.*`.\n- **Todos** los invariantes y **todas** sus combinaciones de orden en **una sola** expresión.\n- **Conservar lo intercalado**: el reemplazo es la concatenación de los grupos capturados.\n- **Repetir** hasta que `re.subn` no haga más reemplazos.\n- Con más de 10 transiciones, `T1` también coincide con el comienzo de `T10`: usar un separador en el log o `T1(?!\\d)`."}
];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
}
function fmt(s) {
  return s.split('\n\n').map(bloque => {
    let html = '', items = [];
    const cerrar = () => { if (items.length) { html += '<ul>' + items.join('') + '</ul>'; items = []; } };
    bloque.split('\n').forEach(l => {
      if (l.startsWith('- ')) items.push(`<li>${inline(l.slice(2))}</li>`);
      else { cerrar(); html += `<p>${inline(l)}</p>`; }
    });
    cerrar();
    return html;
  }).join('');
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coma = x => String(x).replace('.', ',');
const reloj = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- Historial: última respuesta de cada pregunta (1 bien, 0 mal), sólo en este navegador ---------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem(CONF.KEY)) || {}; } catch (e) { hist = {}; }
const guardarHist = () => { try { localStorage.setItem(CONF.KEY, JSON.stringify(hist)); } catch (e) {} };
const esFloja = id => hist[id] === 0;

/* ---------- Filtros ---------- */
const ORIGENES = { todas: 'Fuente: parciales + apunte', examen: 'Fuente: sólo parciales', apunte: 'Fuente: sólo apunte' };
let origen = 'todas';
const pasaOrigen = p => origen === 'todas' || (origen === 'examen') === p.ex;
let temasActivos = new Set(Object.values(T));
const base = () => BANCO.filter(p => temasActivos.has(p.tema) && pasaOrigen(p));

/* ---------- Estado de la ronda ---------- */
let modo = 'examen';
let ronda = [];          // [{p, opciones:[{x, e, ok}], elegida: índice | null}]
let entregado = false;
let inicio = 0, fin = 0, tic = null;

function elegirExamen(b) {
  let elegidas = [];
  if (CONF.BLOQUES) {
    Object.entries(CONF.BLOQUES).forEach(([bl, n]) => elegidas.push(...shuffle(b.filter(p => p.b === bl)).slice(0, n)));
  }
  const resto = shuffle(b.filter(p => !elegidas.includes(p)));
  elegidas.push(...resto.slice(0, Math.max(0, CONF.EXAMEN - elegidas.length)));
  return shuffle(elegidas);
}

function armarRonda(lista) {
  let preguntas;
  if (lista) { preguntas = shuffle(lista); modo = 'practica'; }
  else preguntas = modo === 'examen' ? elegirExamen(base()) : shuffle(base());
  ronda = preguntas.map(p => ({ p, opciones: shuffle(p.o.map((o, i) => ({ x: o[0], e: o[1], ok: i === p.c }))), elegida: null }));
  entregado = false;
  inicio = Date.now(); fin = 0;
  clearInterval(tic);
  if (modo === 'examen') tic = setInterval(actualizarStats, 1000);
  render();
}

/* ---------- Render ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.modo === modo));
  $('#summary').innerHTML = '';
  const list = $('#list');
  list.innerHTML = '';
  if (!ronda.length) list.innerHTML = '<p class="sub">No hay preguntas con estos filtros.</p>';
  ronda.forEach((item, n) => list.appendChild(tarjeta(item, n)));
  $('#pie').innerHTML = modo === 'examen' && ronda.length ? '<button class="btn primary" id="entregar2">Entregar el examen</button>' : '';
  if ($('#entregar2')) $('#entregar2').onclick = entregar;
  chips();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function tarjeta(item, n) {
  const { p } = item;
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = `<div class="qhead"><span class="num">${n + 1}.</span>
      ${p.b ? `<span class="tag">${esc(p.b)}</span>` : ''}
      <span class="tag">${esc(p.tema)}</span>
      <span class="tag${p.ex ? '' : ' apunte'}">${p.ex ? 'Parcial' : 'Fuente'}: ${esc(p.src)}</span>
      ${esFloja(p.id) ? '<span class="tag floja">floja</span>' : ''}</div>
    <p class="qtext">${inline(p.q)}</p>
    <div class="opts"></div>
    <div class="fb" hidden></div>`;
  const opts = el.querySelector('.opts');
  item.opciones.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[k]}</span><span>${inline(o.x)}</span>`;
    b.onclick = () => elegir(item, k, el);
    opts.appendChild(b);
  });
  item.el = el;
  return el;
}

function elegir(item, k, el) {
  if (entregado || (modo === 'practica' && item.elegida !== null)) return;
  item.elegida = k;
  if (modo === 'practica') corregir(item);
  else el.querySelectorAll('.opt').forEach((b, i) => b.classList.toggle('sel', i === k));
  actualizarStats();
  if (modo === 'practica' && ronda.every(it => it.elegida !== null)) resumen();
}

function corregir(item) {
  const el = item.el, k = item.elegida;
  const acerto = k !== null && item.opciones[k].ok;
  el.classList.add(acerto ? 'bien' : 'mal');
  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('sel');
    const o = item.opciones[i];
    b.classList.add(o.ok ? 'ok' : (i === k ? 'bad' : 'dim'));
  });
  const p = item.p;
  const veredicto = k === null ? '<div class="verdict bad">Sin responder</div>'
    : acerto ? '<div class="verdict ok">✔ Correcto</div>' : '<div class="verdict bad">✘ Incorrecto</div>';
  const fb = el.querySelector('.fb');
  fb.innerHTML = `${veredicto}
    <ul class="exp">${item.opciones.map((o, i) => `<li class="${o.ok ? 'good' : 'wrong'}"><p><b>${'ABCD'[i]}.</b> ${inline(o.e)}</p></li>`).join('')}</ul>
    ${p.n ? `<div class="warn">${fmt(p.n)}</div>` : ''}
    <details><summary>Ver la respuesta desarrollada</summary><div class="model">${fmt(p.r)}</div></details>`;
  fb.hidden = false;
  hist[p.id] = acerto ? 1 : 0;
  guardarHist();
}

function entregar() {
  if (entregado || !ronda.length) return;
  const faltan = ronda.filter(it => it.elegida === null).length;
  if (faltan && !confirm(`Te ${faltan === 1 ? 'falta 1 pregunta' : `faltan ${faltan} preguntas`}. Las que no respondas cuentan como incorrectas. ¿Entregar igual?`)) return;
  entregado = true;
  fin = Date.now();
  clearInterval(tic);
  ronda.forEach(corregir);
  $('#pie').innerHTML = '';
  resumen();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function resumen() {
  const corregidas = ronda.filter(it => modo === 'examen' || it.elegida !== null);
  const bien = corregidas.filter(it => it.elegida !== null && it.opciones[it.elegida].ok);
  const nota = corregidas.length ? 10 * bien.length / corregidas.length : 0;
  const porTema = {};
  corregidas.forEach(it => {
    const t = porTema[it.p.tema] = porTema[it.p.tema] || { bien: 0, n: 0 };
    t.n++; if (bien.includes(it)) t.bien++;
  });
  const filas = Object.entries(porTema).sort((a, b) => a[1].bien / a[1].n - b[1].bien / b[1].n)
    .map(([t, v]) => `<div class="srow"><div>${esc(t)}<div class="mini"><div style="width:${100 * v.bien / v.n}%"></div></div></div><b>${v.bien}/${v.n}</b></div>`).join('');
  const erradas = corregidas.filter(it => !bien.includes(it)).map(it => it.p);
  const tiempo = modo === 'examen' ? ` en ${reloj(fin - inicio)}` : '';
  const destino = modo === 'examen' ? '#summary' : '#pie';
  const abajo = modo === 'examen' ? 'Abajo está cada pregunta con la explicación de todas las opciones.' : 'Arriba quedó cada pregunta con la explicación de todas las opciones.';
  $(destino).innerHTML = `<div class="summary" style="width:100%">
      <h2>Nota: ${coma(nota.toFixed(1))} / 10 · ${nota >= 6 ? 'aprobado' : 'a repasar'}</h2>
      <p class="sub" style="margin-bottom:8px">${bien.length} de ${corregidas.length} correctas${tiempo}. Por tema, de más flojo a más firme. ${abajo}</p>
      ${filas}
      ${erradas.length ? '<div class="controls" style="margin:12px 0 0"><button class="btn primary" id="rehacer">Practicar las que erré</button></div>' : ''}
    </div>`;
  if ($('#rehacer')) $('#rehacer').onclick = () => armarRonda(erradas);
}

function actualizarStats() {
  const resp = ronda.filter(it => it.elegida !== null).length;
  const nFlojas = BANCO.filter(p => esFloja(p.id)).length;
  let partes = [`<span>Respondidas: <b>${resp}</b>/<b>${ronda.length}</b></span>`];
  if (modo === 'practica' || entregado) {
    const bien = ronda.filter(it => it.elegida !== null && it.opciones[it.elegida].ok).length;
    const total = modo === 'examen' ? ronda.length : resp;
    partes.push(`<span>Correctas: <b>${bien}</b></span>`);
    partes.push(`<span>Nota: <b>${total ? coma((10 * bien / total).toFixed(1)) + ' / 10' : '—'}</b></span>`);
  }
  if (modo === 'examen') partes.push(`<span>Tiempo: <b>${reloj((fin || Date.now()) - inicio)}</b></span>`);
  partes.push(`<span>Flojas guardadas: <b>${nFlojas}</b></span>`);
  $('#stats').innerHTML = partes.join('');
  $('#entregar').hidden = !(modo === 'examen' && !entregado && ronda.length);
  $('#pbar').style.width = ronda.length ? (100 * resp / ronda.length) + '%' : '0';
  $('#flojas').disabled = nFlojas === 0;
  $('#flojas').textContent = `Repasar las flojas (${nFlojas})`;
}

function chips() {
  const c = $('#chips');
  c.innerHTML = '';
  Object.values(T).forEach(t => {
    const n = BANCO.filter(p => p.tema === t && pasaOrigen(p)).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip' + (temasActivos.has(t) ? ' on' : '');
    b.textContent = `${t} (${n})`;
    b.onclick = () => {
      temasActivos.has(t) ? temasActivos.delete(t) : temasActivos.add(t);
      if (!temasActivos.size) temasActivos = new Set(Object.values(T));
      armarRonda();
    };
    c.appendChild(b);
  });
}

/* ---------- Controles ---------- */
document.title = CONF.TITULO;
$('#titulo').textContent = CONF.TITULO;
$('#bajada').innerHTML = inline(CONF.BAJADA);
$('#tab-examen').textContent = `Examen (${CONF.EXAMEN} al azar)`;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { modo = t.dataset.modo; armarRonda(); });
$('#nueva').onclick = () => armarRonda();
$('#entregar').onclick = entregar;
$('#flojas').onclick = () => armarRonda(BANCO.filter(p => esFloja(p.id)));
$('#borrar').onclick = () => { if (confirm('¿Borrar el historial de preguntas flojas?')) { hist = {}; guardarHist(); render(); } };
$('#origen').textContent = ORIGENES[origen];
$('#origen').onclick = () => {
  const claves = Object.keys(ORIGENES);
  origen = claves[(claves.indexOf(origen) + 1) % claves.length];
  $('#origen').textContent = ORIGENES[origen];
  armarRonda();
};
$('#theme').onclick = () => {
  const root = document.documentElement;
  const oscuroAhora = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = oscuroAhora ? 'light' : 'dark';
};

armarRonda();
</script>
</body>
