{"id":"p1:blocked-vs-waiting","tema":"Estados de hilos y procesos","src":"apunte","ex":false,"q":"Un hilo intenta ejecutar un método `synchronized` de un objeto cuyo monitor tiene otro hilo. ¿En qué estado queda?","o":[["BLOCKED.","Correcta: está esperando el monitor."],["WAITING.","No: WAITING es para `wait()` o `join()`."],["TIMED_WAITING.","No: no hay ningún plazo de por medio."],["NEW.","No: NEW es antes de `start()`."]],"c":0,"r":"**BLOCKED**: el hilo quiere **entrar** a un bloque o método `synchronized` cuyo monitor tiene otro hilo. Sale cuando el monitor se libera.\n\n**WAITING**: el hilo **eligió** esperar a otro, con `wait()` (hasta un `notify`/`notifyAll`) o con `join()` (hasta que el otro termine). Un hilo que hace `wait()` **libera** el monitor; uno en BLOCKED nunca lo tuvo.\n\nDe los dos estados se vuelve a RUNNABLE, nunca directo a ejecución.","b":"1er parcial"},
{"id":"p1:modificadores","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Cuántos niveles de acceso hay en Java?","o":[["Cuatro: `public`, `protected`, package-private (sin modificador) y `private`.","Package-private da acceso desde la misma clase y el mismo paquete."],["Tres: `public`, `protected` y `private`.","Falta el acceso por defecto, sin modificador."],["Dos: `public` y `private`.","También están `protected` y el de paquete."],["Cinco, contando `static`.","`static` no es un nivel de acceso."]],"c":0,"r":"Cuatro:\n- **public**: accesible desde cualquier clase.\n- **protected**: misma clase, mismo paquete y subclases de otros paquetes.\n- **package-private** (sin modificador): misma clase y mismo paquete.\n- **private**: sólo la misma clase.","b":"1er parcial"},
{"id":"p1:runnable-vs-thread","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Por qué se prefiere implementar `Runnable` antes que extender `Thread`?","o":[["Porque extender `Thread` gasta la única herencia y ata la tarea al hilo.","Correcta."],["Porque un `Runnable` se ejecuta más rápido.","No: la velocidad es la misma; al final lo ejecuta un `Thread`."],["Porque `Thread` no permite sobrescribir `run()`.","No: se puede, es la primera forma."],["Porque a un `Thread` heredado no se le puede poner nombre.","No: `setName()` funciona igual en las dos formas."]],"c":0,"r":"1. **Extender `Thread`** y sobrescribir `run()`.\n2. **Implementar `Runnable`** y pasarle el objeto al constructor de `Thread`.\n\nSe recomienda **`Runnable`**. Java tiene herencia simple, y extender `Thread` gasta la única herencia. Además, con `Runnable` la **tarea** queda separada del **mecanismo** que la ejecuta: la misma tarea se le puede dar a un `Thread` o a un executor. En los dos casos el hilo arranca con `start()`.","b":"1er parcial"},
{"id":"p1:start-vs-run","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Si en lugar de `hilo.start()` se escribe `hilo.run()`, ¿qué pasa?","o":[["El código de `run()` se ejecuta en el hilo que llama, sin crear un hilo nuevo.","Correcta."],["Se crea el hilo igual, pero con prioridad mínima.","No: no se crea ningún hilo."],["Lanza `IllegalThreadStateException`.","No: eso pasa si se llama a `start()` dos veces sobre el mismo hilo."],["El hilo arranca pero no se puede interrumpir.","No: no arranca ningún hilo."]],"c":0,"r":"`start()` le pide a la JVM que cree un **hilo nuevo** y que ese hilo ejecute `run()`. El que llama sigue de largo inmediatamente.\n\n`run()` es una llamada a método **común**: se ejecuta en el **mismo hilo** que la hace, de forma secuencial, sin concurrencia.\n\nEn el buscador de archivos: con `run()`, el `main` busca él mismo hasta el final y el `interrupt()` posterior no tiene efecto; con `start()`, el `main` sigue, duerme 10 s e interrumpe la búsqueda.","b":"1er parcial"},
{"id":"p1:uml-secuencia","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Qué fragmento combinado marca una región que ningún otro fragmento puede intercalar?","o":[["`critical`.","Correcta: es la sección crítica dibujada."],["`par`.","No: `par` es lo contrario, deja intercalar los operandos."],["`strict`.","No: impone un orden vertical estricto, pero no habla de atomicidad."],["`alt`.","No: elige un operando según su guarda."]],"c":0,"r":"El `start()` es un **mensaje asincrónico** (punta abierta): el emisor sigue sin esperar respuesta. Una llamada común como `run()` es un **mensaje sincrónico** (punta llena), que bloquea al que llama hasta el retorno.\n\nFragmentos útiles:\n- **`par`**: los operandos se intercalan de cualquier forma, cada uno con su orden interno. Es el interleaving dibujado.\n- **`critical`**: región atómica que ningún otro fragmento puede intercalar. Es la sección crítica.\n- **`loop`**, **`alt`** y **`opt`**: repetición y alternativas con guardas.","b":"1er parcial"},
{"id":"p1:static-thread-safe","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Un atributo `static` es thread safe?","o":[["No, pertenece a la clase y lo comparten todos los hilos sin ninguna sincronización.","Es el caso más puro de estado compartido."],["Sí, porque hay una sola copia en memoria.","Que haya una sola copia es justamente lo que lo vuelve compartido."],["Sí, Java sincroniza automáticamente los atributos `static`.","Java no agrega sincronización por ser `static`."],["Sólo si es `private`.","El nivel de acceso no da sincronización."]],"c":0,"r":"**No.** Un atributo `static` pertenece a la **clase**, así que **todos** los hilos ven la misma variable. Es el caso más puro de estado compartido y el primer candidato a condición de carrera. Ser `static` no agrega ninguna sincronización.\n\nExcepciones: un `static final` de un tipo inmutable, las variables `volatile` (dan visibilidad, no atomicidad) y las clases `Atomic*`.\n\nEn el práctico, `y1`, `y2` y `critical` estáticos compartidos por T1 y T2 terminaron mostrando `critical = -1` y `1`.","b":"1er parcial"},
{"id":"p1:volatile","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Qué garantiza declarar una variable `volatile`?","o":[["Visibilidad, o sea que una escritura la ven enseguida los demás hilos, pero no atomicidad.","`contador++` sobre un `volatile` puede seguir perdiendo actualizaciones."],["Atomicidad de cualquier operación sobre la variable.","No hace atómico un leer-incrementar-escribir."],["Exclusión mutua sobre el objeto.","Para eso hace falta `synchronized` o un `Lock`."],["Que cada hilo tenga su propia copia.","Eso es `ThreadLocal`."]],"c":0,"r":"Garantiza **visibilidad**: una escritura en la variable la ven inmediatamente los demás hilos, no queda en la caché o en un registro de un núcleo.\n\n**No** garantiza **atomicidad**: `contador++` sobre un `volatile` sigue siendo leer, incrementar y escribir, y dos hilos pueden perder actualizaciones. Para eso hace falta `synchronized`, un `Lock` o un `AtomicInteger`.","b":"1er parcial"},
{"id":"p1:prioridad","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"En el práctico, ¿por qué los hilos con `MAX_PRIORITY` no terminaban siempre antes que los de `MIN_PRIORITY`?","o":[["Porque la prioridad es una sugerencia al planificador y, con varios núcleos, todos pueden correr a la vez.","Correcta."],["Porque la prioridad máxima en Java es 5.","No: la máxima es 10; 5 es la normal."],["Porque Java ignora la prioridad de los hilos no daemon.","No: no hay tal regla."],["Porque `setPriority()` no hace nada en Java.","No: la cambia, pero el efecto depende del SO y no garantiza orden."]],"c":0,"r":"Es un entero de **1 a 10** (`MIN_PRIORITY` = 1, `NORM_PRIORITY` = 5, `MAX_PRIORITY` = 10).\n\n**No garantiza nada.** Es una sugerencia al planificador del SO, se mapea distinto en cada plataforma, y con varios núcleos puede no haber competencia que resolver. Un programa cuya corrección dependa de las prioridades está mal diseñado.","b":"1er parcial"},
{"id":"p1:interrupt","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Un hilo está dentro de `Thread.sleep(5000)` y otro llama a su `interrupt()`. ¿Qué pasa?","o":[["`sleep` lanza `InterruptedException` y el flag de interrupción queda en `false`.","Correcta."],["El hilo muere inmediatamente.","No: eso hacía `stop()`, que está deprecado."],["No pasa nada hasta que termina el `sleep`.","No: el `sleep` se corta antes de tiempo."],["`sleep` lanza `InterruptedException` y el flag queda en `true`.","No: el flag se borra al lanzar la excepción."]],"c":0,"r":"**No lo detiene**: sólo pone en `true` una **bandera** interna. Es un pedido, y el hilo puede ignorarlo.\n- Si el hilo está corriendo código normal, no pasa nada automático. Su código tiene que consultar el flag (`isInterrupted()` o `Thread.interrupted()`) y decidir terminar.\n- Si está bloqueado en `sleep()`, `wait()` o `join()`, ese método lanza **`InterruptedException`** y el flag **se borra**.\n\nCómo terminar lo decide el código de la tarea, por ejemplo con un `return` en el `catch`. Es la alternativa segura a `stop()`, que está deprecado.","b":"1er parcial"},
{"id":"p1:interrupted-vs-is","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre `isInterrupted()` y `Thread.interrupted()`?","o":[["`isInterrupted()` consulta el flag de un hilo sin modificarlo. `Thread.interrupted()` consulta el del hilo actual y lo borra.","El método estático deja el flag en `false`."],["Son iguales, uno es un alias del otro.","Uno borra el flag y el otro no."],["`isInterrupted()` interrumpe al hilo y `Thread.interrupted()` lo consulta.","Para interrumpir se usa `interrupt()`."],["`Thread.interrupted()` consulta el flag sin modificarlo.","Lo borra después de consultarlo."]],"c":0,"r":"`isInterrupted()` es **de instancia**: consulta el flag del hilo sobre el que se llama y **no lo modifica**.\n\n`Thread.interrupted()` es **estático**: consulta el flag del hilo **actual** y lo **borra** (lo deja en `false`).","b":"1er parcial"},
{"id":"p1:stop","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Cuál es el problema de `Thread.stop()`?","o":[["Corta el hilo en cualquier punto y puede dejar datos inconsistentes o recursos sin liberar.","Correcta."],["Que el hilo puede ignorarlo.","No: eso le pasa a `interrupt()`, y es a propósito."],["Que sólo funciona en hilos daemon.","No."],["Que bloquea al hilo que lo llama.","No."]],"c":0,"r":"`stop()` mataba al hilo **en cualquier punto** de su ejecución, sin darle oportunidad de liberar locks, cerrar archivos o dejar los datos en un estado consistente. Está deprecado desde Java 1.2.\n\nEn su lugar se usa **`interrupt()`**: un pedido gentil que el código de la tarea atiende en puntos seguros.","b":"1er parcial"},
{"id":"p1:join","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Se arrancan tres hilos y recién después se hacen los tres `join()`. ¿Qué se garantiza?","o":[["Que `main` sigue sólo cuando terminaron los tres, aunque sus mensajes se intercalen entre sí.","Correcta: `join()` ordena respecto de lo que viene después de él."],["Que los tres hilos se ejecutan en orden.","No: arrancaron juntos, así que se intercalan."],["Nada: `join()` no hace efecto después de `start()`.","No: justamente se usa después de `start()`."],["Que los mensajes de `main` salen primero.","No: `main` espera a los tres."]],"c":0,"r":"El hilo que llama a `otro.join()` **se suspende** (WAITING, o TIMED_WAITING con `join(ms)`) hasta que `otro` termina.\n\nEn el ejemplo, cada `start()` va seguido de su `join()`, así que hay un solo grupo vivo a la vez y los mensajes salen ordenados por grupo. Sin `join()`, los grupos **se intercalan** y el mensaje final de `main` puede salir en cualquier momento, casi siempre al principio. El programa igual no termina hasta que terminan los hilos, porque son no-daemon.","b":"1er parcial"},
{"id":"p1:sleep-listo","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Cuando termina el plazo de un `sleep()`, ¿qué pasa con el hilo?","o":[["Pasa a RUNNABLE y continúa cuando el planificador le asigne CPU.","De un estado de espera siempre se vuelve a listo."],["Vuelve a ejecutarse en ese mismo instante.","Puede tener que esperar en la cola de listos."],["Pasa a TERMINATED.","El `sleep()` no termina el hilo."],["Queda en WAITING hasta que alguien haga `notify()`.","`sleep()` no necesita `notify()`. Vuelve solo cuando termina el plazo."]],"c":0,"r":"No. Pasa de TIMED_WAITING a **RUNNABLE** (la cola de listos) y continúa cuando el planificador le asigne CPU. De los estados de espera siempre se vuelve a listo, nunca directo a ejecución. Por eso `sleep()` no sirve para ordenar hilos con precisión.","b":"1er parcial"},
{"id":"p1:daemon-set","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Cuándo se puede llamar a `setDaemon(true)` sobre un hilo?","o":[["Antes de `start()`. Después lanza `IllegalThreadStateException`.","La condición de daemon queda fija cuando el hilo arranca."],["En cualquier momento de su ejecución.","Si ya arrancó, lanza una excepción."],["Sólo después de que termina.","Un hilo terminado ya no sirve como daemon."],["Sólo desde el propio hilo, dentro de su `run()`.","Para ese momento el hilo ya arrancó."]],"c":0,"r":"`setDaemon(true)` se llama **antes de `start()`**. Después, la condición queda fija, y llamarlo lanza **`IllegalThreadStateException`**.\n\nUn daemon da servicios en segundo plano, como el limpiador de eventos viejos del práctico. Cuando los únicos hilos vivos son daemons, la JVM los termina y cierra el programa.","b":"1er parcial"},
{"id":"p1:uncaught","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Un hilo lanza una `NullPointerException` no capturada dentro de `run()`. ¿Qué ocurre por defecto?","o":[["Se imprime el stack trace y termina sólo ese hilo.","Correcta."],["Termina todo el programa.","No: los demás hilos siguen."],["El compilador obliga a capturarla.","No: es unchecked."],["El hilo pasa a WAITING hasta que alguien la maneje.","No: el hilo termina."]],"c":0,"r":"La JVM imprime el stack trace y **termina sólo ese hilo**, no todo el programa. Es peligroso: el hilo muere en silencio y puede dejar el sistema a medio hacer.\n\nPara interceptarla se implementa **`Thread.UncaughtExceptionHandler`** (método `uncaughtException(Thread t, Throwable e)`) y se lo asigna con `setUncaughtExceptionHandler()`, o para todos los hilos con `Thread.setDefaultUncaughtExceptionHandler()`.","b":"1er parcial"},
{"id":"p1:latch","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Qué pasa si se llama a `await()` sobre un `CountDownLatch` cuyo contador ya llegó a 0?","o":[["Retorna inmediatamente.","Correcta."],["Se bloquea hasta que alguien llame a `reset()`.","No: el `CountDownLatch` no tiene reset."],["Lanza una excepción.","No."],["Vuelve a contar desde el valor inicial.","No: es de un solo uso."]],"c":0,"r":"Es un sincronizador que permite que uno o más hilos **esperen a que ocurran N eventos**. Tiene tres elementos:\n- El **valor inicial**: cuántos eventos se esperan.\n- **`await()`**: lo llama quien espera, y se duerme hasta que el contador llega a 0.\n- **`countDown()`**: lo llama cada evento al terminar.\n\nLimitaciones: es de **uso único** (el contador no se resetea; en 0 queda en 0 y `await()` retorna enseguida), y **no protege** una sección crítica. Ejemplo: la videoconferencia que arranca cuando llegaron todos los participantes.","b":"1er parcial"},
{"id":"p1:sync-static","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"Un hilo ejecuta un método `static synchronized` de la clase `Cuenta`, y otro un método `synchronized` de instancia de un objeto `Cuenta`. ¿Se excluyen?","o":[["No: uno usa el monitor de la clase y el otro el del objeto.","Correcta."],["Sí: los dos usan el monitor de la clase.","No: el de instancia usa `this`."],["Sí: los dos usan el monitor del objeto.","No: el estático usa `Cuenta.class`."],["No compila: no se puede combinar `static` con `synchronized`.","No: es válido."]],"c":0,"r":"Un método `synchronized` de instancia toma el monitor del **objeto** (`this`). Uno `static synchronized` toma el monitor de la **clase** (el objeto `Clase.class`).\n\nSon **dos llaves distintas**: un hilo puede estar en un método estático sincronizado y otro en uno de instancia sincronizado **al mismo tiempo**. Si los dos tocan el mismo dato estático, hay condición de carrera.","b":"1er parcial"},
{"id":"p1:sync-integer","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Cuál de estas llaves garantiza la exclusión mutua?","o":[["Un `private final Object lock = new Object()` dedicado.","Correcta: su identidad nunca cambia."],["La variable `Integer` que se incrementa dentro del bloque.","No: cada incremento la hace apuntar a otro objeto."],["Un elemento de un arreglo que se reasigna dentro del bloque.","No: es el caso 4 de la cátedra, que dio erróneo."],["Un `String` que se concatena dentro del bloque.","No: `String` también es inmutable, y cada concatenación crea otro objeto."]],"c":0,"r":"`synchronized` toma el monitor **del objeto** al que apunta la referencia en ese momento. Un `Integer` es **inmutable**: `valor = valor + 1` crea otro objeto y reasigna la referencia. El siguiente hilo que haga `synchronized (valor)` toma el monitor de **otro objeto**, y dos hilos pueden quedar dentro a la vez.\n\nHay que sincronizar con un objeto cuya identidad no cambie, por ejemplo un `Object` dedicado y `final`. En el experimento de la cátedra, el error no apareció en 10 corridas: hizo falta correrlo 100.000 veces. El testing puede engañarte.","b":"1er parcial"},
{"id":"p1:cinema","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Qué se gana sincronizando bloques con dos llaves distintas en lugar de dos métodos `synchronized`?","o":[["Que las operaciones sobre recursos independientes ya no se excluyen entre sí.","Correcta."],["Que se evita el deadlock en cualquier caso.","No: si un hilo toma las dos llaves en orden opuesto al de otro, puede haber deadlock."],["Que ya no hace falta sincronizar las lecturas.","No: las lecturas también tienen que ver datos consistentes."],["Nada: es equivalente.","No: los métodos `synchronized` comparten la llave `this`."]],"c":0,"r":"El cine tiene **dos salas independientes**. Con métodos `synchronized`, todos usarían la misma llave (`this`): vender en la sala 1 bloquearía a quien vende en la sala 2, aunque no compartan datos.\n\nCon dos objetos (`controlCinema1` y `controlCinema2`) y bloques `synchronized` sobre cada uno, cada recurso se protege **por separado**: hay exclusión mutua dentro de cada sala y paralelismo entre salas. Es la ventaja del bloque sobre el método: elegir la llave y achicar la sección crítica.","b":"1er parcial"},
{"id":"p1:while-wait","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"En el `EventStorage` del productor/consumidor, ¿qué puede pasar si se cambia el `while` del `wait()` por un `if`?","o":[["Un productor despertado puede agregar con el buffer otra vez lleno.","Correcta: no vuelve a chequear la condición."],["Ninguno de los hilos se despierta nunca.","No: `notifyAll()` los despierta igual."],["El programa no compila.","No: compila sin problemas."],["El `wait()` deja de liberar el monitor.","No: `wait()` siempre libera el monitor."]],"c":0,"r":"Porque al despertar **la condición puede ya no valer**. `notifyAll()` despierta a todos, y otro hilo pudo adelantarse y volver a llenar (o vaciar) el buffer antes de que éste recupere el monitor. También existen los despertares espurios.\n\nCon `while`, el hilo vuelve a evaluar la condición y, si no se cumple, vuelve a dormir. Con `if` seguiría de largo con una condición falsa.","b":"1er parcial"},
{"id":"p1:deadlock-orden","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Cuál es la solución de diseño clásica a ese deadlock?","o":[["Que todos los hilos tomen los locks en el mismo orden global.","Correcta."],["Subir la prioridad de uno de los hilos.","No: la prioridad no rompe la espera circular."],["Hacer `volatile` las variables protegidas.","No: `volatile` no tiene nada que ver con los locks."],["Agregar un `sleep()` antes de tomar el segundo lock.","No: sólo cambia la probabilidad, no elimina el deadlock."]],"c":0,"r":"Si el hilo A toma X y espera Y, mientras B toma Y y espera X, los dos quedan bloqueados para siempre: es una **espera circular** producida por adquirir los locks en **orden opuesto**.\n\nSe evita fijando un **orden global** de adquisición que todo el código respete (siempre X antes que Y), o usando `tryLock()` con plazo para no esperar indefinidamente.","b":"1er parcial"},
{"id":"p1:lock-vs-sync","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué ofrece `Lock` que `synchronized` no tiene?","o":[["Intentar tomar la llave sin bloquearse, con `tryLock()`.","Correcta."],["Exclusión mutua.","No: la dan los dos."],["Liberación automática al salir del bloque.","No: es al revés, eso lo tiene `synchronized`."],["Reentrancia.","No: `synchronized` también es reentrante."]],"c":0,"r":"El `Lock` ofrece:\n- `tryLock()`: intentar tomarlo sin bloquearse (con o sin plazo).\n- `lockInterruptibly()`: adquirirlo de forma interrumpible.\n- **Fairness** opcional.\n- Bloques más flexibles, por ejemplo tomarlo en un método y liberarlo en otro.\n- `ReadWriteLock`, que separa lectura de escritura.\n\nRegla práctica: usar `synchronized` por defecto (es más simple y libera solo), y `Lock` cuando hace falta alguna de esas capacidades. El precio es que hay que llamar a `unlock()` **en un `finally`**.","b":"1er parcial"},
{"id":"p1:unlock-finally","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Dónde se debe llamar a `unlock()` y por qué?","o":[["En un bloque `finally`, para que el lock se libere aunque la sección crítica lance una excepción.","Si no, el lock queda tomado para siempre y todos los que lo pidan se bloquean."],["Al principio de la sección crítica.","Liberaría el lock antes de usar el recurso."],["No hace falta, el lock se libera solo al salir del método.","Eso pasa con `synchronized`, no con un `Lock`."],["En el `catch`, sólo si hubo una excepción.","También hay que liberarlo cuando no hay excepción."]],"c":0,"r":"En un bloque **`finally`**, después del `try` que contiene la sección crítica. Si la SC lanza una excepción y el `unlock()` no se ejecuta, el lock queda tomado para siempre, y todos los hilos que lo pidan se bloquean.\n\n`synchronized` no tiene este problema: libera el monitor automáticamente al salir del bloque, incluso por una excepción.","b":"1er parcial"},
{"id":"p1:rwlock","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿En cuál de estos escenarios conviene un `ReadWriteLock`?","o":[["Una base de datos que se consulta continuamente y se modifica muy de vez en cuando.","Correcta: los lectores corren en paralelo."],["Una base de precios que cambia continuamente y casi no se consulta.","No: casi todo es escritura exclusiva, y se paga el costo de administrar dos locks."],["Un contador que todos los hilos incrementan.","No: incrementar es escribir."],["En cualquier caso: siempre es más rápido que `synchronized`.","No: en el escenario equivocado es más caro."]],"c":0,"r":"Tiene **dos** locks: uno de **lectura**, que pueden tener **varios** hilos a la vez, y uno de **escritura**, exclusivo (no admite otros escritores ni lectores).\n\nConviene cuando hay **muchas lecturas y pocas escrituras**, por ejemplo una base de datos que se consulta continuamente y se modifica de vez en cuando: ahí los lectores corren en paralelo de verdad. Si casi todo son escrituras, sale **más caro** que una sección crítica clásica.\n\nEs responsabilidad del programador no escribir con el lock de lectura tomado.","b":"1er parcial"},
{"id":"p1:fair","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿A qué método **no** afecta el atributo `fair` de un `ReentrantLock`?","o":[["`tryLock()`.","Correcta: no duerme al hilo, así que no hay cola que ordenar."],["`lock()`.","No: `lock()` hace esperar, y fair decide el orden."],["`unlock()`.","No: al liberar es cuando se elige a quién darle el lock."],["`lockInterruptibly()`.","No: también hace esperar en la cola."]],"c":0,"r":"Con `fair = true`, cuando se libera el lock se le da al hilo que **hace más tiempo** que espera (orden de llegada). Con `false`, que es el valor por defecto, se elige uno **sin criterio**.\n\nFair evita la inanición pero cuesta más. No afecta a `tryLock()`, que no hace esperar a nadie.","b":"1er parcial"},
{"id":"p1:semaforo-n","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Por qué no alcanza el `Semaphore(3)` solo?","o":[["Porque hasta tres hilos pueden estar a la vez eligiendo impresora en el mismo arreglo.","Correcta: esa búsqueda necesita su propia exclusión mutua."],["Porque un semáforo sólo puede tener un permiso.","No: puede tener N."],["Porque el semáforo no despierta a los hilos que esperan.","No: `release()` despierta a uno."],["Porque `acquire()` no es atómico.","No: lo es."]],"c":0,"r":"El **semáforo de 3 permisos** limita a **tres** los hilos que imprimen a la vez, uno por impresora. El cuarto se duerme en `acquire()` hasta que alguien haga `release()`.\n\nPero el semáforo no dice **cuál** impresora está libre. Para elegirla se recorre y se modifica el arreglo `freePrinters`, y esa búsqueda es una sección crítica entre los hilos que pasaron el semáforo. Por eso se protege con un **`Lock`** aparte.\n\nEn una RdP, el semáforo es un lugar con 3 fichas.","b":"1er parcial"},
{"id":"p1:semaforo-cero","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué propiedad de los semáforos permite usar uno inicializado en 0 para avisar entre hilos?","o":[["Que no tienen dueño: cualquier hilo puede hacer `release()`.","Correcta."],["Que son reentrantes.","No: un semáforo no es reentrante."],["Que son fair por defecto.","No: por defecto son non-fair."],["Que `acquire()` nunca bloquea.","No: bloquea si no hay permisos."]],"c":0,"r":"Para la **señalización** entre hilos. El que debe esperar hace `acquire()` y se bloquea (no hay permisos), hasta que otro hilo hace `release()` para avisarle.\n\nFunciona porque los semáforos **no tienen dueño**: quien libera no tiene por qué ser quien adquirió. En una RdP es un lugar \"señal\" sin marca inicial, que una rama produce y la otra consume.","b":"1er parcial"},
{"id":"p1:tryacquire","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué hace `tryAcquire()` en un `Semaphore`?","o":[["Intenta tomar un permiso sin bloquear y devuelve `true` o `false` según si lo consiguió.","`acquire()` bloquea, y `acquireUninterruptibly()` bloquea ignorando las interrupciones."],["Bloquea al hilo hasta que haya un permiso.","Eso hace `acquire()`."],["Bloquea ignorando las interrupciones.","Eso hace `acquireUninterruptibly()`."],["Libera un permiso si el hilo tiene uno.","Para liberar se usa `release()`."]],"c":0,"r":"- `acquire()`: toma un permiso o **bloquea** si no hay. Puede lanzar `InterruptedException`.\n- `tryAcquire()`: **no bloquea**. Devuelve `true` si lo tomó o `false` si no había.\n- `acquireUninterruptibly()`: bloquea, pero **ignora** las interrupciones.\n\nLas tres tienen versiones con un `int` para tomar varios permisos de una vez. Es la base de lectores/escritores con semáforos: el escritor pide todos los permisos.","b":"1er parcial"},
{"id":"p1:chomsky","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"¿Qué autómata reconoce los lenguajes de tipo 2?","o":[["El autómata de pila.","Correcta."],["El autómata finito.","No: reconoce los de tipo 3."],["El autómata lineal acotado.","No: reconoce los de tipo 1."],["La máquina de Turing.","Reconoce los de tipo 2, pero no es el que les corresponde: es el de tipo 0."]],"c":0,"r":"- **Tipo 0** (sin restricciones): lenguajes recursivamente enumerables. **Máquina de Turing**.\n- **Tipo 1** (sensibles al contexto, `α A β → α γ β`): **autómata lineal acotado**.\n- **Tipo 2** (libres de contexto, `A → γ`): **autómata de pila**.\n- **Tipo 3** (regulares, `A → aB` o `A → a`): **autómata finito**.\n\nCada clase está **incluida** en la anterior: tipo 3 ⊂ tipo 2 ⊂ tipo 1 ⊂ tipo 0.","b":"1er parcial"},
{"id":"p1:afnd-afd-conv","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"Un AFND tiene 4 estados. ¿Cuántos estados puede tener, como máximo, el AFD equivalente?","o":[["16.","Correcta: 2^4 subconjuntos."],["4.","No: puede necesitar más, uno por cada subconjunto alcanzable."],["8.","No: el máximo es 2^n."],["Infinitos.","No: el AFD siempre es finito."]],"c":0,"r":"Con la **construcción de subconjuntos**: cada estado del AFD es un **conjunto** de estados del AFND (los que podrían estar activos a la vez). Se arranca con el estado inicial (y su clausura λ) y, para cada símbolo, se calcula el conjunto alcanzable. Son finales los conjuntos que contienen algún estado final del AFND.\n\nCon n estados, el AFD puede tener hasta **2^{n}** estados, aunque en general sólo se generan muchos menos accesibles.","b":"1er parcial"},
{"id":"p1:er","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"¿Cuál de estas cadenas pertenece al lenguaje de la ER `(a|b)*abb`?","o":[["`babb`","Correcta: `b` lo genera `(a|b)*`, y sigue `abb`."],["`abba`","No: tiene que terminar en `abb`."],["`ab`","No: le falta una `b` al final."],["`bbab`","No: termina en `ab`, no en `abb`."]],"c":0,"r":"Es una **descripción compacta** de un lenguaje regular, construida con los símbolos del alfabeto, λ, ∅ y tres operaciones: **unión** (`+` o `|`), **concatenación** y **clausura de Kleene** (`*`).\n\nPor el **teorema de Kleene**, los lenguajes que describen las ER son exactamente los que reconocen los autómatas finitos. De una ER se construye un AFND (con transiciones λ), y de un AF se obtiene una ER eliminando estados.","b":"1er parcial"},
{"id":"p1:church","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"¿Qué dice la tesis de Church-Turing?","o":[["Que todo lo efectivamente computable lo puede computar una máquina de Turing.","No es un teorema, porque \"algoritmo\" es una noción intuitiva que no se puede formalizar."],["Que es un teorema que demuestra que la MT es el modelo más potente.","Es una tesis, no se puede demostrar."],["Que todo programa termina.","La terminación es justamente indecidible."],["Que los autómatas finitos reconocen cualquier lenguaje.","Reconocen sólo los regulares."]],"c":0,"r":"Que todo lo **efectivamente computable** (calculable por un algoritmo) lo puede computar una **máquina de Turing**.\n\nNo es un teorema, porque \"algoritmo\" es una noción intuitiva que no se puede formalizar para demostrarlo. Es una tesis aceptada porque todos los modelos de cómputo propuestos resultaron equivalentes a la MT. Por eso se dice que todo programa tiene una MT asociada.","b":"1er parcial"},
{"id":"p1:pda-nodet","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"¿Los autómatas de pila deterministas reconocen los mismos lenguajes que los no deterministas?","o":[["No, los deterministas reconocen sólo un subconjunto propio de los libres de contexto.","Por ejemplo, los palíndromos de longitud par, donde hay que adivinar dónde está la mitad."],["Sí, igual que con los autómatas finitos.","Con los finitos son equivalentes, con los de pila no."],["Sí, porque todo autómata no determinista se puede convertir en uno determinista.","Eso vale para los finitos, no para los de pila."],["No, los deterministas reconocen más lenguajes.","Es al revés."]],"c":0,"r":"**No**, a diferencia de lo que pasa con los autómatas finitos. Los AP **no deterministas** reconocen todos los lenguajes libres de contexto; los **deterministas**, sólo un subconjunto propio. Ejemplo clásico: los palíndromos de longitud par, donde hay que \"adivinar\" dónde está la mitad.\n\nEn cambio, todo AFND tiene un AFD equivalente.","b":"1er parcial"},
{"id":"p1:eda-reactivo","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"Al modelar un sistema reactivo con un autómata, ¿qué representa un símbolo del alfabeto?","o":[["Un evento al que el sistema reacciona.","Correcta."],["Una variable del programa.","No: las variables forman parte del estado."],["Un hilo.","No."],["Un estado del sistema.","No: los estados son los nodos; los símbolos etiquetan las transiciones."]],"c":0,"r":"Porque los sistemas concurrentes son casi siempre **reactivos**: reaccionan a **secuencias de eventos** del entorno. Un autómata modela eso exactamente, con un estado y transiciones disparadas por eventos (los símbolos del alfabeto). El conjunto de secuencias de eventos válidas es un **lenguaje**, y el autómata lo reconoce.\n\nEn una **arquitectura dirigida por eventos**, el sistema es un autómata que avanza con cada evento. Y el grafo de accesibilidad de una red de Petri **es** un autómata.","b":"1er parcial"},
{"id":"p2:fenomenos","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), 2021, recup. 2021, 2023","ex":true,"q":"¿Qué tipo de fenómenos de control e informáticos modelan (o permiten visualizar) las Redes de Petri?","o":[["Sincronización, compartir datos, paralelismo y concurrencia.","Correcta: es la respuesta que acepta la cátedra."],["P-invariantes y T-invariantes.","No: son herramientas de análisis. Esta respuesta sacó 0 en 2021."],["Sólo sistemas secuenciales con un único estado activo.","No: eso lo hace un autómata. La RdP justamente expresa concurrencia."],["Únicamente el tiempo de ejecución de los procesos.","No: las RdP autónomas ni siquiera tienen tiempo."]],"c":0,"r":"**Sincronización**, **compartir datos (recursos)**, **paralelismo** y **concurrencia**.\n\nCon esas piezas se modelan también la exclusión mutua (un lugar con una ficha compartido por dos regiones críticas), los conflictos (un lugar con varias transiciones de salida), la capacidad limitada (buffers) y la comunicación entre procesos.","b":"2do parcial","n":"En 2021 respondieron \"p invariantes\" y sacaron 0: los invariantes son una herramienta de análisis, no un fenómeno que se modela. La respuesta que aceptó la cátedra en 2021, 2023 y el recuperatorio es literalmente \"sincronización y compartir datos, paralelismo y concurrencia\"."},
{"id":"p2:adecuadas","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), capturas","ex":true,"q":"¿Son adecuadas las RdP para modelar sistemas con concurrencia y sincronización? ¿Qué más permiten visualizar?","o":[["Sí, y además permiten visualizar el paralelismo y la compartición de recursos.","Y sobre el modelo se verifican acotación, vivacidad o exclusión mutua."],["Sí, pero sólo la concurrencia, no la sincronización.","Las dos se modelan. La sincronización, con transiciones de varias entradas."],["No, sirven sólo para sistemas secuenciales.","Justamente se usan para sistemas concurrentes."],["No, para eso hacen falta autómatas finitos.","Un autómata finito no expresa la concurrencia de forma directa."]],"c":0,"r":"**Sí.** Además de la concurrencia y la sincronización permiten visualizar el **paralelismo** y el **intercambio (compartición) de recursos**.\n\nY una vez modelado, sobre la red se pueden verificar propiedades como acotación, vivacidad, ausencia de interbloqueo o exclusión mutua.","b":"2do parcial","n":"En una captura respondieron que son adecuadas \"porque permiten visualizar las relaciones entre distintos estados...\" y sacaron 0. El comentario fue \"Paralelismo e intercambio de recursos\": eso es lo que hay que nombrar."},
{"id":"p2:marcado-plaza","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"¿Qué representa el marcado de una plaza en una Red de Petri?","o":[["El estado local de la parte del sistema que esa plaza representa.","Correcta: es el comentario de la cátedra."],["El estado global de todo el sistema.","No: eso es el marcado de toda la red, no el de una plaza."],["La cantidad de veces que se disparó la transición de salida.","No: eso es el vector característico de una secuencia."],["El tiempo que lleva sensibilizada la transición.","No: eso es información temporal, no el marcado."]],"c":0,"r":"El **estado local** de la parte del sistema que esa plaza representa: por ejemplo, cuántos recursos libres hay, cuántos elementos tiene un buffer, o si un proceso está en su sección crítica.\n\nEl marcado de **toda** la red (el vector con las fichas de cada plaza) es el **estado global** del sistema.","b":"2do parcial","n":"En 2021 respondieron \"el estado del sistema en un determinado momento; cuántos tokens tiene cada plaza\" y les dieron 1, pero el comentario corrige: \"el marcado de una plaza representa el estado local de la parte del sistema que representa\". Distinguí plaza (local) de red (global)."},
{"id":"p2:dinamica","tema":"RdP: elementos, disparo y tipos de red","src":"recup. 2021","ex":true,"q":"¿Cómo se representa la dinámica de un sistema descripto por una Red de Petri?","o":[["Con la evolución del marcado a medida que se disparan las transiciones.","Correcta."],["Con la matriz de incidencia, que cambia en cada disparo.","No: la matriz de incidencia es fija, describe la estructura. Lo que cambia es el marcado."],["Con la cantidad de plazas, que crece a medida que el sistema avanza.","No: la estructura de la red no cambia."],["Con los pesos de los arcos, que se ajustan en cada disparo.","No: los pesos son parte de la estructura y no cambian."]],"c":0,"r":"Con la **evolución del marcado** a medida que se **disparan** las transiciones sensibilizadas. Cada disparo saca fichas de los lugares de entrada y pone en los de salida, y el nuevo marcado es el nuevo estado.\n\nAlgebraicamente es la **ecuación de estado**: M_{k+1} = M_{k} + C · σ, con C la matriz de incidencia y σ el vector de disparo.","b":"2do parcial"},
{"id":"p2:sensibilizada-ordinaria","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2)","ex":true,"q":"En una Red de Petri **ordinaria**, ¿cuál es la condición para que una transición esté sensibilizada?","o":[["Cada una de sus plazas de entrada tiene al menos una marca.","Correcta: en una ordinaria los pesos valen 1."],["Alguna de sus plazas de entrada tiene al menos una marca.","No: tienen que ser todas."],["Sus plazas de salida están vacías.","No: las plazas de salida no intervienen en la sensibilización (salvo que estén acotadas o haya arcos especiales)."],["Cada plaza de entrada tiene exactamente tantas marcas como arcos salen de ella.","No: alcanza con una marca, el peso es 1."]],"c":0,"r":"En una red ordinaria **todos los arcos tienen peso 1**. Entonces una transición está sensibilizada cuando **cada una de sus plazas de entrada tiene al menos una marca**.\n\nEn general (red no ordinaria): t está sensibilizada en M si para toda plaza p, M(p) ≥ Pre(p, t).","b":"2do parcial","n":"En 2020 respondieron \"que las plazas tengan la cantidad de tokens que solicita el peso del arco\" y el comentario fue \"¿Ordinaria? ¿peso?\". En una ordinaria no hace falta hablar de pesos: valen 1. Decí \"al menos una marca en cada plaza de entrada\"."},
{"id":"p2:disparo-salida","tema":"RdP: elementos, disparo y tipos de red","src":"2020","ex":true,"q":"Cuando una transición se dispara, ¿qué pasa con los tokens de las plazas que tienen arcos que **salen** de la transición?","o":[["Se les agregan tantas marcas como el peso del arco transición→plaza.","Correcta."],["Se les quitan marcas.","No: las marcas se quitan de las plazas de entrada."],["No cambian: sólo cambian las de entrada.","No: el disparo consume de las entradas y produce en las salidas."],["Se les agrega una única marca, sin importar el peso.","No: en una red no ordinaria cuenta el peso del arco."]],"c":0,"r":"A cada plaza de salida se le **agregan** tantas marcas como el **peso** del arco que va de la transición a esa plaza (Post(p, t)). En una red ordinaria, una marca por plaza.\n\nEl disparo es **atómico**: en un mismo paso indivisible se quitan las marcas de las entradas y se ponen en las salidas.","b":"2do parcial"},
{"id":"p2:disparo-entrada","tema":"RdP: elementos, disparo y tipos de red","src":"recup. 2021","ex":true,"q":"Cuando una transición se dispara, ¿qué pasa con los tokens de las plazas que tienen arcos que **llegan** a la transición?","o":[["Con arcos comunes se consumen según el peso; con lectores e inhibidores no se consume nada.","Correcta."],["Se consumen siempre, sin importar el tipo de arco.","No: los arcos lectores e inhibidores no consumen."],["Pasan directamente a las plazas de salida.","No: las marcas se consumen y se crean otras en las salidas; no \"viajan\"."],["Se duplican.","No."]],"c":0,"r":"Depende del tipo de arco:\n- **Arco común**: se **consumen** tantas marcas como el **peso** del arco.\n- **Arco lector**: la plaza tiene que tener marca para que la transición esté sensibilizada, pero el disparo **no la consume**.\n- **Arco inhibidor**: la plaza tiene que estar **vacía** para que la transición esté sensibilizada, y el disparo **no consume** nada.\n- **Arco reset**: el disparo **vacía** la plaza (le saca todas las marcas).","b":"2do parcial"},
{"id":"p2:lector-disparo","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"Al dispararse una transición, ¿qué pasa con los tokens de una plaza unida a ella por un arco lector?","o":[["Nada, el arco lector exige que haya marca pero no la consume.","Es un test de presencia."],["Se consumen, igual que con un arco común.","El lector no consume."],["Se vacía la plaza.","Eso hace un arco reset."],["Se agrega un token a la plaza.","El arco lector no deposita marcas."]],"c":0,"r":"**Nada.** Un arco lector exige que haya marca en la plaza para que la transición esté sensibilizada, pero **no la consume**: el disparo no cambia el marcado de esa plaza. Es un **test de presencia**.","b":"2do parcial","n":"En 2021 respondieron \"los tokens pasan a la siguiente plaza\" y sacaron 0. Comentario: \"Nada, un arco lector no consume tokens\"."},
{"id":"p2:autonoma","tema":"RdP: elementos, disparo y tipos de red","src":"2020, 2021","ex":true,"q":"¿Qué tipo de red evoluciona por los disparos de sus transiciones que cumplen con la condición de sensibilidad?","o":[["Autónoma.","Correcta."],["No autónoma.","No: en una no autónoma, además de estar sensibilizada, la transición espera un evento o un tiempo."],["Sensibilizada.","No: esa respuesta sacó 0 en 2021."],["Temporizada.","No: es un caso de no autónoma, condicionada por el tiempo."]],"c":0,"r":"Es una red que evoluciona **por sí sola**: sus transiciones se disparan sólo porque están **sensibilizadas**, sin depender de eventos externos ni del tiempo. Los instantes de disparo son desconocidos o no están indicados: la red dice **qué** puede pasar, no **cuándo**. Describe el comportamiento de forma **cualitativa**.\n\nEjemplo de la filmina: el ciclo de las estaciones. Con la ficha en primavera, la única transición sensibilizada lleva a verano, pero no se sabe cuándo.","b":"2do parcial","n":"En 2021 respondieron \"una red de Petri sensibilizada\" y sacaron 0. La respuesta es \"autónoma\"."},
{"id":"p2:no-autonoma","tema":"RdP: elementos, disparo y tipos de red","src":"2020 (x2), 2023","ex":true,"q":"Defina una Red de Petri **no autónoma**.","o":[["Una red cuyas transiciones sensibilizadas disparan recién cuando ocurre un evento externo o pasa un tiempo.","Correcta."],["Una red que no tiene marcado inicial.","No: eso sería una red no marcada."],["Una red en la que ninguna transición puede dispararse.","No: eso es un deadlock."],["Una red cuyas transiciones disparan aunque no estén sensibilizadas.","No: la sensibilización sigue siendo necesaria."]],"c":0,"r":"Es una red cuyo disparo depende, además de la sensibilización, de **eventos externos** o del **tiempo**:\n- **Sincronizada**: la transición sensibilizada dispara cuando ocurre un **evento externo**. Ejemplo: un motor detenido que arranca cuando llega la orden de inicio.\n- **Temporizada**: la transición dispara cuando pasa un **tiempo**. Ejemplo: el semáforo vial que pasa de verde a amarillo 60 s después de haberse sensibilizado.\n\nLas guardas y las colas de eventos asociadas a las transiciones son las que conectan la red con el medio y la hacen no autónoma.","b":"2do parcial"},
{"id":"p2:evento-externo","tema":"RdP: elementos, disparo y tipos de red","src":"2020","ex":true,"q":"¿Qué tipo de red evoluciona por el disparo de transiciones sensibilizadas asociadas a un evento externo?","o":[["Una red no autónoma, en particular sincronizada.","Para disparar, la transición tiene que estar sensibilizada y tiene que ocurrir el evento."],["Una red autónoma.","En una autónoma el disparo no depende de nada externo."],["Una red coloreada.","Los colores son identidades en las fichas, no eventos."],["Una red pura.","Ser pura es no tener auto-loops, no tiene que ver con eventos."]],"c":0,"r":"Una red **no autónoma**, en particular **sincronizada**: la transición tiene que estar sensibilizada **y** tiene que ocurrir el evento externo asociado para que dispare.","b":"2do parcial"},
{"id":"p2:pura","tema":"RdP: elementos, disparo y tipos de red","src":"2021","ex":true,"q":"¿Qué es una Red de Petri pura?","o":[["Una red sin auto-loops: ninguna plaza es entrada y salida de la misma transición.","Correcta."],["Una red sin conflictos.","No: esa es la red libre de conflicto, otra clase."],["Una red en la que todos los arcos tienen peso 1.","No: esa es la red ordinaria."],["Una red con un solo token.","No: el marcado no tiene que ver con la pureza."]],"c":0,"r":"Una red **sin auto-loops** (bucles propios): ninguna plaza es a la vez **entrada y salida de una misma transición**.\n\nImporta porque, en una red pura, la **matriz de incidencia** C = Post − Pre alcanza para reconstruir la red. Con un auto-loop, Pre(p, t) = Post(p, t) y la columna de C da 0, así que el arco desaparece de la matriz.","b":"2do parcial","n":"En 2021 respondieron \"una red libre de conflictos y sin bucles\" y les dieron 1. Lo que define a la pura es \"sin bucles\" (auto-loops); \"libre de conflictos\" no tiene nada que ver. Mejor no agregarlo."},
{"id":"p2:impura-pura","tema":"RdP: elementos, disparo y tipos de red","src":"2021, recup. 2021","ex":true,"q":"¿Se puede convertir una RdP impura en pura? ¿Cómo?","o":[["Sí, agregando una plaza y una transición por cada auto-loop, o sea partiendo la transición en dos.","La primera mitad consume de la plaza y deposita en la nueva, y la segunda devuelve la marca."],["No, una red impura nunca se puede convertir.","Toda RdP impura se puede convertir en pura."],["Sí, eliminando las plazas del auto-loop.","Eso cambiaría el comportamiento de la red."],["Sí, agregando un arco inhibidor.","No hace falta ninguna extensión."]],"c":0,"r":"**Sí** (Propiedad 1.1: toda RdP impura se puede convertir en una pura), **agregando una plaza y una transición**.\n\nLa transición del auto-loop T_{j} se parte en dos: T_{j}' consume de la plaza P_{i} y deposita en una plaza nueva, y T_{j}'' consume de la plaza nueva y devuelve la marca a P_{i}. Así ninguna plaza es entrada y salida de la misma transición.","b":"2do parcial"},
{"id":"p2:arcos-tipos","tema":"RdP: elementos, disparo y tipos de red","src":"filmina (paper ecuación generalizada)","ex":false,"q":"Una transición tiene un arco inhibidor desde la plaza P, y P tiene 2 marcas. ¿Puede dispararse?","o":[["No: con marcas en P, la transición no está sensibilizada.","Correcta."],["Sí, y consume las 2 marcas de P.","No: así se comporta un arco reset, y además el inhibidor la deshabilita."],["Sí, y consume una marca de P.","No: el inhibidor no consume."],["Sí, sin tocar las marcas de P.","No: así sería un arco lector."]],"c":0,"r":"Los tres unen una plaza con una transición y aumentan la capacidad de expresión de la red:\n- **Inhibidor**: si hay marca en la plaza, la transición **no** está sensibilizada (exige plaza vacía). No consume.\n- **Lector**: si **no** hay marca en la plaza, la transición no está sensibilizada. El disparo no consume.\n- **Reset**: al dispararse la transición se retiran **todas** las marcas de la plaza (la pone en cero).\n\nLos inhibidores y lectores permiten modelar **prioridades**.","b":"2do parcial"},
{"id":"p2:guardas-eventos","tema":"RdP: elementos, disparo y tipos de red","src":"filmina (paper ecuación generalizada)","ex":false,"q":"¿Qué son las guardas y los eventos asociados a una transición? ¿Qué tipo de red producen?","o":[["Condiciones externas al marcado que se suman a la sensibilización; hacen a la red no autónoma.","Correcta."],["Arcos especiales que consumen todos los tokens.","No: eso es el arco reset."],["Plazas extra que se agregan para hacer pura a la red.","No."],["Prioridades fijas de las transiciones.","No: las prioridades son otra extensión."]],"c":0,"r":"- Una **guarda** es una variable lógica asociada a una transición: para dispararla, además de estar sensibilizada, la guarda tiene que ser verdadera.\n- Un **evento** se guarda en una **cola** (un contador) asociada a la transición: se incrementa cuando llega un evento y se decrementa cuando la transición dispara. Para estar sensibilizada, la cola tiene que tener al menos un evento.\n\nLas dos comunican la red con el medio, así que la hacen **no autónoma**.","b":"2do parcial"},
{"id":"p2:rdp-def","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Por qué se dice que una RdP es un grafo bipartito?","o":[["Porque sus nodos son de dos clases (lugares y transiciones) y cada arco une un nodo de cada clase.","Correcta."],["Porque siempre tiene dos componentes conexas.","No."],["Porque cada transición tiene exactamente dos arcos.","No: puede tener cualquier cantidad."],["Porque se puede dibujar en dos colores.","No."]],"c":0,"r":"Es un **grafo bipartito dirigido**: lugares y transiciones se alternan en cualquier camino, y cada arco une un lugar con una transición (o al revés). Formalmente:\n\nR = ⟨P, T, Pre, Post⟩\n\ncon P el conjunto finito de **lugares** (condiciones o estados locales), T el de **transiciones** (eventos o acciones), y Pre, Post: P × T → ℕ los pesos de los arcos de entrada y de salida. La **matriz de incidencia** es C = Post − Pre. Una **red marcada** es el par ⟨R, M_{0}⟩: las **fichas** indican que una condición se cumple o cuántos recursos hay, y el **marcado** M es el estado de la red.","b":"2do parcial"},
{"id":"p2:disparo-props","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"Si una transición está sensibilizada, ¿qué se puede asegurar?","o":[["Que puede dispararse, no que vaya a dispararse.","Sólo se sabe que el próximo cambio de marcado será el disparo de alguna de las sensibilizadas."],["Que se dispara inmediatamente.","El disparo no es obligatorio, y en una red autónoma es no determinista cuál dispara."],["Que es la única que puede dispararse.","Puede haber varias sensibilizadas a la vez."],["Que la red es viva.","La vivacidad es una propiedad de toda la red y de todas sus marcas alcanzables."]],"c":0,"r":"Sensibilizada significa que **puede** dispararse: cada lugar de entrada tiene al menos tantas fichas como el peso de su arco. Tres propiedades:\n- **Sensibilizada no significa que va a disparar.** Sólo sabemos que el próximo cambio de marcado será el disparo de alguna de las sensibilizadas (no determinismo acotado).\n- **El disparo es indivisible**: no hay estados intermedios.\n- **Duración cero**: en una red no temporizada lo que lleva tiempo es la espera en los lugares, no el disparo.","b":"2do parcial"},
{"id":"p2:fuente-sumidero","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Qué es una transición fuente?","o":[["Una transición sin lugares de entrada, que está siempre sensibilizada.","Correcta: es la definición de transición fuente."],["Una transición sin lugares de salida.","No: esa es la transición sumidero."],["Una transición con un auto-loop.","No."],["La primera transición que dispara desde M0.","No."]],"c":0,"r":"- **Fuente** (source): no tiene lugares de entrada. Está **siempre sensibilizada** y genera fichas de la nada: modela la llegada de clientes, pedidos o eventos del exterior.\n- **Sumidero** (sink): no tiene lugares de salida. Consume fichas y no produce nada: modela la salida del sistema.\n\nUna transición fuente que deposita en un lugar del que nada saca lo hace crecer sin límite: la red **no está acotada**.","b":"2do parcial"},
{"id":"p2:coloreadas","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Las redes de Petri coloreadas agregan poder expresivo?","o":[["No, una coloreada con un número finito de colores se puede desplegar en una ordinaria equivalente.","Son una abreviatura, que escribe lo mismo de forma más compacta."],["Sí, modelan sistemas que ninguna red ordinaria puede modelar.","Con colores finitos, el despliegue da una ordinaria equivalente."],["Sí, porque agregan tiempo a las transiciones.","El tiempo lo agregan las redes temporizadas, no los colores."],["No, porque no se pueden usar con más de un proceso.","Justamente sirven para muchos procesos idénticos."]],"c":0,"r":"En una red coloreada cada **ficha lleva un color** (una identidad, que puede ser una n-tupla), y las condiciones de disparo se definen con **funciones asociadas a los arcos**. Sirven cuando hay muchos procesos idénticos: en lugar de copiar el mismo subgrafo, se pone la identidad en la ficha.\n\n- **Plegado** (folding): fusionar varios lugares o transiciones en uno coloreado.\n- **Despliegue** (unfolding): la operación inversa.\n\nEl despliegue completo de una red coloreada da una **única red ordinaria**. Por lo tanto **no agregan poder expresivo**, agregan **compacidad**.","b":"2do parcial"},
{"id":"p2:orden-parcial","tema":"RdP: elementos, disparo y tipos de red","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre la semántica de interleaving y la semántica de orden parcial de una red concurrente?","o":[["En orden parcial, dos disparos independientes simplemente no se ordenan; en interleaving se enumeran todas sus intercalaciones.","Correcta."],["El interleaving sólo vale para monoprocesadores y el orden parcial sólo para multiprocesadores.","No: son dos formas de dar semántica, no dependen del hardware."],["En orden parcial no puede haber conflictos.","No: los conflictos siguen existiendo."],["Son lo mismo con distinto nombre.","No."]],"c":0,"r":"- **Interleaving**: se impone un orden **total** a los disparos. La concurrencia se representa como todas las intercalaciones posibles, y eso hace explotar el espacio de estados.\n- **Orden parcial** (true concurrency): dos disparos que no compiten por fichas **no están ordenados** entre sí; son incomparables. No hace falta enumerar las n! intercalaciones equivalentes.\n\nPor eso la RdP es un formalismo de concurrencia y no sólo un autómata dibujado distinto: puede decir \"estos dos eventos son independientes\".","b":"2do parcial"},
{"id":"p2:abrev-ext","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Cuál de estas es una abreviatura (no agrega poder de modelado)?","o":[["Una red generalizada, con pesos en los arcos.","Correcta: toda red generalizada se puede transformar en una ordinaria equivalente."],["Una red con arcos inhibidores.","No: es una extensión. Con inhibidores la red alcanza el poder de una máquina de Turing."],["Una red con prioridades entre transiciones.","No: en general las prioridades, igual que los inhibidores, aumentan el poder de modelado."],["Una red temporizada.","No: es no autónoma, y no se puede convertir en una ordinaria."]],"c":0,"r":"- **Abreviaturas**: permiten escribir lo mismo de forma más compacta, **sin** agregar poder de modelado. Se mantienen las propiedades de las redes ordinarias, con algunas adaptaciones. Ejemplos: las redes **generalizadas** (arcos con peso) y las **coloreadas** con un número finito de colores. Las dos se pueden convertir en una red ordinaria equivalente, aunque para las generalizadas la transformación es sumamente compleja.\n- **Extensiones**: reglas nuevas que **sí** aumentan el poder de modelado. A cambio, **no todas** las propiedades de las ordinarias se mantienen. Ejemplos: los **arcos inhibidores** (con ellos la red alcanza el poder de una máquina de Turing, y la acotación o la alcanzabilidad dejan de ser decidibles en general) y las **prioridades**.\n\nLas **no autónomas** (sincronizadas o temporizadas) son las que se implementan, y **no** se pueden convertir en ordinarias: el evento o el reloj externos no se representan con fichas.","b":"2do parcial"},
{"id":"p2:test-cero","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Por qué una red ordinaria no puede modelar \"abrir la puerta cuando no queda nadie adentro\"?","o":[["Porque una transición sólo se habilita por la presencia de fichas, nunca por su ausencia.","Correcta: es un test a cero, y para eso está el arco inhibidor."],["Porque la red tendría que ser no acotada.","No: el problema no es la acotación."],["Porque hace falta tiempo para saber cuándo salió el último cliente.","No: alcanza con mirar el marcado, con un arco inhibidor."],["Sí puede: alcanza con un arco de peso 0.","No: en una red ordinaria todos los arcos pesan 1."]],"c":0,"r":"\"Abrir cuando el lugar clientes adentro está vacío\" es un **test a cero**, y una red ordinaria **no puede** expresarlo: una transición se habilita por la **presencia** de fichas, nunca por su ausencia.\n\nHace falta un **arco inhibidor** desde clientes adentro hacia la transición abrir puerta. Se dibuja con un círculo en la punta y habilita la transición **sólo si el lugar tiene 0 fichas** (en general, menos fichas que el peso del arco).\n\nPara la variante alcanza con un arco inhibidor de **peso 3**: la puerta puede abrirse mientras haya menos de 3 clientes adentro.","b":"2do parcial"},
{"id":"p2:continuas","tema":"RdP: elementos, disparo y tipos de red","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"¿Qué caracteriza a una red de Petri continua?","o":[["El marcado de cada lugar es un número real, no un entero.","Se usa para flujos continuos o cuando hay demasiadas fichas para contarlas."],["Que sus transiciones disparan continuamente, sin parar.","Lo continuo es el marcado, no el disparo."],["Que es fuertemente conexa.","Es otro concepto, de teoría de grafos."],["Que cada lugar tiene a lo sumo una ficha.","Eso es ser segura, y en una continua ni siquiera tiene sentido."]],"c":0,"r":"- En una RdP **continua** el marcado de cada lugar es un **número real** positivo, no un entero. Se usa cuando el sistema tiene un **flujo** continuo, o cuando hay tantas fichas que no tiene sentido contarlas de a una.\n- Una RdP **híbrida** combina una parte **discreta** (marcado entero) y una **continua**.\n\nAlgunas propiedades no se aplican a las continuas: por ejemplo, ser **segura**, justamente porque el marcado no es entero.","b":"2do parcial"},
{"id":"p2:maquina-estado","tema":"Clases de redes","src":"2020 (x2), capturas","ex":true,"q":"¿Qué caracteriza a una Red de Petri para que se comporte como una máquina de estado?","o":[["Cada transición tiene una sola entrada y una sola salida, y la red tiene una única marca.","Correcta: estructura y marcado."],["Cada transición tiene una sola entrada y una sola salida, con cualquier marcado.","Incompleta: sacó 0 con el comentario \"¿Y el marcado?\"."],["Cada plaza tiene una sola transición de entrada y una de salida.","No: ese es el grafo de eventos (grafo marcado)."],["La red no tiene conflictos.","No: una máquina de estado puede tener conflictos (un estado con varias salidas)."]],"c":0,"r":"Estructura: **cada transición tiene exactamente una plaza de entrada y una de salida** (es un grafo de estado).\n\nMarcado: **una sola marca** en toda la red. Con un único token, la red está en un solo estado a la vez (la plaza que tiene el token) y se comporta como un autómata clásico.\n\nCon más de una marca ya no es equivalente: 3 plazas con 2 tokens generan 6 marcados distintos, que un autómata de 3 estados no representa.","b":"2do parcial","n":"En una captura respondieron \"que cada transición tenga solamente una entrada y un lugar de salida\" y sacaron 0, con el comentario \"¿Y el marcado?\". Hay que decir las dos cosas: la estructura **y** un solo token."},
{"id":"p2:grafo-marcado-conflicto","tema":"Clases de redes","src":"2020 (x2), 2021 (x2)","ex":true,"q":"¿Puede tener conflicto una RdP que es un grafo marcado (grafo de eventos)?","o":[["No, cada plaza tiene una sola transición de salida, y el conflicto necesita una plaza con dos o más.","Sí puede tener sincronizaciones."],["Sí, siempre que tenga más de un token.","La cantidad de tokens no cambia la estructura."],["Sí, porque toda red con ciclos tiene conflictos.","Los ciclos no generan conflictos por sí mismos."],["Sólo si es no acotada.","La acotación no tiene relación con los conflictos."]],"c":0,"r":"**No.** En un grafo marcado (o grafo de eventos) **cada plaza tiene exactamente una transición de entrada y una de salida**. Para que haya conflicto hace falta una plaza con dos o más transiciones de salida, y eso no existe.\n\nPuede haber **sincronizaciones** (transiciones con varias entradas), pero no conflictos: no hay elecciones, sólo distintas planificaciones.","b":"2do parcial","n":"No confundas \"**grafo marcado**\" (una clase de RdP: el grafo de eventos) con el \"**grafo de marcado**\" o de marcas (el grafo de accesibilidad). En 2021 contestaron describiendo el grafo de accesibilidad y sacaron 0. Ojo: la cátedra usa \"grafo de marcado\" para las dos cosas; acá \"una red **que es** un grafo de marcado\" es la clase de red."},
{"id":"p2:libre-eleccion-ext","tema":"Clases de redes","src":"resumen","ex":true,"q":"¿Qué caracteriza a una Red de Petri de libre elección extendida? (relación plaza-transición, conflicto)","o":[["Las transiciones en conflicto tienen el mismo conjunto de plazas de entrada.","Correcta."],["No tiene conflictos.","No: esa es la red libre de conflicto."],["Cada transición tiene una sola entrada y una sola salida.","No: esa es la máquina de estado."],["Cada transición participa en a lo sumo un conflicto.","No: esa es la red simple."]],"c":0,"r":"**Para cada conflicto, las transiciones en conflicto tienen el mismo conjunto de plazas de entrada.** Formalmente: si p_{1}• ∩ p_{2}• ≠ ∅, entonces p_{1}• = p_{2}•.\n\nConsecuencia: si se habilita una de las transiciones del conflicto, **se habilitan todas**. La elección es \"libre\" porque no depende de otra parte del marcado. Es la clase donde se aplica el teorema de Commoner.","b":"2do parcial"},
{"id":"p2:clases-inclusion","tema":"Clases de redes","src":"apunte","ex":false,"q":"Una red tiene una transición con dos plazas de entrada (una sincronización). ¿Puede ser una máquina de estado?","o":[["No: en una máquina de estado cada transición tiene una sola entrada.","Correcta."],["Sí, si tiene un solo token.","No: la estructura ya la descarta."],["Sí, siempre que no tenga conflictos.","No."],["Sólo si es pura.","No."]],"c":0,"r":"- **Máquina de estado** (cada transición, una entrada y una salida): puede tener **conflictos**, no **sincronizaciones**.\n- **Grafo de eventos** (cada plaza, una entrada y una salida): puede tener **sincronizaciones**, no **conflictos**.\n\nLas clases se obtienen restringiendo la estructura; a cambio de modelar menos, se pueden demostrar más propiedades:\n\nGrafos de eventos ⊂ Libres de conflicto ⊂ Libre elección ⊂ Simples ⊂ Ordinarias, y Máquinas de estado ⊂ Libre elección.","b":"2do parcial"},
{"id":"p2:grafo-estado-token","tema":"Clases de redes","src":"apunte","ex":false,"q":"¿Cuándo un grafo de estado de 3 lugares es equivalente a un autómata de 3 estados?","o":[["Sólo cuando está marcado con un único token.","Con más fichas hay más marcados posibles que estados del autómata."],["Siempre, con cualquier marcado.","Con 2 fichas en 3 lugares ya hay 6 marcados posibles."],["Nunca, son modelos incomparables.","Con un token son equivalentes."],["Sólo cuando no tiene conflictos.","Un grafo de estado puede tener conflictos y seguir siendo equivalente a un autómata."]],"c":0,"r":"**Sólo si está marcado con un único token.** Con una ficha, la red está en un solo lugar a la vez y cada transición corresponde a un arco del diagrama de estados: es un autómata clásico.\n\nCon **más de un token** deja de ser equivalente: con 3 lugares y 2 fichas hay 6 marcados posibles, que un autómata de 3 estados no representa. El autómata guarda **un** estado global; la red guarda una **distribución** de fichas.","b":"2do parcial"},
{"id":"p2:plaza-limitada","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Cómo define una plaza limitada (acotada) de una Red de Petri?","o":[["Para todo marcado alcanzable desde M0, la cantidad de marcas en la plaza no supera una constante k.","Correcta."],["Una plaza con un arco inhibidor.","No: esa respuesta sacó 0 en el recuperatorio 2021."],["Una plaza que en M0 tiene k marcas.","No: lo que importa es todo marcado alcanzable, no sólo el inicial."],["Una plaza que nunca se vacía.","No: eso tiene que ver con las trampas, no con la acotación."]],"c":0,"r":"Una plaza p es **k-limitada** para el marcado inicial M_{0} si, para **cualquier** marcado M alcanzable desde M_{0}, el número de marcas en p es **menor o igual que k**: M(p) ≤ k.\n\nLa cota depende del marcado inicial.","b":"2do parcial","n":"En el recuperatorio 2021 respondieron \"mediante un arco inhibidor\" y sacaron 0. La pregunta pide la **definición** de plaza limitada, no cómo limitarla."},
{"id":"p2:red-limitada","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Qué relación hay entre una red segura y una red acotada?","o":[["Toda red segura es acotada, pero no toda red acotada es segura.","Segura es 1-limitada, y una red puede ser 3-limitada sin ser segura."],["Son lo mismo.","Segura es el caso particular k = 1."],["Toda red acotada es segura.","Una red 2-limitada es acotada y no es segura."],["No tienen relación.","Segura es un caso particular de acotada."]],"c":0,"r":"Una RdP está **limitada** (acotada) para M_{0} si **todas sus plazas están limitadas** para esa marca inicial. Es **k-limitada** si todas las plazas son k-limitadas.\n\nUna red es **segura** si es 1-limitada: ninguna plaza tiene nunca más de una marca. Toda red segura es acotada, pero no al revés.\n\nLa acotación depende de M_{0}. Una red es **estructuralmente acotada** si está acotada para cualquier marcado inicial.","b":"2do parcial"},
{"id":"p2:vivacidad-marcado","tema":"Propiedades: acotada, viva, home state","src":"2021, recup. 2021, capturas","ex":true,"q":"Si una red es viva para M_{0}, ¿sigue siendo viva para cualquier marcado mayor?","o":[["No en general, porque agregar fichas puede habilitar una secuencia que termine en deadlock.","La vivacidad no es monótona. Sí se conserva en clases como las libres de conflicto."],["Sí, siempre, porque más fichas sólo habilitan más disparos.","Esos disparos de más pueden llevar a una marca muerta."],["Sí, si la red es acotada.","La acotación no garantiza que se conserve la vivacidad."],["No, agregar fichas siempre la vuelve no viva.","Tampoco es siempre así. Simplemente no está garantizado."]],"c":0,"r":"**No.** La vivacidad y la ausencia de interbloqueo dependen del marcado inicial y **no son monótonas**: agregar fichas puede habilitar una secuencia que termine en un deadlock, o desbalancear un conflicto de modo que una transición nunca vuelva a habilitarse.\n\nEn cambio, sí se mantiene la quasi-vivacidad (más fichas no le quitan a una transición la posibilidad de disparar alguna vez), y la falta de acotación (agregar fichas no la arregla).","b":"2do parcial"},
{"id":"p2:libre-interbloqueo-m","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"Si una RdP está libre de interbloqueo para m_{0}, ¿es libre de interbloqueo para un marcado m > m_{0}? ¿Por qué?","o":[["No necesariamente: más fichas pueden habilitar una secuencia que termina en un deadlock.","Correcta."],["Sí: con más fichas siempre hay más transiciones sensibilizadas.","No: puede haber más transiciones sensibilizadas en el camino y aun así llegar a una marca muerta."],["Sí, si la red es acotada.","No: la acotación no garantiza esto."],["No: con más fichas siempre aparece un deadlock.","No: puede aparecer, no siempre aparece."]],"c":0,"r":"**No necesariamente.** Con cierta marca puede no habilitarse nunca una transición que lleva a un deadlock, y al agregar fichas sí se puede disparar, y desde ese estado la red no evoluciona más.\n\nEjemplo: una plaza P con 1 ficha, un ciclo P → t_{1} → Q → t_{2} → P, y una transición t_{3} que necesita **2** fichas de P y las manda a una plaza sin salida. Con 1 ficha, t_{3} nunca se habilita y la red cicla para siempre. Con 2 fichas, t_{3} puede dispararse, se lleva las dos fichas y la red queda en deadlock.","b":"2do parcial"},
{"id":"p2:quasi-viva-veces","tema":"Propiedades: acotada, viva, home state","src":"2020 (x2), 2021, capturas","ex":true,"q":"¿Cuántas veces se puede disparar una transición quasi viva?","o":[["Al menos una vez.","Correcta."],["Infinitas veces.","No: eso lo garantiza una transición viva."],["Exactamente una vez.","No: puede dispararse más, pero lo garantizado es al menos una."],["Ninguna.","No: esa sería una transición muerta."]],"c":0,"r":"**Al menos una vez.** Una transición es quasi viva si existe **alguna** secuencia de disparos desde M_{0} en la que dispara al menos una vez. No garantiza que pueda volver a dispararse después.\n\nQue todas las transiciones sean quasi vivas dice que el diseño no tiene partes \"de adorno\" que nunca se usan.","b":"2do parcial","n":"En una captura respondieron \"no se sabe cuántas veces se puede disparar\" y sacaron 0. Comentario: \"Al menos una vez\"."},
{"id":"p2:seudo-viva-bloqueo","tema":"Propiedades: acotada, viva, home state","src":"2020, resumen","ex":true,"q":"¿Puede bloquearse totalmente una red seudo viva?","o":[["No, tiene alguna transición viva, que siempre puede volver a dispararse.","Lo que sí puede pasar es que otras transiciones mueran."],["Sí, seudo viva significa que puede llegar a un deadlock.","Si llegara a un deadlock, ninguna transición sería viva."],["Sí, si tiene transiciones quasi vivas.","Que haya quasi vivas no cambia que alguna sea viva."],["Depende de si es segura.","La seguridad no tiene relación con el bloqueo."]],"c":0,"r":"**No.** Una red seudo viva tiene **algunas transiciones vivas** (no necesariamente todas). Una transición viva siempre puede volver a dispararse desde cualquier marca alcanzable, así que la red **nunca se bloquea totalmente**: alguna actividad sigue siendo posible. Lo que sí puede pasar es que otras transiciones dejen de estar disponibles para siempre.","b":"2do parcial"},
{"id":"p2:viva-alcanzar","tema":"Propiedades: acotada, viva, home state","src":"2020, 2023","ex":true,"q":"Si una RdP es viva, ¿qué se puede garantizar desde cualquier marca alcanzable? (respuesta que acepta la cátedra)","o":[["Que existe una secuencia de disparos que contiene a cualquier transición de la red.","Ninguna capacidad del sistema se pierde nunca. La cátedra lo acepta como \"sí, se puede llegar\"."],["Que siempre se vuelve a la marca inicial.","Eso es la reversibilidad."],["Que la red es acotada.","La vivacidad no implica acotación."],["Que no hay conflictos.","Una red viva puede tener conflictos."]],"c":0,"r":"Respuesta que acepta la cátedra: **Sí**, porque si la red es viva, desde **cualquier** marca M_{i} alcanzable siempre existe una secuencia de disparos que contiene a cualquier transición T_{j}: ninguna capacidad del sistema se pierde nunca.","b":"2do parcial","n":"La cátedra le dio 1 al \"Sí\" en 2020 y en 2023. Pero ojo, formalmente vivacidad **no** es lo mismo que poder alcanzar cualquier marca: eso es la **reversibilidad** (o tener home state). Una red viva puede tener marcas transitorias a las que no se vuelve. Si te la toman, contestá \"Sí\" con la justificación de arriba (siempre se puede volver a disparar cualquier transición); no la mezcles con la definición de reversible. Comparala con la variante \"seudo viva y quasi viva\", donde la respuesta es \"No\"."},
{"id":"p2:seudo-quasi-alcanzar","tema":"Propiedades: acotada, viva, home state","src":"2021 (x2)","ex":true,"q":"Si una red es seudo viva y todas sus transiciones son quasi vivas, ¿desde cualquier marca se puede llegar a cualquier otra?","o":[["No, puede haber transiciones que después de disparar no se habiliten más, y marcas a las que no se puede volver.","Quasi viva sólo garantiza que cada transición dispara al menos una vez."],["Sí, porque todas las transiciones pueden dispararse.","Poder dispararse una vez no alcanza."],["Sí, si además es acotada.","La acotación no garantiza volver a cualquier marca."],["Sí, porque seudo viva implica reversible.","No implica reversibilidad."]],"c":0,"r":"**No.** Quasi viva sólo garantiza que cada transición dispara **al menos una vez** en alguna secuencia, y seudo viva sólo que **algunas** transiciones son vivas. Puede haber transiciones que, después de dispararse, no se habiliten nunca más, y marcas a las que no se puede volver. Para esa garantía la red tiene que ser **viva** (según la cátedra).","b":"2do parcial","n":"En 2021 respondieron \"Sí se puede garantizar\" y sacaron 0; el mismo año, \"No se puede garantizar\" sacó 1."},
{"id":"p2:reversible","tema":"Propiedades: acotada, viva, home state","src":"2020, 2021","ex":true,"q":"¿Qué significa que una red sea reversible para m_{0}?","o":[["Que desde cualquier marca alcanzable existe una secuencia que vuelve a m_{0}.","O sea, m_{0} es un home state."],["Que se pueden disparar las transiciones al revés.","No se invierte el sentido de los disparos."],["Que es viva y acotada.","Eso es comportarse bien."],["Que desde m_{0} se puede llegar a cualquier marca.","Es al revés. Se pide poder volver a m_{0}."]],"c":0,"r":"**Sí.** Esa es la definición: una red es **reversible** (o reinicializable) si desde **cualquier marca alcanzable** desde m_{0} existe una secuencia de disparos que vuelve a m_{0}. Es decir, m_{0} es un **home state**: siempre se puede volver al estado de arranque.","b":"2do parcial"},
{"id":"p2:home-state","tema":"Propiedades: acotada, viva, home state","src":"2020 (x2)","ex":true,"q":"¿Qué es un home state m_{h}?","o":[["Una marca a la que se puede llegar desde cualquier marca alcanzable.","Si el home state es m_{0}, la red es reversible."],["La marca inicial de la red.","Puede ser la inicial, pero no tiene por qué serlo."],["Una marca desde la que no se puede disparar nada.","Eso es una marca muerta, un deadlock."],["La marca con más tokens del grafo.","No depende de la cantidad de tokens."]],"c":0,"r":"**Sí.** Una marca m_{h} es un **home state** si desde **cualquier** marca alcanzable existe una secuencia de disparos que llega a m_{h}. Si el home state es la marca inicial m_{0}, la red es **reversible**.","b":"2do parcial"},
{"id":"p2:tipo-home","tema":"Propiedades: acotada, viva, home state","src":"2021","ex":true,"q":"Si una Red de Petri tiene una marca m_{h} que se puede alcanzar desde cualquier estado, ¿qué tipo de red es?","o":[["Una red con home state.","Correcta."],["Una red reversible.","No: sólo si mh es la marca inicial. Esta respuesta sacó 0 en 2021."],["Una red viva.","No: tener un home state no implica que todas las transiciones estén vivas."],["Una red segura.","No: no tiene que ver con la cantidad de fichas por plaza."]],"c":0,"r":"Es una **RdP con home state** (m_{h} es un home state).\n\nSólo sería **reversible** si m_{h} fuera la marca inicial m_{0}.","b":"2do parcial","n":"En 2021 respondieron \"es una red reversible\" y sacaron 0. Comentario: \"RdP con home state\". Reversible es el caso particular en que el home state es m0."},
{"id":"p2:estructura-comportamiento","tema":"Propiedades: acotada, viva, home state","src":"recup. 2021","ex":true,"q":"¿Se puede determinar todo el comportamiento de una RdP sólo con su estructura?","o":[["No, además hace falta el marcado inicial. La misma red puede ser viva con un M_{0} y no serlo con otro.","Con la estructura sola se ven las propiedades estructurales."],["Sí, la estructura determina todo.","La vivacidad o la acotación dependen del marcado."],["Sí, si la red es pura.","Ser pura no hace al comportamiento independiente del marcado."],["No, además hace falta el código que la implementa.","El comportamiento de la red queda definido por la estructura y el marcado."]],"c":0,"r":"**No.** Además de la estructura hace falta el **marcado** (inicial). La misma red puede ser viva y acotada con un M_{0} y no serlo con otro.\n\nCon la estructura sola se ven las propiedades **estructurales**: conflictos estructurales, componentes conservadores (P-invariantes), sifones y trampas. Las de **comportamiento** (vivacidad, acotación, interbloqueo, home state) dependen también del marcado.","b":"2do parcial","n":"En el recuperatorio 2021 respondieron \"sí, porque por la estructura podemos ver si tiene home state, si tiene conflictos...\" y sacaron 0. Comentario: \"No, es necesario además de la estructura el marcado\"."},
{"id":"p2:well-behaved","tema":"Propiedades: acotada, viva, home state","src":"apunte","ex":false,"q":"¿Cuál de estas afirmaciones es verdadera?","o":[["Toda red viva es libre de deadlock.","Correcta: una marca muerta impediría que cualquier transición vuelva a disparar."],["Toda red libre de deadlock es viva.","No: puede no trabarse nunca y aun así tener una transición que dejó de estar disponible."],["Toda red quasi viva es libre de deadlock.","No: cada transición puede disparar una vez y después trabarse todo."],["Una red bien comportada es la que es segura y reversible.","No: es la que es viva y acotada."]],"c":0,"r":"- **Quasi-vivacidad y libertad de deadlock son independientes**: una red puede ser quasi viva y tener un deadlock (cada transición disparó su vez y después todo se trabó), y puede ser libre de deadlock sin ser quasi viva (una transición nunca dispara, pero el resto funciona para siempre).\n- **Viva implica libre de deadlock**: si hubiera una marca muerta, ninguna transición podría volver a dispararse desde ahí. La recíproca no vale.\n\nUna red es **bien comportada** (well-behaved) si es **viva y acotada**: sin acotación no es implementable con recursos finitos, y sin vivacidad puede perder funcionalidad para siempre.","b":"2do parcial"},
{"id":"p2:bien-formada","tema":"Propiedades: acotada, viva, home state","src":"apunte","ex":false,"q":"Una red no marcada Q está bien formada si...","o":[["Existe algún marcado inicial con el que es viva y acotada.","Correcta."],["Es viva y acotada para todo marcado inicial.","No: alcanza con que exista uno."],["Es viva con el marcado vacío.","No: con el marcado vacío en general no dispara nada."],["No tiene conflictos estructurales.","No: esa es la red libre de conflicto."]],"c":0,"r":"- Una red **marcada** ⟨Q, m_{0}⟩ **se comporta bien** (well-behaved) si es **viva y acotada**.\n- Una red **no marcada** Q está **bien formada** si **existe** algún m_{0} con el que se comporta bien.\n\nSobre agregar fichas: en general la vivacidad **no** se hereda. Para algunas clases sí: en las redes **libres de conflicto** (y sus extendidas), si ⟨Q, m_{0}⟩ es viva, también lo es con cualquier marcado mayor o igual que m_{0}.\n\nY una red **persistente** es viva si y sólo si hay un marcado alcanzable desde el que se puede aplicar una secuencia repetitiva **completa**, con todas las transiciones. La persistencia sola no garantiza vivacidad.","b":"2do parcial"},
