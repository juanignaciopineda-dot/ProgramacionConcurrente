{"id":"p2:conflicto-estr-vs-efec","tema":"Conflicto, concurrencia y prioridades","src":"recup. 2021 (x2)","ex":true,"q":"Explique la diferencia entre conflicto estructural y conflicto efectivo.","o":[["El estructural depende sólo de que compartan una plaza de entrada; el efectivo además requiere que, con el marcado actual, no alcancen las marcas para dispararlas a todas.","Correcta."],["El estructural depende del marcado y el efectivo no.","No: es al revés."],["El efectivo se da cuando dos transiciones no comparten plazas.","No: sin plaza compartida no hay conflicto."],["Son sinónimos.","No."]],"c":0,"r":"- **Conflicto estructural**: dos o más transiciones **comparten al menos una plaza de entrada** (la plaza tiene más de una transición de salida). Depende **sólo de la estructura**, no del marcado.\n- **Conflicto efectivo**: hay conflicto estructural **y además**, para un marcado dado, las transiciones están sensibilizadas pero las marcas de la plaza compartida **no alcanzan para dispararlas a todas**. Disparar una deshabilita a la otra.\n\nSi las marcas alcanzan para todas, el conflicto no es efectivo: las transiciones son concurrentes.","b":"2do parcial"},
{"id":"p2:concurrencia-conflicto","tema":"Conflicto, concurrencia y prioridades","src":"2021","ex":true,"q":"¿Qué entiende por concurrencia (conflicto) en una Red de Petri?","o":[["Cuando dos transiciones en conflicto pueden dispararse en cualquier secuencia o simultáneamente.","Correcta: es el comentario textual de la cátedra."],["Cuando no pueden realizarse transiciones de tokens hacia otra plaza.","No: sacó 0 en 2021."],["Cuando disparar una transición deshabilita a la otra.","No: eso es el conflicto efectivo."],["Cuando ninguna transición está sensibilizada.","No: eso es un deadlock."]],"c":0,"r":"Cuando **dos transiciones en conflicto pueden ser disparadas en cualquier secuencia o simultáneamente**: comparten plaza de entrada, pero hay marcas suficientes para las dos (conflicto **no efectivo**). Son causalmente independientes: una puede dispararse antes, después o al mismo tiempo que la otra, y el resultado es el mismo (disparo múltiple [T_{1}T_{2}]).","b":"2do parcial","n":"En 2021 respondieron \"cuando no pueden realizarse transiciones de tokens hacia otra plaza\" y sacaron 0. El comentario es la respuesta textual: \"Cuando dos transiciones en conflicto pueden ser disparadas en cualquier secuencia o simultáneamente\"."},
{"id":"p2:persistencia","tema":"Conflicto, concurrencia y prioridades","src":"2023","ex":true,"q":"¿Qué entiende por persistencia (conflicto) en una Red de Petri?","o":[["Que el disparo de una transición habilitada nunca deshabilita a otra habilitada.","Correcta."],["Que una transición, una vez habilitada, dispara infinitas veces.","No: eso se parece a la vivacidad."],["Que el marcado de una plaza nunca cambia.","No: eso sería un invariante trivial."],["Que la red vuelve siempre al marcado inicial.","No: eso es reversibilidad."]],"c":0,"r":"Una red es **persistente** si, para cada marca alcanzable, dos transiciones habilitadas cualesquiera pueden dispararse **en cualquier secuencia**: el disparo de una **no deshabilita** a la otra. Una transición habilitada sólo deja de estarlo **por su propio disparo**.\n\nLa respuesta que aceptó la cátedra en 2023 fue: \"Cuando dos transiciones pueden ser disparadas en cualquier secuencia o simultáneamente\".\n\nUna red sin conflicto estructural es persistente para cualquier M_{0}.","b":"2do parcial"},
{"id":"p2:conflicto-efectivo-solucion","tema":"Conflicto, concurrencia y prioridades","src":"2020, 2023, capturas","ex":true,"q":"¿Cómo solucionamos el problema del conflicto efectivo en un conjunto de transiciones?","o":[["Con una política de prioridades que resuelva el orden de disparo de esas transiciones.","Correcta: es el comentario de la cátedra."],["Con un arco inhibidor.","No: esa respuesta sacó 0 en 2023."],["Agregando más marcas hasta que alcancen para todas.","No: eso cambia el modelo y puede romper otras propiedades."],["No tiene solución: el conflicto efectivo es un deadlock.","No: un conflicto no es un deadlock."]],"c":0,"r":"Con una **política** que decida cuál de las transiciones en conflicto se dispara: por ejemplo, una **política de prioridades** que resuelva el orden de ejecución de ese conjunto. También puede ser por turnos o probabilidades.\n\nEn la implementación, es lo que hacen las políticas de las colas de condición del monitor: entre las transiciones sensibilizadas con hilos esperando, eligen a cuál despertar.","b":"2do parcial","n":"En 2023 respondieron \"mediante un arco inhibidor\" y sacaron 0. Comentario: \"Se puede establecer una política de prioridades que resuelva el orden de ejecución de este conjunto de transiciones\". Aunque un inhibidor puede modelar una prioridad, lo que espera la cátedra es \"política de prioridades\"."},
{"id":"p2:prioridades-cuando","tema":"Conflicto, concurrencia y prioridades","src":"2020, resumen","ex":true,"q":"¿Cuándo usamos prioridades para el disparo de un conjunto de transiciones?","o":[["Cuando varias transiciones en conflicto están sensibilizadas y hay que elegir cuál dispara.","Correcta."],["Cuando ninguna transición está sensibilizada.","No: en ese caso no hay nada que elegir (es un deadlock)."],["Siempre, en cualquier red.","No: sin conflicto no hace falta."],["Cuando la red no está acotada.","No: la prioridad no resuelve la acotación."]],"c":0,"r":"Cuando hay **varias transiciones sensibilizadas a la vez y en conflicto** (efectivo), y hay que **elegir cuál** de ellas se dispara. La prioridad reduce el no determinismo: de entre las que cumplen la condición de sensibilización, dispara **la de mayor prioridad**.","b":"2do parcial"},
{"id":"p2:prioridad-orden","tema":"Conflicto, concurrencia y prioridades","src":"apunte (filmina de abreviaturas y extensiones)","ex":false,"q":"En una RdP con prioridades, ¿qué transiciones necesitan estar ordenadas entre sí?","o":[["Las que pueden estar en conflicto, porque compiten por las mismas fichas.","Correcta: por eso alcanza con un orden parcial."],["Todas: la prioridad es un orden total sobre las transiciones.","No: no tiene sentido ordenar transiciones que nunca compiten."],["Sólo las transiciones fuente.","No."],["Las que están en un mismo T-invariante.","No: estar en el mismo ciclo no las pone en conflicto."]],"c":0,"r":"Una RdP con prioridades es una red de Petri más una **relación de orden parcial** sobre sus transiciones. Cuando varias transiciones de un mismo conflicto están habilitadas, dispara la de **mayor** prioridad.\n\nEs parcial porque sólo hace falta comparar las transiciones que **compiten**. En el ejemplo de la filmina hay dos conflictos, ⟨P_{1}, {T_{1}, T_{2}}⟩ y ⟨P_{2}, {T_{2}, T_{3}, T_{4}}⟩, y se ordena dentro de cada uno: T_{2} < T_{1} y T_{4} < T_{2} < T_{3}. No tiene sentido ordenar transiciones que nunca están en conflicto.\n\nEn el **puente de una sola mano** entra un auto por vez. El lugar puente libre es un recurso con un conflicto entre entra desde L y entra desde R, y la prioridad se la da a los que esperan en L. Ahí se puede dibujar una red equivalente sin prioridades, agregando lugares de control. Pero en general las prioridades sí aumentan el poder de modelado.","b":"2do parcial"},
{"id":"p2:inhibidor-prod-mas","tema":"Conflicto, concurrencia y prioridades","src":"2021 (x2)","ex":true,"q":"Con un arco inhibidor, ¿puede controlar la prioridad en una red que comparte un recurso? Explique cómo controla la prioridad para que un **productor** tenga **más** prioridad que un **consumidor**.","o":[["Con un arco inhibidor desde la plaza del productor que espera hacia la transición de entrada del consumidor.","Correcta."],["Con un arco inhibidor desde la plaza del consumidor hacia la transición de entrada del productor.","No: \"justamente al revés\"; así tiene más prioridad el consumidor."],["Con un arco inhibidor desde el buffer hacia el productor.","No: así se bloquearía al productor cuando hay elementos."],["No se puede: los inhibidores no sirven para prioridades.","No: los inhibidores y los lectores permiten modelar prioridades."]],"c":0,"r":"**Sí.** Se coloca un **arco inhibidor desde la plaza del productor** (la que indica que el productor está esperando para tomar el recurso) **hacia la transición de entrada del consumidor**.\n\nMientras haya un productor esperando (marca en su plaza), la transición del consumidor **no está sensibilizada**: el recurso se lo lleva el productor. El consumidor sólo puede entrar cuando no hay productores esperando.","b":"2do parcial","n":"En 2021 respondieron \"de la plaza del consumidor a la transición de entrada del productor\" y el comentario fue \"**Justamente al revés**\": así se le da más prioridad al consumidor. Otra respuesta que sólo explicaba la idea sacó 1 con el comentario \"¿Y cómo lo implemento?\": nombrá de qué plaza a qué transición va el arco."},
{"id":"p2:inhibidor-prod-menos","tema":"Conflicto, concurrencia y prioridades","src":"2020 (x2)","ex":true,"q":"Con un arco inhibidor, ¿puede controlar la prioridad en una red que comparte un recurso? Explique cómo controla la prioridad para que un **productor** tenga **menos** prioridad que un **consumidor**.","o":[["Con un arco inhibidor desde la plaza del consumidor hacia la transición de entrada del productor.","Correcta."],["Con un arco inhibidor desde la plaza del productor hacia la transición de entrada del consumidor.","No: así el que tiene prioridad es el productor."],["Con un arco lector desde el buffer hacia el consumidor.","No: eso no le quita el recurso al productor."],["Aumentando el peso del arco del productor.","No: el peso no establece prioridad."]],"c":0,"r":"**Sí.** En un productor/consumidor se coloca un **arco inhibidor desde la plaza del consumidor** (consumidor esperando) **hacia la transición de entrada del productor**.\n\nMientras haya un consumidor esperando, el productor no puede tomar el recurso: el consumidor tiene prioridad.","b":"2do parcial","n":"En 2020 la respuesta sacó 1, pero el comentario aclaró: \"en un productor consumidor se coloca un arco inhibidor entre la plaza del consumidor a la transición de entrada del productor\". Es la versión simétrica de la pregunta de 2021."},
{"id":"p2:lector-prioridad","tema":"Conflicto, concurrencia y prioridades","src":"2021","ex":true,"q":"¿Se puede controlar la prioridad con un arco lector?","o":[["Sí, con una plaza de control unida por un arco lector a la transición que se quiere priorizar.","La plaza funciona como un permiso que no se consume."],["No, para eso hace falta un arco inhibidor.","El inhibidor es una opción, pero el lector también sirve."],["No, el arco lector no afecta la sensibilización.","Sí la afecta, porque exige que haya marca en la plaza."],["Sí, porque el lector vacía la plaza de las otras transiciones.","El que vacía es el arco reset."]],"c":0,"r":"**Sí**, colocando una **plaza de control con un arco lector asociado a la transición que se quiere priorizar**. El arco lector condiciona el disparo a la presencia de una marca en la plaza de control **sin consumirla**, así que esa plaza funciona como un permiso o turno que el resto de la red administra.\n\nComo el inhibidor, el arco lector es una de las extensiones que permiten modelar prioridades.","b":"2do parcial","n":"En 2021 respondieron \"No, porque sensibilizaría a ambas transiciones... se necesita un arco inhibidor\" y sacaron 0. Comentario: \"Sí, colocando una plaza de control con un arco lector asociado a la transición que deseamos priorizar\"."},
{"id":"p2:confusion","tema":"Conflicto, concurrencia y prioridades","src":"apunte","ex":false,"q":"¿Qué describe la confusión en una RdP?","o":[["Cuando el orden entre transiciones concurrentes cambia qué conflictos aparecen.","Correcta: es la confusión (en este caso, asimétrica)."],["Cuando dos transiciones comparten un lugar de salida.","No: compartir un lugar de salida no genera conflicto."],["Cuando la red tiene arcos inhibidores y lectores a la vez.","No."],["Cuando dos plazas tienen el mismo nombre.","No."]],"c":0,"r":"Es la **mezcla de conflicto y concurrencia**, que hace difícil razonar sobre cada uno por separado.\n- **Simétrica**: t_{1} y t_{3} son concurrentes, y las dos están en conflicto con una t_{2} que comparte un lugar con cada una. Disparar t_{1} deshabilita a t_{2}, aunque t_{1} y t_{3} \"no tenían nada que ver\".\n- **Asimétrica**: t_{1} es concurrente con t_{2}, y t_{2} entra en conflicto con t_{3} sólo si t_{1} dispara antes. El **orden** entre dos transiciones concurrentes cambia qué conflictos aparecen.","b":"2do parcial"},
{"id":"p2:grafo-acotada","tema":"Análisis: grafo, invariantes, sifones","src":"2020, 2021, 2023","ex":true,"q":"Sobre el grafo de marcado, ¿cómo se verifica que la red es acotada?","o":[["Se busca, en todos los nodos, el máximo de marcas de cada plaza: si existe una cota, es acotada.","Correcta."],["Se cuenta la cantidad de arcos del grafo.","No: los arcos son disparos, no dicen cuántas marcas hay."],["Se verifica que no haya ciclos.","No: una red acotada puede tener ciclos."],["No se puede: el grafo de marcado no sirve para eso.","No: la respuesta \"No\" sacó 0 en 2020."]],"c":0,"r":"**Sí.** El grafo de marcado (de accesibilidad) contiene todas las marcas alcanzables y todos los disparos posibles, así que sobre él se leen las propiedades de comportamiento.\n\n**Acotada**: se recorren **todos los nodos** (marcas) y, para cada plaza, se busca el **máximo** número de marcas. Si el grafo es finito y ese máximo existe para todas las plazas, la red es **k-acotada**, con k el mayor de esos máximos. (Si al construirlo aparece ω en el árbol de cobertura, la red no está acotada.)","b":"2do parcial","n":"En 2020 respondieron \"No, porque sólo sabemos que la cantidad de arcos de entrada y salida de una plaza es uno\" y sacaron 0, con el comentario \"Sí, se realiza la suma de token para todos los estados y se verifica que no supere un valor\". En 2023, una respuesta con la definición de acotada sacó 1, pero con el comentario \"¿Y cómo veo si es acotada en el grafo?\": decí el procedimiento sobre los nodos del grafo."},
{"id":"p2:grafo-segura","tema":"Análisis: grafo, invariantes, sifones","src":"2020 (x2), 2021","ex":true,"q":"¿Cómo se verifica con el grafo de marcado que una red es segura?","o":[["Comprobando que en ninguna marca del grafo una plaza tiene más de una marca.","El grafo contiene todas las marcas alcanzables."],["Comprobando que el grafo no tiene ciclos.","Una red segura puede tener ciclos."],["Buscando un nodo sin arcos de salida.","Eso detecta un interbloqueo."],["No se puede, hace falta el árbol de cobertura.","Si la red es acotada, el grafo de marcado alcanza."]],"c":0,"r":"**Sí.** El grafo de marcado contiene todas las marcas alcanzables.\n\n**Segura**: se recorren todos los nodos y se verifica que **en ninguna marca alguna plaza tenga más de una marca** (todas las componentes de todas las marcas son 0 o 1).","b":"2do parcial"},
{"id":"p2:grafo-interbloqueo","tema":"Análisis: grafo, invariantes, sifones","src":"2021","ex":true,"q":"¿Cómo aparece un interbloqueo en el grafo de marcado?","o":[["Como un nodo alcanzable sin arcos de salida.","Desde esa marca no se puede disparar ninguna transición."],["Como un ciclo en el grafo.","Un ciclo indica que se puede repetir una secuencia, no que se traba."],["Como un nodo con muchos arcos de entrada.","Que se llegue de muchas formas no lo traba."],["Como una marca con todos los tokens en una sola plaza.","Puede ser una marca muerta o no, depende de las transiciones."]],"c":0,"r":"**Sí.** Un interbloqueo es una marca desde la que no se puede disparar ninguna transición: en el grafo es un **nodo sin arcos de salida** (un punto muerto, o marca sumidero). Si existe un nodo alcanzable así, la red tiene deadlock; si ningún nodo lo es, la red es libre de interbloqueo.","b":"2do parcial"},
{"id":"p2:grafo-tinv","tema":"Análisis: grafo, invariantes, sifones","src":"2020, capturas","ex":true,"q":"¿Cómo se ve un invariante de transición en el grafo de marcado?","o":[["Como un ciclo: una secuencia de disparos que vuelve al mismo nodo.","Correcta."],["Como un nodo sin arcos de salida.","No: eso es un interbloqueo."],["Como el nodo con más marcas.","No: eso sirve para la acotación."],["No se puede ver en el grafo.","No: la respuesta \"No\" sacó 0."]],"c":0,"r":"**Sí.** Un invariante de transición es un conjunto de disparos que **devuelve la red a la misma marca**. En el grafo se ve como un **ciclo**: un camino que sale de un nodo y vuelve a él. Contando cuántas veces se dispara cada transición a lo largo del ciclo se obtiene el vector del T-invariante (y cumple C · y = 0).","b":"2do parcial","n":"En una captura respondieron \"No, porque sólo sabemos que el total de arcos de entrada como de salida es uno\" y sacaron 0. El comentario fue sólo \"Si\"."},
{"id":"p2:cobertura-w","tema":"Análisis: grafo, invariantes, sifones","src":"recup. 2021 (x2)","ex":true,"q":"En el grafo (árbol) de cobertura, ¿qué representa ω?","o":[["El marcado de una plaza que puede crecer indefinidamente.","Correcta."],["Un vértice del grafo.","No: esa respuesta sacó 0."],["Una marca muerta.","No: un deadlock es un nodo sin sucesores."],["El marcado inicial.","No."]],"c":0,"r":"El **marcado de una plaza que crece indefinidamente** (no acotada). Cuando al construir el árbol aparece una marca que **cubre estrictamente** a una anterior del mismo camino (M' > M), las componentes que crecieron se reemplazan por ω, porque repitiendo ese ciclo pueden crecer sin límite.\n\nGracias a ω el árbol de cobertura **siempre es finito**, incluso si la red no es acotada. Si aparece ω, la red no está acotada.","b":"2do parcial","n":"En el recuperatorio 2021 respondieron \"representa el vértice del grafo\" y sacaron 0."},
{"id":"p2:constante-pinv","tema":"Análisis: grafo, invariantes, sifones","src":"2020 (x2), 2021","ex":true,"q":"La **constante de marcado** de un invariante de plaza (componente conservador), ¿depende de la marca, de la estructura de la red o de ambas?","o":[["De ambas: los pesos salen de la estructura y el valor, de la marca inicial.","Correcta."],["Sólo de la estructura.","No: eso vale para la existencia del invariante, no para el valor de la constante."],["Sólo de la marca inicial.","No: los pesos del invariante salen de la estructura."],["De ninguna: es siempre 1.","No: vale 1 sólo en casos como la exclusión mutua."]],"c":0,"r":"**De ambas.** El invariante es x^{T} · M = x^{T} · M_{0}: la constante es x^{T} · M_{0}. Los pesos x salen de la **estructura** (x^{T} · C = 0), y M_{0} es la **marca inicial**. Con la misma red y otro marcado inicial, el invariante sigue existiendo pero la constante cambia.","b":"2do parcial","n":"No la confundas con la otra pregunta, casi igual: \"**un invariante de plaza** (componente conservador), ¿es dependiente de la marca inicial, de la estructura o de ambas?\". Ahí la respuesta es \"de la estructura\". Acá preguntan por la **constante**, que depende de las dos."},
{"id":"p2:pinv-estructural","tema":"Análisis: grafo, invariantes, sifones","src":"2020, 2021, recup. 2021","ex":true,"q":"Un **invariante de plaza** (componente conservador), ¿es dependiente de la marca inicial, de la estructura de la red o de ambas?","o":[["De la estructura: es una propiedad estructural (x^T · C = 0); el valor de la constante sí depende de M0.","Correcta."],["De la marca inicial.","No: la existencia del invariante no depende de M0."],["De ambas.","Esa es la respuesta para la constante de marcado, no para el invariante."],["De la cantidad de transiciones.","No."]],"c":0,"r":"Depende **exclusivamente de la estructura**: ser componente conservador es una **propiedad estructural**, porque sólo exige que exista un vector x > 0 con x^{T} · C = 0, y C es la matriz de incidencia. Es independiente de la marca inicial.\n\nEl **valor numérico** de la constante sí varía con la marca inicial.","b":"2do parcial","n":"Es la contracara de la pregunta sobre la **constante** de marcado (que depende de ambas). La mejor respuesta, que sacó 1 en el recuperatorio 2021: \"Depende exclusivamente de la estructura de la red. El valor numérico sí variará según la marca inicial, pero la propiedad es de la estructura\"."},
{"id":"p2:cuatro-estaciones","tema":"Análisis: grafo, invariantes, sifones","src":"2020, recup. 2021, capturas","ex":true,"q":"En la red de las cuatro estaciones, ¿qué significa que la suma de marcas de todas las plazas sea siempre 1?","o":[["Que sólo se puede estar en una estación a la vez.","Es una máquina de estado con un único token, y la plaza marcada es la estación actual."],["Que la red tiene un deadlock.","El invariante no dice nada de bloqueos."],["Que cada estación dura lo mismo.","La red no tiene tiempo."],["Que la red no es acotada.","Es al revés. El invariante prueba que es acotada, y además segura."]],"c":0,"r":"Que **sólo se puede estar en una estación a la vez**.\n\nLa red es una máquina de estado con un único token: M(primavera) + M(verano) + M(otoño) + M(invierno) = 1 es un componente conservador, y la plaza que tiene el token es la estación actual.","b":"2do parcial","n":"En una captura respondieron \"componente conservador, el sistema tiene un único estado\" y les dieron 1, pero el comentario fue: \"Que se puede estar en solo una estación a la vez\". Decilo con esas palabras."},
{"id":"p2:matriz-incidencia","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"En una red con plazas P1, P2 y una transición t1 que saca una marca de P1 y pone una en P2, la columna de t1 en C es (−1, +1). Si M = (1, 0), ¿cuál es el marcado después de disparar t1?","o":[["(0, 1)","Correcta: M + C·σ = (1, 0) + (−1, +1)."],["(1, 1)","No: también se resta la marca de P1."],["(2, −1)","No: se sumó la columna con el signo invertido."],["(0, 0)","No: la marca se mueve a P2, no desaparece."]],"c":0,"r":"Es la matriz C = Post − Pre, con una fila por plaza y una columna por transición: C(p, t) es el cambio neto de marcas en p cuando t se dispara (negativo si consume, positivo si produce).\n\nLa **ecuación de estado** da el marcado siguiente: M' = M + C · σ, donde σ es el vector de disparo (un 1 en la transición que se dispara). Para una secuencia completa, σ es el **vector característico**, que cuenta cuántas veces se disparó cada transición.\n\nLa matriz representa al sistema en sí: es lo que se implementa en el monitor (y en el IP-Core de la cátedra).","b":"2do parcial"},
{"id":"p2:ecuacion-vector","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"Si m_{k} = m_{0} + C · s tiene una solución s entera y no negativa, ¿m_{k} es alcanzable?","o":[["No necesariamente, porque la ecuación de estado es una condición necesaria pero no suficiente.","En cada paso la transición tiene que estar efectivamente sensibilizada."],["Sí, siempre.","La aritmética puede cerrar sin que exista una secuencia real."],["Sí, si la red es acotada.","Tampoco alcanza con la acotación."],["No, nunca es alcanzable.","Puede serlo. Simplemente no está garantizado."]],"c":0,"r":"**No necesariamente.** La ecuación de estado es una condición **necesaria** pero no suficiente: que la aritmética cierre no garantiza que exista una secuencia real, porque en cada paso la transición tiene que estar efectivamente sensibilizada.\n\nOtras propiedades del vector característico: secuencias distintas con el **mismo** vector llevan a la **misma** marca; pero dos secuencias que llegan a la misma marca pueden tener vectores distintos.","b":"2do parcial"},
{"id":"p2:pinv-calculo","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"En la red de exclusión mutua, el P-invariante M(P2) + M(P4) + M(mutex) = 1, ¿qué prueba?","o":[["Que nunca hay dos procesos a la vez en la sección crítica.","Correcta: M(P2) + M(P4) ≤ 1."],["Que la red está libre de deadlock.","No: un P-invariante prueba seguridad, no ausencia de deadlock."],["Que ningún proceso sufre inanición.","No: es una propiedad de progreso."],["Que la red es reversible.","No."]],"c":0,"r":"Es un vector de pesos x ≥ 0 sobre las plazas tal que **x^{T} · C = 0**. Por la ecuación de estado, implica x^{T} · M = x^{T} · M_{0} para **toda** marca alcanzable: una suma pesada de marcas que **nunca cambia**. Las plazas con peso positivo forman el **soporte** (componente conservador).\n\nSirve para **probar propiedades de seguridad sin construir el grafo**. En la exclusión mutua, M(P_{2}) + M(P_{4}) + M(mutex) = 1 implica M(P_{2}) + M(P_{4}) ≤ 1: nunca hay dos procesos en la sección crítica. Eso es verificación, no testing.","b":"2do parcial"},
{"id":"p2:tinv","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Qué es un T-invariante?","o":[["Un vector de disparos que, aplicado, devuelve la red a la misma marca.","Correcta."],["Un vector de pesos sobre las plazas cuya suma pesada no cambia.","No: ese es el P-invariante."],["Una transición que nunca se dispara.","No: esa es una transición muerta."],["El conjunto de transiciones sensibilizadas en M0.","No."]],"c":0,"r":"Un **T-invariante** es un vector y ≥ 0 sobre las transiciones con **C · y = 0**: disparar cada transición y_{j} veces deja el marcado **igual** que al empezar.\n\nSi además existe una secuencia disparable con ese vector característico, el conjunto de transiciones con y_{j} > 0 es un **componente repetitivo**: un ciclo que el sistema puede repetir indefinidamente.\n\nLa existencia de un T-invariante es una condición **necesaria, no suficiente**: el álgebra da candidatos, pero hay que verificar que haya una secuencia real.","b":"2do parcial"},
{"id":"p2:sifon-trampa","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"Un sifón de una red queda sin marcas. ¿Qué pasa?","o":[["Queda vacío para siempre, y sus transiciones de salida no vuelven a habilitarse.","Correcta."],["Se vuelve a llenar en cuanto dispare alguna transición de entrada.","No: toda transición de entrada del sifón es también de salida, y necesita marcas del propio sifón."],["Se convierte en una trampa.","No."],["Nada: un sifón vacío no afecta a la red.","No: deja muertas sus transiciones de salida."]],"c":0,"r":"Son conjuntos de plazas, y son conceptos **estructurales**:\n- **Sifón**: •P' ⊆ P'• (toda transición que le da marcas al conjunto también le saca). **Sólo puede perder marcas**: si se vacía, queda vacío **para siempre**, y sus transiciones de salida no vuelven a habilitarse. Un sifón vacío es un problema de diseño permanente.\n- **Trampa**: P'• ⊆ •P' (toda transición que le saca marcas también le da). **Sólo puede ganar marcas**: si tiene al menos una, la conserva para siempre.\n\nLa unión de sifones es un sifón, y la de trampas es una trampa.","b":"2do parcial"},
{"id":"p2:commoner","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Qué dice el teorema de Commoner?","o":[["Que una red de libre elección extendida es viva si cada sifón contiene una trampa marcada.","Así ningún sifón puede vaciarse del todo."],["Que toda red acotada es viva.","La acotación no implica vivacidad."],["Que toda trampa contiene un sifón vacío.","No es el enunciado, y además invierte los papeles."],["Que una red es viva si tiene un T-invariante.","Tener un T-invariante no alcanza para que la red sea viva."]],"c":0,"r":"Una red ordinaria de **libre elección extendida** es **viva** si **cada sifón contiene una trampa marcada** (no deficiente) en el marcado inicial.\n\nLa idea: si todo sifón tiene adentro una trampa que nunca se queda sin marcas, ningún sifón puede vaciarse del todo, y la red nunca pierde la posibilidad de disparar sus transiciones.","b":"2do parcial"},
{"id":"p2:grafo-vs-cobertura","tema":"Análisis: grafo, invariantes, sifones","src":"apunte","ex":false,"q":"¿Por qué el árbol de cobertura pierde información respecto del grafo de marcas?","o":[["Porque ω agrupa infinitas marcas distintas, y no siempre se puede saber si una marca exacta es alcanzable.","Correcta."],["Porque no incluye el marcado inicial.","No."],["Porque sólo sirve para redes seguras.","No: justamente sirve para las no acotadas."],["Porque elimina los ciclos.","No."]],"c":0,"r":"El **grafo de marcas** (de accesibilidad) es exacto, pero sólo es finito si la red es **acotada**; si no, tiene infinitos nodos.\n\nPara redes potencialmente **no acotadas** se usa el **árbol de cobertura**: las componentes que crecen sin límite se marcan con ω, y el árbol **siempre es finito**. El precio es que **pierde información**: no siempre permite responder si una marca exacta es alcanzable. Para una red acotada, el árbol de cobertura coincide con el grafo de marcas.\n\nModelar con redes no elimina la explosión de estados: la **posterga**, porque los invariantes permiten razonar sin construir el grafo.","b":"2do parcial"},
{"id":"p2:acotada-buffer","tema":"Del modelo al programa","src":"2020 (x2), 2023","ex":true,"q":"¿Qué relación tiene que una RdP que modela un sistema sea acotada (o tenga una plaza limitada que modela el buffer) con los buffers del programa que implementa el modelo?","o":[["El buffer que modela esa plaza tiene una capacidad máxima finita, igual a la cota de la plaza.","Correcta."],["Ninguna: la acotación es una propiedad sólo del modelo.","No: es justamente lo que hace implementable al programa."],["El buffer nunca se vacía.","No: acotada dice que no se pasa de un máximo, no que no se vacíe."],["Hay que usar un hilo por cada elemento del buffer.","No."]],"c":0,"r":"Si la red es acotada, todas las plazas tienen una cota k. La plaza que modela un buffer nunca supera k marcas, así que **el buffer del programa no es infinito: tiene una capacidad máxima**, igual a la cota de la plaza. Se puede implementar con memoria finita (por ejemplo, un arreglo de tamaño k) sin desbordarse, y el productor se bloquea cuando se llena.\n\nSi la red no fuera acotada, el buffer crecería sin límite: el modelo no sería implementable con recursos finitos.","b":"2do parcial"},
{"id":"p2:segura-hilos","tema":"Del modelo al programa","src":"2020","ex":true,"q":"Si una RdP es segura y se instancia un hilo por plaza, ¿qué se puede asegurar?","o":[["Que un hilo por plaza alcanza, porque nunca hay dos actividades pendientes en la misma plaza.","No hace falta código reentrante para la acción de una plaza."],["Que el programa no tiene condiciones de carrera.","La seguridad de la red no protege los datos compartidos del código."],["Que hay que crear dos hilos por plaza.","Con a lo sumo una marca por plaza, alcanza con uno."],["Que el programa termina.","La seguridad no dice nada de la terminación."]],"c":0,"r":"Si la red es segura, cada plaza tiene **a lo sumo una marca**. Si cada plaza la atiende un hilo, nunca hay más de una \"actividad\" pendiente en esa plaza, así que **un hilo por plaza alcanza**: nunca se necesitan dos ejecuciones simultáneas de la misma acción (no hace falta código reentrante) y ningún trabajo queda esperando a un hilo libre.\n\nSi la red fuera k-acotada con k > 1, esa plaza podría tener k marcas a la vez: para aprovechar ese paralelismo harían falta hasta k hilos, o el hilo tendría que procesar las marcas de a una.","b":"2do parcial","n":"Esta pregunta quedó sin contestar en el parcial de 2020 que hay en la carpeta, así que no hay comentario de la cátedra: la respuesta modelo está razonada desde la definición de red segura."},
{"id":"p2:secuencia-infinita","tema":"Del modelo al programa","src":"2021, recup. 2021, capturas","ex":true,"q":"¿Qué relación tiene que una RdP que modela un sistema tenga una **secuencia de disparos infinita** con el programa que implementa el modelo?","o":[["El programa no termina: es reactivo (como un SO) y siempre tiene al menos una transición que puede disparar.","Correcta."],["El programa tiene un error: toda secuencia de disparos debe ser finita.","No: los sistemas reactivos no terminan, y eso es lo esperado."],["El buffer del programa es infinito.","No: eso tiene que ver con la acotación, no con la longitud de la secuencia."],["El programa usa infinitos hilos.","No: unos pocos hilos en bucle alcanzan."]],"c":0,"r":"Que el programa **no termina**: es un sistema reactivo, como un sistema operativo o un servidor, cuyos hilos corren en un **bucle infinito**. Para que eso sea posible, **siempre tiene que poder dispararse al menos una transición** (la red no tiene deadlock: hay al menos una transición viva) y la red tiene que tener **ciclos** (T-invariantes) que la devuelvan a marcas ya visitadas.\n\nSi además es acotada, el programa puede correr para siempre con memoria finita.","b":"2do parcial","n":"En el recuperatorio 2021 respondieron sólo \"si o si debe dispararse aunque sea una transición\" y sacaron 0. La misma idea **con el ejemplo del sistema operativo** (\"tiene secuencia de disparos infinita, lo cual implica que sí o sí tiene al menos una transición...\") sacó 1. Desarrollala: programa que no termina, ejemplo, al menos una transición disparable."},
{"id":"p2:mutex-semaforo","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Qué representa en Java un lugar con N fichas que es entrada de las secciones críticas y salida de sus finales?","o":[["El lugar es el semáforo; tomar una ficha es `acquire()` y devolverla es `release()`.","Correcta."],["El lugar es un hilo y las fichas son sus estados.","No."],["El lugar es un `CountDownLatch`.","No: el latch sólo decrementa y no se puede reutilizar."],["No hay relación: las RdP no modelan semáforos.","No: es el ejemplo central del apunte."]],"c":0,"r":"Son el mismo objeto: `new Semaphore(N)` es un lugar con **N fichas**; `acquire()` es la transición de **entrada** (consume una ficha, y no puede dispararse si no hay), y `release()` la de **salida** (devuelve la ficha).\n\nCon N = 1 es la exclusión mutua: el lugar mutex. El P-invariante M(SC_{1}) + M(SC_{2}) + M(recursos) = N es la **prueba** de que el semáforo nunca deja más de N hilos adentro.","b":"2do parcial"},
{"id":"p2:buffer-rdp","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Cómo se modela un buffer acotado de capacidad N?","o":[["Con dos lugares, libres y ocupados, cuya suma es siempre la capacidad.","Correcta."],["Con una transición fuente que produce sin límite.","No: así el buffer no estaría acotado."],["Con un arco reset sobre el buffer.","No."],["Con un solo lugar con N fichas y sin restricciones.","No: falta el lugar complementario que bloquea al productor."]],"c":0,"r":"Con dos lugares complementarios, **libres** y **ocupados**, cuya suma es constante e igual a la capacidad N: M(libres) + M(ocupados) = N. La transición **producir** tiene a \"libres\" como entrada (no puede disparar con el buffer lleno) y **consumir** tiene a \"ocupados\" como entrada (no puede disparar con el buffer vacío).\n\nEl bloqueo del productor y del consumidor **sale solo del modelo**, sin escribir una línea de control. En Java es el `EventStorage` con `wait()`/`notifyAll()`, o dos semáforos (vacíos y llenos) más un mutex.","b":"2do parcial"},
{"id":"p2:filosofos","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"En la versión correcta (tomar los dos tenedores en un solo disparo), ¿qué problema puede seguir habiendo?","o":[["Inanición: dos vecinos pueden turnarse para siempre.","Correcta: para eso hace falta una política."],["Deadlock: todos con un tenedor.","No: el disparo atómico lo impide."],["Dos vecinos comiendo a la vez.","No: lo impide el P-invariante del tenedor compartido."],["Que la red no esté acotada.","No: los invariantes la acotan."]],"c":0,"r":"- **Ingenua** (tomar los tenedores de a uno): si los cinco toman el izquierdo antes de que alguno tome el derecho, queda una marca con cinco fichas en \"con uno\" y **ningún tenedor libre**: ninguna transición está sensibilizada. Es un **deadlock** alcanzable, y el grafo de marcados lo encuentra.\n- **Correcta** (tomar los dos a la vez): una sola transición con tres entradas (pensando, tenedor izq., tenedor der.). Como el disparo es **atómico**, nadie se queda con un tenedor a medias. Los P-invariantes prueban que dos vecinos nunca comen a la vez, y la red no tiene deadlock.\n\nPero **no evita la inanición**: dos vecinos pueden turnarse para siempre. Para eso hace falta una **política** (prioridades, turnos, un monitor).","b":"2do parcial"},
{"id":"p2:barberia","tema":"Del modelo al programa","src":"apunte","ex":false,"q":"¿Qué método de `Semaphore` modela al cliente que se va si no hay banco libre?","o":[["`tryAcquire()`, que no bloquea y devuelve `false` si no hay permiso.","Correcta."],["`acquire()`.","No: el cliente se quedaría esperando un banco."],["`release()`.","No: eso libera un banco."],["`acquireUninterruptibly()`.","No: también bloquea."]],"c":0,"r":"Dos componentes conservadores:\n- M(bancos) + M(esperando) = m: nunca hay más de m clientes esperando. La regla \"si no hay banco, se va\" no es un `if`: es estructural, porque con `bancos` en 0 no se puede sentar.\n- M(barberos libres) + M(cortando) + M(barbero en caja) = n: cobrar le saca un barbero a la tarea de cortar.\n\nEn Java: sala de espera `new Semaphore(m)`, sillones `new Semaphore(n)`, caja `new Semaphore(1)`, y el cliente rechazado con `if (!salaDeEspera.tryAcquire()) { irse(); return; }`.","b":"2do parcial"},
{"id":"p2:sensibilizado-extendido","tema":"Del modelo al programa","src":"filmina (paper ecuación generalizada)","ex":false,"q":"En la ecuación de estado generalizada de la cátedra, ¿cómo se decide si una transición puede dispararse cuando hay arcos inhibidores, lectores, guardas, eventos y tiempo?","o":[["Con la conjunción (AND) de los vectores de sensibilizado por marcado, inhibidores, lectores, guardas, eventos y tiempo.","Correcta."],["Sumando a la matriz de incidencia una matriz por cada tipo de arco.","No: los arcos especiales no se meten en C; se evalúan con matrices aparte y se combinan con AND."],["Disparando todas las transiciones sensibilizadas a la vez.","No: se usa la política de servidor único, de a un disparo."],["Con la disyunción (OR) de las condiciones.","No: tienen que cumplirse todas."]],"c":0,"r":"Se calcula un **vector de sensibilizado extendido** como la **conjunción lógica** (AND) de varios vectores binarios, uno por cada condición:\n- E: sensibilizada por marcado (la ecuación de estado clásica).\n- B: no inhibida por arcos inhibidores.\n- L: habilitada por arcos lectores.\n- G: guardas verdaderas.\n- V: hay eventos en la cola de la transición.\n- Z: el tiempo transcurrido está dentro de la ventana [α, β].\n\nSólo puede dispararse una transición con 1 en todos. El disparo se hace con la ecuación original (salvo el arco reset), y la ventaja es que se implementa como un circuito combinacional (IP-Core en FPGA).","b":"2do parcial"},
{"id":"p2:servidor-unico","tema":"Del modelo al programa","src":"filmina (paper ecuación generalizada)","ex":false,"q":"¿Qué es la política de servidor único?","o":[["Calcular el nuevo estado considerando un solo disparo por vez, y si hacen falta más, una secuencia.","Evita conflictos en el cálculo del estado."],["Tener un solo hilo para toda la red.","Habla de los disparos, no de los hilos."],["Que cada transición tenga un solo arco de entrada.","Es una restricción de estructura, no una política de disparo."],["Disparar todas las transiciones sensibilizadas a la vez.","Es lo contrario."]],"c":0,"r":"Calcular el nuevo estado considerando **un solo disparo de una transición** por vez. Si hacen falta más, se hace una **secuencia** de disparos.\n\nSe usa para **evitar conflictos** en el cálculo: nunca se aplican dos disparos \"a la vez\" que compitan por las mismas marcas. Para que el sistema sea determinístico hacen falta además políticas de selección: prioridades, probabilidades, arcos inhibidores o lectores.","b":"2do parcial"},
{"id":"p2:monitor-def","tema":"Monitores","src":"resumen","ex":true,"q":"¿Qué es un monitor?","o":[["Un módulo de alto nivel que encapsula el estado de un recurso compartido y sus procedimientos, ejecutados en exclusión mutua y con sincronización por condición.","Correcta."],["Un contador entero con dos operaciones, wait y signal.","No: eso es un semáforo."],["Un hilo que vigila a los demás hilos.","No."],["Una plaza de una red de Petri.","No."]],"c":0,"r":"Un **mecanismo de software de alto nivel** para el control de la concurrencia: un módulo de abstracción que **encapsula** los datos (las variables que representan el estado del recurso) y los procedimientos necesarios para asignar un recurso o grupo de recursos compartidos, reutilizables en serie.\n\nSe cumple que **todos sus métodos se ejecutan en exclusión mutua**, y define la **sincronización por condición** de cada método (bloquear al proceso hasta que se cumpla la condición y avisarle cuando puede seguir). Lo presentó Dijkstra (1971) y lo refinaron Brinch Hansen (1973) y Hoare (1974).","b":"2do parcial"},
{"id":"p2:elementos-monitor","tema":"Monitores","src":"resumen","ex":true,"q":"¿Cuáles son los elementos que componen un monitor?","o":[["Variables permanentes, código de inicialización, procedimientos internos y procedimientos exportados.","Correcta."],["Un contador, una cola y dos operaciones atómicas.","No: eso describe un semáforo."],["Plazas, transiciones y arcos.","No: son los elementos de una RdP."],["Sólo métodos `synchronized`.","No."]],"c":0,"r":"- Las **variables locales permanentes**, que almacenan el estado interno del recurso.\n- El **código de inicialización** (constructor).\n- Los **procedimientos internos**, que manejan las variables permanentes.\n- La declaración de los **procedimientos exportados**, que son los que pueden llamar los procesos activos.\n\nPara funcionar, además, usa una **cola de entrada** (mutex) y **variables de condición** con sus colas.","b":"2do parcial"},
{"id":"p2:metodos-monitor","tema":"Monitores","src":"recup. 2021","ex":true,"q":"¿Cómo deben ejecutarse los métodos de un monitor?","o":[["En exclusión mutua.","Correcta."],["Dentro del monitor y no fuera.","No: esa respuesta sacó 0."],["En paralelo, para aprovechar los núcleos.","No: se excluyen entre sí."],["En el orden en que fueron declarados.","No."]],"c":0,"r":"**En exclusión mutua**: un solo proceso a la vez puede estar ejecutando un método del monitor (cualquiera de ellos). Si otro proceso intenta entrar, el código de acceso lo bloquea y lo manda a la **cola de entrada**; cuando el proceso activo sale, el monitor desbloquea al primero de la cola.\n\nAdemás, cada método tiene su **sincronización por condición**: si no se cumple, el proceso se bloquea en una cola de condición y libera el monitor.","b":"2do parcial","n":"En el recuperatorio 2021 respondieron \"deben ejecutarse dentro del mismo y no fuera\" y sacaron 0. La palabra clave es **exclusión mutua**."},
{"id":"p2:acciones-afuera","tema":"Monitores","src":"2021 (x2)","ex":true,"q":"Las acciones que implementan operaciones sobre los recursos, ¿se realizan adentro o afuera del monitor? ¿Por qué?","o":[["Afuera, para liberar el monitor y no serializar todas las acciones.","Correcta: es el comentario textual de la cátedra."],["Adentro, porque el monitor administra los recursos.","No: sacó 0 en 2021."],["Adentro, para garantizar la exclusión mutua de la acción.","No: el monitor garantiza el acceso; la acción va afuera."],["Es indistinto.","No."]],"c":0,"r":"**Afuera** del monitor, con el fin de **liberar el monitor** permitiendo el acceso a otros hilos y **no serializar todas las acciones** posibles.\n\nEl monitor sólo decide si el hilo puede avanzar (dispara la transición, actualiza el estado) y lo deja salir. La acción en sí (imprimir, producir, usar el recurso) se hace fuera; si se hiciera adentro, mientras un hilo trabaja nadie más podría ni siquiera consultar el estado, y se perdería todo el paralelismo.","b":"2do parcial","n":"En 2021 respondieron \"adentro, porque el monitor es el que administra los recursos\" y sacaron 0. El comentario es la respuesta textual: \"Se realizan afuera del monitor, con el fin de liberar el monitor permitiendo el acceso y no serializar todas las acciones posibles\"."},
{"id":"p2:variables-condicion","tema":"Monitores","src":"2021, 2023, capturas","ex":true,"q":"¿Qué función cumplen las variables de condición en un monitor?","o":[["Hacer esperar a un proceso hasta que se cumpla una condición del monitor, y despertar a los que esperaban por ella.","Correcta."],["Indicar si el proceso tiene que dormirse o ejecutarse.","No: esa respuesta sacó 0 en 2021."],["Garantizar la exclusión mutua de los métodos.","No: eso lo hace la cola de entrada (el mutex)."],["Guardar el estado del recurso.","No: eso lo hacen las variables permanentes."]],"c":0,"r":"Dos funciones:\n- **Hacer esperar** a un proceso hasta que se cumpla una condición sobre el estado del monitor. Con `wait`, el proceso queda dormido en la cola asociada a la variable y **libera el monitor**.\n- **Despertar** a un proceso que estaba esperando por esa condición. Con `signal`, si la cola no está vacía se despierta al primero (qué pasa después depende de la política); si está vacía, no pasa nada.\n\nSon \"contenedores\" de hilos que esperan una determinada condición.","b":"2do parcial","n":"En 2021, \"nos indica si el proceso tiene que irse a dormir a una cola asociada o se debe ejecutar\" sacó 0. En 2023, \"hacer esperar a un proceso hasta que una condición del estado del monitor se cumpla; también despierta a procesos que estaban esperando por su causa\" sacó 1. Nombrá las **dos** funciones."},
{"id":"p2:transiciones-varcond","tema":"Monitores","src":"recup. 2021","ex":true,"q":"¿Cómo se relacionan las transiciones (de la RdP) con las variables de condición en un monitor?","o":[["Hay una relación biunívoca: cada transición tiene su variable de condición.","Correcta."],["Cada variable de condición representa una plaza.","No: representa una transición."],["No tienen relación.","No."],["Todas las transiciones comparten una única variable de condición.","No: eso es lo que pasa con `wait`/`notify` de Java, y por eso hace falta `notifyAll`."]],"c":0,"r":"Es posible establecer una **relación biunívoca**: una representa a la otra. Cada transición tiene su variable de condición (su cola). Un hilo que quiere disparar una transición que no está sensibilizada se duerme en la cola de **esa** transición; cuando la transición se sensibiliza, el monitor despierta a un hilo de esa cola.","b":"2do parcial","n":"En el recuperatorio 2021 se explicó la analogía entre recursos y sensibilización y sacó 0. Lo que pedía la cátedra es la palabra **biunívoca**: una representa a la otra."},
{"id":"p2:politicas-reactivacion","tema":"Monitores","src":"2021 (x2), recup. 2021, 2023","ex":true,"q":"¿Qué resuelven las políticas de reactivación de un monitor (entrada, waiting, cortesía)?","o":[["La secuencia de acceso al monitor.","Correcta."],["Los conflictos modelados por la RdP.","No: eso lo resuelven las políticas de las colas de condición. Sacó 0 acá."],["La concurrencia y los conflictos.","No: sacó 0 en 2021."],["El tamaño de las colas.","No."]],"c":0,"r":"Resuelven **la secuencia de acceso al monitor**: cuando el monitor se libera, a quién se le da entre los hilos de la **cola de entrada**, los de las **colas de condición** (waiting) que fueron señalizados y el de la **cola de cortesía** (urgente). Se definen por las prioridades relativas de esas colas.","b":"2do parcial","n":"Atención: \"resuelven los conflictos modelados por la RdP\" sacó 0 (recuperatorio 2021) y \"resuelven la concurrencia y los conflictos\" también (2021). Eso es lo que resuelven las políticas de las **colas de condición**. Las de **reactivación** resuelven **la secuencia de acceso al monitor**."},
{"id":"p2:politicas-condicion","tema":"Monitores","src":"2021","ex":true,"q":"¿Qué resuelven las políticas de las colas de condición (transiciones) en un monitor?","o":[["Los conflictos modelados por la RdP.","Correcta."],["La secuencia de acceso al monitor.","No: eso lo resuelven las políticas de reactivación."],["El deadlock de la red.","No: una política no arregla un deadlock del modelo."],["La acotación de las plazas.","No."]],"c":0,"r":"Resuelven **los conflictos modelados por la RdP**. Cuando hay varias transiciones sensibilizadas con hilos esperando en sus colas, la política **elige cuál disparar**, es decir, a qué hilo despertar.","b":"2do parcial","n":"Es la contracara de las políticas de **reactivación** (entrada-waiting-cortesía), que resuelven la secuencia de acceso al monitor. No las confundas."},
{"id":"p2:cola-cortesia","tema":"Monitores","src":"recup. 2021, capturas","ex":true,"q":"¿Cuál es el objetivo de implementar una cola de cortesía en un monitor?","o":[["Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado, por encontrarse urgido.","Correcta: es la frase de la cátedra."],["Encolar a los hilos que llegan mientras hay uno activo.","No: esa es la cola de entrada. Sacó 0."],["Dormir a los hilos cuya transición no está sensibilizada.","No: esas son las colas de condición."],["Darles prioridad a los hilos nuevos.","No: es al revés."]],"c":0,"r":"**Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado, por encontrarse urgido.**\n\nCuando el hilo que está en el monitor despierta a otro (signal), le cede el monitor y se queda esperando en la cola de cortesía, que tiene **prioridad sobre la cola de entrada**. Así el despertado encuentra la condición tal como se la dejaron, y no se la gana un hilo nuevo (lo que podría postergarlo indefinidamente).","b":"2do parcial","n":"En una captura describieron la cola de entrada (bloquear al que llega mientras hay un proceso activo) y sacaron 0. El comentario es la frase textual: \"Ceder el tiempo de procesamiento restante del hilo activo al hilo despertado por encontrarse urgido\"."},
{"id":"p2:semaforo-debilidades","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Cuál es la principal crítica a los semáforos que motiva los monitores?","o":[["Que las primitivas quedan esparcidas por el código y olvidar una puede corromper el sistema.","Correcta."],["Que son más lentos que cualquier otro mecanismo.","No: la crítica es de diseño, no de velocidad."],["Que no sirven para la exclusión mutua.","No: sí sirven (semáforo binario)."],["Que sólo permiten un hilo a la vez.","No: un semáforo de N permisos deja pasar N."]],"c":0,"r":"- La **omisión** de una primitiva (un `signal` olvidado) puede corromper todo el sistema.\n- El control de la concurrencia es **responsabilidad del programador**.\n- Las primitivas quedan **esparcidas** por todo el sistema: el código de sincronización está repartido entre los procesos, y es difícil de mantener.\n- La sección crítica y la sincronización usan **las mismas primitivas**, y cuesta distinguirlas.\n- No se puede restringir el tipo de operación sobre el recurso.\n\nEl monitor **centraliza** todo en una sola estructura de alto nivel.","b":"2do parcial"},
{"id":"p2:signal-politicas","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿En qué política el proceso que señaliza se bloquea, pero es el primero en recuperar el mutex cuando lo libera el despertado?","o":[["Signal and Urgent Wait.","Correcta: es la que usa la cola de cortesía (urgente)."],["Signal and Continue.","No: ahí el que señaliza no se bloquea."],["Signal and Wait.","No: ahí compite de nuevo, sin prioridad."],["Signal and Exit.","No: ahí el que señaliza sale del método."]],"c":0,"r":"- **Signal and Continue (SC)**: el que señaliza **mantiene** el mutex y sigue; el despertado compite por el mutex. No hace falta cola de cortesía.\n- **Signal and Wait (SW)**: el que señaliza se **bloquea** y compite de nuevo por el mutex; el despertado lo toma y sigue.\n- **Signal and Urgent Wait (SU)**: el que señaliza se bloquea, pero es **el primero** en conseguir el mutex cuando el despertado lo libera (cola de cortesía o urgente).\n- **Signal and Exit (SX)**: el que señaliza **sale** del método, y el despertado toma directamente el mutex.","b":"2do parcial"},
{"id":"p2:signal-continue","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"Con la política Signal and Continue, ¿hace falta una cola de cortesía?","o":[["No, el que señaliza sigue ejecutando, así que nunca queda esperando.","Los señalizados pasan a la cola de entrada."],["Sí, para el hilo que señaliza.","El que señaliza no pierde el monitor."],["Sí, para los hilos señalizados.","Los señalizados van a la cola de entrada, no a una de cortesía."],["Sólo si hay más de una variable de condición.","La cantidad de condiciones no cambia la respuesta."]],"c":0,"r":"**No.** La señalización no hace que el hilo que señaliza pierda el monitor: sigue ejecutando. Los hilos señalizados se mueven a la **cola de entrada**, con más prioridad que los que esperaban para entrar. Como el que señaliza nunca queda esperando, no hay nadie a quien poner en una cola de cortesía.","b":"2do parcial"},
{"id":"p2:monitor-prioridad-espera","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Por qué el monitor debe darle prioridad a un proceso que esperaba un recurso sobre los procesos nuevos que piden entrar?","o":[["Para evitar que lo posterguen indefinidamente.","Correcta."],["Para garantizar la exclusión mutua.","No: la exclusión mutua la da el mutex, sin importar el orden."],["Para que la red sea acotada.","No."],["Para que el monitor ejecute más rápido.","No."]],"c":0,"r":"Para asegurar que el proceso que espera **obtenga** el recurso. Si los procesos nuevos de la cola de entrada pudieran tomarlo antes, el que esperaba podría ser postergado una y otra vez: **postergación indefinida** (inanición). Por eso las colas de condición y de cortesía tienen prioridad sobre la de entrada.","b":"2do parcial"},
{"id":"p2:gestor-monitor","tema":"Monitores","src":"filmina (diagrama de secuencia del monitor)","ex":false,"q":"En el monitor de la cátedra, ¿qué representa m = Vs AND Vc?","o":[["Las transiciones que están sensibilizadas y además tienen hilos esperando en su cola.","Correcta."],["Las transiciones que acaban de dispararse.","No."],["Los hilos que están en la cola de entrada.","No: Vc es por transición, de las colas de condición."],["El nuevo marcado de la red.","No: el marcado se actualiza con la ecuación de estado."]],"c":0,"r":"1. El hilo toma el **mutex** del monitor (`acquire`).\n2. Intenta **disparar** la transición en la RdP: k = rdp.disparar(t).\n3. **Si disparó** (k verdadero): calcula Vs (transiciones **sensibilizadas**) y Vc (transiciones con **hilos esperando** en sus colas), y m = **Vs AND Vc**.\n   - Si m ≠ 0, la **política** elige cuál (`cual()`), despierta a un hilo de esa cola (`release`) y el hilo actual **sale del monitor sin liberar el mutex**: lo hereda el despertado. Es **Signal and Exit**: el mutex pasa de mano en mano y nadie de la cola de entrada se cuela.\n   - Si m = 0, nadie puede avanzar: k = false y sale.\n4. **Si no pudo disparar**: libera el mutex y se **duerme en la cola de esa transición** (`acquire` de la cola). Cuando lo despiertan, ya tiene el monitor y vuelve al paso 2.\n5. Al salir del loop, libera el mutex.\n\nLa **lógica** está en la RdP; la **política**, en la clase Políticas; las acciones se hacen afuera.","b":"2do parcial"},
{"id":"p2:monitor-logica-politica","tema":"Monitores","src":"filmina de monitores","ex":false,"q":"¿Qué separa (identifica y gestiona por separado) el monitor que propone la cátedra, y qué decisiones de diseño hay que tomar?","o":[["La lógica (la RdP), la política (las colas) y las acciones.","Correcta."],["Los hilos, los procesos y los núcleos.","No."],["La lectura y la escritura, como un `ReadWriteLock`.","No."],["El código Java y el diagrama UML.","No."]],"c":0,"r":"Separa:\n- La **lógica del sistema** (la RdP: qué puede pasar).\n- La **política del sistema**, que emerge de la relación entre las colas de entrada, de condición y de cortesía, y de las propias colas de condición (qué pasa cuando hay conflicto).\n- Las **acciones** que se ejecutan (fuera del monitor).\n\nDecisiones de diseño: (1) una estructura general para los métodos que implementan las acciones del recurso compartido, (2) qué condición en las colas se requiere para bloquear, y (3) una estrategia para desbloquear cuando hay varios hilos candidatos.","b":"2do parcial"},
{"id":"p2:rdpt-semantica","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Por qué se elige la semántica de tiempo de sensibilización?","o":[["Porque la de tiempo de disparo no permite modelar actividades interrumpibles, como un timeout.","Correcta."],["Porque es la única en la que el disparo tiene duración.","No: es al revés, en la de sensibilización el disparo es instantáneo."],["Porque elimina todos los conflictos.","No."],["Porque no necesita marcado.","No."]],"c":0,"r":"- **Tiempo de sensibilización** (enabling time): el parámetro temporal es el tiempo que pasa desde que la transición queda sensibilizada hasta que se dispara. La retirada y colocación de marcas es **atómica e instantánea**.\n- **Tiempo de disparo** (firing time, semántica de duración): el tiempo pasa **entre** retirar las marcas de entrada y poner las de salida; el disparo no es atómico, tiene duración.\n\nSe elige la de **sensibilización** porque la de disparo **no permite modelar actividades interrumpibles** (timeouts, transferencia asíncrona de control), y eso la descarta para sistemas de tiempo real.","b":"2do parcial"},
{"id":"p2:rdpt-intervalo","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"Una transición con intervalo [2, 5] queda sensibilizada en t = 10. ¿Cuándo puede dispararse?","o":[["Entre t = 12 y t = 15.","Correcta: entre wi + α y wi + β."],["Entre t = 2 y t = 5.","No: el intervalo se cuenta desde que se sensibiliza."],["En cualquier momento después de t = 10.","No: no antes de 12."],["Exactamente en t = 15.","No: eso sería un intervalo puntual."]],"c":0,"r":"Cada transición tiene un **intervalo estático** [α, β]. Si t_{i} empieza a estar sensibilizada en el instante w_{i} y sigue sensibilizada, el disparo se produce **no antes de w_{i} + α y no más tarde de w_{i} + β**.\n- α es el instante de disparo más cercano (**EFT**, earliest firing time).\n- β es el más lejano (**LFT**, latest firing time).\n\nCasos particulares: intervalo puntual [a, a] (tiempo fijo) e intervalo sin restricción [0, ∞), que equivale al formalismo autónomo. Las marcas permanecen en los lugares de entrada durante la espera, y el disparo es instantáneo.","b":"2do parcial"},
{"id":"p2:rdpt-debil-fuerte","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Qué diferencia hay entre la semántica de tiempo débil y la fuerte?","o":[["En la fuerte la transición debe dispararse dentro del intervalo. En la débil no está obligada, pero si dispara, lo hace dentro del intervalo.","La fuerte es la apropiada para tiempo real."],["En la débil la transición está obligada a dispararse.","Es al revés."],["En la débil no hay intervalos de tiempo.","Las dos tienen intervalo. Lo que cambia es si el disparo es obligatorio."],["Son iguales, sólo cambia el nombre.","Difieren en si el disparo es obligatorio."]],"c":0,"r":"- **Fuerte** (strong): hay que indicar específicamente en qué momento y con qué condiciones **se debe** realizar el disparo. Es la apropiada para tiempo real.\n- **Débil** (weak): la transición **no está obligada** a disparar, pero si lo hace, tiene que ser dentro del intervalo. Sirve para acciones que sólo pueden ocurrir en un período, pero que no necesariamente ocurren.\n\nLa débil se puede modelar con la fuerte agregando una transición en conflicto que aborte la ejecución.","b":"2do parcial"},
{"id":"p2:rdpt-tipos","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Qué tipo de transición modela un timeout?","o":[["TIME.","Correcta."],["CODE.","No: CODE modela la ejecución de un código."],["SYCO.","No: SYCO es de disparo inmediato, sin significado temporal."],["Una transición fuente.","No."]],"c":0,"r":"- **CODE**: representan la ejecución de un código o actividad, que empieza cuando la transición se sensibiliza; la etiqueta [α, β] es el tiempo mínimo y máximo de ejecución. Modelan la parte operativa.\n- **TIME**: asociadas a una actividad temporal, como un **timeout** o una activación periódica. Modelan el control y la supervisión temporal.\n- **SYCO**: el resto. No tienen significado temporal: disparo inmediato (intervalo [0, 0]). Modelan sincronizaciones, eventos no temporales y excepciones.","b":"2do parcial"},
{"id":"p2:rdpt-estado","tema":"RdP con tiempo","src":"filmina de RdP temporales","ex":false,"q":"¿Cuál es el estado de una RdP con tiempo?","o":[["El par (M, I), formado por el marcado y los intervalos de disparo de las transiciones sensibilizadas.","Importa cuánto tiempo pasó desde que cada transición se sensibilizó."],["Sólo el marcado.","Con el marcado solo no se sabe si ya se puede disparar."],["Sólo el reloj global.","Falta el marcado."],["El conjunto de transiciones que ya dispararon.","El historial no es el estado."]],"c":0,"r":"Es el par **(M, I)**: el marcado M y el vector I de los intervalos de disparo posibles de todas las transiciones sensibilizadas por M.\n\nNo alcanza con el marcado porque para decidir si una transición puede dispararse importan dos cosas: que esté sensibilizada **y** cuánto tiempo pasó desde que se sensibilizó.\n\nPor eso el grafo de estados de una RdP con tiempo puede ser enorme, o infinito en tiempo continuo. Se resuelve con discretización o con el **grafo de clases de estados** (State Class Graph).","b":"2do parcial"},
{"id":"p2:monitor-tiempo","tema":"RdP con tiempo","src":"filmina (diagrama de secuencia monitor con tiempo)","ex":false,"q":"En el monitor con tiempo de la cátedra, ¿qué hace un hilo que quiere disparar una transición temporal antes de que se abra su ventana de tiempo?","o":[["Libera el mutex, se marca como esperando y duerme hasta que se abra la ventana; después reintenta.","Correcta."],["Dispara igual, porque la transición está sensibilizada.","No: en una RdP con tiempo, además hay que respetar la ventana."],["Duerme dentro del monitor, sin liberar el mutex.","No: bloquearía a todos los demás hilos."],["Descarta la transición para siempre.","No: sólo pasa eso si la ventana ya se cerró."]],"c":0,"r":"Al intentar disparar se verifica la **ventana de tiempo**: α < (ahora − timeStamp) < β, donde timeStamp es el instante en que la transición se sensibilizó.\n- Si está **dentro** de la ventana (y nadie más está esperando esa transición), dispara.\n- Si llegó **antes** de la ventana: **libera el mutex**, se marca como esperando y **duerme** `sleep(timeStamp + α − ahora)`, fuera del monitor. Después vuelve a intentarlo.\n- Si la ventana ya pasó: no dispara (k = false).\n\nDespués de cada disparo se actualizan los timeStamps de las transiciones que quedaron sensibilizadas.","b":"2do parcial","n":"El detalle que importa: el `sleep` se hace **habiendo liberado el mutex**. Si un hilo durmiera dentro del monitor, bloquearía a todos los demás durante la espera."},
{"id":"p2:phaser-init","tema":"Sincronizadores y Executors","src":"2023","ex":true,"q":"¿Con qué valor debe ser inicializada la primitiva PHASER?","o":[["Con la cantidad de participantes que se sincronizan en cada fase.","Correcta."],["Con la cantidad de fases que va a tener.","No: las fases se cuentan solas, a partir de 0."],["Con el tiempo máximo de espera.","No: eso es un parámetro de algunos métodos de espera, no del constructor."],["Con 1, como un semáforo binario.","No: no es un semáforo."]],"c":0,"r":"Con la **cantidad de participantes** (parties) que se sincronizan en cada fase: `new Phaser(n)`. La fase avanza cuando **todos** los participantes registrados llegaron.\n\nTambién se puede crear con 0 y registrar participantes dinámicamente con `register()` (o `bulkRegister(n)`). Cada participante llama a `arriveAndAwaitAdvance()` al terminar su fase, o a `arriveAndDeregister()` para dejar de participar.","b":"2do parcial","n":"En 2023 la dejaron sin responder (un punto) y sacaron 0. Es la única pregunta de Java de los segundos parciales que hay en la carpeta."},
{"id":"p2:phaser-metodos","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"Un participante de un `Phaser` terminó su trabajo y no va a participar en las fases siguientes. ¿Qué método llama?","o":[["`arriveAndDeregister()`.","Correcta."],["`arriveAndAwaitAdvance()`.","No: con ese seguiría registrado y las próximas fases lo esperarían."],["`register()`.","No: eso suma un participante."],["`countDown()`.","No: es un método del `CountDownLatch`."]],"c":0,"r":"- `arriveAndAwaitAdvance()`: el participante avisa que terminó la fase y **espera** a los demás.\n- `arrive()`: avisa que llegó, **sin esperar**.\n- `arriveAndDeregister()`: avisa y **deja de participar**; las fases siguientes esperan a uno menos.\n- `register()` / `bulkRegister(n)`: suma participantes.\n- `getPhase()`: número de fase actual.\n- `onAdvance(phase, registeredParties)`: se ejecuta al cambiar de fase; si devuelve `true`, el phaser **termina**. Por defecto termina cuando no quedan participantes registrados.\n\nA diferencia del `CountDownLatch`, se **reutiliza** fase tras fase, y la cantidad de participantes puede cambiar.","b":"2do parcial"},
{"id":"p2:cyclicbarrier","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"¿Qué distingue a un `CyclicBarrier` de un `CountDownLatch`?","o":[["Que es reutilizable y los hilos que llegan son los mismos que esperan.","Correcta."],["Que protege una sección crítica.","No: ninguno de los dos es exclusión mutua."],["Que no tiene un número fijo de participantes.","No: eso es una característica del `Phaser`."],["Que se decrementa con `countDown()`.","No: eso es del `CountDownLatch`."]],"c":0,"r":"Es un punto de encuentro para **N hilos**: `new CyclicBarrier(n, accion)`. Cada hilo llama a `await()` y se duerme hasta que llegaron los n; entonces se ejecuta la **acción de barrera** (un `Runnable` opcional) y se liberan todos.\n\nDiferencias con el `CountDownLatch`:\n- Es **reutilizable** (cíclica): después de liberar, vuelve a esperar a n hilos.\n- En la barrera **esperan los mismos hilos que llegan**; en el latch, unos esperan (`await`) y otros cuentan (`countDown`).\n- Si un hilo que espera es interrumpido o vence su plazo, la barrera se **rompe** y los demás reciben `BrokenBarrierException`.","b":"2do parcial"},
{"id":"p2:exchanger","tema":"Sincronizadores y Executors","src":"apunte (cookbook cap. 3)","ex":false,"q":"¿Para qué sirve un `Exchanger`?","o":[["Para que dos hilos se esperen e intercambien un objeto.","Correcta."],["Para que N hilos esperen a que ocurran N eventos.","No: eso es el `CountDownLatch`."],["Para cambiar la prioridad de un hilo.","No."],["Para pasar tareas a un pool de hilos.","No: eso es un executor."]],"c":0,"r":"Para que **dos hilos intercambien datos** en un punto de sincronización. Cada uno llama a `exchange(objeto)`: el primero que llega se bloquea hasta que llega el otro, y entonces cada uno recibe el objeto del otro.\n\nEjemplo típico: un productor y un consumidor que intercambian buffers (el productor entrega el lleno y recibe el vacío).","b":"2do parcial"},
{"id":"p2:executor","tema":"Sincronizadores y Executors","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre `shutdown()` y `shutdownNow()`?","o":[["`shutdown()` termina las tareas que ya tiene; `shutdownNow()` descarta las pendientes e interrumpe las que corren.","Correcta."],["`shutdown()` bloquea al que llama hasta que todo termina.","No: no bloquea; para esperar está `awaitTermination()`."],["`shutdownNow()` mata los hilos con `stop()`.","No: los interrumpe; terminan si su código responde a la interrupción."],["Son iguales.","No."]],"c":0,"r":"Es un administrador de un **pool de hilos**. El programador sólo crea las tareas (`Runnable`) y las envía con `execute()`; el executor crea, **reutiliza** y administra los hilos. Con `Executors.newFixedThreadPool(n)` hay como máximo n hilos; si están todos ocupados, la tarea **espera en una cola**. Se ahorra el costo de crear un hilo por tarea y se acota la cantidad de hilos vivos.\n\nHay que **finalizarlo** explícitamente: si no, sigue esperando tareas y el programa no termina.\n- `shutdown()`: no acepta tareas nuevas, termina las que tiene (corriendo y encoladas) y se cierra. No bloquea.\n- `shutdownNow()`: no ejecuta las pendientes (las devuelve en una lista) e interrumpe a las que están corriendo.\n\nUna tarea enviada después del `shutdown()` se rechaza y va al `RejectedExecutionHandler`.","b":"2do parcial"},
{"id":"p2:threadfactory","tema":"Sincronizadores y Executors","src":"apunte","ex":false,"q":"¿Qué es una `ThreadFactory` y qué ventajas da?","o":[["Una interfaz con un método `newThread(Runnable)` que centraliza la creación de hilos.","Correcta."],["Un pool que reutiliza hilos.","No: eso es un executor (que usa una fábrica por dentro)."],["Una clase que hereda de `Thread`.","No: es una interfaz."],["Un sincronizador como el `Phaser`.","No."]],"c":0,"r":"Es la interfaz de Java para aplicar el **patrón Factory** (creacional) a la creación de hilos. Tiene un solo método, `Thread newThread(Runnable r)`, que recibe la tarea y devuelve el hilo que la va a ejecutar.\n\nCentralizar la creación permite crear hilos **personalizados** (nombre, prioridad, daemon, handler de excepciones), **guardar estadísticas** y **validar o limitar** la cantidad de hilos creados. Hay que asegurarse de que **todos** los hilos del programa se creen con la fábrica.\n\nLos executors usan internamente una `ThreadFactory`, y se les puede pasar una propia.","b":"2do parcial"},
{"id":"p2:estr-tabla","tema":"Estructurales, reducción y composición","src":"apunte (filmina de propiedades estructurales)","ex":false,"q":"¿Qué criterio algebraico caracteriza a una red consistente?","o":[["Existe Y > 0 con C · Y = 0.","Correcta: una secuencia con todas las transiciones vuelve exactamente a la marca de partida."],["Existe Y > 0 con C · Y ≥ 0.","No: esa es la repetitiva; puede no volver exactamente a la misma marca."],["Existe X > 0 con X^{T} · C = 0.","No: esa es la conservadora."],["Existe X > 0 con X^{T} · C ≤ 0.","No: esa es la estructuralmente acotada."]],"c":0,"r":"Dependen sólo de la red no marcada (de C), no de M_{0}. X > 0 e Y > 0 significan **todas** las componentes estrictamente positivas.\n- **Estructuralmente acotada**: acotada para **cualquier** M_{0}. Criterio: ∃ X > 0 con **X^{T} C ≤ 0**.\n- **Conservadora**: una suma pesada X^{T} M con X > 0 constante para todo M_{0}. Criterio: ∃ X > 0 con **X^{T} C = 0**. Todos los lugares están cubiertos por P-invariantes, y por eso es acotada.\n- **Repetitiva**: existe M_{0} y una secuencia en la que **cada** transición aparece infinitas veces. Criterio: ∃ Y > 0 con **C Y ≥ 0**.\n- **Consistente**: existe M_{0} y una secuencia con todas las transiciones que vuelve a M_{0}. Criterio: ∃ Y > 0 con **C Y = 0**.\n\nIntuición: si X^{T} C ≤ 0, por la ecuación fundamental X^{T} M ≤ X^{T} M_{0}, así que cada lugar cumple m_{i} ≤ X^{T} M_{0} / x_{i}.","b":"2do parcial","n":"El apunte avisa que la tabla de la filmina tiene signos mal y la reproduce corregida. Si estudiás de la filmina, guiate por la intuición: en la acotada la suma pesada nunca crece (≤ 0) y en la repetitiva la secuencia no le quita fichas a ningún lugar (≥ 0)."},
{"id":"p2:estr-implicaciones","tema":"Estructurales, reducción y composición","src":"apunte (filmina de propiedades estructurales)","ex":false,"q":"¿Qué se puede afirmar de una red viva y estructuralmente acotada?","o":[["Que es conservadora y consistente.","Combina una condición de comportamiento con una estructural."],["Que es segura.","Acotada no significa 1-limitada."],["Que no tiene conflictos.","Puede tener conflictos."],["Que no tiene T-invariantes.","Al contrario, es consistente, así que tiene un T-invariante con todas las transiciones."]],"c":0,"r":"- Toda red **viva** es **repetitiva**.\n- Toda red **viva y acotada** (o viva con un home state) es **consistente**.\n- Toda red **conservadora** es acotada.\n- Una red **viva y estructuralmente acotada** es **conservadora y consistente**.","b":"2do parcial"},
{"id":"p2:farkas","tema":"Estructurales, reducción y composición","src":"apunte (filmina de cálculo de invariantes)","ex":false,"q":"En el ejemplo, ¿qué P-invariante prueba que nunca hay dos procesos en P_{2}?","o":[["m_{2} + m_{3} = 1","Correcta: como m_{3} ≥ 0, m_{2} ≤ 1."],["m_{1} + m_{2} = 2","No: ese invariante permite m_{2} = 2."],["m_{1} + m_{3} = 3","No: ni siquiera es invariante, T_{1} le saca dos fichas a esa suma."],["El T-invariante (1, 1).","No: un T-invariante no acota lugares."]],"c":0,"r":"Eliminación de **Farkas**:\n- Se arma **[I | C]**: la identidad (una fila por lugar) y la matriz de incidencia.\n- Para cada columna de C se combinan, con coeficientes **positivos**, los pares de filas de **signo opuesto** en esa columna, para anularla.\n- Se **eliminan** las filas con valor distinto de cero en esa columna.\n- Al final, la parte izquierda de cada fila es un P-invariante. Se quedan los de soporte mínimo. Para los T-invariantes se hace lo mismo con C^{T}.\n\nEn el ejemplo, C tiene filas P_{1}: (−1, +1), P_{2}: (+1, −1), P_{3}: (−1, +1). En la columna T_{1} se combinan P_{1} + P_{2} y P_{2} + P_{3}:\n- **m_{1} + m_{2} = 2**: la cantidad de procesos es constante.\n- **m_{2} + m_{3} = 1**: el recurso. Implica m_{2} ≤ 1, o sea exclusión mutua.\n\nEl T-invariante es y = (1, 1).","b":"2do parcial"},
{"id":"p2:invariantes-props","tema":"Estructurales, reducción y composición","src":"apunte (filmina de cálculo de invariantes)","ex":false,"q":"Si x1 y x2 son P-invariantes de una red, ¿cuál de estos vectores es necesariamente un P-invariante?","o":[["2·x1 + 3·x2","Correcta: toda combinación lineal con coeficientes no negativos es un P-invariante."],["x1 − x2","No necesariamente: sólo si x1 − x2 ≥ 0 en todas las componentes."],["x1 · x2, componente a componente","No: el producto no es una operación lineal."],["−x1","No: un P-invariante tiene componentes no negativas."]],"c":0,"r":"- Si x_{1} y x_{2} son P-invariantes y α, β son enteros no negativos, **α x_{1} + β x_{2}** también lo es. Si α, β > 0, su soporte es la unión de los soportes. Si x_{1} − x_{2} ≥ 0, también es un P-invariante.\n- **Todo P-invariante es combinación lineal no negativa de P-invariantes mínimos**: los mínimos son una base.\n- En sistemas reales cada P-invariante mínimo suele tener un **significado físico** (un recurso, una estrategia de control), y muchas veces se encuentra **a ojo**.\n\nPara los T-invariantes vale lo mismo. Un **T-invariante mínimo** corresponde a un **proceso que puede repetirse para siempre**, y se identifica ignorando los recursos. Si una secuencia vuelve de M_{0} a M_{0}, su vector de conteo es un T-invariante.","b":"2do parcial"},
{"id":"p2:reduccion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de métodos de reducción)","ex":false,"q":"¿Qué conserva una red obtenida por métodos de reducción?","o":[["Algunas propiedades, como vivacidad, acotación y home state, pero no es equivalente a la original.","No hay que buscarle semántica a la red reducida."],["Todo, es equivalente a la original.","Sólo conserva algunas propiedades."],["Nada, sólo sirve para dibujarla más chica.","Si no conservara propiedades, no serviría para el análisis."],["Sólo la cantidad de lugares.","Justamente elimina lugares."]],"c":0,"r":"Transforman la red en otra **más simple** que **conserva algunas propiedades**: **vivacidad, acotación y home state**. La reducida **no es equivalente**: no hay que buscarle semántica.\n- **Sustitución de un lugar**: se elimina un lugar \"de paso\" fusionando su transición de entrada con la de salida. La condición principal: la **transición de salida no tiene otro lugar de entrada**, así que la ficha siempre sigue de largo.\n- **Lugar implícito**: su marca **nunca** impide el disparo de sus transiciones de salida y se **deduce** del marcado de otros lugares. Se elimina.\n\nSi reduciendo se llega a una red trivial viva, acotada y con home state, la original también lo es.","b":"2do parcial"},
{"id":"p2:ge-fuertemente-conexo","tema":"Estructurales, reducción y composición","src":"apunte (filmina de grafos de eventos)","ex":false,"q":"Un grafo de eventos fuertemente conexo tiene dos secuencias repetitivas mínimas: T1 T2 T3 T4 y T1 T3 T2 T4. ¿Cuántos T-invariantes mínimos tiene?","o":[["Uno, (1, 1, 1, 1): las dos secuencias tienen el mismo vector de conteo.","Correcta."],["Dos, uno por secuencia.","No: el T-invariante cuenta disparos, no el orden."],["Ninguno, porque T2 y T3 son concurrentes.","No: la concurrencia no impide volver al marcado."],["Uno por circuito elemental.","No: eso vale para los P-invariantes del grafo de eventos."]],"c":0,"r":"- A cada **circuito elemental** le corresponde un **P-invariante mínimo**: la suma de las fichas de sus lugares es constante.\n- El **único T-invariante mínimo** es **(1, 1, …, 1)**: toda secuencia repetitiva mínima dispara cada transición la misma cantidad de veces.\n- Es **vivo si y sólo si cada circuito elemental tiene al menos una ficha**.\n\nUn grafo de estado fuertemente conexo tiene las propiedades **duales**: un T-invariante por circuito elemental, un único P-invariante (1, …, 1) y es vivo con al menos una ficha.","b":"2do parcial"},
{"id":"p2:refinamiento-composicion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de estructuración)","ex":false,"q":"Dos subsistemas se sincronizan en una transición común. ¿Cómo se arma el modelo global?","o":[["Fusionando la transición común: es la composición por rendez-vous.","Correcta."],["Fusionando los lugares que representan recursos.","No: esa es la composición por lugares compartidos."],["Reemplazando la transición por un bloque bien formado.","No: eso es refinamiento."],["Agregando un arco inhibidor entre las dos subredes.","No."]],"c":0,"r":"Una sola red armada \"de un tirón\" para un sistema real queda tan grande que se vuelve inutilizable. Se estructura la especificación y se analiza en cada etapa, garantizando que los resultados valgan para el modelo completo.\n- **Refinamiento sucesivo** (descendente): se describe el sistema con una red **simple**, donde cada transición es una operación compleja, y se la analiza. Después se reemplaza cada transición por un **bloque bien formado** (por ejemplo, \"secuencia\" o \"si-entonces-si no\") que **preserva** acotación, vivacidad, etc. El modelo final hereda las propiedades.\n- **Composición por lugares compartidos**: cuando no se puede refinar de arriba hacia abajo, se modelan las partes y se **fusionan** los lugares comunes, típicamente recursos. Según la filmina, mantiene la vivacidad.\n- **Composición por rendez-vous**: se **fusionan** las transiciones comunes que sincronizan a los subsistemas. Según la filmina, mantiene la vivacidad y la acotación.\n\nLa idea de fondo es poder verificar cada pieza por separado.","b":"2do parcial"},
