{"id":"p2:validacion-pipe","tema":"Estructurales, reducción y composición","src":"apunte (filmina de software de análisis)","ex":false,"q":"¿Cuáles son los tres métodos de análisis que usa un software de análisis de RdP?","o":[["Grafo de marcas (o árbol de cobertura), álgebra lineal y reducción.","Correcta."],["Testing, simulación y depuración.","No: esos no prueban propiedades para todas las ejecuciones."],["Sólo el grafo de marcas.","No: también usa invariantes y reducción."],["Expresiones regulares sobre el código.","No: las regex se usan sobre el log de una ejecución, no para validar el modelo."]],"c":0,"r":"La **validación** es el análisis que comprueba las propiedades principales (acotada, viva, reversible…) y propiedades específicas, como la exclusión mutua o los límites de recursos.\n\nUn software de análisis tiene dos partes:\n- **Edición** del modelo, textual o gráfica. La gráfica es más cómoda, pero sólo viable para modelos chicos.\n- **Análisis** con los métodos de la materia: **grafo de marcas** (o árbol de cobertura), **álgebra lineal** (invariantes) y **reducción**.\n\nSuelen traer una **biblioteca** de modelos básicos. La cátedra usa **PIPE**, que clasifica la red (state machine, marked graph, free choice…), analiza el espacio de estados (bounded, safe, deadlock) y calcula los invariantes.","b":"2do parcial"},
{"id":"p2:grafo-eventos-simulacion","tema":"Estructurales, reducción y composición","src":"apunte (filmina de software de análisis)","ex":false,"q":"En un grafo de eventos para simulación (Schruben), ¿qué representa un arco?","o":[["Que la ocurrencia de un evento programa otro, con una condición y/o un retardo opcionales.","Correcta."],["Un lugar con una transición de entrada y una de salida.","No: esa es la subclase de RdP, que es otra cosa."],["El movimiento físico de un cliente entre dos estaciones.","No: el grafo representa la relación de programación entre eventos, no el movimiento."],["Una ficha que pasa de un lugar a otro.","No: este grafo no tiene fichas."]],"c":0,"r":"**No**: es otro uso de la misma expresión, y no hay que confundirlo con la subclase de RdP (cada lugar con una entrada y una salida).\n\nEl grafo de eventos de simulación representa la **lista de eventos futuros** de un modelo de eventos discretos:\n- Cada **nodo** es un **evento**, una transición de estado.\n- Cada **arco** es la **programación** de otro evento, con una **condición** booleana y/o un **retardo** opcionales: \"A programa B dentro de t, si la condición es verdadera\".\n\nPara arrancar hace falta un evento **Run** que inicializa las variables y programa el primer arribo. El problema central son los **eventos simultáneos**: según el orden aparecen trayectorias inválidas, y por eso se pueden **priorizar arcos**.","b":"2do parcial"},
{"id":"p2:grafos-conceptos","tema":"Estructurales, reducción y composición","src":"apunte (filmina de teoría de grafos)","ex":false,"q":"Un grafo conexo tiene 9 arcos y 6 vértices. ¿Cuántos ciclos elementales independientes tiene?","o":[["4","Correcta: 9 − 6 + 1 = 4."],["3","No: 9 − 6 = 3, falta sumar 1."],["15","No: no se suman arcos y vértices."],["6","No: no depende sólo de los vértices."]],"c":0,"r":"- **Cadena**: secuencia de arcos, cada uno con un extremo común con el siguiente, **sin** importar la orientación.\n- **Camino**: cadena que **respeta la orientación**: el extremo final de cada arco es el inicial del siguiente.\n- **Ciclo**: cadena que vuelve al vértice inicial. **Circuito**: camino que vuelve al vértice inicial. Todo circuito es un ciclo, no al revés.\n- **Elemental**: que no repite vértices, salvo el primero, que es también el último.\n- **Conexo**: entre todo par de vértices hay una **cadena**. **Fuertemente conexo**: entre todo par hay un **camino**. Un grafo es fuertemente conexo si y sólo si hay un circuito que pasa por todos los vértices.\n\nEn un grafo conexo, el número de ciclos elementales independientes (el **número ciclomático**) es **|U| − |X| + 1**: arcos menos vértices más uno. Forman una base de la que se obtienen los demás.","b":"2do parcial"},
{"id":"p2:greedy-lazy","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Qué devuelve `re.search(r\"<.*?>\", \"<a>b<c>\")`?","o":[["`<a>`","Correcta: el perezoso se detiene en el primer `>`."],["`<a>b<c>`","No: eso lo devuelve la versión codiciosa."],["`<c>`","No: la búsqueda empieza por la izquierda."],["Nada: el `?` vuelve opcional el patrón.","No: después de un cuantificador, `?` lo vuelve perezoso."]],"c":0,"r":"Los cuantificadores son **codiciosos**: coinciden con la **mayor** cantidad posible. Con un `?` **después** del cuantificador pasan a ser **perezosos**: coinciden con la **menor**.\n- `<.*>` devuelve **toda** la cadena `<a>b<c>`.\n- `<.*?>` devuelve `<a>`.\n\nEn el log, los huecos entre transiciones tienen que ser perezosos, `(.*?)`: uno codicioso salta invariantes enteros.\n\nEn Python `+` es **una o más veces** (cierre positivo) y la alternativa es `|`. En JFLAP, `+` era la unión.","b":"2do parcial"},
{"id":"p2:regex-metacaracteres","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"En Python, ¿qué cadenas reconoce `(ab)+`?","o":[["`ab`, `abab`, `ababab`…: una o más veces `ab`.","Correcta: `+` es el cierre positivo."],["`ab` o la cadena vacía.","No: eso sería `(ab)?`."],["`a` o `b`.","No: en Python la alternativa es `|`. Esa lectura es la del `+` de JFLAP."],["`ab+` literal, con el signo más.","No: para un `+` literal habría que escaparlo con `\\+`."]],"c":0,"r":"- `[abc]`: **un** carácter de la lista en esa posición; `[a-z]` es un rango. `[^ab]`: un carácter que **no** esté en la lista.\n- `{n}`, `{n,}`, `{n,m}`: repetición exacta, al menos n veces, entre n y m veces.\n- `.`: cualquier carácter salvo el salto de línea.\n- `|`: alternativa, el \"o\".\n- `( )`: agrupa y **captura** lo que coincidió.\n- `\\`: escapa un metacarácter; `\\.` es un punto literal.\n- `^` y `$`: comienzo y fin de la cadena o de la línea.\n\nLos cuantificadores son `?` (cero o una vez), `*` (cero o más) y `+` (**una o más**). Ojo con el cambio de notación: en JFLAP y en la teoría, `+` era la **unión**.","b":"2do parcial"},
{"id":"p2:re-funciones","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Qué devuelve `re.match(r\"T1\", \"T0T1\")`?","o":[["`None`: `match` sólo busca al principio, y la cadena empieza con `T0`.","Correcta."],["Una coincidencia con `T1`.","No: eso lo haría `re.search`."],["El número de coincidencias, 1.","No: lo que cuenta es `re.subn`, y cuenta reemplazos."],["La cadena `T0`.","No."]],"c":0,"r":"- `re.match`: busca una coincidencia sólo al **principio** de la cadena.\n- `re.search`: devuelve la **primera** coincidencia en **cualquier** posición.\n- `re.sub`: **reemplaza** todas las coincidencias, sin solaparse.\n- `re.subn`: igual que `sub`, pero devuelve además **cuántos** reemplazos hizo.\n\nPara el log conviene `re.subn`: cada invariante completo se reemplaza por las transiciones intercaladas que capturaron los grupos, y la cuenta dice cuántos invariantes se quitaron en esa pasada. Se repite **hasta que la cuenta sea 0**.","b":"2do parcial"},
{"id":"p2:log-tinv","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Después de quitar todos los invariantes completos del log, ¿qué resto es aceptable?","o":[["Transiciones de invariantes que quedaron a medias al cortar la ejecución.","Correcta."],["Cualquier resto más corto que un invariante.","No: si no es el comienzo de un ciclo en curso, hubo un disparo fuera de lugar."],["Sólo el vacío.","No: al cortar la ejecución es normal que haya ciclos en curso."],["Cualquiera: sólo importa cuántos invariantes se quitaron.","No: el resto es lo que hay que explicar."]],"c":0,"r":"Por la ecuación fundamental, si el log se puede **descomponer en invariantes completos**, la red volvió al marcado inicial.\n- Un script lee el log (`T0T1T3T0T4...`) y aplica una regex que reconoce un invariante **completo** aunque esté **intercalado** con otros.\n- Lo intercalado se captura con grupos perezosos `(.*?)` y se **conserva**. El invariante reconocido se **borra** con `re.subn`, que también dice cuántos reemplazos hizo.\n- Se repite hasta que no haya más coincidencias.\n- El **resto** tiene que explicarse: sólo invariantes a medias al cortar la ejecución. Cualquier otra cosa es un disparo fuera de lugar.\n\nSi hay **varios** T-invariantes, van todos en **una sola** regex.","b":"2do parcial"},
{"id":"p2:una-sola-regex","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Si una red tiene varios T-invariantes, ¿cómo se arma la verificación del log?","o":[["Con una sola regex que tenga todos los invariantes como alternativas.","Correcta."],["Con una regex por invariante, aplicadas de la más larga a la más corta.","No: igual pueden robarse transiciones y dar falsos errores."],["Con una regex por invariante, en paralelo con hilos.","No: el problema es el emparejamiento, no la velocidad."],["Contando cuántas veces aparece cada transición.","No alcanza: el conteo no ve el orden dentro de cada invariante."]],"c":0,"r":"El log es válido: el invariante 2 con un invariante 1 completo (`T0T1T2`) intercalado.\n\nCon regex **separadas**, `T0(.*?)T1(.*?)T2` toma el **primer** `T0`, salta hasta el `T1` y se lleva el `T2` siguiente: le **roba** el `T0` al invariante 2. Queda `T2T0T3`, que la otra regex no reconoce: un **error que no existe**.\n\nCon **una sola**, `T0(.*?)(?:T1(.*?)T2|T2(.*?)T3)`, el motor prueba las dos alternativas a cada largo del hueco: reconoce primero el invariante 2 y después el 1. Resto vacío.","b":"2do parcial"},
{"id":"p2:combinaciones-invariante","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"¿Por qué en la regex del productor/consumidor T3 nunca va antes que T1?","o":[["Porque T3 consume de \"productos\", y la única transición que le pone fichas es T1.","Correcta."],["Porque el mutex impide que el consumidor corra antes que el productor.","No: el mutex protege el buffer, no impone un orden."],["Porque la regex es perezosa.","No: la pereza afecta el largo de los huecos."],["Porque los consumidores se crean después que los productores.","No: el orden de creación no garantiza nada."]],"c":0,"r":"El consumidor puede arrancar apenas hay un producto, después de **T1**. El T2 del productor puede quedar antes, entre o después de T3, T4 y T5:\n- T0 T1 T2 T3 T4 T5\n- T0 T1 T3 T2 T4 T5\n- T0 T1 T3 T4 T2 T5\n- T0 T1 T3 T4 T5 T2\n\nLa regex incluye **todas** como alternativas, con huecos perezosos.\n\nNo hace falta T3 antes de T1 porque la entrada de T3 es \"productos\" y la **única** transición que le pone fichas es **T1**: si arranca vacío, cada T3 tiene antes un T1 con el que emparejarse.","b":"2do parcial"},
{"id":"p2:log-mutex-limite","tema":"Regex: verificar T-invariantes en el log","src":"apunte (actividad de la filmina de expresiones regulares)","ex":false,"q":"En la exclusión mutua con dos procesos, la regex `T0(.*?)T1|T2(.*?)T3` encuentra 2 invariantes y resto vacío en el log `T0T2T1T3`. ¿Qué significa?","o":[["Que el log se descompone en ciclos completos, aunque es imposible porque los dos procesos estarían juntos en la sección crítica.","Quitar T-invariantes no verifica los P-invariantes. Es una condición necesaria, no suficiente."],["Que la ejecución respetó la exclusión mutua.","El log viola la exclusión mutua y aun así se descompone."],["Que hay un error en la regex.","La regex hace lo que tiene que hacer. El que tiene ese límite es el método."],["Que el proceso 2 terminó antes que el 1.","En el log, el proceso 1 sale antes de que salga el 2."]],"c":0,"r":"Para los **dos** logs informa **2 invariantes y resto vacío**. Pero **ninguno es posible**: en `T0T2T1T3` los dos procesos están juntos en la sección crítica, y en `T0T0T1T1` el proceso 1 entra dos veces sin salir.\n\nQuitar T-invariantes del log verifica que la ejecución se descomponga en ciclos completos, pero **no** verifica los P-invariantes (la exclusión mutua) ni que cada disparo estuviera sensibilizado. Es una verificación **necesaria, no suficiente**.","b":"2do parcial","n":"El apunte deja esto como actividad sin respuesta. La respuesta es propia y está probada en Python con el script del apunte."},
{"id":"p2:log-cuidados","tema":"Regex: verificar T-invariantes en el log","src":"apunte (filmina de expresiones regulares)","ex":false,"q":"Una red tiene 12 transiciones y el log es `T0T1T10T2...`. ¿Qué problema tiene buscar `T1`?","o":[["Que también coincide con el comienzo de `T10` y `T11`.","Correcta: hay que separar las transiciones o usar `T1(?!\\d)`."],["Ninguno: el motor distingue los números.","No: compara caracteres, no números."],["Que coincide con `T0`.","No."],["Que hay que escribirla en minúsculas.","No."]],"c":0,"r":"- Huecos **perezosos** en todos lados, nunca `.*`.\n- **Todos** los invariantes y **todas** sus combinaciones de orden en **una sola** expresión.\n- **Conservar lo intercalado**: el reemplazo es la concatenación de los grupos capturados.\n- **Repetir** hasta que `re.subn` no haga más reemplazos.\n- Con más de 10 transiciones, `T1` también coincide con el comienzo de `T10`: usar un separador en el log o `T1(?!\\d)`.","b":"2do parcial"},
{"id":"f:ciclo-diseno","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"En ese camino, ¿dónde se garantiza que nunca haya dos hilos en la sección crítica?","o":[["En la verificación del modelo, con un P-invariante.","Correcta: el invariante lo prueba para todas las marcas alcanzables."],["En el testing, corriendo el programa muchas veces.","No: el testing sólo puede encontrar el error, no garantizar que no existe."],["En el diagrama de clases.","No: el diagrama de clases no describe el comportamiento."],["Subiendo la prioridad del hilo que está en la sección crítica.","No: la prioridad no garantiza nada."]],"c":0,"r":"1. **Entender el problema y modelarlo en UML**: diagramas de clases y de secuencia para identificar los hilos, los recursos compartidos y las interacciones (mensajes asincrónicos para los `start()`, fragmentos `par` y `critical`).\n2. **Modelar con una RdP**: lugares para estados y recursos, transiciones para eventos y acciones, fichas para recursos disponibles.\n3. **Verificar sobre el modelo**, no sobre el código: P-invariantes para la seguridad (exclusión mutua, buffers acotados), grafo de marcado o de cobertura para vivacidad, deadlock y acotación, conflictos para saber dónde hace falta una política, T-invariantes para los ciclos que el sistema repite.\n4. **Implementar** con un monitor que contiene la RdP (la lógica), una cola por transición y una clase de políticas que resuelve los conflictos. Los hilos de Java llaman a `dispararTransicion()` y hacen las acciones **afuera** del monitor.\n5. Si hay restricciones temporales, usar **RdP con tiempo** (ventanas [α, β]).\n6. **Testear** como complemento: puede encontrar errores, pero no garantiza su ausencia.","b":"Integradora"},
{"id":"f:por-que-modelar","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"El error de sincronizar con un `Integer` apareció recién con 100.000 corridas. ¿Qué ilustra?","o":[["Que el testing puede pasar muchas veces sin mostrar un error de concurrencia que existe.","Correcta."],["Que hace falta correr cada programa al menos 100.000 veces.","No: ninguna cantidad de corridas garantiza la ausencia de errores."],["Que los `Integer` son más lentos que los `int`.","No tiene que ver con la velocidad."],["Que el error está en la JVM.","No: el error es de diseño, la llave cambia de identidad."]],"c":0,"r":"- **Dijkstra**: el testing puede confirmar la presencia de errores, nunca su ausencia.\n- **Explosión de estados**: el estado incluye el pc de cada hilo, y la cantidad de interleavings crece exponencialmente. Ningún conjunto de pruebas cubre todos.\n- **Los errores de concurrencia son raros**: en el ejemplo del cine, sincronizar con un `Integer` \"funcionó\" en 10 corridas y falló recién en 100.000. Los `y1`/`y2` estáticos del práctico mostraban `critical = -1` sólo en algunos intercalados. El Therac-25 fue una condición de carrera que el testing no encontró.\n- **El modelo abstrae**: deja afuera datos e interfaz y se queda con la concurrencia, así que se puede analizar de forma **exhaustiva y mecánica**, y con invariantes se prueban propiedades **sin recorrer** los estados.\n\nLímite: la verificación automática general no es computable (problema de la parada), por eso se restringen las propiedades a verificar.","b":"Integradora"},
{"id":"f:safety-liveness-rdp","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"La vivacidad de una RdP, ¿qué tipo de propiedad es?","o":[["De progreso.","Correcta: asegura que las transiciones siempre pueden volver a dispararse."],["De seguridad.","No: la seguridad dice que algo malo no ocurre; la vivacidad, que algo bueno sigue siendo posible."],["Estructural: no depende del marcado.","No: la vivacidad depende del marcado inicial."],["De acotación.","No: son propiedades distintas."]],"c":0,"r":"**Seguridad** (\"nada malo ocurre nunca\"): ninguna marca alcanzable viola una condición. Se prueba con **P-invariantes** (M(SC_{1}) + M(SC_{2}) ≤ 1 para la exclusión mutua), con la **acotación** (los buffers nunca se desbordan) o con la red **segura**.\n\n**Progreso** (\"algo bueno termina ocurriendo\"): **vivacidad** (cualquier transición puede volver a dispararse), **libertad de deadlock**, **reversibilidad** o home state. Ojo: la **inanición** no queda excluida por la vivacidad; depende de cómo se resuelvan los conflictos (la política).","b":"Integradora"},
{"id":"f:deadlock-tres-vistas","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"¿Por qué la versión de los filósofos que toma los dos tenedores en un solo disparo no tiene deadlock?","o":[["Porque el disparo es atómico: nadie se queda con un tenedor a medias.","Correcta."],["Porque hay más tenedores que filósofos.","No: siguen siendo cinco."],["Porque los filósofos tienen prioridades distintas.","No: no hay prioridades en esa versión."],["Porque la red no está acotada.","No: está acotada por sus invariantes."]],"c":0,"r":"- **En Java**: dos hilos toman dos locks en **orden opuesto** y cada uno espera el del otro (espera circular). Quedan bloqueados para siempre (BLOCKED con `synchronized`, WAITING con un `Lock`).\n- **En la RdP**: una **marca** desde la que **ninguna transición está sensibilizada**. En los filósofos ingenuos: cinco fichas en \"con un tenedor\" y ninguno libre.\n- **En el grafo de marcado**: un **nodo sin arcos de salida**.\n\nPrevención: tomar todos los recursos **atómicamente** (una transición con varias entradas, o un monitor), fijar un **orden global** de adquisición, o limitar la cantidad de competidores (un semáforo de N − 1). Un sifón que puede vaciarse es una señal estructural de peligro.","b":"Integradora"},
{"id":"f:inanicion","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"¿Una RdP viva garantiza que no haya inanición?","o":[["No, viva dice que una transición siempre puede volver a dispararse, no que vaya a hacerlo.","Puede haber una ejecución en la que siempre se elige otra transición en conflicto. Se resuelve con una política justa."],["Sí, la vivacidad implica ausencia de inanición.","Puede dispararse siempre otra transición en conflicto."],["Sí, si además es acotada.","La acotación no tiene relación con la justicia."],["No, porque toda red viva tiene un deadlock.","Una red viva no tiene deadlock."]],"c":0,"r":"**No.** Que una transición sea viva dice que **siempre puede** volver a dispararse, no que **vaya a** dispararse: puede existir una ejecución infinita en la que, cada vez que está sensibilizada, se elige otra transición en conflicto. En los filósofos, dos vecinos pueden turnarse para siempre.\n\nLa inanición depende de **cómo se resuelven los conflictos**:\n- En el modelo y el monitor: una **política** (prioridades, turnos, colas FIFO) y la prioridad de los hilos despertados sobre los nuevos (cola de cortesía).\n- En Java: el modo **fair** de `ReentrantLock` y `Semaphore`, que atiende al que más tiempo espera.\n\nEn tiempo real, la cátedra define starvation como no atender un pedido **en el tiempo requerido**; eso se modela con RdP con tiempo.","b":"Integradora"},
{"id":"f:reactivo-formalismos","tema":"Integradora: modelar y verificar","src":"integradora","ex":false,"q":"¿Qué propiedades de la RdP necesita un sistema reactivo para poder correr para siempre con memoria finita?","o":[["Que sea viva (o al menos libre de deadlock) y acotada.","Correcta."],["Que sea segura y no tenga ciclos.","No: sin ciclos no podría repetir su comportamiento."],["Que todas sus transiciones sean quasi vivas.","No: alcanza con que se disparen una vez, no garantiza seguir."],["Que tenga transiciones fuente sin límite.","No: eso la haría no acotada."]],"c":0,"r":"- **Definición**: interactúa permanentemente con el ambiente y **no se espera que termine** (un SO, un servidor, un controlador).\n- **Como autómata**: reacciona a eventos (los símbolos del alfabeto), y sus secuencias de eventos válidas forman un lenguaje.\n- **Como RdP**: tiene una **secuencia de disparos infinita**: es **viva** (o al menos sin deadlock), tiene T-invariantes que la devuelven a marcas conocidas, y conviene que sea **acotada** para poder correr para siempre con memoria finita.\n- **En Java**: hilos en un bucle infinito que se terminan con `interrupt()` o `shutdown()`, o servicios de fondo como hilos daemon.","b":"Integradora"},
{"id":"f:grafo-automata","tema":"Integradora: autómatas y RdP","src":"integradora","ex":false,"q":"Si una RdP es acotada, ¿qué tipo de lenguaje forman sus secuencias de disparo?","o":[["Regular: el grafo de marcado es un autómata finito.","Correcta."],["Libre de contexto, porque la red cuenta fichas.","No: si está acotada, cuenta hasta una cota fija, y eso lo hace un AF."],["Sensible al contexto.","No."],["No forman un lenguaje.","No: un conjunto de secuencias sobre el alfabeto de transiciones es un lenguaje."]],"c":0,"r":"El **grafo de marcado es un autómata**: sus estados son las marcas alcanzables y sus transiciones son los disparos, etiquetados con la transición que se disparó.\n\n- Si la red es **acotada**, el grafo es finito: es un **autómata finito**, y el conjunto de secuencias de disparo es un **lenguaje regular**.\n- Un **grafo de estado con una sola ficha** es directamente un autómata: la ficha es el estado actual.\n\nLa red es la **descripción compacta**; el grafo es la **expansión**, y ahí reaparece la explosión de estados. Modelar con redes posterga esa explosión: los invariantes permiten razonar sin construir el grafo.","b":"Integradora"},
{"id":"f:rdp-contador","tema":"Integradora: autómatas y RdP","src":"integradora","ex":false,"q":"¿Puede una RdP no acotada generar secuencias que un autómata finito no reconoce?","o":[["Sí, una plaza no acotada funciona como un contador sin cota, y un autómata finito tiene memoria finita.","Es la misma razón por la que a^{n}b^{n} necesita un autómata a pila."],["No, toda RdP es equivalente a un autómata finito.","Sólo las acotadas tienen un grafo de marcado finito."],["No, porque las RdP no generan secuencias.","Sus secuencias de disparo forman un lenguaje."],["Sí, pero sólo si tiene arcos inhibidores.","Alcanza con una plaza no acotada."]],"c":0,"r":"**Sí.** Una plaza no acotada funciona como un **contador** de capacidad ilimitada. Si t_{a} deposita una ficha en P y t_{b} la consume, en toda secuencia válida cada prefijo tiene **a lo sumo tantas t_{b} como t_{a}**. Ese lenguaje no es regular: para reconocerlo hay que contar sin cota, y un AF tiene memoria finita.\n\nEs la misma razón por la que a^{n} b^{n} no la reconoce un autómata finito y sí uno **de pila**: la pila (o la plaza) es la memoria no acotada.","b":"Integradora"},
{"id":"f:fsm-vs-rdp","tema":"Integradora: autómatas y RdP","src":"integradora","ex":false,"q":"¿Cuál es la ventaja principal de la RdP sobre una FSM para modelar concurrencia?","o":[["Porque la RdP representa el estado de forma distribuida y compacta, mientras que la FSM necesita el producto de los estados.","Correcta."],["Porque las FSM no pueden tener ciclos.","No: pueden."],["Porque las RdP siempre tienen menos estados alcanzables.","No: el grafo de marcado puede ser enorme; lo compacto es la descripción."],["Porque las FSM no pueden modelar eventos.","No: una FSM es justamente un modelo de eventos."]],"c":0,"r":"- La **FSM** guarda **un estado global**. Con varios componentes concurrentes hay que dibujar el **producto** de sus estados, que crece exponencialmente: la representación gráfica limita la complejidad que se puede abordar.\n- La **RdP** guarda un **estado distribuido** (el marcado): cada componente tiene sus lugares, y el estado global **emerge** de las fichas. La concurrencia, la sincronización y los recursos compartidos se dibujan explícitamente y de forma compacta.\n- La RdP admite **semántica de orden parcial** (dos eventos independientes no se ordenan) y **análisis algebraico** (matriz de incidencia, invariantes).\n\nLas dos se relacionan: el grafo de marcado de la red es una FSM.","b":"Integradora"},
{"id":"f:moore-mealy-rdp","tema":"Integradora: autómatas y RdP","src":"integradora","ex":false,"q":"Si las acciones se ejecutan al disparar las transiciones, ¿a qué máquina se parece la RdP?","o":[["A Mealy, porque la acción depende del estado y del evento que se dispara.","Correcta."],["A Moore, porque la acción depende sólo del estado.","No: eso correspondería a acciones asociadas a las plazas."],["A una máquina de Turing.","No."],["A ninguna: no hay relación posible.","No: la analogía es razonable."]],"c":0,"r":"Es una **analogía**:\n- Acciones en las **transiciones** (se ejecutan al dispararse, es decir, dependen del estado **y** del evento): se parece a **Mealy**, cuya salida depende del estado y de la entrada.\n- Acciones en las **plazas** (se ejecutan mientras la plaza está marcada, dependen sólo del estado): se parece a **Moore**, cuya salida depende sólo del estado.\n\nEn el monitor de la cátedra, el hilo dispara la transición y después hace la acción afuera: la acción va ligada al evento, como en Mealy.","b":"Integradora","n":"No salió en parciales: es una pregunta para relacionar temas. Si te la hacen, aclarar que es una analogía y justificarla con de qué depende la salida en cada máquina."},
{"id":"f:estados-hilo-rdp","tema":"Integradora: autómatas y RdP","src":"integradora","ex":false,"q":"¿Qué clase de RdP resulta al modelar el ciclo de vida de un hilo con una plaza por estado?","o":[["Una máquina de estado (grafo de estado).","Correcta: cada transición tiene una entrada y una salida."],["Un grafo de eventos.","No: hay estados con varias salidas (conflictos), y eso un grafo de eventos no lo admite."],["Una red coloreada.","No necesariamente; haría falta para distinguir N hilos en una sola red."],["Una red no acotada.","No: la cantidad de fichas es constante."]],"c":0,"r":"Una plaza por estado y una transición por cada cambio: `start()` (NEW → RUNNABLE), entrar a un `synchronized` ocupado (→ BLOCKED), liberarse el monitor (→ RUNNABLE), `wait()`/`join()` (→ WAITING), `notify()`/fin del otro hilo (→ RUNNABLE), fin de `run()` (→ TERMINATED).\n\nCada transición tiene una entrada y una salida: es una **máquina de estado** (grafo de estado). Con **una ficha** (un hilo) equivale a un autómata: la ficha es el estado del hilo.\n\nCon **N hilos** hay N fichas y la red deja de ser equivalente a un autómata de esos estados; el P-invariante es que la suma de fichas es N (todo hilo está en algún estado). Notar que de los estados de espera siempre se vuelve a RUNNABLE, nunca directo a ejecución.","b":"Integradora"},
{"id":"f:rdp-a-java","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"¿Qué construcción de Java corresponde a un co-end (una transición que espera a que N ramas depositen su ficha)?","o":[["`CountDownLatch(N)` o `join()` sobre los N hilos.","Correcta."],["`Semaphore(1)`.","No: eso es exclusión mutua."],["`ReadWriteLock`.","No."],["`setDaemon(true)`.","No."]],"c":0,"r":"- **Lugar con N fichas** (recurso): `new Semaphore(N)`, o un contador en el monitor.\n- **Lugar mutex** (1 ficha): `synchronized`, `Lock` o `Semaphore(1)`.\n- **Transición**: un método del monitor (`dispararTransicion`), o un `acquire()`/`release()`.\n- **Disparo atómico**: la sección crítica del monitor.\n- **Transición no sensibilizada**: hilo dormido en una cola de condición (`wait`, `acquire`).\n- **Conflicto**: una política (prioridades, fairness).\n- **Plaza acotada**: buffer de capacidad fija.\n- **Sincronización por señal**: `Semaphore(0)`, `notify`.\n- **Co-end** (esperar a N ramas): `join()`, `CountDownLatch`, `CyclicBarrier`.\n- **Transición con tiempo**: ventana [α, β] y un `sleep` fuera del monitor.\n- **Marcado**: el vector de estado del monitor.","b":"Integradora"},
{"id":"f:signal-java","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"¿Por qué en Java hace falta `notifyAll()` en el productor/consumidor, y en el monitor de la cátedra no?","o":[["Porque Java tiene un solo wait set por objeto, y la cátedra tiene una cola por transición.","Correcta."],["Porque `notify()` no existe en Java.","No: existe, pero despierta a uno cualquiera del único wait set."],["Porque el monitor de la cátedra no usa colas.","No: usa una por transición."],["Porque `notifyAll()` es más rápido.","No: es más caro, pero seguro."]],"c":0,"r":"Java implementa **Signal and Continue**: el hilo que hace `notify()` **sigue** con el monitor hasta salir, y el despertado pasa a **competir** por el monitor, sin prioridad garantizada. Consecuencias:\n- Cuando el despertado entra, la condición puede haber cambiado: hay que chequearla con **`while`**.\n- Hay **un solo wait set por objeto** (una única variable de condición): `notify()` puede despertar al hilo equivocado, por eso se usa **`notifyAll()`**.\n\nEl monitor de la cátedra tiene **una cola por transición** (relación biunívoca), la **política** elige exactamente a quién despertar, y el que despierta **sale cediéndole el mutex** al despertado (Signal and Exit: el mutex pasa de mano en mano), que encuentra la condición intacta. En Java, `Lock.newCondition()` permite tener varias variables de condición.","b":"Integradora"},
{"id":"f:sc-chica","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"¿Qué tienen en común \"acciones afuera del monitor\", \"dos llaves en el cine\" y el `ReadWriteLock`?","o":[["Que achican lo que se ejecuta en exclusión mutua, para no serializar más de lo necesario.","Correcta."],["Que evitan el deadlock en cualquier caso.","No: ninguno lo garantiza por sí solo."],["Que reemplazan a los semáforos.","No."],["Que hacen innecesaria la sincronización.","No: la reducen, no la eliminan."]],"c":0,"r":"Porque la sección crítica **serializa**: mientras un hilo está adentro, los demás esperan, y ese tramo del programa no aprovecha ningún paralelismo (la cátedra dice que una SC es varias veces más lenta). Cuanto más chica, más tiempo corren los hilos en paralelo.\n- **Monitor**: las acciones sobre los recursos se hacen **afuera**; adentro sólo se decide quién avanza.\n- **Cine**: dos llaves en lugar de dos métodos `synchronized`, para que las salas independientes no se excluyan.\n- **`ReadWriteLock`**: los lectores no se excluyen entre sí; sólo la escritura es exclusiva.\n- **Impresoras**: el semáforo deja pasar a tres, y el `Lock` protege sólo la búsqueda de impresora libre, no la impresión.","b":"Integradora"},
{"id":"f:tiempo-java","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"Mientras espera que se abra la ventana de su transición, ¿en qué estado está el hilo y tiene el mutex?","o":[["En TIMED_WAITING, sin el mutex.","Correcta."],["En BLOCKED, con el mutex.","No: el `sleep` produce TIMED_WAITING, y antes de dormir libera el mutex."],["En RUNNABLE, con el mutex.","No."],["En WAITING, con el mutex.","No: dormir con el mutex bloquearía a todos."]],"c":0,"r":"Al sensibilizarse la transición se guarda su **timeStamp**. Cuando un hilo intenta dispararla, el monitor verifica la ventana α < ahora − timeStamp < β:\n- **Dentro**: dispara normalmente.\n- **Antes**: el hilo **libera el mutex** y hace `sleep(timeStamp + α − ahora)`. Durante la espera está en **TIMED_WAITING**, sin el monitor, así que no bloquea a nadie. Al vencer pasa a RUNNABLE y vuelve a pedir el mutex (si el mutex es un `Semaphore`, la espera por él es WAITING; con `synchronized` sería BLOCKED).\n- **Después**: no dispara.\n\nDormir **dentro** del monitor sería un error grave: todos los demás hilos quedarían bloqueados durante la espera.","b":"Integradora"},
{"id":"f:hilos-tinv","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"Si una secuencia de transiciones puede tener como máximo 2 fichas recorriéndola a la vez, ¿qué pasa si se le asignan 5 hilos?","o":[["Funciona, pero 3 hilos pasan el tiempo esperando en las colas sin aportar paralelismo.","Correcta."],["La red pierde la acotación.","No: los hilos no agregan fichas; el monitor sólo deja disparar lo que el marcado permite."],["Se produce un deadlock.","No necesariamente: el monitor los hace esperar."],["Va 5 veces más rápido.","No: el marcado limita a 2 el paralelismo real."]],"c":0,"r":"Los hilos son los que **disparan** las transiciones. Un criterio natural:\n- Los **T-invariantes** son los ciclos de transiciones que el sistema repite. Cada hilo ejecuta **en un bucle** la secuencia de transiciones de un invariante (o de un tramo), y hace las acciones afuera del monitor.\n- La **cantidad** de hilos por secuencia se limita por el **paralelismo máximo**: cuántas fichas pueden recorrer esa secuencia a la vez, dato que se lee del marcado y de los P-invariantes. Con más hilos, los de sobra sólo esperan en las colas; con menos, se desperdicia paralelismo.\n- Si la red es **segura**, nunca hay más de una ficha por plaza, y un hilo por plaza o por secuencia alcanza.\n- Las transiciones que modelan **eventos externos** o llegadas (fuentes) las disparan hilos que generan esos eventos.","b":"Integradora","n":"No salió en los parciales de la carpeta: es una pregunta de razonamiento que une T-invariantes, P-invariantes y la implementación. Justificá siempre con los invariantes."},
{"id":"f:executor-rdp","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"En ese modelo, ¿por qué la plaza de tareas pendientes no está acotada?","o":[["Porque se alimenta de una transición fuente y la cola del pool fijo no tiene límite.","Correcta."],["Porque hay n hilos.","No: los n hilos están acotados por el invariante."],["Porque las tareas no terminan nunca.","No necesariamente."],["Porque el executor usa `shutdownNow()`.","No."]],"c":0,"r":"- Plaza **hilos libres** con **n** fichas, plaza **pendientes** y plaza **ejecutando**.\n- **Enviar** (`execute`) es una transición **fuente** que deposita en pendientes.\n- **Tomar tarea** tiene dos entradas (pendientes e hilos libres) y deposita en ejecutando. **Terminar** devuelve la ficha a hilos libres.\n- P-invariante: M(hilos libres) + M(ejecutando) = n: nunca hay más de n tareas corriendo.\n\nLa plaza **pendientes no está acotada**: el pool fijo usa una cola sin límite, y si las tareas llegan más rápido de lo que se procesan, crece sin fin (memoria). Si se usa una cola acotada, las tareas que no entran se **rechazan** y van al `RejectedExecutionHandler`: es el cliente que se va de la barbería cuando no hay bancos (`tryAcquire()`).","b":"Integradora"},
{"id":"f:sincronizadores-rdp","tema":"Integradora: de la RdP al código","src":"integradora","ex":false,"q":"¿Qué modelo de RdP corresponde a un `Semaphore(0)` usado para que un hilo le avise a otro?","o":[["La sincronización por señal: un lugar sin marca inicial que una rama produce y otra consume.","Correcta."],["La exclusión mutua: un lugar con una ficha.","No: eso es `Semaphore(1)`."],["El buffer acotado.","No."],["Una transición fuente.","No."]],"c":0,"r":"- **`join()`**: un **co-end** de un hilo: la transición que sigue en el que espera tiene como entrada la plaza \"el otro terminó\".\n- **`CountDownLatch(N)`**: la transición de espera necesita **N fichas** (un arco de peso N) de una plaza \"eventos\" a la que cada `countDown()` le suma una. Es de **un solo uso**: nadie repone las fichas.\n- **`CyclicBarrier(N)`**: un **co-end** de N ramas seguido de un **co-begin** que las vuelve a largar, en un ciclo: es reutilizable (un T-invariante que se repite).\n- **`Semaphore(0)`**: **sincronización por señal**: un lugar sin marca inicial que una rama produce y otra consume.","b":"Integradora"},
{"id":"f:prod-cons","tema":"Integradora: problemas clásicos","src":"integradora","ex":false,"q":"En la versión con semáforos, ¿qué pasa si el productor hace `mutex.acquire()` antes de `vacios.acquire()`?","o":[["Con el buffer lleno, se duerme con el mutex tomado y el consumidor no puede entrar: deadlock.","Correcta."],["Nada: el orden no importa.","No: importa, y es un error clásico."],["El buffer se desborda.","No: `vacios` lo sigue impidiendo, pero a costa de un deadlock."],["El consumidor lee datos repetidos.","No."]],"c":0,"r":"1. **`wait`/`notifyAll`** (el `EventStorage`): métodos `synchronized`; el productor hace `while (lleno) wait();`, agrega y `notifyAll()`; el consumidor, al revés.\n2. **Semáforos**: `vacios = new Semaphore(N)`, `llenos = new Semaphore(0)`, `mutex = new Semaphore(1)`. Productor: `vacios.acquire(); mutex.acquire(); poner; mutex.release(); llenos.release();`. Consumidor simétrico.\n3. **RdP**: lugares libres (N), ocupados (0) y mutex (1); producir consume de libres y deposita en ocupados.\n\nInvariante común: **libres + ocupados = N** (contando los que están en uso). Detalle clave: hay que tomar `vacios` **antes** que el `mutex`; al revés, con el buffer lleno el productor se duerme con el mutex tomado y el consumidor nunca puede entrar: deadlock.","b":"Integradora"},
{"id":"f:lectores-escritores","tema":"Integradora: problemas clásicos","src":"integradora","ex":false,"q":"En la RdP de lectores/escritores con un lugar de N fichas, ¿qué peso tiene el arco hacia la transición \"escribir\"?","o":[["N: el escritor necesita todas las fichas, o sea, que no haya ningún lector.","Correcta."],["1, igual que los lectores.","No: así el escritor entraría junto con los lectores."],["0.","No: un arco de peso 0 no existe."],["N − 1.","No: dejaría entrar a un lector junto con el escritor."]],"c":0,"r":"- **`ReadWriteLock`**: los lectores toman el lock de lectura (compartido) y el escritor el de escritura (exclusivo).\n- **Semáforos**: un `Semaphore(N)`; cada lector hace `acquire(1)` y el escritor `acquire(N)`, es decir, pide **todos** los permisos.\n- **RdP**: un lugar con N fichas; el arco hacia \"leer\" tiene peso 1 y el arco hacia \"escribir\" tiene **peso N**.\n\nRiesgo: si los lectores se suceden sin pausa, siempre queda alguno adentro y el **escritor sufre inanición**. Se resuelve con fairness, o dándole prioridad al escritor (por ejemplo, un arco inhibidor desde \"escritor esperando\" hacia la transición de entrada de los lectores).","b":"Integradora"},
{"id":"f:filosofos-soluciones","tema":"Integradora: problemas clásicos","src":"integradora","ex":false,"q":"¿Qué solución, además de evitar el deadlock, evita la inanición?","o":[["Un monitor con una política de turnos o de prioridad al que más espera.","Correcta."],["Tomar los dos tenedores en un solo disparo.","No: evita el deadlock, pero dos vecinos pueden turnarse para siempre."],["Tomar los tenedores de a uno, en cualquier orden.","No: esa tiene deadlock."],["Dar más prioridad de Java (`setPriority`) a un filósofo.","No: la prioridad no garantiza nada."]],"c":0,"r":"- **Tomar los dos tenedores atómicamente** (una transición con tres entradas, o un monitor): **sin deadlock**, pero puede haber **inanición**.\n- **Orden global**: todos toman primero el tenedor de menor número (uno de ellos queda \"zurdo\"). Rompe la espera circular: **sin deadlock**.\n- **Limitar a 4 comensales** con un `Semaphore(4)` (un lugar con 4 fichas): con cinco tenedores y cuatro filósofos, siempre alguno puede comer. **Sin deadlock**.\n- **Monitor con política** (turnos, prioridad al que más espera): además **evita la inanición**.\n\nLos P-invariantes prueban, en cualquiera de ellas, que dos vecinos no comen a la vez.","b":"Integradora"},
{"id":"f:mecanismos-comparados","tema":"Integradora: problemas clásicos","src":"integradora","ex":false,"q":"¿Qué mecanismo separa la lógica del sistema de la política de resolución de conflictos y permite verificar formalmente su comportamiento?","o":[["El monitor con RdP.","Correcta."],["El semáforo.","No: sus primitivas quedan esparcidas por el código."],["`synchronized`.","No: no separa lógica de política."],["`volatile`.","No: no es un mecanismo de sincronización de acceso."]],"c":0,"r":"- **Semáforo**: contador con `acquire`/`release`, sin dueño. Sirve para exclusión mutua, N recursos y señalización. Las primitivas quedan esparcidas y olvidar una corrompe el sistema.\n- **`synchronized` + `wait`/`notify`**: monitor integrado al lenguaje, con una sola variable de condición y política Signal and Continue (`while` y `notifyAll`). Simple y libera solo.\n- **`Lock`**: más flexible (`tryLock`, fairness, `ReadWriteLock`, varias condiciones), pero hay que liberarlo en un `finally`.\n- **Monitor con RdP**: centraliza la **lógica** (la red), la **política** (resolver conflictos) y deja las acciones afuera. Lo que hace es **verificable** formalmente.\n- **Pasaje de mensajes**: no hay dato compartido; la sincronización es implícita en `send`/`receive`. Natural en sistemas distribuidos.","b":"Integradora"}
];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
}
function fmt(s) {
  return s.split('\n\n').map(bloque => {
    let html = '', items = [];
    const cerrar = () => { if (items.length) { html += '<ul>' + items.join('') + '</ul>'; items = []; } };
    bloque.split('\n').forEach(l => {
      if (l.startsWith('- ')) items.push(`<li>${inline(l.slice(2))}</li>`);
      else { cerrar(); html += `<p>${inline(l)}</p>`; }
    });
    cerrar();
    return html;
  }).join('');
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coma = x => String(x).replace('.', ',');
const reloj = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- Historial: última respuesta de cada pregunta (1 bien, 0 mal), sólo en este navegador ---------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem(CONF.KEY)) || {}; } catch (e) { hist = {}; }
const guardarHist = () => { try { localStorage.setItem(CONF.KEY, JSON.stringify(hist)); } catch (e) {} };
const esFloja = id => hist[id] === 0;

/* ---------- Filtros ---------- */
const ORIGENES = { todas: 'Fuente: parciales + apunte', examen: 'Fuente: sólo parciales', apunte: 'Fuente: sólo apunte' };
let origen = 'todas';
const pasaOrigen = p => origen === 'todas' || (origen === 'examen') === p.ex;
let temasActivos = new Set(Object.values(T));
const base = () => BANCO.filter(p => temasActivos.has(p.tema) && pasaOrigen(p));

/* ---------- Estado de la ronda ---------- */
let modo = 'examen';
let ronda = [];          // [{p, opciones:[{x, e, ok}], elegida: índice | null}]
let entregado = false;
let inicio = 0, fin = 0, tic = null;

function elegirExamen(b) {
  let elegidas = [];
  if (CONF.BLOQUES) {
    Object.entries(CONF.BLOQUES).forEach(([bl, n]) => elegidas.push(...shuffle(b.filter(p => p.b === bl)).slice(0, n)));
  }
  const resto = shuffle(b.filter(p => !elegidas.includes(p)));
  elegidas.push(...resto.slice(0, Math.max(0, CONF.EXAMEN - elegidas.length)));
  return shuffle(elegidas);
}

function armarRonda(lista) {
  let preguntas;
  if (lista) { preguntas = shuffle(lista); modo = 'practica'; }
  else preguntas = modo === 'examen' ? elegirExamen(base()) : shuffle(base());
  ronda = preguntas.map(p => ({ p, opciones: shuffle(p.o.map((o, i) => ({ x: o[0], e: o[1], ok: i === p.c }))), elegida: null }));
  entregado = false;
  inicio = Date.now(); fin = 0;
  clearInterval(tic);
  if (modo === 'examen') tic = setInterval(actualizarStats, 1000);
  render();
}

/* ---------- Render ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.modo === modo));
  $('#summary').innerHTML = '';
  const list = $('#list');
  list.innerHTML = '';
  if (!ronda.length) list.innerHTML = '<p class="sub">No hay preguntas con estos filtros.</p>';
  ronda.forEach((item, n) => list.appendChild(tarjeta(item, n)));
  $('#pie').innerHTML = modo === 'examen' && ronda.length ? '<button class="btn primary" id="entregar2">Entregar el examen</button>' : '';
  if ($('#entregar2')) $('#entregar2').onclick = entregar;
  chips();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function tarjeta(item, n) {
  const { p } = item;
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = `<div class="qhead"><span class="num">${n + 1}.</span>
      ${p.b ? `<span class="tag">${esc(p.b)}</span>` : ''}
      <span class="tag">${esc(p.tema)}</span>
      <span class="tag${p.ex ? '' : ' apunte'}">${p.ex ? 'Parcial' : 'Fuente'}: ${esc(p.src)}</span>
      ${esFloja(p.id) ? '<span class="tag floja">floja</span>' : ''}</div>
    <p class="qtext">${inline(p.q)}</p>
    <div class="opts"></div>
    <div class="fb" hidden></div>`;
  const opts = el.querySelector('.opts');
  item.opciones.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[k]}</span><span>${inline(o.x)}</span>`;
    b.onclick = () => elegir(item, k, el);
    opts.appendChild(b);
  });
  item.el = el;
  return el;
}

function elegir(item, k, el) {
  if (entregado || (modo === 'practica' && item.elegida !== null)) return;
  item.elegida = k;
  if (modo === 'practica') corregir(item);
  else el.querySelectorAll('.opt').forEach((b, i) => b.classList.toggle('sel', i === k));
  actualizarStats();
  if (modo === 'practica' && ronda.every(it => it.elegida !== null)) resumen();
}

function corregir(item) {
  const el = item.el, k = item.elegida;
  const acerto = k !== null && item.opciones[k].ok;
  el.classList.add(acerto ? 'bien' : 'mal');
  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('sel');
    const o = item.opciones[i];
    b.classList.add(o.ok ? 'ok' : (i === k ? 'bad' : 'dim'));
  });
  const p = item.p;
  const veredicto = k === null ? '<div class="verdict bad">Sin responder</div>'
    : acerto ? '<div class="verdict ok">✔ Correcto</div>' : '<div class="verdict bad">✘ Incorrecto</div>';
  const fb = el.querySelector('.fb');
  fb.innerHTML = `${veredicto}
    <ul class="exp">${item.opciones.map((o, i) => `<li class="${o.ok ? 'good' : 'wrong'}"><p><b>${'ABCD'[i]}.</b> ${inline(o.e)}</p></li>`).join('')}</ul>
    ${p.n ? `<div class="warn">${fmt(p.n)}</div>` : ''}
    <details><summary>Ver la respuesta desarrollada</summary><div class="model">${fmt(p.r)}</div></details>`;
  fb.hidden = false;
  hist[p.id] = acerto ? 1 : 0;
  guardarHist();
}

function entregar() {
  if (entregado || !ronda.length) return;
  const faltan = ronda.filter(it => it.elegida === null).length;
  if (faltan && !confirm(`Te ${faltan === 1 ? 'falta 1 pregunta' : `faltan ${faltan} preguntas`}. Las que no respondas cuentan como incorrectas. ¿Entregar igual?`)) return;
  entregado = true;
  fin = Date.now();
  clearInterval(tic);
  ronda.forEach(corregir);
  $('#pie').innerHTML = '';
  resumen();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function resumen() {
  const corregidas = ronda.filter(it => modo === 'examen' || it.elegida !== null);
  const bien = corregidas.filter(it => it.elegida !== null && it.opciones[it.elegida].ok);
  const nota = corregidas.length ? 10 * bien.length / corregidas.length : 0;
  const porTema = {};
  corregidas.forEach(it => {
    const t = porTema[it.p.tema] = porTema[it.p.tema] || { bien: 0, n: 0 };
    t.n++; if (bien.includes(it)) t.bien++;
  });
  const filas = Object.entries(porTema).sort((a, b) => a[1].bien / a[1].n - b[1].bien / b[1].n)
    .map(([t, v]) => `<div class="srow"><div>${esc(t)}<div class="mini"><div style="width:${100 * v.bien / v.n}%"></div></div></div><b>${v.bien}/${v.n}</b></div>`).join('');
  const erradas = corregidas.filter(it => !bien.includes(it)).map(it => it.p);
  const tiempo = modo === 'examen' ? ` en ${reloj(fin - inicio)}` : '';
  const destino = modo === 'examen' ? '#summary' : '#pie';
  const abajo = modo === 'examen' ? 'Abajo está cada pregunta con la explicación de todas las opciones.' : 'Arriba quedó cada pregunta con la explicación de todas las opciones.';
  $(destino).innerHTML = `<div class="summary" style="width:100%">
      <h2>Nota: ${coma(nota.toFixed(1))} / 10 · ${nota >= 6 ? 'aprobado' : 'a repasar'}</h2>
      <p class="sub" style="margin-bottom:8px">${bien.length} de ${corregidas.length} correctas${tiempo}. Por tema, de más flojo a más firme. ${abajo}</p>
      ${filas}
      ${erradas.length ? '<div class="controls" style="margin:12px 0 0"><button class="btn primary" id="rehacer">Practicar las que erré</button></div>' : ''}
    </div>`;
  if ($('#rehacer')) $('#rehacer').onclick = () => armarRonda(erradas);
}

function actualizarStats() {
  const resp = ronda.filter(it => it.elegida !== null).length;
  const nFlojas = BANCO.filter(p => esFloja(p.id)).length;
  let partes = [`<span>Respondidas: <b>${resp}</b>/<b>${ronda.length}</b></span>`];
  if (modo === 'practica' || entregado) {
    const bien = ronda.filter(it => it.elegida !== null && it.opciones[it.elegida].ok).length;
    const total = modo === 'examen' ? ronda.length : resp;
    partes.push(`<span>Correctas: <b>${bien}</b></span>`);
    partes.push(`<span>Nota: <b>${total ? coma((10 * bien / total).toFixed(1)) + ' / 10' : '—'}</b></span>`);
  }
  if (modo === 'examen') partes.push(`<span>Tiempo: <b>${reloj((fin || Date.now()) - inicio)}</b></span>`);
  partes.push(`<span>Flojas guardadas: <b>${nFlojas}</b></span>`);
  $('#stats').innerHTML = partes.join('');
  $('#entregar').hidden = !(modo === 'examen' && !entregado && ronda.length);
  $('#pbar').style.width = ronda.length ? (100 * resp / ronda.length) + '%' : '0';
  $('#flojas').disabled = nFlojas === 0;
  $('#flojas').textContent = `Repasar las flojas (${nFlojas})`;
}

function chips() {
  const c = $('#chips');
  c.innerHTML = '';
  Object.values(T).forEach(t => {
    const n = BANCO.filter(p => p.tema === t && pasaOrigen(p)).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip' + (temasActivos.has(t) ? ' on' : '');
    b.textContent = `${t} (${n})`;
    b.onclick = () => {
      temasActivos.has(t) ? temasActivos.delete(t) : temasActivos.add(t);
      if (!temasActivos.size) temasActivos = new Set(Object.values(T));
      armarRonda();
    };
    c.appendChild(b);
  });
}

/* ---------- Controles ---------- */
document.title = CONF.TITULO;
$('#titulo').textContent = CONF.TITULO;
$('#bajada').innerHTML = inline(CONF.BAJADA);
$('#tab-examen').textContent = `Examen (${CONF.EXAMEN} al azar)`;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { modo = t.dataset.modo; armarRonda(); });
$('#nueva').onclick = () => armarRonda();
$('#entregar').onclick = entregar;
$('#flojas').onclick = () => armarRonda(BANCO.filter(p => esFloja(p.id)));
$('#borrar').onclick = () => { if (confirm('¿Borrar el historial de preguntas flojas?')) { hist = {}; guardarHist(); render(); } };
$('#origen').textContent = ORIGENES[origen];
$('#origen').onclick = () => {
  const claves = Object.keys(ORIGENES);
  origen = claves[(claves.indexOf(origen) + 1) % claves.length];
  $('#origen').textContent = ORIGENES[origen];
  armarRonda();
};
$('#theme').onclick = () => {
  const root = document.documentElement;
  const oscuroAhora = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = oscuroAhora ? 'light' : 'dark';
};

armarRonda();
</script>
