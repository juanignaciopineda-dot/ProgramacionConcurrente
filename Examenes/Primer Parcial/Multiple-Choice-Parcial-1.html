<script>
const CONF = {"TITULO":"Multiple choice del primer parcial","BAJADA":"109 preguntas de opción múltiple. 63 salieron en parciales viejos y 46 están armadas con el apunte. El examen saca 20 al azar y se corrige al entregar. En la práctica, cada respuesta se corrige en el momento. Cada opción trae la explicación de por qué es correcta o no, y abajo está la respuesta desarrollada, la misma del cuestionario escrito.","KEY":"pc-mc-parcial1-hist","EXAMEN":20,"BLOQUES":null};
const T = {
 "CONC": "Concurrencia e interleaving",
 "VER": "Testing, verificación y reactivos",
 "EST": "Estados de hilos y procesos",
 "SC": "Sección crítica, monitor, semáforo",
 "JAVA": "Java",
 "UML": "Java básico y UML",
 "HIL": "Hilos en Java: API y ciclo de vida",
 "LOCK": "Locks, ReadWriteLock y semáforos",
 "GRAM": "Lenguajes y gramáticas",
 "AUT": "Autómatas y máquinas"
};
const BANCO = [
{"id":"interleaving","tema":"Concurrencia e interleaving","src":"2020 (x2)","ex":true,"q":"¿Cómo se ejecutan los procesos concurrentes? (interleaving)","o":[["Intercalando sus acciones atómicas, en un orden que en general no puede decidirse.","Correcta: esa es la definición de interleaving de la cátedra."],["Uno después del otro, en el orden en que fueron creados.","No: eso es ejecución secuencial. El orden de creación no fija el interleaving."],["Siempre en simultáneo, cada uno en un núcleo distinto.","No: eso es paralelismo. Con un solo núcleo también hay concurrencia."],["Intercalando sentencias completas del código fuente.","No: se intercalan acciones atómicas, no sentencias. `x++` es una sentencia pero son tres acciones."]],"c":0,"r":"Se ejecutan **intercalando las acciones atómicas** que los componen. A eso se lo llama **interleaving**.\n\nEl orden en que se ejecutan las acciones atómicas **no puede decidirse** en general. Por el **no determinismo** en la elección de la próxima acción atómica, un mismo par de procesos puede tener ejecuciones distintas.","n":"En 2020 alguien respondió \"se ejecutan de manera simultánea… con synchronized\" y la cátedra le corrigió con la definición de arriba. No digas \"simultánea\": decí \"intercalando acciones atómicas\"."},
{"id":"paralelo-vs-conc","tema":"Concurrencia e interleaving","src":"2021, 2023","ex":true,"q":"¿Qué diferencia hay entre la ejecución de procesos paralelos y procesos concurrentes? (interleaving)","o":[["En paralelo se ejecutan al mismo tiempo. En concurrencia se intercalan, y el interleaving puede ser cualquiera, incluso el simultáneo.","Correcta: es el comentario textual de la cátedra."],["Los paralelos comparten recursos y los concurrentes no.","No: compartir recursos no es lo que los distingue. Justamente los concurrentes suelen compartirlos."],["Los concurrentes corren siempre en un solo núcleo.","No: pueden correr en varios núcleos. La ejecución simultánea es uno más de los interleavings posibles."],["No hay diferencia: son sinónimos.","No: el paralelismo es un caso particular de la concurrencia."]],"c":0,"r":"En la ejecución **paralela** los procesos se ejecutan **al mismo tiempo**, en procesadores o núcleos distintos.\n\nEn la **concurrente** las acciones atómicas se **intercalan**, y el interleaving puede ser **cualquiera, incluso el simultáneo**. El paralelismo es entonces un caso particular de la concurrencia.","n":"Comentario de la cátedra (2021): \"en el paralelo los dos se ejecutan al mismo tiempo; en el concurrente el interleaving puede ser cualquiera, incluso el simultáneo\"."},
{"id":"orden-atomicas","tema":"Concurrencia e interleaving","src":"2020 (x2)","ex":true,"q":"¿El orden en que se ejecutan las sentencias atómicas de un programa concurrente es siempre el mismo?","o":[["No, puede cambiar de una corrida a otra porque la elección de la próxima acción atómica es no determinista.","La ejecución intercala las acciones atómicas y no se puede decidir de antemano cuál sigue."],["Sí, siempre que el programa no tenga errores.","Un programa correcto también puede tener muchos interleavings distintos. Lo que se pide es que todos den un resultado correcto."],["Sí, porque lo fija el orden en que se escribieron las sentencias.","Ese orden vale dentro de cada proceso, pero no entre procesos distintos."],["Sólo cambia si el programa corre en varios procesadores.","En un monoprocesador el sistema operativo también intercala los hilos de formas distintas."]],"c":0,"r":"**No.** El orden **no puede decidirse**: la ejecución intercala las acciones atómicas y la elección de cuál sigue es **no determinista**. Dos corridas del mismo programa pueden tener interleavings distintos."},
{"id":"dif-resultados","tema":"Concurrencia e interleaving","src":"2021, 2023","ex":true,"q":"¿Por qué distintos interleavings pueden llevar a resultados distintos?","o":[["Porque el orden de ejecución no se puede determinar y los procesos comparten datos, así que el resultado depende de ese orden.","Por ejemplo, dos hilos que hacen `x++` sobre la misma variable pueden perder una actualización."],["Porque el compilador genera código distinto en cada corrida.","El código es el mismo. Lo que cambia es el orden en que se intercalan sus acciones."],["Porque los procesadores cometen errores de cálculo cuando hay varios hilos.","El hardware no se equivoca. El problema está en el acceso no protegido a datos compartidos."],["Sólo pasa si los procesos tienen distinta prioridad.","Pasa con cualquier prioridad, porque la prioridad no fija el interleaving."]],"c":0,"r":"Porque no se puede determinar (al menos no del todo) el **orden de ejecución** de los procesos o hilos: qué acción atómica sigue se elige de forma no determinista. Si los procesos **comparten datos**, el resultado depende de ese orden. Por ejemplo, dos hilos que hacen `x++` sobre la misma variable pueden perder una actualización."},
{"id":"deterministico","tema":"Concurrencia e interleaving","src":"2021","ex":true,"q":"Si un sistema es determinístico, ¿distintos interleavings pueden llevar a distintos resultados?","o":[["No, en un sistema determinístico toda ejecución da el mismo resultado.","Es lo que significa determinístico. El resultado no depende del interleaving."],["Sí, siempre que haya más de un hilo.","Si los resultados pudieran variar, el sistema no sería determinístico."],["Sí, pero sólo en un multiprocesador.","La cantidad de procesadores no cambia la definición."],["Depende de las prioridades de los hilos.","Un sistema determinístico da el mismo resultado sin importar las prioridades."]],"c":0,"r":"**No.** Si el sistema es determinístico, toda ejecución da el mismo resultado, sea cual sea el interleaving.","n":"Es una trampa. En 2021 respondieron \"Sí, porque no se sabe qué acción va a suceder primero\" y sacaron 0; el comentario fue sólo \"No\". La premisa de la pregunta es que el sistema es determinístico."},
{"id":"atomicas","tema":"Concurrencia e interleaving","src":"2020 (x2), 2021 (x2)","ex":true,"q":"¿Cómo son las operaciones atómicas? (variante: ¿para qué son las operaciones atómicas?)","o":[["Se ejecutan completas o no se ejecutan, y ningún otro hilo ve un estado intermedio.","Correcta."],["Son las que se escriben en una sola línea de código.","No: `x++` está en una sola línea y no es atómica (leer, sumar, escribir)."],["Son las que se ejecutan más rápido que el resto.","No: la atomicidad no tiene que ver con la velocidad."],["Son las que sólo puede ejecutar el hilo main.","No: cualquier hilo ejecuta acciones atómicas."]],"c":0,"r":"Una operación atómica se ejecuta **completa o no se ejecuta**: empieza y termina, o no empieza. No puede quedar a medio hacer ni ser interrumpida por otro hilo en el medio, así que nadie ve un estado intermedio.\n\n**Para qué sirven:** garantizan que una acción sobre un recurso compartido no quede incompleta. Protegen los recursos compartidos."},
{"id":"no-atomicas","tema":"Concurrencia e interleaving","src":"2021 (x2)","ex":true,"q":"¿Por qué diferentes corridas en un programa concurrente con acciones no atómicas pueden llevar a diferentes resultados o comportamientos erróneos?","o":[["Por condiciones de carrera.","Correcta: otro hilo se intercala en el medio de la acción no atómica."],["Por deadlock.","No: un deadlock deja a los hilos bloqueados para siempre; no produce resultados distintos."],["Porque la JVM reordena el código fuente al compilar.","No: es lo que pasa entre las acciones en tiempo de ejecución, no en la compilación."],["Por inanición (starvation).","No: la inanición es no conseguir nunca un recurso; no explica valores incorrectos."]],"c":0,"r":"Por **condiciones de carrera** (race conditions). Si una acción no es atómica, otro hilo puede meterse en el medio (por ejemplo, entre el leer y el escribir de `x++`) y trabajar con un valor intermedio. Como el interleaving cambia de una corrida a otra, el resultado también cambia.","n":"El comentario de la cátedra fue sólo \"problemas de carrera\". Nombralo explícitamente."},
{"id":"estados-2x2","tema":"Concurrencia e interleaving","src":"2021 (x3), recup. 2021","ex":true,"q":"¿Cuántos son los estados posibles que tendría un proceso compuesto por **dos hilos** los cuales tienen **2 estados** cada uno?","o":[["4","Correcta: 2^{2} = 4. Si los estados son A y B: AA, AB, BA, BB."],["2","No: 2 son los estados de cada hilo, no los del proceso."],["7","No: no se trata de contar los estados de la MV (nuevo, listo, etc.). La pregunta dice 2 estados por hilo."],["8","No: sería 2^{3}, con tres hilos."]],"c":0,"r":"**4.** Con h hilos de e estados cada uno, el proceso tiene **e^{h}** estados: son todas las combinaciones posibles. Acá 2^{2} = 4."},
{"id":"estados-2x3","tema":"Concurrencia e interleaving","src":"2021, 2023","ex":true,"q":"¿Cuántos son los estados posibles que tendría un proceso compuesto por **dos hilos** los cuales tienen **3 estados** cada uno?","o":[["9","Correcta: 3^{2} = 9."],["6","No: eso es 2 × 3. Los estados se combinan, no se suman por hilo."],["8","No: sería 2^{3}, con los papeles invertidos."],["5","No: eso es 2 + 3."]],"c":0,"r":"**9.** e^{h} = 3^{2} = 9, que es la cantidad de combinaciones.","n":"En 2023 la cátedra corrigió \"3^2 = cantidad de combinaciones = 9\". En 2021, a esta misma pregunta le pusieron \"4\" en el comentario, que parece copiado de la de 2×2. Respondé 9 y mostrá la cuenta."},
{"id":"estados-4x3","tema":"Concurrencia e interleaving","src":"2021","ex":true,"q":"¿Cuántos son los estados posibles que tendría un proceso compuesto por **cuatro hilos** los cuales tienen **3 estados** cada uno?","o":[["81","Correcta: 3^{4} = 81."],["12","No: 4 × 3 cuenta pares hilo-estado, no estados del proceso. (Es lo que puso un comentario de 2021, pero contradice la regla e^h.)"],["64","No: sería 4^{3}, con los papeles invertidos."],["7","No: eso es 4 + 3."]],"c":0,"r":"**81.** e^{h} = 3^{4} = 81 (combinatoria).","n":"Ojo: en 2021 el comentario de la cátedra fue \"12\" (4 × 3). Eso no cuadra con la regla que usan en las otras preguntas (2×2 = 4, 2×3 = 9 = 3^2). El resumen de respuestas de la carpeta pone 3^4 = 81. Respondé 81 con la cuenta, y si querés mencioná la regla."},
{"id":"testing-interleavings","tema":"Testing, verificación y reactivos","src":"2020 (x3), 2021, recup. 2021","ex":true,"q":"¿Por qué no es factible verificar con testing un programa concurrente?","o":[["Porque los interleavings crecen exponencialmente y un error puede aparecer sólo en uno muy improbable que el testing nunca ejercita.","Es la explosión de estados. El testing sólo recorre algunas ejecuciones."],["Porque los programas concurrentes no se pueden compilar en modo de prueba.","Se compilan y ejecutan normalmente. El problema es la cantidad de ejecuciones posibles."],["Sí es factible, alcanza con correr el programa muchas veces.","Correrlo muchas veces repite los interleavings más probables y no garantiza encontrar el que falla."],["Porque el testing sólo sirve para programas con interfaz gráfica.","No tiene relación con la interfaz."]],"c":0,"r":"**No.** Los casos a testear **crecen exponencialmente** con la cantidad de hilos y de acciones, así que no se pueden probar todos los interleavings. Además, un error puede aparecer sólo en un interleaving muy específico e improbable que el testing nunca ejercita.\n\nEn general es muy difícil razonar sobre programas concurrentes, y el testing difícilmente pueda darnos confianza de que funcionan correctamente.","n":"A dos personas que respondieron \"sí\" les dieron el punto igual, pero el comentario de la cátedra dice que **no**: \"las instancias a testear crecen exponencialmente\". Respondé \"No\" y dá la razón."},
{"id":"testing-garantia","tema":"Testing, verificación y reactivos","src":"resumen de respuestas","ex":true,"q":"En un programa concurrente, ¿podría garantizar que es correcto realizando testing?","o":[["No: el testing muestra la presencia de errores, nunca su ausencia.","Correcta."],["Sí, si se corre el test las veces suficientes.","No: siempre puede faltar el interleaving que falla."],["Sí, si se testea en una máquina con un solo núcleo.","No: con un solo núcleo también hay interleaving, porque el scheduler desaloja hilos."],["Sí, siempre que no haya secciones críticas.","No: sin secciones críticas los errores de carrera son todavía más probables."]],"c":0,"r":"**No.** El testing puede mostrar la **presencia** de errores, pero nunca su **ausencia**. Cada corrida puede tener otro interleaving: un programa concurrente puede andar bien 10.000 veces y fallar una."},
{"id":"verif-automatica","tema":"Testing, verificación y reactivos","src":"2021 (x2)","ex":true,"q":"¿Cuál es una limitación de la verificación automática de software?","o":[["Decidir si un programa cualquiera termina no es computable, así que sólo se puede verificar automáticamente imponiendo restricciones.","Es el problema de la parada. Además hay que confiar en que el modelo sea correcto."],["Sólo se puede aplicar a programas secuenciales.","Justamente se usa para sistemas concurrentes, a través de modelos como las RdP."],["Necesita ejecutar el programa en todos los procesadores posibles.","La verificación razona sobre un modelo, no ejecuta el programa."],["No tiene limitaciones, siempre puede decidir cualquier propiedad.","Hay propiedades indecidibles, como la terminación."]],"c":0,"r":"Tiene **serias limitaciones**. Por ejemplo, decidir si un programa dado **termina o no** no es computable (es el problema de la parada). Sólo si imponemos **restricciones** sobre las propiedades que queremos verificar, algunas tareas pueden verificarse automáticamente.\n\nOtras limitaciones que acepta la cátedra: la verificación se basa en un **modelo**, y el modelo tiene que ser correcto. Hay que terminar la codificación para empezar a testear, y si cambia la estructura del código hay que rehacer los casos. La fase más compleja es determinar las **trazas** particulares según las entradas y los estados del sistema."},
{"id":"grafo-semantica","tema":"Testing, verificación y reactivos","src":"2020","ex":true,"q":"La semántica de un programa concurrente se basa en los sistemas de transición de estados, que podemos representar con grafos dirigidos. ¿Qué representan los nodos? ¿Y las aristas?","o":[["Nodos: estados del sistema. Aristas: acciones atómicas (transiciones).","Correcta."],["Nodos: hilos. Aristas: locks.","No: el grafo es de estados, no de hilos."],["Nodos: acciones. Aristas: estados.","No: está al revés."],["Nodos: variables compartidas. Aristas: accesos a esas variables.","No: eso sería otro tipo de diagrama."]],"c":0,"r":"Los **nodos** representan los **estados** del sistema. Las **aristas** (arcos dirigidos) representan las **transiciones**, es decir, las **acciones atómicas** que llevan de un estado a otro.\n\nUna ejecución es un camino en ese grafo."},
{"id":"modelos-abstractos","tema":"Testing, verificación y reactivos","src":"2020 (x2)","ex":true,"q":"¿Por qué los modelos abstractos de un sistema tienen que representar datos, recursos, interacción con el medio y concurrencia?","o":[["Porque los sistemas que modelamos suelen ser reactivos y críticos, y para verificar seguridad y progreso el modelo tiene que representar esos aspectos.","Sin esas características no se podrían verificar las propiedades que importan."],["Porque así el programa se ejecuta más rápido.","El modelo no cambia la velocidad del programa. Sirve para verificarlo."],["Porque lo exige la sintaxis de Java.","No tiene relación con el lenguaje de implementación."],["Para poder eliminar el testing por completo.","La verificación sobre el modelo complementa al testing, que igual se hace."]],"c":0,"r":"Porque los sistemas que modelamos suelen ser **reactivos** y críticos: una falla puede tener consecuencias graves.\n\nPor eso se introducen mecanismos para verificar que el modelo satisface **condiciones de seguridad** y **propiedades de progreso**. Para poder verificarlas, el modelo tiene que representar los **datos**, la **asignación de recursos**, la **interacción con el usuario o el medio** y la **concurrencia**."},
{"id":"seguridad-progreso","tema":"Testing, verificación y reactivos","src":"2021","ex":true,"q":"¿Con qué se verifica que un modelo cumple condiciones de seguridad y propiedades de progreso?","o":[["Con modelado formal, por ejemplo redes de Petri y autómatas, verificando propiedades que valen en toda la ejecución.","Sobre el modelo se verifican exclusión mutua, sincronización, invariantes, persistencia y conflictos."],["Con casos de prueba elegidos al azar.","Eso es testing, y sólo cubre algunas ejecuciones."],["Con un depurador paso a paso.","El depurador sigue una sola ejecución."],["Midiendo el tiempo de ejecución.","El tiempo no dice nada sobre seguridad o progreso."]],"c":0,"r":"Con **modelado formal**: el sistema se modela con **Redes de Petri** y **autómatas**. Sobre el modelo se verifican propiedades que se cumplen a lo largo de toda la ejecución del programa: **exclusión mutua**, **sincronización**, **invariantes de recursos**, **invariantes de acciones**, **concurrencia**, **persistencia** y **conflicto**."},
{"id":"reactivo","tema":"Testing, verificación y reactivos","src":"2020, 2021 (x3), recup. 2021","ex":true,"q":"Indique qué caracteriza a un programa reactivo (variante: ¿cuál es su característica principal?)","o":[["Interactúa permanentemente con el ambiente, y no se espera que termine.","Correcta."],["Recibe una entrada, calcula y devuelve un resultado.","No: ese es un programa transformacional."],["Administra programas de gran abstracción.","No: esa respuesta sacó 0 en 2021."],["Siempre corre en paralelo en varios núcleos.","No: suele ser concurrente, pero lo que lo define es la interacción con el ambiente."]],"c":0,"r":"Su funcionalidad involucra la **interacción permanente con el ambiente** (y con otros procesos). En muchos casos **no computan un resultado**, y suele **no requerirse que terminen**.\n\nEjemplos: sistemas operativos, software de control, hardware."},
{"id":"starvation","tema":"Testing, verificación y reactivos","src":"2021 (x4), recup. 2021, 2023","ex":true,"q":"¿Qué entiende por starvation en un sistema de tiempo real? (variante: ¿cuándo se produce starvation?)","o":[["Cuando no se atienden las solicitudes de un proceso (hilo) en el tiempo en que se requiere la respuesta.","Correcta: es la definición textual de la cátedra."],["Cuando dos procesos se esperan mutuamente y ninguno avanza.","No: eso es deadlock. En la inanición el sistema sigue avanzando, pero un proceso nunca es atendido."],["Cuando hay exclusión mutua.","No: la exclusión mutua es necesaria. Esa respuesta sacó 0."],["Es la condición inicial en la que un sistema es reactivo.","No: esa respuesta también sacó 0."]],"c":0,"r":"Cuando **no se atienden las solicitudes de un proceso (hilo) en el tiempo en que se requiere la respuesta**.\n\nEn general, starvation (inanición) es que un proceso queda esperando indefinidamente un recurso que nunca obtiene, porque siempre se lo ganan otros.","n":"La cátedra puso esa misma frase en el comentario todas las veces; memorizala. En 2021 respondieron \"cuando hay exclusión mutua, errores en los algoritmos o fuga de recursos\" y sacaron 0."},
{"id":"hilo-bloqueo","tema":"Estados de hilos y procesos","src":"2020 (x2), 2021, recup. 2021","ex":true,"q":"Un hilo pasa a **bloqueado**. ¿De qué estado viene y a cuál va cuando se desbloquea?","o":[["Viene de ejecución y, al recibir la señal de desbloqueo, va a listo.","Correcta."],["Viene de listo y, al desbloquearse, va directo a ejecución.","No: sólo un hilo que se está ejecutando puede bloquearse (pide algo y no lo obtiene). Además, al desbloquearse vuelve a la cola de listos."],["Viene de nuevo y, al desbloquearse, termina.","No: un hilo recién creado pasa a listo con `start()`."],["Viene de ejecución y, al desbloquearse, va directo a ejecución.","No: al desbloquearse compite de nuevo desde la cola de listos."]],"c":0,"r":"**Viene de ejecución** (running). El hilo necesita esperar un suceso: un recurso ocupado, un lock, E/S o un `wait()`. La MV lo **saca del procesador** y lo deja **bloqueado**, sin consumir CPU, **esperando la señal de desbloqueo**. Mientras tanto la MV le da el procesador a otro hilo de la cola de listos.\n\nCuando llega la señal (se libera el recurso, un `notify()`, fin de la E/S), **va a listo/preparado**, no directamente a ejecución.","n":"En 2020 alguien describió \"el hilo entra a la sección crítica… y se bloquea\" y sacó 0. Comentario de la cátedra: \"Viene del estado ejecución; cuando recibe la señal de desbloqueo va a listo/preparado; lo que hace es esperar la condición de desbloqueo (señal)\"."},
{"id":"hilo-desbloqueo","tema":"Estados de hilos y procesos","src":"2020 (x2), 2021","ex":true,"q":"Cuando un hilo bloqueado recibe la señal de desbloqueo, ¿a qué estado pasa?","o":[["A listo, a la cola de listos, hasta que la MV le asigne el procesador.","Nunca vuelve directo a ejecución."],["Directo a ejecución.","Primero tiene que esperar en la cola de listos a que el planificador lo elija."],["A terminado.","El desbloqueo no termina el hilo."],["A nuevo, para volver a llamar a `start()`.","Un hilo no vuelve nunca al estado nuevo."]],"c":0,"r":"**Viene del estado bloqueado.** Cuando ocurre el suceso que esperaba (se libera el recurso, otro hilo hace `notify()`, termina la E/S), el hilo **recibe la señal de desbloqueo** y **pasa a listo/preparado**, a la cola de listos. Ahí espera a que la MV le asigne el procesador para volver a ejecución.","n":"Un comentario de 2021 dice \"recibe la señal de desbloqueo (viene de ejecución) y va a listo/preparado\", mezclando el bloqueo con el desbloqueo. Lo que la cátedra quiere oír: **señal de desbloqueo → listo/preparado**."},
{"id":"proc-bloqueo","tema":"Estados de hilos y procesos","src":"2021, resumen","ex":true,"q":"¿De qué estado viene un proceso que pasa a bloqueado, y qué hace el SO?","o":[["Viene de ejecución. El SO lo saca de la CPU mientras espera un evento (E/S, un recurso) y despacha otro proceso listo.","Mientras está bloqueado no consume procesador."],["Viene de listo. El SO lo bloquea antes de darle la CPU.","Un proceso se bloquea porque, al ejecutarse, pidió algo que no está disponible."],["Viene de nuevo. El SO lo bloquea hasta asignarle memoria.","Eso corresponde a la admisión, no al bloqueo."],["Viene de ejecución. El SO lo deja ocupando la CPU hasta que ocurra el evento.","Eso sería espera activa. El SO lo duerme para no gastar CPU."]],"c":0,"r":"**Viene de ejecución.** El proceso no puede avanzar porque necesita un evento: E/S, un recurso no disponible (variable, puerto de E/S, etc.). El SO lo saca de la CPU y lo deja **bloqueado (dormido)**, sin consumir procesador, y despacha otro proceso listo.\n\nCuando termina la operación u ocurre el evento, recibe la señal de desbloqueo y **pasa a listo/preparado**."},
{"id":"proc-desbloqueo","tema":"Estados de hilos y procesos","src":"2021 (x3)","ex":true,"q":"Un proceso bloqueado recibe la señal de desbloqueo. ¿A dónde va?","o":[["A listo, a esperar que el planificador le asigne la CPU.","De un estado de espera siempre se vuelve a listo."],["A ejecución, inmediatamente.","Tiene que esperar su turno en la cola de listos."],["A terminado.","El desbloqueo le permite seguir, no lo termina."],["Se queda bloqueado hasta que el usuario lo reanude.","La señal de desbloqueo es justamente lo que lo saca de ahí."]],"c":0,"r":"**Viene del estado bloqueado.** Cuando recibe la **señal de desbloqueo** (terminó la E/S, se liberó el recurso, ocurrió el evento), **va a listo/preparado**. Lo que hace mientras está bloqueado es **esperar la condición de desbloqueo (la señal)**.","n":"Comentario textual de la cátedra: \"Viene del estado bloqueado; cuando recibe la señal de desbloqueo va a listo/preparado; lo que hace es esperar la condición de desbloqueo (señal)\"."},
{"id":"hilo-creacion","tema":"Estados de hilos y procesos","src":"resumen","ex":true,"q":"Un objeto `Thread` recién creado, al que todavía no se le llamó `start()`, ¿en qué estado está y a dónde pasa?","o":[["Está en nuevo y, al llamar a `start()`, pasa a listo a esperar que lo elija el planificador.","`start()` no lo ejecuta en el acto, lo deja en la cola de listos."],["Está en ejecución desde que se crea el objeto.","Hasta que no se llama a `start()` el hilo no corre."],["Está bloqueado hasta que otro hilo haga `notify()`.","`notify()` no tiene relación con la creación."],["Está en nuevo y, al llamar a `start()`, pasa directo a ejecución.","Pasa a listo, no a ejecución."]],"c":0,"r":"Es el estado inicial, **nuevo**: el objeto `Thread` existe pero todavía no se llamó a `start()`. La MV le prepara sus estructuras propias: contador de programa, registros y pila.\n\nAl llamar a `start()` **pasa a listo** (la cola de listos). Todavía no se ejecuta: espera que el planificador lo elija."},
{"id":"proc-creacion","tema":"Estados de hilos y procesos","src":"resumen","ex":true,"q":"¿Qué hace el SO durante la creación de un proceso y a dónde pasa el proceso después?","o":[["Le arma su PCB y le asigna memoria y recursos. Cuando lo admite, pasa a listo.","Después el planificador lo elige para ejecución."],["Lo ejecuta una vez para probarlo y después lo bloquea.","El SO no ejecuta el proceso durante la creación."],["Le asigna la CPU directamente.","Primero pasa por listo."],["Lo pone en la cola de bloqueados.","No está esperando ningún evento."]],"c":0,"r":"Es el estado **nuevo**: el SO está creando el proceso, le arma su PCB y le asigna memoria y recursos. Cuando el SO lo admite, **pasa a listo/preparado** a esperar que el planificador le asigne la CPU; de ahí pasará a ejecución."},
{"id":"listo","tema":"Estados de hilos y procesos","src":"2023","ex":true,"q":"¿Desde qué estado **no** llega un hilo a listo para ejecutar?","o":[["Terminado (muerto).","Correcta: un hilo terminado no vuelve a correr, ni siquiera llamando otra vez a `start()`."],["Nuevo, después de start().","Sí llega: es el camino normal de un hilo recién creado."],["Bloqueado, al recibir la señal de desbloqueo.","Sí llega: al desbloquearse vuelve a listo."],["Ejecución, al perder el procesador.","Sí llega: por fin de quantum o por `yield()`."]],"c":0,"r":"Puede venir de tres estados:\n\n- **nuevo**: recién creado, después de `start()`\n- **bloqueado**: recibió la señal de desbloqueo\n- **ejecución**: le quitaron el procesador porque se le acabó el quantum o hizo `yield()`\n\nMientras está listo espera en la **cola de listos**. Cuando el planificador de la MV lo elige, **va a ejecución**.","n":"En 2023 respondieron \"viene de sleeping…\" y el comentario fue: \"¿Y si fue recientemente creado?\". Nombrá todos los orígenes posibles."},
{"id":"sc","tema":"Sección crítica, monitor, semáforo","src":"recup. 2021, captura 2021, 2020","ex":true,"q":"¿Qué es una sección crítica?","o":[["La región de código que accede a un recurso compartido y en la que no puede haber más de un hilo a la vez.","Se protege con exclusión mutua."],["La parte del programa que más tiempo consume.","La sección crítica se define por el acceso a recursos compartidos, no por el tiempo."],["El código que maneja las excepciones.","No tiene relación con las excepciones."],["La región donde se crean los hilos.","Crear hilos no implica acceder a un recurso compartido."]],"c":0,"r":"Es la región de código que **accede a un recurso compartido** y en la que **no puede ejecutarse más de un hilo o proceso a la vez**. Si eso pasara, puede haber comportamiento erróneo (el recurso se corrompe). Se protege con **exclusión mutua**."},
{"id":"sc-tiempo","tema":"Sección crítica, monitor, semáforo","src":"2021","ex":true,"q":"Dé una idea (comparativa) del tiempo de una sección crítica.","o":[["Unas 5 veces más lenta que el mismo código sin sincronizar.","Correcta: es el número que da la cátedra."],["Igual de rápida: sincronizar no tiene costo.","No: adquirir y liberar el lock cuesta, y además los hilos se serializan."],["Unas 1000 veces más lenta.","No: la cátedra da un orden de 5 veces."],["Más rápida, porque evita la competencia por la CPU.","No: sincronizar siempre agrega costo."]],"c":0,"r":"Una sección crítica es del orden de **5 veces más lenta** que el mismo código sin sincronizar.\n\nPor eso conviene tener **pocas** secciones críticas y que sean lo más **cortas** posible.","n":"La cátedra espera literalmente \"5 veces más lento\". A una respuesta que explicaba qué es una sección crítica le pusieron 0."},
{"id":"proteger","tema":"Sección crítica, monitor, semáforo","src":"2020 (x2)","ex":true,"q":"¿Cómo se protege un recurso compartido?","o":[["Encerrando su acceso en una sección crítica con exclusión mutua, con `synchronized`, locks, semáforos o monitores.","Así entra un solo hilo a la vez y el recurso no se corrompe."],["Declarando `static` la variable.","`static` sólo hace que la variable sea de la clase. La comparten todos los hilos sin ninguna protección."],["Dándole más prioridad al hilo que lo usa.","La prioridad no garantiza exclusión mutua."],["Agregando un `sleep()` antes de usarlo.","Un `sleep()` no impide que otro hilo acceda al mismo tiempo."]],"c":0,"r":"Definiendo una **sección crítica** alrededor del acceso al recurso y garantizando **exclusión mutua**, es decir, que entre un solo hilo a la vez. Se hace con `synchronized`, locks, semáforos o monitores. Así el recurso no se corrompe."},
{"id":"ejemplo-recursos","tema":"Sección crítica, monitor, semáforo","src":"resumen","ex":true,"q":"¿Cuál de estos es un recurso compartido que hay que proteger?","o":[["Un buffer productor-consumidor al que acceden varios hilos.","Varios hilos lo leen y lo modifican, así que necesita exclusión mutua."],["Una variable local de un método.","Cada hilo tiene su propia copia en su pila, así que no se comparte."],["Una constante `final` de un tipo inmutable.","Nadie la modifica, así que no hay carrera."],["Un parámetro que recibe un método.","También vive en la pila de cada hilo."]],"c":0,"r":"Variables compartidas (por ejemplo, un contador), estructuras de datos (listas, colas, un buffer productor-consumidor), archivos, puertos de E/S, una impresora, una conexión a base de datos."},
{"id":"synchronized","tema":"Sección crítica, monitor, semáforo","src":"2020 (x2), 2021","ex":true,"q":"Dos hilos ejecutan `synchronized(a){…}` y `synchronized(b){…}` con `a != b`. ¿Qué pasa?","o":[["Pueden ejecutar los dos bloques al mismo tiempo, porque usan locks distintos.","Correcta: la exclusión es por objeto. Por eso el argumento importa."],["Se excluyen igual, porque los dos bloques son synchronized.","No: el lock es el del objeto del argumento, no uno global."],["Hay deadlock seguro.","No: con un solo lock por hilo no hay espera circular."],["No compila: sólo se puede sincronizar sobre `this`.","No: se puede sincronizar sobre cualquier objeto."]],"c":0,"r":"`synchronized` define una **sección crítica**: sólo un hilo por vez puede ejecutar un bloque sincronizado sobre el mismo objeto.\n\nEl **argumento** es el objeto cuyo **lock** (monitor intrínseco) se usa como llave. Todo objeto hereda de `Object` y tiene uno. El hilo que entra toma el lock y lo devuelve al salir; los demás que quieran entrar a un bloque sincronizado sobre **ese mismo objeto** quedan dormidos hasta que se libere. Dos bloques sincronizados sobre objetos distintos **no** se excluyen.\n\nSe recomienda un `Object` dedicado (`private final Object lock = new Object();`) y no wrappers como `Integer`, que se reemplazan o comparten y rompen la exclusión."},
{"id":"monitor","tema":"Sección crítica, monitor, semáforo","src":"2020 (x2), 2021","ex":true,"q":"¿Qué es un monitor?","o":[["Un módulo de alto nivel que encapsula los datos compartidos y sus procedimientos, garantiza exclusión mutua y sincroniza con variables de condición.","Hay un solo hilo adentro a la vez, y los que esperan duermen en colas de condición."],["Un contador de permisos con una cola de espera.","Eso es un semáforo."],["Un programa que mide el uso de CPU de los hilos.","Ese es otro significado de la palabra, no el de la materia."],["Un hilo que vigila a los demás y los termina si se traban.","El monitor no es un hilo, es una estructura que usan los hilos."]],"c":0,"r":"Es una **herramienta (módulo) de alto nivel** para la **gestión de recursos** que se usan concurrentemente. Encapsula los datos compartidos junto con los procedimientos que los acceden. Garantiza **exclusión mutua** (un solo hilo adentro a la vez) y da **sincronización** con variables de condición: colas donde duermen los hilos que esperan."},
{"id":"monitor-ventaja","tema":"Sección crítica, monitor, semáforo","src":"2021 (x3)","ex":true,"q":"¿Qué ventaja tiene un monitor?","o":[["Centraliza la gestión de los hilos: exclusión mutua y sincronización quedan en una misma estructura.","Correcta: es la respuesta de la cátedra."],["Hace que el programa se ejecute en paralelo.","No: un monitor serializa el acceso, no agrega paralelismo."],["Elimina la necesidad de wait() y notify().","No: el monitor los usa para sincronizar."],["Evita cualquier deadlock automáticamente.","No: un monitor mal diseñado también puede trabarse."]],"c":0,"r":"Por ser un **patrón de alto nivel** y **centralizar la gestión de los hilos**, mantiene todos los mecanismos (exclusión mutua, sincronización, etc.) **en la misma estructura**. Las secciones críticas no quedan desparramadas por el código, que resulta más claro y fácil de controlar.","n":"Es el comentario textual de la cátedra. Usá las palabras \"centraliza\" y \"misma estructura\"."},
{"id":"semaforo","tema":"Sección crítica, monitor, semáforo","src":"2020, 2023","ex":true,"q":"¿Qué es un semáforo?","o":[["Una herramienta de sincronización con un contador de permisos y una cola donde duermen los hilos que esperan.","`acquire()` decrementa o bloquea, y `release()` incrementa y despierta a uno."],["Un objeto que sólo puede liberar el hilo que lo tomó.","Eso describe a un Lock. El semáforo no tiene dueño."],["Un módulo que encapsula datos y procedimientos con variables de condición.","Eso es un monitor."],["Una variable booleana que indica si un hilo terminó.","No alcanza con un booleano. Tiene contador y cola."]],"c":0,"r":"Es una **herramienta de sincronización** que permite proteger **uno o varios** recursos. Tiene un **contador** (la cantidad de permisos) y una **cola** donde se ponen a dormir los hilos que esperan acceder.\n\n`acquire()` decrementa el contador, o bloquea al hilo si está en 0. `release()` lo incrementa y despierta a un hilo de la cola.\n\nEn Java el constructor recibe **2 parámetros**: el número de permisos y un booleano de **fairness**.","n":"El comentario de 2023 pedía mencionar la cola y los 2 parámetros (recursos y fairness)."},
{"id":"tipos-semaforo","tema":"Sección crítica, monitor, semáforo","src":"resumen","ex":true,"q":"¿Qué tipos de semáforo conoce?","o":[["Binario y general (contador).","Correcta."],["Fuerte y débil.","No: eso habla de fairness, no del tipo de semáforo."],["Público y privado.","No: esos son modificadores de acceso."],["Rojo, amarillo y verde.","No."]],"c":0,"r":"**Binario**: toma sólo los valores 0 y 1; funciona como un mutex.\n\n**General (contador)**: toma cualquier valor entero no negativo; sirve para administrar N recursos iguales."},
{"id":"ownership","tema":"Sección crítica, monitor, semáforo","src":"resumen","ex":true,"q":"¿Qué diferencia hay entre un `Lock` y un `Semaphore` en cuanto a ownership (dueño)?","o":[["El Lock tiene dueño y sólo lo libera el hilo que lo tomó. El Semaphore no tiene dueño y cualquier hilo puede hacer `release()`.","Si otro hilo hace `unlock()` de un Lock, recibe `IllegalMonitorStateException`."],["Los dos tienen dueño.","El semáforo no lo tiene. Cualquier hilo con acceso puede liberar permisos."],["Ninguno de los dos tiene dueño.","El Lock sí lo tiene."],["El Semaphore tiene dueño y el Lock no.","Es al revés."]],"c":0,"r":"Ownership es la idea de **qué hilo puede liberar** la primitiva.\n\nUn **Lock tiene dueño**: sólo el hilo que lo tomó puede hacer `unlock()`; si lo intenta otro, recibe `IllegalMonitorStateException`.\n\nUn **Semaphore no tiene dueño**: cualquier hilo con acceso al semáforo puede hacer `release()`, aunque no haya hecho el `acquire()`."},
{"id":"wait","tema":"Java","src":"2020, 2021 (x3), 2023","ex":true,"q":"Explique cuáles son las acciones que realiza `wait()`.","o":[["Libera el lock del objeto, duerme hasta un notify y lo vuelve a adquirir antes de retornar.","Correcta."],["Duerme al hilo sin soltar el lock, como sleep().","No: esa es justamente la diferencia con `sleep()`, que no suelta el lock."],["Termina el hilo.","No: el hilo sigue vivo y continúa después del notify."],["Espera a que termine otro hilo.","No: eso es `join()`."]],"c":0,"r":"Le dice al hilo que lo llama que **libere el lock** del objeto (del monitor) y **se vaya a dormir** hasta que otro hilo entre al mismo monitor y llame a `notify()` o `notifyAll()`.\n\nAl despertar, **vuelve a adquirir el lock** antes de retornar. Por eso sólo se puede llamar teniendo el lock, dentro de un `synchronized` sobre ese objeto."},
{"id":"wait-precaucion","tema":"Java","src":"2021, recup. 2021, captura 2021","ex":true,"q":"Explique qué precaución tiene que tomar para incluir `wait()` en un código.","o":[["Ponerlo dentro de un try/catch, porque lanza InterruptedException.","Correcta: es lo que marca la cátedra en el comentario."],["Llamarlo siempre fuera de un bloque synchronized.","No: es al revés. Fuera de synchronized lanza IllegalMonitorStateException."],["Llamar antes a notify() en el mismo hilo.","No: el notify lo hace otro hilo para despertarlo."],["Ninguna: wait() no lanza excepciones.","No: lanza InterruptedException, que es checked."]],"c":0,"r":"Ponerlo dentro de un **`try { wait(); } catch (InterruptedException e) {…}`**, porque `wait()` lanza `InterruptedException`, que es checked.\n\nAdemás:\n- llamarlo **dentro de `synchronized`** sobre el mismo objeto (si no, `IllegalMonitorStateException`)\n- llamarlo dentro de un **`while`** que vuelva a chequear la condición\n- asegurarse de que **algún hilo haga `notify()`**; si no, el hilo duerme para siempre","n":"En todos los intentos, el comentario de la cátedra fue \"ponerlo entre un try { wait(); } catch\". Empezá por eso."},
{"id":"notify","tema":"Java","src":"2021","ex":true,"q":"¿Qué hace `notify()`?","o":[["Despierta a un solo hilo de los que hicieron `wait()` sobre el mismo objeto, sin liberar el lock.","El lock se suelta recién cuando el notificador sale del bloque sincronizado."],["Despierta a todos los hilos en espera.","Eso es `notifyAll()`."],["Libera el lock en el acto para que el despertado continúe.","`notify()` no libera el lock."],["Despierta siempre al hilo que esperó más tiempo.","No hay garantía de orden. Despierta a uno cualquiera."]],"c":0,"r":"**Despierta a un solo hilo** (cualquiera) de los que llamaron a `wait()` sobre el **mismo objeto**.\n\nLlamar a `notify()` **no libera el lock**. Le avisa a un hilo en espera que puede despertarse, pero el lock no se suelta hasta que el notificador sale del bloque sincronizado."},
{"id":"notifyall","tema":"Java","src":"resumen","ex":true,"q":"Después de un `notifyAll()`, ¿por qué cada hilo despertado tiene que volver a chequear su condición?","o":[["Porque se despiertan todos, compiten por el lock y entran de a uno, y cuando le toca a uno la condición puede haber cambiado.","Por eso el `wait()` va dentro de un `while`."],["Porque `notifyAll()` no despierta a nadie hasta que termina el programa.","Despierta a todos los que esperaban sobre ese objeto."],["Porque todos los despertados ejecutan a la vez dentro del bloque sincronizado.","Siguen entrando de a uno, porque necesitan el lock."],["No hace falta, `notifyAll()` garantiza que la condición se cumple.","No garantiza nada sobre la condición, sólo despierta."]],"c":0,"r":"Despierta a **todos** los hilos que llamaron a `wait()` sobre ese objeto. Compiten por el lock y van entrando de a uno, así que cada uno tiene que volver a chequear su condición (por eso el `while`)."},
{"id":"checked","tema":"Java","src":"2023","ex":true,"q":"Explique las diferencias entre las excepciones CHECKED y UNCHECKED.","o":[["Las checked se controlan en compilación; las unchecked aparecen en ejecución.","Correcta."],["Las checked son más graves que las unchecked.","No: la gravedad no tiene nada que ver."],["Las unchecked no se pueden capturar con try/catch.","No: se pueden capturar; lo que pasa es que no es obligatorio."],["Las checked sólo ocurren en programas concurrentes.","No: `IOException` es checked y aparece en cualquier programa."]],"c":0,"r":"La diferencia está en el **momento en que se controlan**.\n\nLas **checked** se verifican **en compilación**: el compilador obliga a capturarlas con `try/catch` o a declararlas con `throws`. Ejemplos: `IOException`, `InterruptedException`.\n\nLas **unchecked** (subclases de `RuntimeException`) aparecen **en ejecución** y no hay obligación de tratarlas. Ejemplos: `NullPointerException`, `ArithmeticException`.\n\nEn hilos: `run()` no puede declarar checked. Las unchecked que nadie captura se manejan con un `UncaughtExceptionHandler`.","n":"En 2023 respondieron \"si la condición de la excepción fue chequeada o no\" y sacaron 0. Comentario: \"las checked son verificadas en compilación, las otras en ejecución\"."},
{"id":"daemon","tema":"Java","src":"resumen","ex":true,"q":"En un programa con un hilo main, múltiples hilos productores y dos hilos daemon, indique cuándo finaliza la ejecución del programa y por qué.","o":[["Cuando terminan el main y todos los productores; los daemon se cortan solos.","Correcta."],["Cuando termina el main, aunque sigan los productores.","No: los productores son no-daemon y mantienen viva a la JVM."],["Cuando terminan los dos daemon.","No: la JVM no espera a los daemon."],["Nunca, porque los daemon no terminan.","No: la JVM los mata cuando sólo quedan ellos."]],"c":0,"r":"Finaliza cuando **terminan todos los hilos no-daemon**: el main y todos los productores.\n\nLos daemon no mantienen viva a la JVM. Cuando los únicos hilos vivos son daemons, la JVM **los termina** y cierra el programa; no espera a que terminen solos.","n":"La respuesta de la carpeta agrega \"porque los daemons tienen mínima prioridad y no finalizan nunca\". La prioridad no tiene nada que ver: la razón es que la JVM no espera a los daemon."},
{"id":"threadlocal","tema":"Java","src":"resumen","ex":true,"q":"¿Cuándo conviene usar una variable `ThreadLocal`?","o":[["Cuando varios hilos ejecutan el mismo `Runnable` y cada uno necesita su propia copia de un atributo, como la fecha de inicio.","Cada hilo ve sólo su valor y no hace falta sincronizar."],["Cuando todos los hilos tienen que ver y modificar el mismo valor.","Para eso hace falta un atributo compartido y sincronizado."],["Para que una variable sea visible enseguida para todos los hilos.","Eso lo da `volatile`."],["Para que un hilo sea daemon.","No tiene relación con los daemon."]],"c":0,"r":"Cuando varios hilos ejecutan **el mismo objeto `Runnable`** (la misma tarea) pero cada uno necesita **su propia copia** de un atributo. El ejemplo del práctico es la fecha de inicio de cada hilo (`startDate`).\n\nSi fuera un atributo común, los hilos se lo pisarían. Con `ThreadLocal<T>`, cada hilo ve y modifica **sólo su valor**, ningún hilo ve el del otro, y no hace falta sincronizar."},
{"id":"lenguaje","tema":"Lenguajes y gramáticas","src":"2020 (x2), 2021 (x3), recup. 2021","ex":true,"q":"¿Qué relación hay entre un lenguaje y una gramática?","o":[["La gramática es la sintaxis del lenguaje. Define qué cadenas son válidas, o sea, genera el lenguaje.","El lenguaje además tiene semántica, el significado de sus cadenas."],["La gramática reconoce el lenguaje y el autómata lo genera.","Es al revés. La gramática genera y el autómata reconoce."],["Son lo mismo, dos nombres para el conjunto de cadenas.","El lenguaje es el conjunto de cadenas y la gramática, las reglas que lo generan."],["La gramática define el significado de las cadenas.","Eso es la semántica. La gramática es la sintaxis."]],"c":0,"r":"Un **lenguaje** es un conjunto de cadenas de símbolos de un alfabeto (palabras, oraciones, textos o frases).\n\nLos lenguajes están compuestos por **sintaxis**, que es la **gramática**: define qué secuencias de símbolos forman cadenas válidas del lenguaje. Y por **semántica**: el significado de las cadenas que lo componen.\n\nLa gramática **genera** el lenguaje.","n":"Es la pregunta que más se repite. El comentario de la cátedra es siempre el texto de arriba (sintaxis + semántica). En 2021 alguien dijo \"conjunto de alfabetos y cadenas… gramáticas tipo 0, 1 o 2\" y sacó 0."},
{"id":"gramatica","tema":"Lenguajes y gramáticas","src":"2021, captura 2020","ex":true,"q":"¿Cuál es la cuádrupla que define una gramática?","o":[["G = (V_{T}, V_{N}, S, P)","Correcta: terminales, no terminales, símbolo inicial y producciones."],["G = (Q, Σ, δ, q_{0}, F)","No: esa es la quíntupla de un autómata finito."],["G = (E, S, Q, q_{0}, f, g)","No: esa es la 6-upla de Mealy y Moore."],["G = (V_{T}, S, P)","No: faltan los no terminales V_{N}."]],"c":0,"r":"Es un ente formal para especificar, de manera **finita**, el conjunto de cadenas de símbolos que constituyen un lenguaje. Es una **cuádrupla G = (V_{T}, V_{N}, S, P)**:\n\n- V_{T}: conjunto finito de símbolos terminales\n- V_{N}: conjunto finito de símbolos no terminales\n- S ∈ V_{N}: símbolo inicial\n- P: reglas de producción (de derivación)\n\nEntre las reglas de producción de una gramática y un autómata **del mismo tipo** hay una **relación biunívoca**: tipo 0 con la máquina de Turing, 1 con el ALA, 2 con el autómata a pila y 3 con el autómata finito."},
{"id":"automata","tema":"Lenguajes y gramáticas","src":"2020 (x2), resumen","ex":true,"q":"¿Qué relación hay entre un autómata y una gramática?","o":[["La gramática genera un lenguaje y el autómata lo reconoce. Para cada gramática hay un autómata que acepta las mismas palabras.","Por ejemplo, para tipo 3 un autómata finito y para tipo 0 una máquina de Turing."],["El autómata genera el lenguaje y la gramática lo reconoce.","Es al revés."],["No tienen relación, son teorías independientes.","La jerarquía de Chomsky las relaciona directamente."],["Sólo hay autómatas para las gramáticas regulares.","Hay un tipo de autómata para cada nivel de la jerarquía."]],"c":0,"r":"Un **autómata** es un sistema (una máquina abstracta) que recibe información en forma de símbolos, la transforma según su estado y produce otra información que transmite al entorno.\n\nLa **gramática genera** un lenguaje y el **autómata lo reconoce**. Dada una gramática (sus reglas de producción), siempre es posible encontrar un autómata que reconozca las mismas palabras que ella genera. Si el lenguaje es de tipo 0, lo reconoce un autómata de tipo 0 (máquina de Turing), y así con cada tipo.","n":"En 2020 contestaron \"un autómata es una máquina que posee 6 estados\" y les pusieron 1 igual, pero el comentario de la cátedra dio la definición de arriba. Mealy y Moore son 6-uplas, que no es lo mismo que \"6 estados\"."},
{"id":"tipo1","tema":"Lenguajes y gramáticas","src":"2021 (x2)","ex":true,"q":"Un lenguaje de tipo 1 lo genera una gramática ___ y lo reconoce ___.","o":[["sensible al contexto / un autómata lineal acotado","Correcta."],["independiente del contexto / un autómata a pila","No: eso es tipo 2."],["regular / un autómata finito","No: eso es tipo 3."],["sin restricciones / una máquina de Turing","No: eso es tipo 0."]],"c":0,"r":"Un lenguaje de tipo 1 es el generado por una gramática **sensible (dependiente) al contexto**. Sus reglas tienen la forma **α_{1} A α_{2} → α_{1} β α_{2}**, con A ∈ V_{N} y β ≠ λ.\n\nEs decir, A sólo puede reemplazarse por β **cuando aparece en el contexto** indicado: α_{1} a su izquierda y α_{2} a su derecha. Lo reconoce un **autómata lineal acotado**."},
{"id":"tipo2-vs-tipo1","tema":"Lenguajes y gramáticas","src":"resumen","ex":true,"q":"¿Por qué una gramática de tipo 2 tiene menos capacidad de expresión que una de tipo 1?","o":[["Porque sustituye un no terminal sin mirar el contexto (A → β), mientras que la de tipo 1 puede condicionar la sustitución a lo que hay alrededor.","Toda gramática tipo 2 es tipo 1, no al revés. En autómatas es la pila contra el autómata lineal acotado."],["Porque tiene menos símbolos terminales.","La capacidad no depende de la cantidad de símbolos."],["Porque no puede tener reglas recursivas.","Las de tipo 2 sí pueden ser recursivas, como la de a^{n}b^{n}."],["Al revés, la de tipo 2 es más expresiva que la de tipo 1.","En la jerarquía de Chomsky, a menor número, más expresividad."]],"c":0,"r":"La gramática de tipo 2 (independiente del contexto) sustituye un no terminal **sin mirar el contexto** (A → β). La de tipo 1 puede condicionar la sustitución a lo que hay alrededor (α_{1}Aα_{2} → α_{1}βα_{2}). Toda gramática tipo 2 es tipo 1, pero no al revés: es la jerarquía de Chomsky.\n\n**La relación con los autómatas:** el tipo 2 se corresponde con el **autómata a pila**, que lee la entrada en un solo sentido y sólo accede al tope de la pila (su transición es q × e × z → q × z*). El tipo 1 se corresponde con el **autómata lineal acotado**, que lee y escribe la cinta y se mueve a izquierda o derecha (q × Γ → q × Γ × {I, D, S}).\n\nEjemplo: a^{n}b^{n}c^{n} es tipo 1 y no es tipo 2."},
{"id":"anbn-gram","tema":"Lenguajes y gramáticas","src":"2020, resumen","ex":true,"q":"¿Con qué tipo de gramática puede derivar la siguiente fórmula? { a^{n} b^{n} : n ≥ 1 }","o":[["Tipo 2","Correcta: S → aSb | ab. Hace falta contar, así que no alcanza con una regular."],["Tipo 3","No: una gramática regular no puede garantizar que haya tantas a como b."],["Tipo 1","Una tipo 1 también la genera, pero la cátedra espera el tipo más restrictivo: tipo 2."],["Tipo 0","Una tipo 0 también la genera, pero es excesivo. La respuesta esperada es tipo 2."]],"c":0,"r":"Con una gramática de **tipo 2** (independiente del contexto). Por ejemplo: S → aSb | ab.","n":"En 2020 alguien respondió \"tipo 1\" y le dieron el punto, pero el comentario de la cátedra dice \"Tipo 2\". Respondé con el tipo más restrictivo que alcanza."},
{"id":"anbm-raro","tema":"Lenguajes y gramáticas","src":"recup. 2021, 2021","ex":true,"q":"¿Con qué tipo de gramática se puede derivar { a^{n} b^{m} : n ≥ 1, n ≥ m ≥ n }? (la respuesta que espera la cátedra)","o":[["Tipo 1.","Es la que aceptó la cátedra. En rigor la condición obliga a que m = n, así que el lenguaje es a^{n}b^{n}, que es tipo 2 y por lo tanto también tipo 1."],["Tipo 3.","No es regular, porque hay que contar cuántas a vinieron."],["Tipo 2.","En rigor es correcto, pero quienes lo respondieron sacaron 0. La cátedra esperaba tipo 1."],["Tipo 0, porque no se puede con ninguna otra.","Alcanza con un tipo menos general."]],"c":0,"r":"La cátedra espera **Tipo 1**.","n":"Dos personas respondieron \"tipo 2\" y sacaron 0; el comentario fue \"Tipo 1\". En rigor, n ≥ m ≥ n obliga a que m = n, así que el lenguaje es a^{n}b^{n}, que es tipo 2. Probablemente la cátedra la pensó como un caso \"dependiente del contexto\". Si te toca, respondé **Tipo 1**; si querés, agregá la aclaración."},
{"id":"anbn-af","tema":"Autómatas y máquinas","src":"2021, captura 2021, resumen","ex":true,"q":"¿Se puede reconocer { a^{n} b^{n} : n ≥ 1 } con un autómata finito?","o":[["No, porque habría que recordar cuántas a entraron y el autómata finito sólo tiene memoria finita.","Hace falta un autómata a pila."],["Sí, con un estado por cada a.","Haría falta un estado por cada n posible, o sea infinitos."],["Sí, si el autómata es no determinista.","El no determinismo no le agrega memoria a un autómata finito."],["No, hace falta una máquina de Turing.","Alcanza con un autómata a pila."]],"c":0,"r":"**No.** Para aceptar habría que recordar cuántas a entraron y verificar que después vengan la misma cantidad de b. Un autómata finito tiene memoria **finita** (sólo sus estados) y no tiene dónde guardar ese conteo, que no está acotado. Hace falta un **autómata a pila**."},
{"id":"anbn-pila","tema":"Autómatas y máquinas","src":"2020 (x2), 2021","ex":true,"q":"¿Cómo reconoce un autómata a pila el lenguaje { a^{n} b^{n} : n ≥ 1 }?","o":[["Apila un símbolo por cada a y desapila uno por cada b. Si al final la pila quedó en el fondo, acepta.","La pila funciona como un contador no acotado."],["No puede, hace falta una máquina de Turing.","Es el ejemplo típico de lenguaje que sí reconoce un autómata a pila."],["Cuenta las a en un estado y las b en otro.","Con estados no alcanza, porque el conteo no está acotado."],["Apila las b y desapila las a.","Las a vienen primero, así que son las que se apilan."]],"c":0,"r":"**Sí.** Por cada **a** que entra se **apila** un símbolo, y por cada **b** se **desapila** uno. Si al terminar la entrada la pila quedó vacía (en el fondo), la cadena se acepta. La pila funciona como un contador no acotado.","n":"Comentario de la cátedra en 2020: \"¿Y la respuesta a la pregunta?… la cual es sí\". Arrancá con Sí o No y después explicá."},
{"id":"anbn-cual","tema":"Autómatas y máquinas","src":"2021, 2020","ex":true,"q":"¿Con qué tipo de autómata puede derivar la siguiente fórmula? { a^{n} b^{n} : n ≥ 1 }","o":[["Autómata a pila","Correcta: apila por cada a y desapila por cada b."],["Autómata finito determinista","No: no puede contar."],["Máquina de Moore","No: es una máquina de estados finitos, así que tampoco puede contar."],["Autómata finito no determinista","No: el no determinismo no le da memoria extra; reconoce lo mismo que un AFD."]],"c":0,"r":"Con un **autómata a pila**, que reconoce los lenguajes de tipo 2."},
{"id":"anbm-af","tema":"Autómatas y máquinas","src":"2021, resumen","ex":true,"q":"¿Con qué tipo de autómata puede derivar la siguiente fórmula? { a^{n} b^{m} : n ≥ 1, m ≥ 0 }","o":[["Autómata finito (AFND)","Correcta: es a^{+}b^{*}, un lenguaje regular."],["Autómata a pila","Funciona, pero sobra: no hay nada que contar. La cátedra esperaba AFND."],["Autómata lineal acotado","Sobra: es un lenguaje regular."],["Ninguno: no es reconocible","No: es regular."]],"c":0,"r":"Con un **autómata finito** (la cátedra puso **AFND**). Como n y m son independientes, no hace falta contar: el lenguaje es a^{+}b^{*}, que es regular (tipo 3).","n":"Alguien respondió \"a^n y b^m\" y sacó 0; el comentario fue \"AFND\"."},
{"id":"pila-vs-af","tema":"Autómatas y máquinas","src":"2020 (x2)","ex":true,"q":"¿Por qué un autómata a pila es más potente que un autómata finito?","o":[["Porque tiene una memoria auxiliar no acotada, la pila, que le permite contar.","Por eso reconoce los lenguajes tipo 2, como a^{n}b^{n}."],["Porque puede moverse en los dos sentidos de la entrada.","El autómata a pila también lee en un solo sentido."],["Porque puede escribir sobre la cinta de entrada.","Eso lo hace la máquina de Turing."],["Porque tiene más estados.","La cantidad de estados sigue siendo finita. La diferencia es la pila."]],"c":0,"r":"Porque tiene una **memoria auxiliar no acotada**: la pila. Puede \"contar\" y recordar lo que leyó, algo que un AF, con memoria finita (sólo sus estados), no puede hacer.\n\nPor eso reconoce los lenguajes independientes del contexto (tipo 2), como a^{n}b^{n}, además de todos los regulares (tipo 3)."},
{"id":"turing-vs-pila","tema":"Autómatas y máquinas","src":"2021, resumen","ex":true,"q":"¿Por qué una máquina de Turing es más potente que un autómata a pila?","o":[["Porque tiene una cinta infinita donde lee y escribe y se mueve en los dos sentidos, mientras que la pila sólo accede al tope.","La MT reconoce los lenguajes tipo 0 y la pila, los tipo 2."],["Porque tiene más estados.","La potencia viene del tipo de memoria, no de la cantidad de estados."],["Porque es determinista.","También hay máquinas de Turing no deterministas, y son equivalentes."],["No es más potente, son equivalentes.","La pila no reconoce, por ejemplo, a^{n}b^{n}c^{n}."]],"c":0,"r":"La máquina de Turing tiene una **cinta infinita** en la que **lee y escribe**, y el cabezal se **mueve en ambos sentidos**. El autómata a pila lee la entrada **en un solo sentido**, sin escribir en ella, y a su memoria sólo accede por el **tope** (LIFO).\n\nLa MT reconoce los lenguajes de tipo 0; la pila, los de tipo 2."},
{"id":"turing-vs-ala","tema":"Autómatas y máquinas","src":"2020 (x2), 2021 (x2)","ex":true,"q":"¿Por qué una máquina de Turing es más potente que un autómata lineal acotado?","o":[["Porque la cinta del ALA está acotada por la entrada (# y $) y la de la MT es infinita.","Correcta: el ALA es una MT con la cinta acotada."],["Porque el ALA no puede escribir en la cinta.","No: el ALA sí lee y escribe. Lo que tiene limitado es el largo de la cinta."],["Porque el ALA sólo tiene una pila.","No: el que tiene pila es el autómata a pila (tipo 2)."],["Porque la MT es determinista y el ALA no.","No: el determinismo no es lo que los distingue."]],"c":0,"r":"Porque la MT **no tiene cotas**: su cinta es infinita. El ALA es una máquina de Turing cuya cinta está **acotada** a izquierda y derecha por marcas (# y $), al largo de la entrada, y el cabezal no puede salir de esos límites. Por eso el ALA reconoce el tipo 1 y no puede representar todos los lenguajes de tipo 0.\n\nPara programas reales, con memoria acotada, en la práctica son **equivalentes**.","n":"La corrección no fue uniforme. En 2020 el comentario usó \"MT: lectura/escritura en ambos sentidos; ALA: sólo lectura, un sentido, cinta finita\", pero eso describe más bien un autómata finito, no un ALA. En 2021, a una respuesta de ese estilo le pusieron 0 con este comentario: \"una MT es un programa con instrucciones… un ALA es una MT con una cinta finita, por lo que son equivalentes\". Lo más seguro es decir que la diferencia es la cinta acotada y agregar que, con memoria finita, son en la práctica equivalentes."},
{"id":"prog-turing","tema":"Autómatas y máquinas","src":"2021 (x2), captura 2021","ex":true,"q":"¿Un programa puede ser expresado por una máquina de Turing?","o":[["Sí, todo algoritmo tiene una máquina de Turing que lo implementa, según la tesis de Church-Turing.","La MT es el modelo de cómputo más general."],["No, la máquina de Turing sólo reconoce lenguajes regulares.","Reconoce los de tipo 0, los más generales."],["Sólo si el programa no tiene bucles.","La MT puede expresar bucles, y también puede no terminar."],["Sólo los programas concurrentes.","La tesis habla de cualquier algoritmo."]],"c":0,"r":"**Sí.** Todo programa (todo algoritmo) tiene una máquina de Turing asociada que lo implementa: es la tesis de Church-Turing. La MT es el modelo de cómputo más general."},
{"id":"prog-pila","tema":"Autómatas y máquinas","src":"recup. 2021, resumen","ex":true,"q":"¿Un programa cualquiera puede ser expresado por un autómata a pila?","o":[["No, la pila sólo reconoce lenguajes tipo 2, y un programa general necesita la potencia de una máquina de Turing.","Por ejemplo, no reconoce a^{n}b^{n}c^{n}."],["Sí, porque la pila es una memoria infinita.","La memoria es infinita, pero sólo se accede al tope, y eso la limita."],["Sí, si el programa es determinista.","El determinismo no cambia la limitación de la pila."],["Sí, cualquier autómata puede expresar cualquier programa.","Cada autómata tiene un poder distinto según la jerarquía."]],"c":0,"r":"**No.** El autómata a pila sólo accede al tope de su memoria y lee la entrada en un sentido. Reconoce los lenguajes de tipo 2, pero no los de tipo 1 ni 0 (por ejemplo, a^{n}b^{n}c^{n}). Un programa general necesita la potencia de una máquina de Turing.","n":"En el recuperatorio 2021 respondieron \"Sí, cualquier programa puede ser expresado por un autómata pila\" y sacaron 0."},
{"id":"prog-ala","tema":"Autómatas y máquinas","src":"2021","ex":true,"q":"¿Cualquier programa real puede expresarse con un autómata lineal acotado?","o":[["Sí, porque un ALA es una máquina de Turing con la cinta acotada y los programas reales están acotados en código y memoria.","Es la respuesta que acepta la cátedra."],["No, sólo los programas sin bucles.","Los bucles no son el problema. Lo que importa es que la memoria esté acotada."],["No, un ALA tiene la misma potencia que un autómata finito.","Un ALA reconoce los lenguajes tipo 1, mucho más que los regulares."],["Sólo si el programa usa una pila.","No tiene relación con usar una pila."]],"c":0,"r":"**Sí.** Un ALA es una máquina de Turing con la cinta acotada. Como los programas reales están acotados en código y en memoria, pueden expresarse con un ALA."},
{"id":"afnd","tema":"Autómatas y máquinas","src":"2023","ex":true,"q":"¿Cuál es la principal característica de un autómata finito NO determinístico?","o":[["Desde algún estado, un mismo símbolo tiene más de una transición posible.","Correcta."],["Reconoce más lenguajes que un AFD.","No: son equivalentes, porque todo AFND se puede convertir en AFD."],["Tiene una pila.","No: ese es el autómata a pila."],["No tiene estados finales.","No: tiene estados de aceptación como cualquier autómata finito."]],"c":0,"r":"Tiene al menos un estado en el que, **para un mismo símbolo del alfabeto, hay más de una transición posible** (también puede tener transiciones λ).\n\nAun así reconoce los mismos lenguajes que un AFD, los regulares: todo AFND puede convertirse en un AFD equivalente."},
{"id":"moore-salida","tema":"Autómatas y máquinas","src":"2023, resumen","ex":true,"q":"En una máquina de Moore, ¿con qué está relacionado el símbolo de salida?","o":[["Con el estado en el que se encuentra.","Correcta: g: Q → S."],["Con el estado y con la entrada.","No: esa es la máquina de Mealy."],["Con la gramática que esté utilizando.","No: esa respuesta sacó 0 en 2023."],["Sólo con la entrada.","No: sería un circuito combinacional, sin estado."]],"c":0,"r":"Con el **estado** en el que se encuentra la máquina: g: Q → S. En cambio, en Mealy la salida depende del estado **y** de la entrada: g: E × Q → S.","n":"En 2023 respondieron \"con la gramática que esté utilizando\" y sacaron 0."},
{"id":"mealy-moore-estados","tema":"Autómatas y máquinas","src":"resumen","ex":true,"q":"¿Qué máquina tiende a tener menos estados para reconocer una misma fórmula, MEALY o MOORE? ¿Por qué?","o":[["Mealy, porque su salida depende del estado y de la entrada.","Correcta."],["Moore, porque su salida depende sólo del estado.","No: justamente por eso Moore necesita más estados."],["Tienen siempre la misma cantidad.","No: son igual de expresivas, pero Mealy suele necesitar menos estados."],["Mealy, porque no tiene estados finales.","No: esa no es la razón."]],"c":0,"r":"**Mealy.** Genera su salida en función del estado actual **y** de la entrada, así que una misma transición puede dar salidas distintas sin necesidad de estados extra. Moore asocia la salida al estado, y necesita un estado por cada salida distinta."},
{"id":"mealy-moore-segura","tema":"Autómatas y máquinas","src":"resumen","ex":true,"q":"¿Qué máquina es más segura de utilizar, MEALY o MOORE? ¿Por qué?","o":[["Moore, porque su salida cambia sincronizada con el estado (flanco del reloj).","Correcta."],["Mealy, porque tiene menos estados.","No: tener menos estados no la hace más segura. Su salida sigue directamente a la entrada."],["Son igual de seguras.","No: la salida de Mealy es sensible a los cambios transitorios de la entrada."],["Mealy, porque reacciona más rápido.","Reacciona más rápido, pero justamente eso la hace menos segura."]],"c":0,"r":"**Moore.** Su salida depende sólo del estado, así que cambia **sincronizada** con el cambio de estado, en el flanco del reloj (un ciclo más tarde). No reacciona a cambios transitorios ni a glitches de la entrada. En Mealy, la salida puede cambiar en cuanto cambia la entrada."},
{"id":"deadlock-livelock","tema":"Testing, verificación y reactivos","src":"apunte","ex":false,"q":"Dos hilos detectan que el otro quiere el recurso, se lo ceden y vuelven a intentar, una y otra vez, consumiendo CPU sin que ninguno termine. ¿Qué problema es?","o":[["Livelock.","Correcta: están activos, pero ninguno progresa."],["Deadlock.","No: en un deadlock los procesos están bloqueados y no consumen CPU."],["Starvation.","No: en la inanición el sistema avanza y sólo uno queda postergado. Acá no avanza nadie."],["Condición de carrera.","No: no hay un dato corrompido por el intercalado. El problema es de progreso."]],"c":0,"r":"- **Deadlock** (interbloqueo): dos o más procesos **esperan mutuamente** a que el otro avance. Están bloqueados, no consumen CPU y nadie avanza.\n- **Livelock**: los procesos **no están bloqueados**. Siguen ejecutando y reaccionando a los cambios de los otros, pero **ninguno progresa** (dos personas que se corren para el mismo lado en un pasillo).\n- **Starvation** (inanición): el sistema en conjunto **sí avanza**, pero uno o más procesos esperan **indefinidamente** un recurso o un mensaje que siempre se le da a otro."},
{"id":"req-exclusion","tema":"Testing, verificación y reactivos","src":"apunte","ex":false,"q":"¿Cuál de estos requisitos de la exclusión mutua es una propiedad de seguridad?","o":[["Nunca hay más de un proceso en su sección crítica por el mismo recurso.","Correcta: dice que algo malo no ocurre nunca."],["Un proceso que pide entrar no es demorado indefinidamente.","No: es de progreso (algo bueno termina ocurriendo)."],["Si la SC está libre, quien pide entrar lo hace sin demora.","No: es de progreso."],["Cada proceso permanece en la SC un tiempo finito.","No: es de progreso, y es responsabilidad del programador."]],"c":0,"r":"Los seis requisitos de Stallings:\n- **Exclusión mutua**: un solo proceso a la vez en su SC por el mismo recurso.\n- Un proceso que se detiene **fuera** de su SC no debe interferir con los demás.\n- **Sin demora indefinida**: ni interbloqueo ni inanición.\n- Si nadie está en la SC, quien pide entrar debe hacerlo **sin demora**.\n- **Sin suposiciones** sobre la velocidad relativa de los procesos ni sobre la cantidad de procesadores.\n- Cada proceso permanece en su SC sólo un **tiempo finito**.\n\nLa exclusión mutua es la propiedad de **seguridad**. La ausencia de demora indefinida, la entrada inmediata y la permanencia finita son de **progreso**."},
{"id":"tres-niveles","tema":"Concurrencia e interleaving","src":"apunte","ex":false,"q":"Dos procesos acceden a un mismo archivo sin conocerse por identificador. ¿Qué problema de control tienen, que la competencia pura no tiene?","o":[["La coherencia de los datos compartidos.","Correcta: es lo que agrega la cooperación por compartimiento."],["El deadlock.","No: el deadlock también aparece en la competencia."],["La inanición.","No: también aparece en la competencia."],["Ninguno: es lo mismo que la competencia.","No: al compartir datos hay que garantizar su integridad."]],"c":0,"r":"- **No se conocen entre sí**: **competencia** por los recursos. Problemas: exclusión mutua, deadlock e inanición.\n- **Se conocen indirectamente** (comparten un objeto, sin conocerse por identificador): **cooperación por compartimiento**. Los mismos problemas, más la **coherencia de los datos**.\n- **Se conocen directamente** (se comunican por identificador): **cooperación por comunicación**. Problemas: deadlock (un mensaje que nunca llega) e inanición. No hay dato compartido que proteger."},
{"id":"pasaje-mensajes","tema":"Concurrencia e interleaving","src":"apunte","ex":false,"q":"¿Qué combinación de primitivas es el rendezvous?","o":[["Send bloqueante y receive bloqueante.","Correcta: los dos se esperan hasta que el mensaje se entrega."],["Send no bloqueante y receive bloqueante.","No: esa es la combinación más útil, pero el emisor no espera."],["Send no bloqueante y receive no bloqueante.","No: ahí nadie espera a nadie."],["Cualquier combinación con memoria compartida.","No: el rendezvous es de pasaje de mensajes."]],"c":0,"r":"- **Send bloqueante + receive bloqueante**: el **rendezvous**. Los dos se bloquean hasta que el mensaje se entrega: sincronización fuerte.\n- **Send no bloqueante + receive bloqueante**: la combinación **más útil**. El emisor sigue trabajando y el receptor espera lo que necesita.\n- **Send no bloqueante + receive no bloqueante**: nadie espera a nadie.\n\nA diferencia de la memoria compartida, no hay un dato compartido que proteger: la sincronización está **implícita** en el send y el receive."},
{"id":"velocidad","tema":"Concurrencia e interleaving","src":"apunte","ex":false,"q":"¿Qué principio sobre la velocidad de los procesos debe cumplir todo programa concurrente?","o":[["Los resultados de un proceso deben ser independientes de la velocidad a la que se ejecutan los demás.","Si el resultado depende de quién corre más rápido, hay una condición de carrera."],["Todos los procesos deben ejecutarse a la misma velocidad.","No se puede controlar la velocidad de los procesos, y tampoco hace falta."],["El proceso más rápido debe tener más prioridad.","Depender de las prioridades para el resultado es justamente un error."],["Hay que agregar `sleep()` para igualar las velocidades.","Un `sleep()` no garantiza ningún orden."]],"c":0,"r":"Los resultados de un proceso deben ser **independientes de la velocidad** a la que se ejecuten los demás procesos concurrentes. Si el resultado cambia según quién corre más rápido, el programa está mal: hay una condición de carrera. Por eso tampoco se puede depender de las prioridades ni de un `sleep` para \"ordenar\" hilos."},
{"id":"monoprocesador","tema":"Concurrencia e interleaving","src":"apunte","ex":false,"q":"Un programa concurrente que corre en un monoprocesador, ¿tiene los problemas de la concurrencia?","o":[["Sí. No es paralelo, pero el SO intercala los hilos y aparecen las mismas condiciones de carrera.","La concurrencia es una propiedad de la estructura del programa, no del hardware."],["No, porque nunca corren dos hilos al mismo tiempo.","Un cambio de contexto en el medio de un `x++` alcanza para perder una actualización."],["No, porque el monoprocesador ejecuta los hilos de a uno y en orden.","El orden lo decide el planificador y puede ser cualquiera."],["Sólo si los hilos tienen la misma prioridad.","Las prioridades no evitan las condiciones de carrera."]],"c":0,"r":"**No es paralelo**, pero **sí** tiene todos los problemas. La concurrencia es una propiedad de la **estructura** del programa (tareas que pueden ejecutarse en cualquier orden). El paralelismo es una propiedad de la **ejecución** (tareas que corren a la vez en hardware distinto). En un monoprocesador el SO intercala los hilos (multiprogramación), cualquier interleaving es posible, y aparecen las mismas condiciones de carrera, deadlocks e inanición."},
{"id":"estado-pc","tema":"Testing, verificación y reactivos","src":"apunte","ex":false,"q":"¿Qué forma parte del estado de un programa concurrente?","o":[["El valor de las variables y el program counter de cada proceso.","Por eso el espacio de estados es un producto y crece exponencialmente."],["Sólo el valor de las variables globales.","Falta en qué sentencia está parado cada proceso."],["Sólo el program counter del proceso que está en ejecución.","Importan los de todos los procesos y también las variables."],["El código fuente del programa.","El código no cambia durante la ejecución, así que no es parte del estado."]],"c":0,"r":"El estado incluye el valor de las variables **y** el **program counter de cada proceso** (en qué sentencia está parado cada uno), que son variables implícitas. El espacio de estados es el **producto** de los valores posibles de las variables por las posiciones posibles de cada pc. Crece exponencialmente con la cantidad de procesos: es la **explosión de estados**, y es la razón por la que el testing no alcanza."},
{"id":"dijkstra","tema":"Testing, verificación y reactivos","src":"apunte","ex":false,"q":"¿Cuál fue el primer mecanismo de sincronización entre procesos concurrentes, propuesto por Dijkstra?","o":[["El semáforo.","Correcta: se usó por primera vez en el sistema operativo THE."],["El monitor.","No: lo formalizaron Brinch Hansen (1973) y Hoare (1974), a partir de una idea de Dijkstra."],["El `ReentrantLock`.","No: es una clase de Java."],["La red de Petri.","No: es de Carl Adam Petri, y es un formalismo de modelado, no un mecanismo de sincronización."]],"c":0,"r":"- Plantea el problema de la **exclusión mutua** para n procesos (1965): la noción de sección crítica.\n- El sistema operativo **THE**, organizado en capas.\n- Cooperating Sequential Processes (1968), que origina el campo.\n- El **semáforo**, primer mecanismo de sincronización entre procesos.\n- Identifica el **deadlock** y propone el algoritmo del banquero.\n- Los **filósofos comensales** (1971).\n- La frase sobre el testing: puede mostrar la presencia de errores, nunca su ausencia."},
{"id":"multiprog","tema":"Concurrencia e interleaving","src":"apunte","ex":false,"q":"¿Cómo se llama la gestión de varios procesos en un sistema con un solo procesador?","o":[["Multiprogramación.","Correcta."],["Multiprocesamiento.","No: implica varios procesadores."],["Procesamiento distribuido.","No: implica varias computadoras."],["Paralelismo.","No: con un solo procesador no hay ejecución simultánea real."]],"c":0,"r":"- **Multiprogramación**: varios procesos en un sistema **monoprocesador**.\n- **Multiprocesamiento**: varios procesos en un sistema **multiprocesador**.\n- **Procesamiento distribuido**: varios procesos en **varias computadoras**.\n\nY surge en tres contextos: múltiples aplicaciones que comparten el procesador, aplicaciones estructuradas como un conjunto de hilos, y la propia estructura del sistema operativo."},
{"id":"proceso-vs-hilo","tema":"Estados de hilos y procesos","src":"apunte","ex":false,"q":"¿Qué tiene cada hilo como propio, sin compartirlo con los otros hilos de su proceso?","o":[["Su pila, sus registros y su contador de programa.","Correcta."],["Su espacio de direcciones.","No: es del proceso y lo comparten todos sus hilos."],["Los archivos abiertos.","No: también son del proceso."],["El heap con los objetos.","No: es compartido. Justamente por eso hay condiciones de carrera."]],"c":0,"r":"El **proceso** es la unidad de **propiedad de recursos** (espacio de direcciones, archivos abiertos). El **hilo** es la unidad de **planificación y ejecución**.\n\nLos hilos de un proceso **comparten** la memoria (código, datos, heap) y los recursos del proceso. Cada hilo tiene **propios** su contador de programa, sus registros, su pila y su estado.\n\nPor eso crear y conmutar hilos es más barato que hacerlo con procesos. Y por eso los hilos necesitan sincronizarse: comparten datos sin ninguna protección."},
{"id":"pcb","tema":"Estados de hilos y procesos","src":"apunte","ex":false,"q":"¿Para qué se guardan en el PCB el contador de programa y los registros?","o":[["Para poder reanudar el proceso después, exactamente donde quedó.","Correcta: es lo que hace el cambio de contexto."],["Para que otros procesos puedan leer sus variables.","No: el PCB es del SO, no un mecanismo de comunicación."],["Para que el proceso no pueda ser interrumpido.","No: es al revés, permite interrumpirlo sin perder nada."],["Para calcular la prioridad del proceso.","No: la prioridad es otro campo del PCB."]],"c":0,"r":"Es la estructura de datos con la que el SO **representa** a cada proceso, y la que permite **interrumpirlo y reanudarlo** después como si nada hubiera pasado. Contiene:\n- **Identificación**: PID, proceso padre, usuario.\n- **Estado del procesador**: contador de programa, registros, puntero de pila.\n- **Información de control**: estado, prioridad, datos de planificación, memoria asignada, archivos y recursos.\n\nEn el cambio de contexto, el SO guarda el contexto del proceso saliente en su PCB y carga el del entrante."},
{"id":"estados-java","tema":"Estados de hilos y procesos","src":"apunte","ex":false,"q":"¿En qué estado de `Thread.State` queda un hilo que llamó a `Thread.sleep(1000)`?","o":[["TIMED_WAITING.","Correcta: es una espera con plazo."],["WAITING.","No: WAITING es la espera sin plazo (`wait()`, `join()`)."],["BLOCKED.","No: BLOCKED es esperar un monitor ocupado."],["RUNNABLE.","No: hasta que vence el plazo no está listo para correr."]],"c":0,"r":"El enum `Thread.State` tiene **seis** valores:\n- **NEW**: creado, todavía sin `start()`.\n- **RUNNABLE**: ejecutándose **o** listo esperando el procesador.\n- **BLOCKED**: esperando un monitor para entrar a un `synchronized`.\n- **WAITING**: espera indefinida (`wait()`, `join()`).\n- **TIMED_WAITING**: espera con plazo (`sleep(t)`, `wait(t)`, `join(t)`).\n- **TERMINATED**: `run()` terminó.\n\nLos **7** de la filmina salen de desdoblar RUNNABLE en **listo** y **en ejecución**, como en el modelo del SO. La JVM no distingue si el hilo está efectivamente sobre el procesador.","n":"Si preguntan \"cuántos estados\", aclará las dos cuentas: 6 en el enum de Java y 7 en el modelo de la filmina (con listo y en ejecución separados)."},
{"id":"blocked-vs-waiting","tema":"Estados de hilos y procesos","src":"apunte","ex":false,"q":"Un hilo intenta ejecutar un método `synchronized` de un objeto cuyo monitor tiene otro hilo. ¿En qué estado queda?","o":[["BLOCKED.","Correcta: está esperando el monitor."],["WAITING.","No: WAITING es para `wait()` o `join()`."],["TIMED_WAITING.","No: no hay ningún plazo de por medio."],["NEW.","No: NEW es antes de `start()`."]],"c":0,"r":"**BLOCKED**: el hilo quiere **entrar** a un bloque o método `synchronized` cuyo monitor tiene otro hilo. Sale cuando el monitor se libera.\n\n**WAITING**: el hilo **eligió** esperar a otro, con `wait()` (hasta un `notify`/`notifyAll`) o con `join()` (hasta que el otro termine). Un hilo que hace `wait()` **libera** el monitor; uno en BLOCKED nunca lo tuvo.\n\nDe los dos estados se vuelve a RUNNABLE, nunca directo a ejecución."},
{"id":"modificadores","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Cuántos niveles de acceso hay en Java?","o":[["Cuatro: `public`, `protected`, package-private (sin modificador) y `private`.","Package-private da acceso desde la misma clase y el mismo paquete."],["Tres: `public`, `protected` y `private`.","Falta el acceso por defecto, sin modificador."],["Dos: `public` y `private`.","También están `protected` y el de paquete."],["Cinco, contando `static`.","`static` no es un nivel de acceso."]],"c":0,"r":"Cuatro:\n- **public**: accesible desde cualquier clase.\n- **protected**: misma clase, mismo paquete y subclases de otros paquetes.\n- **package-private** (sin modificador): misma clase y mismo paquete.\n- **private**: sólo la misma clase."},
