{"id":"runnable-vs-thread","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Por qué se prefiere implementar `Runnable` antes que extender `Thread`?","o":[["Porque extender `Thread` gasta la única herencia y ata la tarea al hilo.","Correcta."],["Porque un `Runnable` se ejecuta más rápido.","No: la velocidad es la misma; al final lo ejecuta un `Thread`."],["Porque `Thread` no permite sobrescribir `run()`.","No: se puede, es la primera forma."],["Porque a un `Thread` heredado no se le puede poner nombre.","No: `setName()` funciona igual en las dos formas."]],"c":0,"r":"1. **Extender `Thread`** y sobrescribir `run()`.\n2. **Implementar `Runnable`** y pasarle el objeto al constructor de `Thread`.\n\nSe recomienda **`Runnable`**. Java tiene herencia simple, y extender `Thread` gasta la única herencia. Además, con `Runnable` la **tarea** queda separada del **mecanismo** que la ejecuta: la misma tarea se le puede dar a un `Thread` o a un executor. En los dos casos el hilo arranca con `start()`."},
{"id":"start-vs-run","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Si en lugar de `hilo.start()` se escribe `hilo.run()`, ¿qué pasa?","o":[["El código de `run()` se ejecuta en el hilo que llama, sin crear un hilo nuevo.","Correcta."],["Se crea el hilo igual, pero con prioridad mínima.","No: no se crea ningún hilo."],["Lanza `IllegalThreadStateException`.","No: eso pasa si se llama a `start()` dos veces sobre el mismo hilo."],["El hilo arranca pero no se puede interrumpir.","No: no arranca ningún hilo."]],"c":0,"r":"`start()` le pide a la JVM que cree un **hilo nuevo** y que ese hilo ejecute `run()`. El que llama sigue de largo inmediatamente.\n\n`run()` es una llamada a método **común**: se ejecuta en el **mismo hilo** que la hace, de forma secuencial, sin concurrencia.\n\nEn el buscador de archivos: con `run()`, el `main` busca él mismo hasta el final y el `interrupt()` posterior no tiene efecto; con `start()`, el `main` sigue, duerme 10 s e interrumpe la búsqueda."},
{"id":"uml-secuencia","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Qué fragmento combinado marca una región que ningún otro fragmento puede intercalar?","o":[["`critical`.","Correcta: es la sección crítica dibujada."],["`par`.","No: `par` es lo contrario, deja intercalar los operandos."],["`strict`.","No: impone un orden vertical estricto, pero no habla de atomicidad."],["`alt`.","No: elige un operando según su guarda."]],"c":0,"r":"El `start()` es un **mensaje asincrónico** (punta abierta): el emisor sigue sin esperar respuesta. Una llamada común como `run()` es un **mensaje sincrónico** (punta llena), que bloquea al que llama hasta el retorno.\n\nFragmentos útiles:\n- **`par`**: los operandos se intercalan de cualquier forma, cada uno con su orden interno. Es el interleaving dibujado.\n- **`critical`**: región atómica que ningún otro fragmento puede intercalar. Es la sección crítica.\n- **`loop`**, **`alt`** y **`opt`**: repetición y alternativas con guardas."},
{"id":"static-thread-safe","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Un atributo `static` es thread safe?","o":[["No, pertenece a la clase y lo comparten todos los hilos sin ninguna sincronización.","Es el caso más puro de estado compartido."],["Sí, porque hay una sola copia en memoria.","Que haya una sola copia es justamente lo que lo vuelve compartido."],["Sí, Java sincroniza automáticamente los atributos `static`.","Java no agrega sincronización por ser `static`."],["Sólo si es `private`.","El nivel de acceso no da sincronización."]],"c":0,"r":"**No.** Un atributo `static` pertenece a la **clase**, así que **todos** los hilos ven la misma variable. Es el caso más puro de estado compartido y el primer candidato a condición de carrera. Ser `static` no agrega ninguna sincronización.\n\nExcepciones: un `static final` de un tipo inmutable, las variables `volatile` (dan visibilidad, no atomicidad) y las clases `Atomic*`.\n\nEn el práctico, `y1`, `y2` y `critical` estáticos compartidos por T1 y T2 terminaron mostrando `critical = -1` y `1`."},
{"id":"volatile","tema":"Java básico y UML","src":"apunte","ex":false,"q":"¿Qué garantiza declarar una variable `volatile`?","o":[["Visibilidad, o sea que una escritura la ven enseguida los demás hilos, pero no atomicidad.","`contador++` sobre un `volatile` puede seguir perdiendo actualizaciones."],["Atomicidad de cualquier operación sobre la variable.","No hace atómico un leer-incrementar-escribir."],["Exclusión mutua sobre el objeto.","Para eso hace falta `synchronized` o un `Lock`."],["Que cada hilo tenga su propia copia.","Eso es `ThreadLocal`."]],"c":0,"r":"Garantiza **visibilidad**: una escritura en la variable la ven inmediatamente los demás hilos, no queda en la caché o en un registro de un núcleo.\n\n**No** garantiza **atomicidad**: `contador++` sobre un `volatile` sigue siendo leer, incrementar y escribir, y dos hilos pueden perder actualizaciones. Para eso hace falta `synchronized`, un `Lock` o un `AtomicInteger`."},
{"id":"prioridad","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"En el práctico, ¿por qué los hilos con `MAX_PRIORITY` no terminaban siempre antes que los de `MIN_PRIORITY`?","o":[["Porque la prioridad es una sugerencia al planificador y, con varios núcleos, todos pueden correr a la vez.","Correcta."],["Porque la prioridad máxima en Java es 5.","No: la máxima es 10; 5 es la normal."],["Porque Java ignora la prioridad de los hilos no daemon.","No: no hay tal regla."],["Porque `setPriority()` no hace nada en Java.","No: la cambia, pero el efecto depende del SO y no garantiza orden."]],"c":0,"r":"Es un entero de **1 a 10** (`MIN_PRIORITY` = 1, `NORM_PRIORITY` = 5, `MAX_PRIORITY` = 10).\n\n**No garantiza nada.** Es una sugerencia al planificador del SO, se mapea distinto en cada plataforma, y con varios núcleos puede no haber competencia que resolver. Un programa cuya corrección dependa de las prioridades está mal diseñado."},
{"id":"interrupt","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Un hilo está dentro de `Thread.sleep(5000)` y otro llama a su `interrupt()`. ¿Qué pasa?","o":[["`sleep` lanza `InterruptedException` y el flag de interrupción queda en `false`.","Correcta."],["El hilo muere inmediatamente.","No: eso hacía `stop()`, que está deprecado."],["No pasa nada hasta que termina el `sleep`.","No: el `sleep` se corta antes de tiempo."],["`sleep` lanza `InterruptedException` y el flag queda en `true`.","No: el flag se borra al lanzar la excepción."]],"c":0,"r":"**No lo detiene**: sólo pone en `true` una **bandera** interna. Es un pedido, y el hilo puede ignorarlo.\n- Si el hilo está corriendo código normal, no pasa nada automático. Su código tiene que consultar el flag (`isInterrupted()` o `Thread.interrupted()`) y decidir terminar.\n- Si está bloqueado en `sleep()`, `wait()` o `join()`, ese método lanza **`InterruptedException`** y el flag **se borra**.\n\nCómo terminar lo decide el código de la tarea, por ejemplo con un `return` en el `catch`. Es la alternativa segura a `stop()`, que está deprecado."},
{"id":"interrupted-vs-is","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Qué diferencia hay entre `isInterrupted()` y `Thread.interrupted()`?","o":[["`isInterrupted()` consulta el flag de un hilo sin modificarlo. `Thread.interrupted()` consulta el del hilo actual y lo borra.","El método estático deja el flag en `false`."],["Son iguales, uno es un alias del otro.","Uno borra el flag y el otro no."],["`isInterrupted()` interrumpe al hilo y `Thread.interrupted()` lo consulta.","Para interrumpir se usa `interrupt()`."],["`Thread.interrupted()` consulta el flag sin modificarlo.","Lo borra después de consultarlo."]],"c":0,"r":"`isInterrupted()` es **de instancia**: consulta el flag del hilo sobre el que se llama y **no lo modifica**.\n\n`Thread.interrupted()` es **estático**: consulta el flag del hilo **actual** y lo **borra** (lo deja en `false`)."},
{"id":"stop","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Cuál es el problema de `Thread.stop()`?","o":[["Corta el hilo en cualquier punto y puede dejar datos inconsistentes o recursos sin liberar.","Correcta."],["Que el hilo puede ignorarlo.","No: eso le pasa a `interrupt()`, y es a propósito."],["Que sólo funciona en hilos daemon.","No."],["Que bloquea al hilo que lo llama.","No."]],"c":0,"r":"`stop()` mataba al hilo **en cualquier punto** de su ejecución, sin darle oportunidad de liberar locks, cerrar archivos o dejar los datos en un estado consistente. Está deprecado desde Java 1.2.\n\nEn su lugar se usa **`interrupt()`**: un pedido gentil que el código de la tarea atiende en puntos seguros."},
{"id":"join","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Se arrancan tres hilos y recién después se hacen los tres `join()`. ¿Qué se garantiza?","o":[["Que `main` sigue sólo cuando terminaron los tres, aunque sus mensajes se intercalen entre sí.","Correcta: `join()` ordena respecto de lo que viene después de él."],["Que los tres hilos se ejecutan en orden.","No: arrancaron juntos, así que se intercalan."],["Nada: `join()` no hace efecto después de `start()`.","No: justamente se usa después de `start()`."],["Que los mensajes de `main` salen primero.","No: `main` espera a los tres."]],"c":0,"r":"El hilo que llama a `otro.join()` **se suspende** (WAITING, o TIMED_WAITING con `join(ms)`) hasta que `otro` termina.\n\nEn el ejemplo, cada `start()` va seguido de su `join()`, así que hay un solo grupo vivo a la vez y los mensajes salen ordenados por grupo. Sin `join()`, los grupos **se intercalan** y el mensaje final de `main` puede salir en cualquier momento, casi siempre al principio. El programa igual no termina hasta que terminan los hilos, porque son no-daemon."},
{"id":"sleep-listo","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Cuando termina el plazo de un `sleep()`, ¿qué pasa con el hilo?","o":[["Pasa a RUNNABLE y continúa cuando el planificador le asigne CPU.","De un estado de espera siempre se vuelve a listo."],["Vuelve a ejecutarse en ese mismo instante.","Puede tener que esperar en la cola de listos."],["Pasa a TERMINATED.","El `sleep()` no termina el hilo."],["Queda en WAITING hasta que alguien haga `notify()`.","`sleep()` no necesita `notify()`. Vuelve solo cuando termina el plazo."]],"c":0,"r":"No. Pasa de TIMED_WAITING a **RUNNABLE** (la cola de listos) y continúa cuando el planificador le asigne CPU. De los estados de espera siempre se vuelve a listo, nunca directo a ejecución. Por eso `sleep()` no sirve para ordenar hilos con precisión."},
{"id":"daemon-set","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Cuándo se puede llamar a `setDaemon(true)` sobre un hilo?","o":[["Antes de `start()`. Después lanza `IllegalThreadStateException`.","La condición de daemon queda fija cuando el hilo arranca."],["En cualquier momento de su ejecución.","Si ya arrancó, lanza una excepción."],["Sólo después de que termina.","Un hilo terminado ya no sirve como daemon."],["Sólo desde el propio hilo, dentro de su `run()`.","Para ese momento el hilo ya arrancó."]],"c":0,"r":"`setDaemon(true)` se llama **antes de `start()`**. Después, la condición queda fija, y llamarlo lanza **`IllegalThreadStateException`**.\n\nUn daemon da servicios en segundo plano, como el limpiador de eventos viejos del práctico. Cuando los únicos hilos vivos son daemons, la JVM los termina y cierra el programa."},
{"id":"uncaught","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"Un hilo lanza una `NullPointerException` no capturada dentro de `run()`. ¿Qué ocurre por defecto?","o":[["Se imprime el stack trace y termina sólo ese hilo.","Correcta."],["Termina todo el programa.","No: los demás hilos siguen."],["El compilador obliga a capturarla.","No: es unchecked."],["El hilo pasa a WAITING hasta que alguien la maneje.","No: el hilo termina."]],"c":0,"r":"La JVM imprime el stack trace y **termina sólo ese hilo**, no todo el programa. Es peligroso: el hilo muere en silencio y puede dejar el sistema a medio hacer.\n\nPara interceptarla se implementa **`Thread.UncaughtExceptionHandler`** (método `uncaughtException(Thread t, Throwable e)`) y se lo asigna con `setUncaughtExceptionHandler()`, o para todos los hilos con `Thread.setDefaultUncaughtExceptionHandler()`."},
{"id":"latch","tema":"Hilos en Java: API y ciclo de vida","src":"apunte","ex":false,"q":"¿Qué pasa si se llama a `await()` sobre un `CountDownLatch` cuyo contador ya llegó a 0?","o":[["Retorna inmediatamente.","Correcta."],["Se bloquea hasta que alguien llame a `reset()`.","No: el `CountDownLatch` no tiene reset."],["Lanza una excepción.","No."],["Vuelve a contar desde el valor inicial.","No: es de un solo uso."]],"c":0,"r":"Es un sincronizador que permite que uno o más hilos **esperen a que ocurran N eventos**. Tiene tres elementos:\n- El **valor inicial**: cuántos eventos se esperan.\n- **`await()`**: lo llama quien espera, y se duerme hasta que el contador llega a 0.\n- **`countDown()`**: lo llama cada evento al terminar.\n\nLimitaciones: es de **uso único** (el contador no se resetea; en 0 queda en 0 y `await()` retorna enseguida), y **no protege** una sección crítica. Ejemplo: la videoconferencia que arranca cuando llegaron todos los participantes."},
{"id":"sync-static","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"Un hilo ejecuta un método `static synchronized` de la clase `Cuenta`, y otro un método `synchronized` de instancia de un objeto `Cuenta`. ¿Se excluyen?","o":[["No: uno usa el monitor de la clase y el otro el del objeto.","Correcta."],["Sí: los dos usan el monitor de la clase.","No: el de instancia usa `this`."],["Sí: los dos usan el monitor del objeto.","No: el estático usa `Cuenta.class`."],["No compila: no se puede combinar `static` con `synchronized`.","No: es válido."]],"c":0,"r":"Un método `synchronized` de instancia toma el monitor del **objeto** (`this`). Uno `static synchronized` toma el monitor de la **clase** (el objeto `Clase.class`).\n\nSon **dos llaves distintas**: un hilo puede estar en un método estático sincronizado y otro en uno de instancia sincronizado **al mismo tiempo**. Si los dos tocan el mismo dato estático, hay condición de carrera."},
{"id":"sync-integer","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Cuál de estas llaves garantiza la exclusión mutua?","o":[["Un `private final Object lock = new Object()` dedicado.","Correcta: su identidad nunca cambia."],["La variable `Integer` que se incrementa dentro del bloque.","No: cada incremento la hace apuntar a otro objeto."],["Un elemento de un arreglo que se reasigna dentro del bloque.","No: es el caso 4 de la cátedra, que dio erróneo."],["Un `String` que se concatena dentro del bloque.","No: `String` también es inmutable, y cada concatenación crea otro objeto."]],"c":0,"r":"`synchronized` toma el monitor **del objeto** al que apunta la referencia en ese momento. Un `Integer` es **inmutable**: `valor = valor + 1` crea otro objeto y reasigna la referencia. El siguiente hilo que haga `synchronized (valor)` toma el monitor de **otro objeto**, y dos hilos pueden quedar dentro a la vez.\n\nHay que sincronizar con un objeto cuya identidad no cambie, por ejemplo un `Object` dedicado y `final`. En el experimento de la cátedra, el error no apareció en 10 corridas: hizo falta correrlo 100.000 veces. El testing puede engañarte."},
{"id":"cinema","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Qué se gana sincronizando bloques con dos llaves distintas en lugar de dos métodos `synchronized`?","o":[["Que las operaciones sobre recursos independientes ya no se excluyen entre sí.","Correcta."],["Que se evita el deadlock en cualquier caso.","No: si un hilo toma las dos llaves en orden opuesto al de otro, puede haber deadlock."],["Que ya no hace falta sincronizar las lecturas.","No: las lecturas también tienen que ver datos consistentes."],["Nada: es equivalente.","No: los métodos `synchronized` comparten la llave `this`."]],"c":0,"r":"El cine tiene **dos salas independientes**. Con métodos `synchronized`, todos usarían la misma llave (`this`): vender en la sala 1 bloquearía a quien vende en la sala 2, aunque no compartan datos.\n\nCon dos objetos (`controlCinema1` y `controlCinema2`) y bloques `synchronized` sobre cada uno, cada recurso se protege **por separado**: hay exclusión mutua dentro de cada sala y paralelismo entre salas. Es la ventaja del bloque sobre el método: elegir la llave y achicar la sección crítica."},
{"id":"while-wait","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"En el `EventStorage` del productor/consumidor, ¿qué puede pasar si se cambia el `while` del `wait()` por un `if`?","o":[["Un productor despertado puede agregar con el buffer otra vez lleno.","Correcta: no vuelve a chequear la condición."],["Ninguno de los hilos se despierta nunca.","No: `notifyAll()` los despierta igual."],["El programa no compila.","No: compila sin problemas."],["El `wait()` deja de liberar el monitor.","No: `wait()` siempre libera el monitor."]],"c":0,"r":"Porque al despertar **la condición puede ya no valer**. `notifyAll()` despierta a todos, y otro hilo pudo adelantarse y volver a llenar (o vaciar) el buffer antes de que éste recupere el monitor. También existen los despertares espurios.\n\nCon `while`, el hilo vuelve a evaluar la condición y, si no se cumple, vuelve a dormir. Con `if` seguiría de largo con una condición falsa."},
{"id":"deadlock-orden","tema":"Sección crítica, monitor, semáforo","src":"apunte","ex":false,"q":"¿Cuál es la solución de diseño clásica a ese deadlock?","o":[["Que todos los hilos tomen los locks en el mismo orden global.","Correcta."],["Subir la prioridad de uno de los hilos.","No: la prioridad no rompe la espera circular."],["Hacer `volatile` las variables protegidas.","No: `volatile` no tiene nada que ver con los locks."],["Agregar un `sleep()` antes de tomar el segundo lock.","No: sólo cambia la probabilidad, no elimina el deadlock."]],"c":0,"r":"Si el hilo A toma X y espera Y, mientras B toma Y y espera X, los dos quedan bloqueados para siempre: es una **espera circular** producida por adquirir los locks en **orden opuesto**.\n\nSe evita fijando un **orden global** de adquisición que todo el código respete (siempre X antes que Y), o usando `tryLock()` con plazo para no esperar indefinidamente."},
{"id":"lock-vs-sync","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué ofrece `Lock` que `synchronized` no tiene?","o":[["Intentar tomar la llave sin bloquearse, con `tryLock()`.","Correcta."],["Exclusión mutua.","No: la dan los dos."],["Liberación automática al salir del bloque.","No: es al revés, eso lo tiene `synchronized`."],["Reentrancia.","No: `synchronized` también es reentrante."]],"c":0,"r":"El `Lock` ofrece:\n- `tryLock()`: intentar tomarlo sin bloquearse (con o sin plazo).\n- `lockInterruptibly()`: adquirirlo de forma interrumpible.\n- **Fairness** opcional.\n- Bloques más flexibles, por ejemplo tomarlo en un método y liberarlo en otro.\n- `ReadWriteLock`, que separa lectura de escritura.\n\nRegla práctica: usar `synchronized` por defecto (es más simple y libera solo), y `Lock` cuando hace falta alguna de esas capacidades. El precio es que hay que llamar a `unlock()` **en un `finally`**."},
{"id":"unlock-finally","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Dónde se debe llamar a `unlock()` y por qué?","o":[["En un bloque `finally`, para que el lock se libere aunque la sección crítica lance una excepción.","Si no, el lock queda tomado para siempre y todos los que lo pidan se bloquean."],["Al principio de la sección crítica.","Liberaría el lock antes de usar el recurso."],["No hace falta, el lock se libera solo al salir del método.","Eso pasa con `synchronized`, no con un `Lock`."],["En el `catch`, sólo si hubo una excepción.","También hay que liberarlo cuando no hay excepción."]],"c":0,"r":"En un bloque **`finally`**, después del `try` que contiene la sección crítica. Si la SC lanza una excepción y el `unlock()` no se ejecuta, el lock queda tomado para siempre, y todos los hilos que lo pidan se bloquean.\n\n`synchronized` no tiene este problema: libera el monitor automáticamente al salir del bloque, incluso por una excepción."},
{"id":"rwlock","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿En cuál de estos escenarios conviene un `ReadWriteLock`?","o":[["Una base de datos que se consulta continuamente y se modifica muy de vez en cuando.","Correcta: los lectores corren en paralelo."],["Una base de precios que cambia continuamente y casi no se consulta.","No: casi todo es escritura exclusiva, y se paga el costo de administrar dos locks."],["Un contador que todos los hilos incrementan.","No: incrementar es escribir."],["En cualquier caso: siempre es más rápido que `synchronized`.","No: en el escenario equivocado es más caro."]],"c":0,"r":"Tiene **dos** locks: uno de **lectura**, que pueden tener **varios** hilos a la vez, y uno de **escritura**, exclusivo (no admite otros escritores ni lectores).\n\nConviene cuando hay **muchas lecturas y pocas escrituras**, por ejemplo una base de datos que se consulta continuamente y se modifica de vez en cuando: ahí los lectores corren en paralelo de verdad. Si casi todo son escrituras, sale **más caro** que una sección crítica clásica.\n\nEs responsabilidad del programador no escribir con el lock de lectura tomado."},
{"id":"fair","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿A qué método **no** afecta el atributo `fair` de un `ReentrantLock`?","o":[["`tryLock()`.","Correcta: no duerme al hilo, así que no hay cola que ordenar."],["`lock()`.","No: `lock()` hace esperar, y fair decide el orden."],["`unlock()`.","No: al liberar es cuando se elige a quién darle el lock."],["`lockInterruptibly()`.","No: también hace esperar en la cola."]],"c":0,"r":"Con `fair = true`, cuando se libera el lock se le da al hilo que **hace más tiempo** que espera (orden de llegada). Con `false`, que es el valor por defecto, se elige uno **sin criterio**.\n\nFair evita la inanición pero cuesta más. No afecta a `tryLock()`, que no hace esperar a nadie."},
{"id":"semaforo-n","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Por qué no alcanza el `Semaphore(3)` solo?","o":[["Porque hasta tres hilos pueden estar a la vez eligiendo impresora en el mismo arreglo.","Correcta: esa búsqueda necesita su propia exclusión mutua."],["Porque un semáforo sólo puede tener un permiso.","No: puede tener N."],["Porque el semáforo no despierta a los hilos que esperan.","No: `release()` despierta a uno."],["Porque `acquire()` no es atómico.","No: lo es."]],"c":0,"r":"El **semáforo de 3 permisos** limita a **tres** los hilos que imprimen a la vez, uno por impresora. El cuarto se duerme en `acquire()` hasta que alguien haga `release()`.\n\nPero el semáforo no dice **cuál** impresora está libre. Para elegirla se recorre y se modifica el arreglo `freePrinters`, y esa búsqueda es una sección crítica entre los hilos que pasaron el semáforo. Por eso se protege con un **`Lock`** aparte.\n\nEn una RdP, el semáforo es un lugar con 3 fichas."},
{"id":"semaforo-cero","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué propiedad de los semáforos permite usar uno inicializado en 0 para avisar entre hilos?","o":[["Que no tienen dueño: cualquier hilo puede hacer `release()`.","Correcta."],["Que son reentrantes.","No: un semáforo no es reentrante."],["Que son fair por defecto.","No: por defecto son non-fair."],["Que `acquire()` nunca bloquea.","No: bloquea si no hay permisos."]],"c":0,"r":"Para la **señalización** entre hilos. El que debe esperar hace `acquire()` y se bloquea (no hay permisos), hasta que otro hilo hace `release()` para avisarle.\n\nFunciona porque los semáforos **no tienen dueño**: quien libera no tiene por qué ser quien adquirió. En una RdP es un lugar \"señal\" sin marca inicial, que una rama produce y la otra consume."},
{"id":"tryacquire","tema":"Locks, ReadWriteLock y semáforos","src":"apunte","ex":false,"q":"¿Qué hace `tryAcquire()` en un `Semaphore`?","o":[["Intenta tomar un permiso sin bloquear y devuelve `true` o `false` según si lo consiguió.","`acquire()` bloquea, y `acquireUninterruptibly()` bloquea ignorando las interrupciones."],["Bloquea al hilo hasta que haya un permiso.","Eso hace `acquire()`."],["Bloquea ignorando las interrupciones.","Eso hace `acquireUninterruptibly()`."],["Libera un permiso si el hilo tiene uno.","Para liberar se usa `release()`."]],"c":0,"r":"- `acquire()`: toma un permiso o **bloquea** si no hay. Puede lanzar `InterruptedException`.\n- `tryAcquire()`: **no bloquea**. Devuelve `true` si lo tomó o `false` si no había.\n- `acquireUninterruptibly()`: bloquea, pero **ignora** las interrupciones.\n\nLas tres tienen versiones con un `int` para tomar varios permisos de una vez. Es la base de lectores/escritores con semáforos: el escritor pide todos los permisos."},
{"id":"chomsky","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"¿Qué autómata reconoce los lenguajes de tipo 2?","o":[["El autómata de pila.","Correcta."],["El autómata finito.","No: reconoce los de tipo 3."],["El autómata lineal acotado.","No: reconoce los de tipo 1."],["La máquina de Turing.","Reconoce los de tipo 2, pero no es el que les corresponde: es el de tipo 0."]],"c":0,"r":"- **Tipo 0** (sin restricciones): lenguajes recursivamente enumerables. **Máquina de Turing**.\n- **Tipo 1** (sensibles al contexto, `α A β → α γ β`): **autómata lineal acotado**.\n- **Tipo 2** (libres de contexto, `A → γ`): **autómata de pila**.\n- **Tipo 3** (regulares, `A → aB` o `A → a`): **autómata finito**.\n\nCada clase está **incluida** en la anterior: tipo 3 ⊂ tipo 2 ⊂ tipo 1 ⊂ tipo 0."},
{"id":"afnd-afd-conv","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"Un AFND tiene 4 estados. ¿Cuántos estados puede tener, como máximo, el AFD equivalente?","o":[["16.","Correcta: 2^4 subconjuntos."],["4.","No: puede necesitar más, uno por cada subconjunto alcanzable."],["8.","No: el máximo es 2^n."],["Infinitos.","No: el AFD siempre es finito."]],"c":0,"r":"Con la **construcción de subconjuntos**: cada estado del AFD es un **conjunto** de estados del AFND (los que podrían estar activos a la vez). Se arranca con el estado inicial (y su clausura λ) y, para cada símbolo, se calcula el conjunto alcanzable. Son finales los conjuntos que contienen algún estado final del AFND.\n\nCon n estados, el AFD puede tener hasta **2^{n}** estados, aunque en general sólo se generan muchos menos accesibles."},
{"id":"er","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"¿Cuál de estas cadenas pertenece al lenguaje de la ER `(a|b)*abb`?","o":[["`babb`","Correcta: `b` lo genera `(a|b)*`, y sigue `abb`."],["`abba`","No: tiene que terminar en `abb`."],["`ab`","No: le falta una `b` al final."],["`bbab`","No: termina en `ab`, no en `abb`."]],"c":0,"r":"Es una **descripción compacta** de un lenguaje regular, construida con los símbolos del alfabeto, λ, ∅ y tres operaciones: **unión** (`+` o `|`), **concatenación** y **clausura de Kleene** (`*`).\n\nPor el **teorema de Kleene**, los lenguajes que describen las ER son exactamente los que reconocen los autómatas finitos. De una ER se construye un AFND (con transiciones λ), y de un AF se obtiene una ER eliminando estados."},
{"id":"church","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"¿Qué dice la tesis de Church-Turing?","o":[["Que todo lo efectivamente computable lo puede computar una máquina de Turing.","No es un teorema, porque \"algoritmo\" es una noción intuitiva que no se puede formalizar."],["Que es un teorema que demuestra que la MT es el modelo más potente.","Es una tesis, no se puede demostrar."],["Que todo programa termina.","La terminación es justamente indecidible."],["Que los autómatas finitos reconocen cualquier lenguaje.","Reconocen sólo los regulares."]],"c":0,"r":"Que todo lo **efectivamente computable** (calculable por un algoritmo) lo puede computar una **máquina de Turing**.\n\nNo es un teorema, porque \"algoritmo\" es una noción intuitiva que no se puede formalizar para demostrarlo. Es una tesis aceptada porque todos los modelos de cómputo propuestos resultaron equivalentes a la MT. Por eso se dice que todo programa tiene una MT asociada."},
{"id":"pda-nodet","tema":"Autómatas y máquinas","src":"apunte","ex":false,"q":"¿Los autómatas de pila deterministas reconocen los mismos lenguajes que los no deterministas?","o":[["No, los deterministas reconocen sólo un subconjunto propio de los libres de contexto.","Por ejemplo, los palíndromos de longitud par, donde hay que adivinar dónde está la mitad."],["Sí, igual que con los autómatas finitos.","Con los finitos son equivalentes, con los de pila no."],["Sí, porque todo autómata no determinista se puede convertir en uno determinista.","Eso vale para los finitos, no para los de pila."],["No, los deterministas reconocen más lenguajes.","Es al revés."]],"c":0,"r":"**No**, a diferencia de lo que pasa con los autómatas finitos. Los AP **no deterministas** reconocen todos los lenguajes libres de contexto; los **deterministas**, sólo un subconjunto propio. Ejemplo clásico: los palíndromos de longitud par, donde hay que \"adivinar\" dónde está la mitad.\n\nEn cambio, todo AFND tiene un AFD equivalente."},
{"id":"eda-reactivo","tema":"Lenguajes y gramáticas","src":"apunte","ex":false,"q":"Al modelar un sistema reactivo con un autómata, ¿qué representa un símbolo del alfabeto?","o":[["Un evento al que el sistema reacciona.","Correcta."],["Una variable del programa.","No: las variables forman parte del estado."],["Un hilo.","No."],["Un estado del sistema.","No: los estados son los nodos; los símbolos etiquetan las transiciones."]],"c":0,"r":"Porque los sistemas concurrentes son casi siempre **reactivos**: reaccionan a **secuencias de eventos** del entorno. Un autómata modela eso exactamente, con un estado y transiciones disparadas por eventos (los símbolos del alfabeto). El conjunto de secuencias de eventos válidas es un **lenguaje**, y el autómata lo reconoce.\n\nEn una **arquitectura dirigida por eventos**, el sistema es un autómata que avanza con cada evento. Y el grafo de accesibilidad de una red de Petri **es** un autómata."}
];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
}
function fmt(s) {
  return s.split('\n\n').map(bloque => {
    let html = '', items = [];
    const cerrar = () => { if (items.length) { html += '<ul>' + items.join('') + '</ul>'; items = []; } };
    bloque.split('\n').forEach(l => {
      if (l.startsWith('- ')) items.push(`<li>${inline(l.slice(2))}</li>`);
      else { cerrar(); html += `<p>${inline(l)}</p>`; }
    });
    cerrar();
    return html;
  }).join('');
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coma = x => String(x).replace('.', ',');
const reloj = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- Historial: última respuesta de cada pregunta (1 bien, 0 mal), sólo en este navegador ---------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem(CONF.KEY)) || {}; } catch (e) { hist = {}; }
const guardarHist = () => { try { localStorage.setItem(CONF.KEY, JSON.stringify(hist)); } catch (e) {} };
const esFloja = id => hist[id] === 0;

/* ---------- Filtros ---------- */
const ORIGENES = { todas: 'Fuente: parciales + apunte', examen: 'Fuente: sólo parciales', apunte: 'Fuente: sólo apunte' };
let origen = 'todas';
const pasaOrigen = p => origen === 'todas' || (origen === 'examen') === p.ex;
let temasActivos = new Set(Object.values(T));
const base = () => BANCO.filter(p => temasActivos.has(p.tema) && pasaOrigen(p));

/* ---------- Estado de la ronda ---------- */
let modo = 'examen';
let ronda = [];          // [{p, opciones:[{x, e, ok}], elegida: índice | null}]
let entregado = false;
let inicio = 0, fin = 0, tic = null;

function elegirExamen(b) {
  let elegidas = [];
  if (CONF.BLOQUES) {
    Object.entries(CONF.BLOQUES).forEach(([bl, n]) => elegidas.push(...shuffle(b.filter(p => p.b === bl)).slice(0, n)));
  }
  const resto = shuffle(b.filter(p => !elegidas.includes(p)));
  elegidas.push(...resto.slice(0, Math.max(0, CONF.EXAMEN - elegidas.length)));
  return shuffle(elegidas);
}

function armarRonda(lista) {
  let preguntas;
  if (lista) { preguntas = shuffle(lista); modo = 'practica'; }
  else preguntas = modo === 'examen' ? elegirExamen(base()) : shuffle(base());
  ronda = preguntas.map(p => ({ p, opciones: shuffle(p.o.map((o, i) => ({ x: o[0], e: o[1], ok: i === p.c }))), elegida: null }));
  entregado = false;
  inicio = Date.now(); fin = 0;
  clearInterval(tic);
  if (modo === 'examen') tic = setInterval(actualizarStats, 1000);
  render();
}

/* ---------- Render ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.modo === modo));
  $('#summary').innerHTML = '';
  const list = $('#list');
  list.innerHTML = '';
  if (!ronda.length) list.innerHTML = '<p class="sub">No hay preguntas con estos filtros.</p>';
  ronda.forEach((item, n) => list.appendChild(tarjeta(item, n)));
  $('#pie').innerHTML = modo === 'examen' && ronda.length ? '<button class="btn primary" id="entregar2">Entregar el examen</button>' : '';
  if ($('#entregar2')) $('#entregar2').onclick = entregar;
  chips();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function tarjeta(item, n) {
  const { p } = item;
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = `<div class="qhead"><span class="num">${n + 1}.</span>
      ${p.b ? `<span class="tag">${esc(p.b)}</span>` : ''}
      <span class="tag">${esc(p.tema)}</span>
      <span class="tag${p.ex ? '' : ' apunte'}">${p.ex ? 'Parcial' : 'Fuente'}: ${esc(p.src)}</span>
      ${esFloja(p.id) ? '<span class="tag floja">floja</span>' : ''}</div>
    <p class="qtext">${inline(p.q)}</p>
    <div class="opts"></div>
    <div class="fb" hidden></div>`;
  const opts = el.querySelector('.opts');
  item.opciones.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[k]}</span><span>${inline(o.x)}</span>`;
    b.onclick = () => elegir(item, k, el);
    opts.appendChild(b);
  });
  item.el = el;
  return el;
}

function elegir(item, k, el) {
  if (entregado || (modo === 'practica' && item.elegida !== null)) return;
  item.elegida = k;
  if (modo === 'practica') corregir(item);
  else el.querySelectorAll('.opt').forEach((b, i) => b.classList.toggle('sel', i === k));
  actualizarStats();
  if (modo === 'practica' && ronda.every(it => it.elegida !== null)) resumen();
}

function corregir(item) {
  const el = item.el, k = item.elegida;
  const acerto = k !== null && item.opciones[k].ok;
  el.classList.add(acerto ? 'bien' : 'mal');
  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('sel');
    const o = item.opciones[i];
    b.classList.add(o.ok ? 'ok' : (i === k ? 'bad' : 'dim'));
  });
  const p = item.p;
  const veredicto = k === null ? '<div class="verdict bad">Sin responder</div>'
    : acerto ? '<div class="verdict ok">✔ Correcto</div>' : '<div class="verdict bad">✘ Incorrecto</div>';
  const fb = el.querySelector('.fb');
  fb.innerHTML = `${veredicto}
    <ul class="exp">${item.opciones.map((o, i) => `<li class="${o.ok ? 'good' : 'wrong'}"><p><b>${'ABCD'[i]}.</b> ${inline(o.e)}</p></li>`).join('')}</ul>
    ${p.n ? `<div class="warn">${fmt(p.n)}</div>` : ''}
    <details><summary>Ver la respuesta desarrollada</summary><div class="model">${fmt(p.r)}</div></details>`;
  fb.hidden = false;
  hist[p.id] = acerto ? 1 : 0;
  guardarHist();
}

function entregar() {
  if (entregado || !ronda.length) return;
  const faltan = ronda.filter(it => it.elegida === null).length;
  if (faltan && !confirm(`Te ${faltan === 1 ? 'falta 1 pregunta' : `faltan ${faltan} preguntas`}. Las que no respondas cuentan como incorrectas. ¿Entregar igual?`)) return;
  entregado = true;
  fin = Date.now();
  clearInterval(tic);
  ronda.forEach(corregir);
  $('#pie').innerHTML = '';
  resumen();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function resumen() {
  const corregidas = ronda.filter(it => modo === 'examen' || it.elegida !== null);
  const bien = corregidas.filter(it => it.elegida !== null && it.opciones[it.elegida].ok);
  const nota = corregidas.length ? 10 * bien.length / corregidas.length : 0;
  const porTema = {};
  corregidas.forEach(it => {
    const t = porTema[it.p.tema] = porTema[it.p.tema] || { bien: 0, n: 0 };
    t.n++; if (bien.includes(it)) t.bien++;
  });
  const filas = Object.entries(porTema).sort((a, b) => a[1].bien / a[1].n - b[1].bien / b[1].n)
    .map(([t, v]) => `<div class="srow"><div>${esc(t)}<div class="mini"><div style="width:${100 * v.bien / v.n}%"></div></div></div><b>${v.bien}/${v.n}</b></div>`).join('');
  const erradas = corregidas.filter(it => !bien.includes(it)).map(it => it.p);
  const tiempo = modo === 'examen' ? ` en ${reloj(fin - inicio)}` : '';
  const destino = modo === 'examen' ? '#summary' : '#pie';
  const abajo = modo === 'examen' ? 'Abajo está cada pregunta con la explicación de todas las opciones.' : 'Arriba quedó cada pregunta con la explicación de todas las opciones.';
  $(destino).innerHTML = `<div class="summary" style="width:100%">
      <h2>Nota: ${coma(nota.toFixed(1))} / 10 · ${nota >= 6 ? 'aprobado' : 'a repasar'}</h2>
      <p class="sub" style="margin-bottom:8px">${bien.length} de ${corregidas.length} correctas${tiempo}. Por tema, de más flojo a más firme. ${abajo}</p>
      ${filas}
      ${erradas.length ? '<div class="controls" style="margin:12px 0 0"><button class="btn primary" id="rehacer">Practicar las que erré</button></div>' : ''}
    </div>`;
  if ($('#rehacer')) $('#rehacer').onclick = () => armarRonda(erradas);
}

function actualizarStats() {
  const resp = ronda.filter(it => it.elegida !== null).length;
  const nFlojas = BANCO.filter(p => esFloja(p.id)).length;
  let partes = [`<span>Respondidas: <b>${resp}</b>/<b>${ronda.length}</b></span>`];
  if (modo === 'practica' || entregado) {
    const bien = ronda.filter(it => it.elegida !== null && it.opciones[it.elegida].ok).length;
    const total = modo === 'examen' ? ronda.length : resp;
    partes.push(`<span>Correctas: <b>${bien}</b></span>`);
    partes.push(`<span>Nota: <b>${total ? coma((10 * bien / total).toFixed(1)) + ' / 10' : '—'}</b></span>`);
  }
  if (modo === 'examen') partes.push(`<span>Tiempo: <b>${reloj((fin || Date.now()) - inicio)}</b></span>`);
  partes.push(`<span>Flojas guardadas: <b>${nFlojas}</b></span>`);
  $('#stats').innerHTML = partes.join('');
  $('#entregar').hidden = !(modo === 'examen' && !entregado && ronda.length);
  $('#pbar').style.width = ronda.length ? (100 * resp / ronda.length) + '%' : '0';
  $('#flojas').disabled = nFlojas === 0;
  $('#flojas').textContent = `Repasar las flojas (${nFlojas})`;
}

function chips() {
  const c = $('#chips');
  c.innerHTML = '';
  Object.values(T).forEach(t => {
    const n = BANCO.filter(p => p.tema === t && pasaOrigen(p)).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip' + (temasActivos.has(t) ? ' on' : '');
    b.textContent = `${t} (${n})`;
    b.onclick = () => {
      temasActivos.has(t) ? temasActivos.delete(t) : temasActivos.add(t);
      if (!temasActivos.size) temasActivos = new Set(Object.values(T));
      armarRonda();
    };
    c.appendChild(b);
  });
}

/* ---------- Controles ---------- */
document.title = CONF.TITULO;
$('#titulo').textContent = CONF.TITULO;
$('#bajada').innerHTML = inline(CONF.BAJADA);
$('#tab-examen').textContent = `Examen (${CONF.EXAMEN} al azar)`;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { modo = t.dataset.modo; armarRonda(); });
$('#nueva').onclick = () => armarRonda();
$('#entregar').onclick = entregar;
$('#flojas').onclick = () => armarRonda(BANCO.filter(p => esFloja(p.id)));
$('#borrar').onclick = () => { if (confirm('¿Borrar el historial de preguntas flojas?')) { hist = {}; guardarHist(); render(); } };
$('#origen').textContent = ORIGENES[origen];
$('#origen').onclick = () => {
  const claves = Object.keys(ORIGENES);
  origen = claves[(claves.indexOf(origen) + 1) % claves.length];
  $('#origen').textContent = ORIGENES[origen];
  armarRonda();
};
$('#theme').onclick = () => {
  const root = document.documentElement;
  const oscuroAhora = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = oscuroAhora ? 'light' : 'dark';
};

armarRonda();
</script>
</body>
