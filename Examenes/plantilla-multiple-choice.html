<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<!-- Archivo generado por Parciales/generar-multiple-choice.js a partir de plantilla-multiple-choice.html.
     No lo edites a mano: corregí la pregunta en el cuestionario completo y volvé a generar. -->
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --ok: #1f7a4a; --ok-soft: #e3f3ea;
  --mid: #9a6700; --mid-soft: #fbf1d9; --bad: #b3261e; --bad-soft: #fbe7e5; --code: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #8aa8ff; --accent-soft: #232b44; --ok: #6fd29b; --ok-soft: #1b3326;
    --mid: #e8c068; --mid-soft: #3a3120; --bad: #ff8a80; --bad-soft: #3a1f1d; --code: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
  --accent: #8aa8ff; --accent-soft: #232b44; --ok: #6fd29b; --ok-soft: #1b3326;
  --mid: #e8c068; --mid-soft: #3a3120; --bad: #ff8a80; --bad-soft: #3a1f1d; --code: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .92em;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; font-size: .95rem; }
.stats b { font-variant-numeric: tabular-nums; }
.stats .entregar { margin-left: auto; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; font-size: .9rem; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary, .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .tab.on { color: #10131c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .tab.on { color: #10131c; } }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-size: .92rem; font-weight: 600; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted);
  padding: 4px 10px; border-radius: 999px; font-size: .82rem; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 18px 14px; margin-bottom: 16px; }
.q.mal { border-color: var(--bad); }
.q.bien { border-color: var(--ok); }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;
  font-size: .78rem; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.tag.apunte { border-style: dashed; }
.tag.floja { color: var(--bad); border-color: var(--bad); }
.num { font-weight: 700; color: var(--ink); }
.qtext { font-weight: 600; margin: 0 0 12px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 10px 12px; border-radius: 9px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { opacity: 1; cursor: default; }
.letter { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  font-size: .8rem; font-weight: 700; background: var(--code); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .letter { background: var(--accent); color: var(--card); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .letter { background: var(--ok); color: var(--card); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .letter { background: var(--bad); color: var(--card); }
.opt.dim { opacity: .6; }

.fb { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: .94rem; }
.fb h4 { margin: 12px 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.verdict { font-weight: 700; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.exp { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.exp li { padding-left: 12px; border-left: 3px solid var(--line); }
.exp li p { margin: 0; }
.exp li.good { border-left-color: var(--ok); } .exp li.wrong { border-left-color: var(--bad); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
.model { background: var(--ok-soft); border-left: 3px solid var(--ok); padding: 10px 12px; border-radius: 0 8px 8px 0; margin-top: 8px; }
.model p { margin: 0 0 6px; } .model p:last-child { margin: 0; }
.model ul { margin: 4px 0 6px; padding-left: 20px; }
.warn { background: var(--mid-soft); border-left: 3px solid var(--mid); padding: 10px 12px; border-radius: 0 8px 8px 0; margin-top: 8px; }
.warn p { margin: 0 0 6px; } .warn p:last-child { margin: 0; }

.pie { display: flex; justify-content: center; margin: 8px 0 24px; }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.summary h2 { margin: 0 0 6px; font-size: 1.2rem; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.srow:last-of-type { border-bottom: 0; }
.mini { height: 5px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.mini > div { height: 100%; background: var(--ok); }
.themebtn { float: right; }
@media (max-width: 520px) { h1 { font-size: 1.35rem; } }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn themebtn" id="theme" title="Cambiar tema">◐</button>
  <h1 id="titulo"></h1>
  <p class="sub" id="bajada"></p>

  <div class="tabs">
    <button class="tab" data-modo="examen" id="tab-examen"></button>
    <button class="tab" data-modo="practica">Práctica (corrección al instante)</button>
  </div>

  <div class="bar">
    <div class="stats"><span id="stats" style="display:contents"></span><button class="btn primary entregar" id="entregar" hidden>Entregar</button></div>
    <div class="progress"><div id="pbar"></div></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="nueva">Nueva ronda</button>
    <button class="btn" id="flojas">Repasar las flojas</button>
    <button class="btn" id="borrar">Olvidar historial</button>
    <button class="btn" id="origen"></button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="summary"></div>
  <div id="list"></div>
  <div class="pie" id="pie"></div>
</div>

<script>
/*__DATOS__*/

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
}
function fmt(s) {
  return s.split('\n\n').map(bloque => {
    let html = '', items = [];
    const cerrar = () => { if (items.length) { html += '<ul>' + items.join('') + '</ul>'; items = []; } };
    bloque.split('\n').forEach(l => {
      if (l.startsWith('- ')) items.push(`<li>${inline(l.slice(2))}</li>`);
      else { cerrar(); html += `<p>${inline(l)}</p>`; }
    });
    cerrar();
    return html;
  }).join('');
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coma = x => String(x).replace('.', ',');
const reloj = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- Historial: última respuesta de cada pregunta (1 bien, 0 mal), sólo en este navegador ---------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem(CONF.KEY)) || {}; } catch (e) { hist = {}; }
const guardarHist = () => { try { localStorage.setItem(CONF.KEY, JSON.stringify(hist)); } catch (e) {} };
const esFloja = id => hist[id] === 0;

/* ---------- Filtros ---------- */
const ORIGENES = { todas: 'Fuente: parciales + apunte', examen: 'Fuente: sólo parciales', apunte: 'Fuente: sólo apunte' };
let origen = 'todas';
const pasaOrigen = p => origen === 'todas' || (origen === 'examen') === p.ex;
let temasActivos = new Set(Object.values(T));
const base = () => BANCO.filter(p => temasActivos.has(p.tema) && pasaOrigen(p));

/* ---------- Estado de la ronda ---------- */
let modo = 'examen';
let ronda = [];          // [{p, opciones:[{x, e, ok}], elegida: índice | null}]
let entregado = false;
let inicio = 0, fin = 0, tic = null;

function elegirExamen(b) {
  let elegidas = [];
  if (CONF.BLOQUES) {
    Object.entries(CONF.BLOQUES).forEach(([bl, n]) => elegidas.push(...shuffle(b.filter(p => p.b === bl)).slice(0, n)));
  }
  const resto = shuffle(b.filter(p => !elegidas.includes(p)));
  elegidas.push(...resto.slice(0, Math.max(0, CONF.EXAMEN - elegidas.length)));
  return shuffle(elegidas);
}

function armarRonda(lista) {
  let preguntas;
  if (lista) { preguntas = shuffle(lista); modo = 'practica'; }
  else preguntas = modo === 'examen' ? elegirExamen(base()) : shuffle(base());
  ronda = preguntas.map(p => ({ p, opciones: shuffle(p.o.map((o, i) => ({ x: o[0], e: o[1], ok: i === p.c }))), elegida: null }));
  entregado = false;
  inicio = Date.now(); fin = 0;
  clearInterval(tic);
  if (modo === 'examen') tic = setInterval(actualizarStats, 1000);
  render();
}

/* ---------- Render ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.modo === modo));
  $('#summary').innerHTML = '';
  const list = $('#list');
  list.innerHTML = '';
  if (!ronda.length) list.innerHTML = '<p class="sub">No hay preguntas con estos filtros.</p>';
  ronda.forEach((item, n) => list.appendChild(tarjeta(item, n)));
  $('#pie').innerHTML = modo === 'examen' && ronda.length ? '<button class="btn primary" id="entregar2">Entregar el examen</button>' : '';
  if ($('#entregar2')) $('#entregar2').onclick = entregar;
  chips();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function tarjeta(item, n) {
  const { p } = item;
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = `<div class="qhead"><span class="num">${n + 1}.</span>
      ${p.b ? `<span class="tag">${esc(p.b)}</span>` : ''}
      <span class="tag">${esc(p.tema)}</span>
      <span class="tag${p.ex ? '' : ' apunte'}">${p.ex ? 'Parcial' : 'Fuente'}: ${esc(p.src)}</span>
      ${esFloja(p.id) ? '<span class="tag floja">floja</span>' : ''}</div>
    <p class="qtext">${inline(p.q)}</p>
    <div class="opts"></div>
    <div class="fb" hidden></div>`;
  const opts = el.querySelector('.opts');
  item.opciones.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[k]}</span><span>${inline(o.x)}</span>`;
    b.onclick = () => elegir(item, k, el);
    opts.appendChild(b);
  });
  item.el = el;
  return el;
}

function elegir(item, k, el) {
  if (entregado || (modo === 'practica' && item.elegida !== null)) return;
  item.elegida = k;
  if (modo === 'practica') corregir(item);
  else el.querySelectorAll('.opt').forEach((b, i) => b.classList.toggle('sel', i === k));
  actualizarStats();
  if (modo === 'practica' && ronda.every(it => it.elegida !== null)) resumen();
}

function corregir(item) {
  const el = item.el, k = item.elegida;
  const acerto = k !== null && item.opciones[k].ok;
  el.classList.add(acerto ? 'bien' : 'mal');
  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('sel');
    const o = item.opciones[i];
    b.classList.add(o.ok ? 'ok' : (i === k ? 'bad' : 'dim'));
  });
  const p = item.p;
  const veredicto = k === null ? '<div class="verdict bad">Sin responder</div>'
    : acerto ? '<div class="verdict ok">✔ Correcto</div>' : '<div class="verdict bad">✘ Incorrecto</div>';
  const fb = el.querySelector('.fb');
  fb.innerHTML = `${veredicto}
    <ul class="exp">${item.opciones.map((o, i) => `<li class="${o.ok ? 'good' : 'wrong'}"><p><b>${'ABCD'[i]}.</b> ${inline(o.e)}</p></li>`).join('')}</ul>
    ${p.n ? `<div class="warn">${fmt(p.n)}</div>` : ''}
    <details><summary>Ver la respuesta desarrollada</summary><div class="model">${fmt(p.r)}</div></details>`;
  fb.hidden = false;
  hist[p.id] = acerto ? 1 : 0;
  guardarHist();
}

function entregar() {
  if (entregado || !ronda.length) return;
  const faltan = ronda.filter(it => it.elegida === null).length;
  if (faltan && !confirm(`Te ${faltan === 1 ? 'falta 1 pregunta' : `faltan ${faltan} preguntas`}. Las que no respondas cuentan como incorrectas. ¿Entregar igual?`)) return;
  entregado = true;
  fin = Date.now();
  clearInterval(tic);
  ronda.forEach(corregir);
  $('#pie').innerHTML = '';
  resumen();
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function resumen() {
  const corregidas = ronda.filter(it => modo === 'examen' || it.elegida !== null);
  const bien = corregidas.filter(it => it.elegida !== null && it.opciones[it.elegida].ok);
  const nota = corregidas.length ? 10 * bien.length / corregidas.length : 0;
  const porTema = {};
  corregidas.forEach(it => {
    const t = porTema[it.p.tema] = porTema[it.p.tema] || { bien: 0, n: 0 };
    t.n++; if (bien.includes(it)) t.bien++;
  });
  const filas = Object.entries(porTema).sort((a, b) => a[1].bien / a[1].n - b[1].bien / b[1].n)
    .map(([t, v]) => `<div class="srow"><div>${esc(t)}<div class="mini"><div style="width:${100 * v.bien / v.n}%"></div></div></div><b>${v.bien}/${v.n}</b></div>`).join('');
  const erradas = corregidas.filter(it => !bien.includes(it)).map(it => it.p);
  const tiempo = modo === 'examen' ? ` en ${reloj(fin - inicio)}` : '';
  const destino = modo === 'examen' ? '#summary' : '#pie';
  const abajo = modo === 'examen' ? 'Abajo está cada pregunta con la explicación de todas las opciones.' : 'Arriba quedó cada pregunta con la explicación de todas las opciones.';
  $(destino).innerHTML = `<div class="summary" style="width:100%">
      <h2>Nota: ${coma(nota.toFixed(1))} / 10 · ${nota >= 6 ? 'aprobado' : 'a repasar'}</h2>
      <p class="sub" style="margin-bottom:8px">${bien.length} de ${corregidas.length} correctas${tiempo}. Por tema, de más flojo a más firme. ${abajo}</p>
      ${filas}
      ${erradas.length ? '<div class="controls" style="margin:12px 0 0"><button class="btn primary" id="rehacer">Practicar las que erré</button></div>' : ''}
    </div>`;
  if ($('#rehacer')) $('#rehacer').onclick = () => armarRonda(erradas);
}

function actualizarStats() {
  const resp = ronda.filter(it => it.elegida !== null).length;
  const nFlojas = BANCO.filter(p => esFloja(p.id)).length;
  let partes = [`<span>Respondidas: <b>${resp}</b>/<b>${ronda.length}</b></span>`];
  if (modo === 'practica' || entregado) {
    const bien = ronda.filter(it => it.elegida !== null && it.opciones[it.elegida].ok).length;
    const total = modo === 'examen' ? ronda.length : resp;
    partes.push(`<span>Correctas: <b>${bien}</b></span>`);
    partes.push(`<span>Nota: <b>${total ? coma((10 * bien / total).toFixed(1)) + ' / 10' : '—'}</b></span>`);
  }
  if (modo === 'examen') partes.push(`<span>Tiempo: <b>${reloj((fin || Date.now()) - inicio)}</b></span>`);
  partes.push(`<span>Flojas guardadas: <b>${nFlojas}</b></span>`);
  $('#stats').innerHTML = partes.join('');
  $('#entregar').hidden = !(modo === 'examen' && !entregado && ronda.length);
  $('#pbar').style.width = ronda.length ? (100 * resp / ronda.length) + '%' : '0';
  $('#flojas').disabled = nFlojas === 0;
  $('#flojas').textContent = `Repasar las flojas (${nFlojas})`;
}

function chips() {
  const c = $('#chips');
  c.innerHTML = '';
  Object.values(T).forEach(t => {
    const n = BANCO.filter(p => p.tema === t && pasaOrigen(p)).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip' + (temasActivos.has(t) ? ' on' : '');
    b.textContent = `${t} (${n})`;
    b.onclick = () => {
      temasActivos.has(t) ? temasActivos.delete(t) : temasActivos.add(t);
      if (!temasActivos.size) temasActivos = new Set(Object.values(T));
      armarRonda();
    };
    c.appendChild(b);
  });
}

/* ---------- Controles ---------- */
document.title = CONF.TITULO;
$('#titulo').textContent = CONF.TITULO;
$('#bajada').innerHTML = inline(CONF.BAJADA);
$('#tab-examen').textContent = `Examen (${CONF.EXAMEN} al azar)`;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { modo = t.dataset.modo; armarRonda(); });
$('#nueva').onclick = () => armarRonda();
$('#entregar').onclick = entregar;
$('#flojas').onclick = () => armarRonda(BANCO.filter(p => esFloja(p.id)));
$('#borrar').onclick = () => { if (confirm('¿Borrar el historial de preguntas flojas?')) { hist = {}; guardarHist(); render(); } };
$('#origen').textContent = ORIGENES[origen];
$('#origen').onclick = () => {
  const claves = Object.keys(ORIGENES);
  origen = claves[(claves.indexOf(origen) + 1) % claves.length];
  $('#origen').textContent = ORIGENES[origen];
  armarRonda();
};
$('#theme').onclick = () => {
  const root = document.documentElement;
  const oscuroAhora = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = oscuroAhora ? 'light' : 'dark';
};

armarRonda();
</script>
</body>
</html>
