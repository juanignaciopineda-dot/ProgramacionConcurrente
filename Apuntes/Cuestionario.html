<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario Concurrente</title>
<style>
:root {
  --bg: #f6f5f1;
  --card: #ffffff;
  --ink: #1d1d1b;
  --muted: #6b6a64;
  --line: #e3e1da;
  --accent: #2f5bd3;
  --accent-soft: #e8eefc;
  --ok: #1f7a4a;
  --ok-soft: #e3f3ea;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --code: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #8aa8ff; --accent-soft: #232b44; --ok: #6fd29b; --ok-soft: #1b3326;
    --bad: #ff8a80; --bad-soft: #3a1f1d; --code: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
  --accent: #8aa8ff; --accent-soft: #232b44; --ok: #6fd29b; --ok-soft: #1b3326;
  --bad: #ff8a80; --bad-soft: #3a1f1d; --code: #2a2a27;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .92em;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; font-size: .95rem; }
.stats b { font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .btn.primary { color: #10131c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10131c; } }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted);
  padding: 4px 10px; border-radius: 999px; font-size: .82rem; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 18px 14px; margin-bottom: 16px; }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;
  font-size: .78rem; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.num { font-weight: 700; color: var(--ink); }
.qtext { font-weight: 600; margin: 0 0 12px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 10px 12px; border-radius: 9px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.letter { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  font-size: .8rem; font-weight: 700; background: var(--code); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .letter { background: var(--ok); color: var(--card); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .letter { background: var(--bad); color: var(--card); }
.opt.dim { opacity: .6; }
.vf { grid-template-columns: 1fr 1fr; }

.fb { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: .94rem; }
.verdict { font-weight: 700; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.fb h4 { margin: 10px 0 4px; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.fb ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.fb li { padding-left: 12px; border-left: 3px solid var(--line); }
.fb li.good { border-left-color: var(--ok); }
.fb li.wrong { border-left-color: var(--bad); }
.fb p { margin: 0; }

.summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 10px; }
.summary h2 { margin: 0 0 10px; font-size: 1.2rem; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.row:last-child { border-bottom: 0; }
.mini { height: 5px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.mini > div { height: 100%; background: var(--ok); }
.themebtn { float: right; }
@media (max-width: 520px) { .vf { grid-template-columns: 1fr; } h1 { font-size: 1.35rem; } }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn themebtn" id="theme" title="Cambiar tema">◐</button>
  <h1>Cuestionario — Programación Concurrente</h1>
  <p class="sub">Verdadero/falso y opción múltiple sobre todo el apunte. Al responder cada pregunta aparece por qué la correcta es correcta y por qué las otras no lo son. Las opciones se mezclan en cada intento.</p>

  <div class="bar">
    <div class="stats">
      <span>Respondidas: <b id="sAns">0</b>/<b id="sTot">0</b></span>
      <span>Correctas: <b id="sOk">0</b></span>
      <span>Incorrectas: <b id="sBad">0</b></span>
      <span>Nota: <b id="sPct">—</b></span>
    </div>
    <div class="progress"><div id="pbar"></div></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="reset">Mezclar y reiniciar</button>
    <button class="btn" id="retry">Repetir sólo las falladas</button>
    <button class="btn" id="type-all">Todas</button>
    <button class="btn" id="type-vf">Sólo V/F</button>
    <button class="btn" id="type-mc">Sólo opción múltiple</button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="list"></div>
  <div id="summary"></div>
</div>

<script>
/* ---------- Banco de preguntas ----------
   vf: {tema, tipo:'vf', q, v:true|false, e:'argumento'}
   mc: {tema, tipo:'mc', q, o:[[texto, argumento], ...], c: índice de la correcta}
------------------------------------------ */
const T = {
  JAVA: 'Java y UML',
  FUND: 'Fundamentos',
  PROC: 'Procesos e hilos',
  LENG: 'Lenguajes y autómatas',
  THR: 'Threads en Java',
  SYNC: 'synchronized',
  LOCK: 'Locks y semáforos',
  INT: 'Interrupción, sleep y join',
  UTIL: 'Excepciones, daemon, ThreadLocal, Latch',
  RDP: 'Redes de Petri',
  PROP: 'Propiedades de RdP'
};

const BANCO = [
/* ======================= JAVA Y UML ======================= */
{tema:T.JAVA, tipo:'vf', v:false,
 q:'En Java existen tres niveles de acceso: `public`, `protected` y `private`.',
 e:'Son cuatro. Falta el package-private, que es el que queda cuando no se escribe ningún modificador: da acceso a la misma clase y al mismo paquete, pero no a subclases de otro paquete.'},
{tema:T.JAVA, tipo:'vf', v:true,
 q:'`protected` da acceso a todas las clases del mismo paquete, no sólo a las subclases.',
 e:'Es verdadero: `protected` incluye todo lo que da package-private (misma clase y mismo paquete) y además suma las subclases de otros paquetes.'},
{tema:T.JAVA, tipo:'vf', v:false,
 q:'`instancias++` sobre un campo `static` es atómico porque se escribe en una sola sentencia.',
 e:'Una sentencia no es una acción atómica. `x++` son tres pasos (leer, incrementar, escribir), y otro hilo puede meterse entre ellos. Por eso un `static` compartido es la primera fuente de condiciones de carrera.'},
{tema:T.JAVA, tipo:'mc', c:0,
 q:'¿Qué garantiza un campo `final` correctamente inicializado respecto de otros hilos?',
 o:[['Que otros hilos lo ven completo sin sincronización.','Correcta: el modelo de memoria de Java garantiza que un `final` bien inicializado se ve completo. Es la base de usar objetos inmutables en lugar de locks.'],
    ['Que sólo lo ve el hilo que ejecutó el constructor.','Falso: cualquier hilo puede leerlo. Lo que da `final` es justamente la garantía de que lo lee completo.'],
    ['Que hay que marcarlo `volatile` para que se vea.','Falso: `final` ya trae su propia garantía de visibilidad. `volatile` se usa en campos mutables.'],
    ['Que sólo se lee bien dentro de un `synchronized`.','Falso: la ventaja de un `final` es que no hace falta sincronizar para leerlo bien.']]},
{tema:T.JAVA, tipo:'mc', c:1,
 q:'¿Por qué se prefiere implementar `Runnable` antes que extender `Thread`?',
 o:[['Porque un `Runnable` se ejecuta más rápido que un `Thread`.','Falso: la velocidad es la misma. Al final un `Runnable` también lo ejecuta un `Thread`.'],
    ['Porque `extends` gasta la única herencia y ata la tarea al hilo.','Correcta: Java tiene herencia simple. Además, con `Runnable` la tarea queda separada del mecanismo que la ejecuta.'],
    ['Porque `Thread` no deja sobrescribir el método `run()`.','Falso: se puede sobrescribir `run()`. Es la "forma 1" de crear hilos.'],
    ['Porque a un `Thread` heredado no se le puede poner nombre.','Falso: `setName()` y `setPriority()` funcionan igual con cualquiera de las dos formas.']]},
{tema:T.JAVA, tipo:'mc', c:2,
 q:'¿Desde qué versión de Java las interfaces pueden tener métodos `private`?',
 o:[['Java 8','Falso: Java 8 agregó métodos `default` y `static` en interfaces, pero todavía no `private`.'],
    ['Java 11','Falso: para Java 11 los métodos `private` en interfaces ya existían.'],
    ['Java 9','Correcta: ese es el "cambio en Java 9" que menciona la filmina.'],
    ['Java 17','Falso: Java 17 trajo sealed classes y records, no esto.']]},
{tema:T.JAVA, tipo:'mc', c:3,
 q:'¿En qué versión LTS aparecen los Virtual Threads (JEP 444)?',
 o:[['Java 8','Falso: Java 8 trajo lambdas, streams paralelos y `CompletableFuture`.'],
    ['Java 11','Falso: Java 11 trajo el cliente HTTP asincrónico.'],
    ['Java 17','Falso: Java 17 trajo records y sealed classes.'],
    ['Java 21','Correcta: Java 21 (septiembre de 2023) trajo Virtual Threads y Structured Concurrency.']]},
{tema:T.JAVA, tipo:'vf', v:true,
 q:'En UML, la agregación se dibuja con rombo vacío y la composición con rombo lleno.',
 e:'Verdadero. En la agregación la parte puede seguir existiendo sin el todo. En la composición, la vida de la parte depende de la del todo.'},
{tema:T.JAVA, tipo:'vf', v:true,
 q:'En un diagrama de secuencia, el mensaje asincrónico (punta abierta) sirve para modelar el `start()` de un hilo.',
 e:'Verdadero: quien envía sigue sin esperar respuesta, igual que `main` después de `start()`. El mensaje sincrónico, en cambio, representa una llamada común que bloquea a quien la hace (como `run()`).'},
{tema:T.JAVA, tipo:'mc', c:1,
 q:'¿Qué fragmento combinado de UML marca una región atómica que ningún otro fragmento puede intercalar?',
 o:[['`par`','Falso: `par` es lo contrario, deja que los operandos se intercalen de cualquier manera.'],
    ['`critical`','Correcta: es la sección crítica dibujada. Ni siquiera un `par` puede intercalarla.'],
    ['`strict`','Falso: `strict` impone un orden vertical estricto, pero no habla de atomicidad.'],
    ['`assert`','Falso: `assert` dice que esa secuencia es la única válida en ese punto.']]},
{tema:T.JAVA, tipo:'mc', c:0,
 q:'¿Qué significa el operador `par` en un diagrama de secuencia?',
 o:[['Los operandos se intercalan de cualquier forma, pero cada uno mantiene su orden interno.','Correcta: es el interleaving dibujado. El entrelazado no está fijado de antemano.'],
    ['Se ejecuta un solo operando, el que tiene la guarda verdadera.','Falso: eso es `alt`.'],
    ['Describe una traza que no debe ocurrir nunca.','Falso: eso es `neg`.'],
    ['Repite el operando entre un mínimo y un máximo de veces.','Falso: eso es `loop(min, max)`.']]},

/* ======================= FUNDAMENTOS ======================= */
{tema:T.FUND, tipo:'vf', v:false,
 q:'Según Dijkstra, con suficientes casos de prueba el testing puede garantizar que no hay errores.',
 e:'Es al revés: "el testing puede confirmar la presencia de errores, pero nunca garantizar su ausencia". Para garantizar ausencia de errores hace falta verificación (por ejemplo, model checking sobre un modelo).'},
{tema:T.FUND, tipo:'vf', v:false,
 q:'Una propiedad de seguridad (safety) dice que "algo bueno termina ocurriendo".',
 e:'Eso es progreso (liveness). Seguridad es "nada malo ocurre nunca", por ejemplo que nunca haya dos procesos en la sección crítica.'},
{tema:T.FUND, tipo:'vf', v:true,
 q:'El estado de un programa concurrente incluye el program counter de cada proceso, no sólo las variables globales.',
 e:'Verdadero: los pc son variables implícitas del estado. Por eso el espacio de estados es el producto de los valores de las variables por todas las posiciones posibles de cada pc.'},
{tema:T.FUND, tipo:'vf', v:true,
 q:'Un programa concurrente en un monoprocesador no es paralelo, pero sigue teniendo todos los problemas de la concurrencia.',
 e:'Verdadero. La concurrencia es una propiedad de cómo está estructurado el programa y el paralelismo una propiedad de cómo se ejecuta. Aunque haya un solo núcleo, el interleaving puede provocar condiciones de carrera.'},
{tema:T.FUND, tipo:'vf', v:true,
 q:'En un livelock los procesos siguen consumiendo CPU, pero ninguno progresa.',
 e:'Verdadero, y eso lo diferencia del deadlock: en el deadlock los procesos están bloqueados y no usan CPU. En el livelock están activos y reaccionan todo el tiempo entre sí sin avanzar, como dos personas que se corren para el mismo lado en un pasillo.'},
{tema:T.FUND, tipo:'vf', v:true,
 q:'En el pasaje de mensajes, la sincronización está implícita en las primitivas `send`/`receive`.',
 e:'Verdadero: no se puede recibir un mensaje que todavía no se envió, y eso ya sincroniza. Con memoria compartida, en cambio, hay que sincronizar a mano (semáforos, monitores, locks).'},
{tema:T.FUND, tipo:'mc', c:2,
 q:'Dos hilos ejecutan una vez cada uno `contador++` sobre un `contador` compartido que empieza en 0. ¿Qué valores puede tener al final?',
 o:[['Siempre 2.','Falso: sería así sólo si `++` fuera atómico. Si los dos leen 0 antes de que alguno escriba, se pierde una actualización.'],
    ['Siempre 1.','Falso: si un hilo termina las tres acciones antes de que el otro lea, el resultado es 2.'],
    ['1 o 2, según el interleaving.','Correcta: los dos resultados corresponden a ejecuciones válidas. El 1 sale cuando ambos leen 0 antes de escribir.'],
    ['0, 1 o 2.','Falso: alguno de los dos siempre escribe al menos un 1, así que 0 no puede salir.']]},
{tema:T.FUND, tipo:'mc', c:3,
 q:'¿Cuál fue la causa del accidente del Therac-25?',
 o:[['Un overflow al convertir un flotante de 64 bits a un entero de 16.','Falso: eso pasó con el Ariane 5.'],
    ['Un error de redondeo que se fue acumulando en el reloj del sistema.','Falso: eso pasó con el misil Patriot.'],
    ['Un módulo trabajaba en sistema imperial y otro en métrico.','Falso: eso pasó con el Mars Climate Orbiter.'],
    ['Una condición de carrera.','Correcta: fue una carrera entre la interfaz y el control del equipo de radioterapia. Es un error de concurrencia que el testing no detectó.']]},
{tema:T.FUND, tipo:'mc', c:0,
 q:'¿Cuál de estos es un sistema reactivo?',
 o:[['Un servidor web.','Correcta: interactúa todo el tiempo con el entorno, no calcula un resultado final y no se espera que termine.'],
    ['Un compilador.','Falso: es el ejemplo típico de sistema transformacional. Recibe una entrada, produce una salida y termina.'],
    ['Un cálculo científico por lotes.','Falso: también es transformacional. Tiene entradas conocidas, una salida y un final.'],
    ['Un programa que ordena un archivo.','Falso: es transformacional. Su corrección es una relación entre entrada y salida.']]},
{tema:T.FUND, tipo:'mc', c:1,
 q:'En la tabla de la filmina de lenguajes, ¿quién marca el ritmo en un sistema interactivo?',
 o:[['El entorno, a la velocidad que él determina.','Falso: eso define al sistema reactivo.'],
    ['El propio sistema, a su ritmo.','Correcta: un shell o un IDE interactúan con el usuario todo el tiempo, pero cuando responden lo decide el sistema.'],
    ['Nadie, porque el programa corre y termina.','Falso: eso corresponde al transformacional.'],
    ['El planificador del sistema operativo.','Falso: la tabla no clasifica por planificador sino por la relación con el entorno.']]},
{tema:T.FUND, tipo:'mc', c:0,
 q:'De los seis requisitos de la exclusión mutua (Stallings), ¿cuál es la propiedad de seguridad?',
 o:[['Exclusión mutua efectiva.','Correcta: "a lo sumo uno a la vez en la sección crítica" dice que algo malo no pasa nunca. Es el requisito 1.'],
    ['No hay demora indefinida.','Falso: es de progreso (requisito 3). Pide que no haya inanición ni deadlock.'],
    ['Si la sección crítica está libre, se entra sin demora.','Falso: es de progreso (requisito 4).'],
    ['Se permanece un tiempo finito en la sección crítica.','Falso: es de progreso (requisito 6), y además le corresponde al programador.']]},
{tema:T.FUND, tipo:'mc', c:2,
 q:'Hay procesos que no se conocen por identificador pero comparten un objeto. ¿Qué tipo de interacción es, según Stallings?',
 o:[['Competencia.','Falso: la competencia es entre procesos que no saben nada unos de otros (nivel 1).'],
    ['Cooperación por comunicación.','Falso: ahí los procesos se conocen de forma directa y se mandan mensajes por identificador (nivel 3).'],
    ['Cooperación por compartimiento.','Correcta: es el nivel 2, donde se conocen de forma indirecta. Es el único nivel que suma el problema de coherencia de los datos.'],
    ['Independencia total.','Falso: si comparten un objeto hay interacción y hace falta control.']]},
{tema:T.FUND, tipo:'mc', c:3,
 q:'En pasaje de mensajes, ¿qué combinación se considera la más útil?',
 o:[['Envío bloqueante y recepción bloqueante (rendezvous).','Falso: sirve, pero es la sincronización más fuerte y bloquea a los dos lados.'],
    ['Envío y recepción no bloqueantes.','Falso: nadie espera a nadie, y el receptor puede seguir sin tener el dato que le hace falta.'],
    ['Envío bloqueante y recepción no bloqueante.','Falso: el emisor se frena sin necesidad y el receptor puede quedarse sin el dato.'],
    ['Envío no bloqueante y recepción bloqueante.','Correcta: el emisor sigue trabajando y el receptor espera lo que necesita para continuar.']]},
{tema:T.FUND, tipo:'mc', c:1,
 q:'Dos procesos de 10 estados cada uno. ¿Cuántos estados tiene la FSM producto y cuántos lugares una red de Petri equivalente?',
 o:[['20 estados y 100 lugares.','Falso: está al revés. El producto multiplica y la red suma.'],
    ['100 estados y 20 lugares.','Correcta: la FSM producto tiene n^k = 10² estados. La red usa k·n = 20 lugares, porque el estado global sale del marcado.'],
    ['100 estados y 100 lugares.','Falso: la red no necesita dibujar el estado global.'],
    ['20 estados y 20 lugares.','Falso: la FSM producto tiene un estado por cada tupla de estados locales.']]},

/* ======================= PROCESOS E HILOS ======================= */
{tema:T.PROC, tipo:'vf', v:false,
 q:'Los hilos de un mismo proceso comparten la pila de ejecución.',
 e:'Cada hilo tiene su propia pila, su propio contador de programa y sus propios registros. Lo que comparten es la memoria (variables de instancia y estáticas), los archivos abiertos y los permisos.'},
{tema:T.PROC, tipo:'vf', v:false,
 q:'Cuando un hilo se desbloquea, pasa directamente a ejecución.',
 e:'Vuelve a la cola de listos y espera a que el planificador lo elija. En Java pasa lo mismo: de `BLOCKED`, `WAITING` o `TIMED_WAITING` siempre se vuelve a `RUNNABLE`.'},
{tema:T.PROC, tipo:'vf', v:true,
 q:'Los hilos no tienen estados de suspensión, porque suspender es una operación sobre el proceso.',
 e:'Verdadero: un hilo tiene los tres estados básicos (ejecución, listo, bloqueado). Suspender, es decir, sacar de memoria principal, se hace con el proceso entero.'},
{tema:T.PROC, tipo:'mc', c:0,
 q:'¿Qué tiene cada hilo como propio, sin compartirlo con los demás?',
 o:[['El contador de programa, la pila y los registros.','Correcta: eso forma el contexto de ejecución de cada hilo. Por eso cambiar de hilo es barato.'],
    ['Los archivos abiertos del proceso.','Falso: todos los hilos del proceso comparten los archivos abiertos.'],
    ['El espacio de direcciones de memoria.','Falso: la memoria se comparte, y de ahí viene la necesidad de exclusión mutua.'],
    ['La autenticación y los permisos.','Falso: son del proceso y los comparten todos sus hilos.']]},
{tema:T.PROC, tipo:'mc', c:2,
 q:'¿Qué es un proceso "suspendido programado" (suspended ready)?',
 o:[['Un proceso nuevo que el sistema operativo todavía no admitió.','Falso: ese es el estado New.'],
    ['Uno suspendido que todavía espera el evento que lo bloqueó.','Falso: ese es el suspendido bloqueado.'],
    ['Uno suspendido que ya no tiene motivo de bloqueo.','Correcta: fue sacado de memoria, pero si volviera podría ejecutar.'],
    ['Uno que perdió la CPU porque se le terminó el quantum.','Falso: ese pasa de Running a Ready, sin suspenderse.']]},
{tema:T.PROC, tipo:'mc', c:3,
 q:'¿Por qué comunicar hilos es más barato que comunicar procesos?',
 o:[['Porque los hilos siempre corren en núcleos distintos.','Falso: dos hilos pueden correr en el mismo núcleo. El costo no depende de eso.'],
    ['Porque cada hilo tiene su propio BCP completo.','Falso: es al revés. El BCP es del proceso, y justamente eso es lo que hace caro al proceso.'],
    ['Porque el sistema operativo copia la memoria de cada hilo.','Falso: no hay ninguna copia. Los hilos ya comparten la memoria.'],
    ['Porque no hace falta invocar al núcleo.','Correcta: se comunican directamente por memoria compartida. Entre procesos hace falta el núcleo para proteger y transferir.']]},

/* ======================= LENGUAJES Y AUTÓMATAS ======================= */
{tema:T.LENG, tipo:'vf', v:true,
 q:'El universo del discurso W(V) es infinito aunque el alfabeto V sea finito.',
 e:'Verdadero: con un solo símbolo ya se pueden formar λ, a, aa, aaa, … Cada cadena es finita, pero hay infinitas cadenas.'},
{tema:T.LENG, tipo:'vf', v:false,
 q:'El lenguaje vacío ∅ y el lenguaje {λ} tienen la misma cardinalidad.',
 e:'∅ no tiene ninguna cadena, así que su cardinal es 0. {λ} tiene una cadena, que es la vacía, así que su cardinal es 1. Es la confusión clásica del parcial.'},
{tema:T.LENG, tipo:'vf', v:true,
 q:'Toda gramática de tipo 3 es también de tipo 2.',
 e:'Verdadero: la jerarquía de Chomsky es inclusiva y cada tipo contiene a los siguientes. Una regla A → aB ya tiene un solo no terminal a la izquierda, que es lo que pide el tipo 2.'},
{tema:T.LENG, tipo:'vf', v:false,
 q:'La tesis de Church es un teorema demostrado formalmente.',
 e:'No se puede demostrar formalmente, porque "algoritmo" es una noción intuitiva y no formal. Se acepta casi universalmente porque todos los otros formalismos (funciones recursivas, cálculo lambda) resultaron equivalentes a la máquina de Turing.'},
{tema:T.LENG, tipo:'vf', v:true,
 q:'Las máquinas de Moore y de Mealy son igualmente expresivas.',
 e:'Verdadero: las dos son máquinas de estados finitos y sirven para analizar lenguajes regulares. Cambia dónde va la salida (en el estado o en el arco) y cuántos estados necesitan, no lo que pueden expresar.'},
{tema:T.LENG, tipo:'vf', v:false,
 q:'Un AFND de n estados siempre da un AFD de exactamente 2ⁿ estados.',
 e:'2ⁿ es una cota superior. En la construcción de subconjuntos sólo aparecen los subconjuntos alcanzables: en el ejemplo del apunte quedan 3 de 8.'},
{tema:T.LENG, tipo:'vf', v:true,
 q:'Los autómatas de pila que aceptan por estado final y los que aceptan por pila vacía reconocen la misma clase de lenguajes.',
 e:'Verdadero: se demuestra que las dos definiciones son equivalentes, porque la clase de lenguajes aceptados es la misma.'},
{tema:T.LENG, tipo:'mc', c:1,
 q:'¿Qué es V⁺?',
 o:[['V* más la cadena vacía.','Falso: V* ya contiene a λ, así que no hay nada que agregar.'],
    ['V* sin la cadena vacía.','Correcta: V⁺ = V* − {λ}. Es la clausura positiva.'],
    ['El conjunto de símbolos de V.','Falso: eso es el propio alfabeto V, que es finito.'],
    ['Las cadenas de V de longitud par.','Falso: la clausura positiva no pone ninguna condición sobre la longitud.']]},
{tema:T.LENG, tipo:'mc', c:2,
 q:'¿De qué tipo es la gramática S → aSb, S → ab?',
 o:[['Tipo 3','Falso: S → aSb no tiene la forma A → aB ni A → a.'],
    ['Tipo 1, y no puede ser de otro tipo','Falso: sí es de tipo 1, pero cumple una restricción más fuerte.'],
    ['Tipo 2','Correcta: a la izquierda hay un solo no terminal. Genera aⁿbⁿ, que no es regular.'],
    ['Tipo 0, y no puede ser de otro tipo','Falso: tiene restricciones, así que entra en un nivel más bajo de la jerarquía.']]},
{tema:T.LENG, tipo:'mc', c:0,
 q:'¿Cuál es el nivel más bajo de la jerarquía de Chomsky al que pertenece {aⁿbⁿcⁿ | n ≥ 1}?',
 o:[['Tipo 1','Correcta: una sola pila alcanza para aparear dos bloques pero no tres. Hace falta un autómata lineal acotado.'],
    ['Tipo 2','Falso: con una pila se cuentan las a contra las b, y para las c ya no queda información.'],
    ['Tipo 3','Falso: un autómata finito ni siquiera puede con aⁿbⁿ.'],
    ['Tipo 0','Falso: es de tipo 0 porque es de tipo 1, pero ese no es el nivel más bajo.']]},
{tema:T.LENG, tipo:'mc', c:3,
 q:'¿Qué autómata reconoce los lenguajes sensibles al contexto (tipo 1)?',
 o:[['El autómata de pila.','Falso: reconoce los de tipo 2 (libres de contexto).'],
    ['La máquina de Turing sin restricciones.','Falso: reconoce los de tipo 0. Para el tipo 1 hay que limitar la cinta.'],
    ['El autómata finito determinista.','Falso: reconoce sólo los regulares (tipo 3).'],
    ['El autómata lineal acotado.','Correcta: es una máquina de Turing que no puede salir de la cinta de entrada, delimitada por # y $.']]},
{tema:T.LENG, tipo:'mc', c:1,
 q:'Con la notación de la cátedra (+ = unión), ¿qué lenguaje denota la ER ab + c?',
 o:[['{ab, ac}','Falso: ese es a(b + c). Sin paréntesis, la concatenación va primero.'],
    ['{ab, c}','Correcta: la concatenación tiene más precedencia que la unión, así que se lee (ab) + c.'],
    ['{abc}','Falso: + no concatena. En esta notación es la unión.'],
    ['{a, bc}','Falso: eso sería a + bc.']]},
{tema:T.LENG, tipo:'mc', c:2,
 q:'¿Qué significa `!` en las expresiones regulares de JFLAP?',
 o:[['Negación del símbolo siguiente','Falso: JFLAP no tiene negación.'],
    ['La unión','Falso: en JFLAP la unión se escribe con `+`.'],
    ['La cadena vacía λ','Correcta: `!` es λ. En los autómatas, λ se carga dejando vacío el campo de la transición.'],
    ['La estrella de Kleene','Falso: esa es `*`.']]},
{tema:T.LENG, tipo:'mc', c:0,
 q:'En una máquina de Moore, ¿de qué depende la salida?',
 o:[['Sólo del estado.','Correcta: g: Q → S, cada estado tiene una única salida. Por eso cambia recién en el ciclo siguiente.'],
    ['Del estado y de la entrada actual.','Falso: esa es la máquina de Mealy, g: E × Q → S.'],
    ['Sólo del último símbolo de entrada.','Falso: ningún autómata depende únicamente del último símbolo. Para eso está el estado.'],
    ['Del contenido de la pila.','Falso: eso corresponde a los autómatas de pila, no a las máquinas de estados finitos.']]},
{tema:T.LENG, tipo:'mc', c:3,
 q:'En la construcción de subconjuntos (AFND → AFD), ¿qué estados del AFD son finales?',
 o:[['Sólo el subconjunto que tiene todos los estados finales.','Falso: con que haya uno alcanza, porque el AFND acepta si alguno de sus estados simultáneos acepta.'],
    ['Los subconjuntos que tienen un único estado.','Falso: la cantidad de elementos no importa. Importa qué estados contiene.'],
    ['Únicamente el último subconjunto que se construye.','Falso: el orden de construcción no tiene nada que ver con aceptar.'],
    ['Los que contienen al menos un estado final del AFND.','Correcta: si el AFND puede estar en un estado final, el AFD tiene que aceptar.']]},
{tema:T.LENG, tipo:'mc', c:1,
 q:'Al pasar una gramática de tipo 3 a un autómata finito, ¿qué estados tiene el autómata?',
 o:[['Uno por cada símbolo terminal.','Falso: los terminales pasan a ser el alfabeto de entrada E, no los estados.'],
    ['Uno por cada no terminal, más un estado final nuevo q_f.','Correcta: una regla A → aB da f(A,a) = B y una regla A → a da f(A,a) = q_f, que es el único final.'],
    ['Uno por cada producción de la gramática.','Falso: cada producción da una transición, no un estado.'],
    ['Dos estados: el inicial y el final.','Falso: con dos estados arranca el GTG en la conversión de ER a AF, no este algoritmo.']]},
{tema:T.LENG, tipo:'mc', c:2,
 q:'Al pasar un AF a gramática regular, si el estado inicial también es final, ¿qué hay que agregar?',
 o:[['Una regla S → S.','Falso: no genera nada nuevo y no es una regla regular.'],
    ['Un estado final nuevo.','Falso: en la gramática no existe el concepto de estado final.'],
    ['La regla S → λ.','Correcta: así la gramática genera la cadena vacía, que el autómata acepta sin leer nada.'],
    ['Nada, porque ya queda cubierto.','Falso: sin S → λ se pierde la cadena vacía del lenguaje.']]},
{tema:T.LENG, tipo:'mc', c:0,
 q:'¿Cuándo acepta una máquina de Turing una cadena w?',
 o:[['Cuando se para en un estado final.','Correcta: lo importante es que se para. Una MT puede no detenerse nunca, y de ahí sale el problema de la parada.'],
    ['Cuando la cinta queda vacía.','Falso: ese criterio se parece a la pila vacía de los AP, no al de la MT.'],
    ['Cuando el cabezal llega al final de la entrada.','Falso: la MT puede ir y volver sobre la cinta, y llegar al final no quiere decir aceptar.'],
    ['Cuando pasa por algún estado final, aunque siga funcionando.','Falso: si no se detiene, no acepta.']]},

/* ======================= THREADS EN JAVA ======================= */
{tema:T.THR, tipo:'vf', v:true,
 q:'El enum `Thread.State` tiene seis valores. El "séptimo estado" de la filmina sale de separar `RUNNABLE` en listo y en ejecución.',
 e:'Verdadero: los valores son NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING y TERMINATED. La JVM no puede saber si el hilo está en el procesador en ese instante, así que no separa listo de en ejecución.'},
{tema:T.THR, tipo:'vf', v:false,
 q:'Si se le pone `MAX_PRIORITY` a un hilo, está garantizado que termina antes que uno con `MIN_PRIORITY`.',
 e:'La prioridad es sólo una sugerencia al planificador. Depende de cómo el sistema operativo mapea las prioridades, con varios núcleos puede no haber competencia, y en todo caso cambia la probabilidad de ser elegido, no garantiza un orden.'},
{tema:T.THR, tipo:'vf', v:true,
 q:'Llamar dos veces a `start()` sobre el mismo `Thread` lanza `IllegalThreadStateException`.',
 e:'Verdadero: un `Thread` no se puede reiniciar. Para volver a ejecutar la tarea hay que crear otro `Thread` con el mismo `Runnable`.'},
{tema:T.THR, tipo:'vf', v:false,
 q:'Los atributos `static` son thread safe porque pertenecen a la clase y no a una instancia.',
 e:'Justamente porque son de la clase, todos los hilos ven la misma variable. Son el caso más claro de estado compartido. La excepción es un `static final` de un tipo inmutable.'},
{tema:T.THR, tipo:'vf', v:false,
 q:'Declarar una variable `volatile` hace que `contador++` sea atómico.',
 e:'`volatile` asegura visibilidad (los demás hilos ven el cambio), pero no atomicidad. Para eso están `AtomicInteger`, `synchronized` o un `Lock`.'},
{tema:T.THR, tipo:'mc', c:1,
 q:'¿Qué pasa si se llama a `h1.run()` en lugar de `h1.start()`?',
 o:[['Se crea un hilo nuevo, pero sin nombre.','Falso: `run()` no crea ningún hilo.'],
    ['`run()` corre en `main` y `h1` queda en NEW.','Correcta: es una llamada común a un método. La salida sale en orden, se imprime el nombre "main" y el `Thread` nunca arranca.'],
    ['La JVM lanza `IllegalThreadStateException` porque `run()` no se puede llamar directamente.','Falso: compila y corre sin error. Por eso es un error tan común.'],
    ['Se ejecuta igual que con `start()`, pero sin llamar al planificador del sistema.','Falso: no es equivalente. No hay concurrencia y `main` se queda bloqueado hasta que `run()` termina.']]},
{tema:T.THR, tipo:'mc', c:2,
 q:'Con `start()`, ¿qué diferencia se ve en el debugger respecto de `run()`?',
 o:[['No se ve ninguna diferencia.','Falso: con `start()` aparecen dos hilos vivos en el panel.'],
    ['Con `start()` la pila muestra `main() → run()`.','Falso: eso se ve con `run()`, porque todo está en la misma pila.'],
    ['`run()` queda en otra pila, sin `main` debajo.','Correcta: cada hilo tiene su propia pila. La de `Thread-0` empieza en `run()`.'],
    ['El breakpoint en `run()` detiene a todos los hilos.','Falso: detiene a `Thread-0` y `main` sigue ejecutando.']]},
{tema:T.THR, tipo:'mc', c:0,
 q:'Un hilo quiere entrar a un bloque `synchronized` cuyo monitor tiene otro hilo. ¿En qué estado queda?',
 o:[['BLOCKED','Correcta: BLOCKED significa exactamente eso, esperar un monitor.'],
    ['WAITING','Falso: WAITING corresponde a `wait()`, `join()` o `park()` sin plazo.'],
    ['TIMED_WAITING','Falso: es una espera con plazo, como `sleep(t)` o `wait(t)`.'],
    ['RUNNABLE','Falso: no puede avanzar hasta que se libere el monitor.']]},
{tema:T.THR, tipo:'mc', c:3,
 q:'En el ejemplo de los 10 hilos `Calculator`, ¿por qué nunca aparece BLOCKED en el LOG?',
 o:[['Porque las prioridades máximas evitan cualquier bloqueo.','Falso: la prioridad no tiene relación con los monitores.'],
    ['Porque `getState()` nunca devuelve BLOCKED.','Falso: sí lo devuelve si el hilo espera un monitor.'],
    ['Porque el bucle de sondeo es demasiado lento.','Falso: puede perder transiciones, pero BLOCKED aparecería alguna vez si se diera.'],
    ['Porque no hay `synchronized`.','Correcta: sin monitores compartidos no hay nada que pueda bloquear a un hilo.']]},
{tema:T.THR, tipo:'mc', c:1,
 q:'¿Qué problema tiene el `while (!finish)` que usa el ejemplo para ir registrando los estados?',
 o:[['Nunca termina, porque los hilos no llegan a TERMINATED.','Falso: termina cuando los 10 llegan a TERMINATED.'],
    ['Es espera activa: ocupa un núcleo sin avanzar.','Correcta: sirve para mostrar, pero en un programa real se usa `join()`, un `ExecutorService` o un `CountDownLatch`.'],
    ['Deja a los hilos en BLOCKED mientras corre.','Falso: consultar `getState()` no toma ningún monitor de los hilos.'],
    ['Cambia la prioridad de los hilos que consulta.','Falso: `getState()` sólo lee, no modifica nada.']]},

/* ======================= SYNCHRONIZED ======================= */
{tema:T.SYNC, tipo:'vf', v:true,
 q:'Un método `static synchronized` y un método de instancia `synchronized` del mismo objeto pueden ejecutarse al mismo tiempo en hilos distintos.',
 e:'Verdadero: uno toma el monitor de la clase y el otro el del objeto, que son distintos. Si los dos modifican la misma variable, puede haber inconsistencia aunque ambos sean `synchronized`.'},
{tema:T.SYNC, tipo:'vf', v:false,
 q:'`wait()` se puede llamar en cualquier parte del código. Fuera de un `synchronized` simplemente no hace nada.',
 e:'Si se llama sin tener el monitor de ese objeto, la JVM lanza `IllegalMonitorStateException`. Hay que llamarlo dentro de un `synchronized` sobre el mismo objeto.'},
{tema:T.SYNC, tipo:'vf', v:true,
 q:'En `Account`, el `Thread.sleep(10)` dentro de `addAmount` no rompe nada mientras el método sea `synchronized`.',
 e:'Verdadero: el hilo duerme sin soltar el monitor, así que nadie más entra. Si se saca el `synchronized`, ese mismo `sleep` deja ver la carrera: otro hilo lee el `balance` viejo y se pierde una actualización.'},
{tema:T.SYNC, tipo:'mc', c:2,
 q:'En `Cinema`, ¿pueden ejecutarse `sellTickets1` y `sellTickets2` al mismo tiempo?',
 o:[['No, porque los dos métodos pertenecen al mismo objeto.','Falso: eso pasaría con métodos `synchronized`. Acá se sincroniza con bloques y cada uno usa su propia llave.'],
    ['No, porque cualquier `synchronized` bloquea todo el objeto.','Falso: un bloque `synchronized(llave)` sólo excluye a los bloques que usan esa misma llave.'],
    ['Sí, porque usan llaves distintas.','Correcta: `controlCinema1` y `controlCinema2` cuidan recursos independientes. `sellTickets1` y `returnTickets1` sí se excluyen entre sí.'],
    ['Sí, pero sólo si los dos hilos tienen la misma prioridad.','Falso: la prioridad no tiene nada que ver con la exclusión mutua.']]},
{tema:T.SYNC, tipo:'mc', c:0,
 q:'¿Por qué falla usar como llave un `Integer` que se reasigna dentro del bloque?',
 o:[['Porque cada valor nuevo es otro objeto, con otro monitor.','Correcta: `Integer` es inmutable y `valor = valor + 1` hace que la referencia apunte a otro objeto. El siguiente hilo sincroniza sobre un monitor diferente.'],
    ['Porque los wrappers no tienen monitor asociado.','Falso: todo objeto tiene monitor. El problema es que el objeto cambia.'],
    ['Porque `synchronized` sólo acepta `this` como llave.','Falso: acepta cualquier objeto, como `controlCinema1`.'],
    ['Porque el autoboxing tira una excepción adentro del bloque.','Falso: no hay ninguna excepción. El error no se ve, y por eso es peligroso.']]},
{tema:T.SYNC, tipo:'mc', c:3,
 q:'En la prueba de la cátedra con las cinco variantes del cine, ¿cuál de estas formas de sincronizar dio resultados erróneos?',
 o:[['Con dos objetos `Object` creados para eso.','Falso: fue el caso 1 y funcionó bien. Esos objetos no cambian nunca de identidad.'],
    ['Con el arreglo completo como llave.','Falso: fue el caso 3 y funcionó bien. La referencia al arreglo no cambia.'],
    ['Con un objeto propio que encapsula la operación.','Falso: fue el caso 5 y funcionó bien.'],
    ['Con un elemento del arreglo.','Correcta: fue el caso 4. El valor del elemento cambia dentro del bloque, así que la llave también cambia.']]},
{tema:T.SYNC, tipo:'mc', c:1,
 q:'En el productor/consumidor con `wait()`, ¿por qué la condición se revisa con `while` y no con `if`?',
 o:[['Porque `if` no compila adentro de un `synchronized`.','Falso: compila sin problema. El error aparece recién al ejecutar.'],
    ['Porque al despertar la condición puede haber dejado de valer.','Correcta: entre el `notifyAll()` y el momento en que el hilo vuelve a correr, otro pudo adelantarse. Hay que volver a revisar.'],
    ['Porque `wait()` vuelve siempre antes de tiempo.','Falso: no pasa siempre. El problema es que no hay garantía sobre la condición.'],
    ['Porque así el hilo no suelta el monitor.','Falso: `wait()` suelta el monitor igual, se use `while` o `if`.']]},
{tema:T.SYNC, tipo:'mc', c:2,
 q:'En ese mismo buffer, ¿por qué se usa `notifyAll()` y no `notify()`?',
 o:[['Porque `notify()` no existe en la clase `Object`.','Falso: sí existe, y despierta a un hilo cualquiera del wait set.'],
    ['Porque `notifyAll()` es más barato.','Falso: es más caro, porque despierta a todos.'],
    ['Porque `notify()` puede despertar a un hilo equivocado.','Correcta: productores y consumidores esperan en el mismo wait set. Puede despertarse otro productor cuando lo que hace falta es un consumidor.'],
    ['Porque `notifyAll()` asegura que se despierten en orden de llegada.','Falso: no asegura ningún orden. Cada hilo vuelve a revisar su `while`.']]},
{tema:T.SYNC, tipo:'mc', c:0,
 q:'¿Cuál es una ventaja real de `Lock` sobre `synchronized`?',
 o:[['`tryLock()`: probar sin bloquearse.','Correcta: `synchronized` no tiene nada equivalente. También suma `lockInterruptibly()`, timeouts y fairness.'],
    ['Que el lock se libera solo si ocurre una excepción.','Falso: es al revés. Con `Lock` hay que liberar a mano en el `finally`, y con `synchronized` se libera solo.'],
    ['Que evita los deadlocks por sí mismo.','Falso: los dos pueden terminar en deadlock si se toman los locks en orden opuesto.'],
    ['Que no hace falta pensar qué es sección crítica.','Falso: la sección crítica la sigue definiendo el programador.']]},

/* ======================= LOCKS Y SEMÁFOROS ======================= */
{tema:T.LOCK, tipo:'vf', v:false,
 q:'El parámetro `fair` de `ReentrantLock` afecta también a `tryLock()`.',
 e:'`fair` sólo afecta a `lock()` y `unlock()`. Como `tryLock()` no duerme ni bloquea al hilo, no entra en la cola, así que la política de fairness no lo alcanza.'},
{tema:T.LOCK, tipo:'vf', v:true,
 q:'Un semáforo puede ser liberado por un hilo distinto del que lo adquirió.',
 e:'Verdadero: los semáforos no tienen dueño. Por eso sirven para señalizar entre hilos (productor/consumidor, semáforo en 0) y un lock no, porque en el lock sale el mismo que entró.'},
{tema:T.LOCK, tipo:'vf', v:false,
 q:'Si se toma el `readLock` y adentro se modifica la variable, `ReadWriteLock` lanza una excepción.',
 e:'No avisa nada. Usar bien los locks es responsabilidad del programador. Como el `readLock` deja entrar a varios hilos a la vez, si uno escribe se pierde la exclusión mutua sin ningún aviso.'},
{tema:T.LOCK, tipo:'vf', v:true,
 q:'El modo non-fair es más rápido, pero permite inanición.',
 e:'Verdadero: sin criterio de orden, el hilo que acaba de soltar el lock puede volver a tomarlo una y otra vez. El modo fair evita la inanición porque atiende primero al que espera hace más tiempo, a cambio de rendimiento.'},
{tema:T.LOCK, tipo:'mc', c:3,
 q:'¿Dónde tiene que ir `unlock()` cuando se usa un `ReentrantLock`?',
 o:[['Al principio del bloque `try`.','Falso: soltaría el lock antes de hacer el trabajo protegido.'],
    ['Adentro del `catch`, para liberar sólo si falla.','Falso: si todo sale bien, el lock no se libera nunca.'],
    ['Después del `try/catch`, fuera de cualquier bloque.','Falso: si se lanza una excepción que no se captura, esa línea no se ejecuta.'],
    ['En el `finally`.','Correcta: así se libera aunque haya una excepción. Si no, los demás hilos esperan para siempre.']]},
{tema:T.LOCK, tipo:'mc', c:0,
 q:'¿En qué escenario conviene usar un `ReadWriteLock`?',
 o:[['Muchas consultas y pocas escrituras.','Correcta: con muchas más lecturas que escrituras, los lectores corren en paralelo de verdad.'],
    ['Precios que cambian todo el tiempo y casi no se consultan.','Falso: casi todo es escritura, que igual es exclusiva, y además se paga el costo de manejar dos locks.'],
    ['Cualquier caso, porque siempre es más barato que una sección crítica común.','Falso: si el escenario no es el adecuado, puede salir más caro.'],
    ['Cuando hace falta que quien libere sea otro hilo.','Falso: eso lo resuelve un semáforo, que no tiene dueño.']]},
{tema:T.LOCK, tipo:'mc', c:2,
 q:'En el experimento del `PrintQueue` con lock FAIR y dos etapas, ¿qué se observa?',
 o:[['Cada hilo hace sus dos etapas seguidas.','Falso: eso es lo que suele pasar en modo non-fair, aunque tampoco está garantizado.'],
    ['El orden cambia en cada corrida.','Falso: en modo fair el orden de llegada es conocido, porque los hilos se lanzan con 100 ms de diferencia.'],
    ['Ningún hilo hace su segunda etapa hasta que todos hicieron la primera.','Correcta: al soltar y volver a pedir el lock, `Thread 0` queda detrás de los que esperan hace más tiempo.'],
    ['Nada, porque el lock fair produce deadlock.','Falso: fairness no provoca deadlock, sólo cambia el orden.']]},
{tema:T.LOCK, tipo:'mc', c:1,
 q:'En la cola de impresión con `new Semaphore(3)`, ¿para qué está además `lockPrinters`?',
 o:[['Para limitar a tres los hilos que imprimen.','Falso: de eso ya se encarga el semáforo, que sólo cuenta permisos.'],
    ['Para que dos hilos no elijan la misma impresora.','Correcta: el semáforo asegura que hay alguna libre y el lock protege el arreglo `freePrinters` al elegir cuál.'],
    ['Para que el semáforo sea fair.','Falso: la fairness se pasa como segundo parámetro del constructor.'],
    ['Para reemplazar al `release()` del `finally`.','Falso: el `release()` sigue siendo necesario para devolver el permiso.']]},
{tema:T.LOCK, tipo:'mc', c:3,
 q:'¿Qué patrón se arma con un semáforo inicializado en 0?',
 o:[['Exclusión mutua estricta.','Falso: para eso se inicializa en 1 (semáforo binario).'],
    ['Un pool de N recursos.','Falso: para eso se inicializa en N.'],
    ['Lectores y escritores.','Falso: ahí el escritor pide todos los permisos de golpe con `acquire(N)`.'],
    ['Espera y aviso entre hilos.','Correcta: un hilo espera en `acquire()` hasta que otro hace `release()`. En una red de Petri es un lugar "señal" sin fichas al inicio.']]},
{tema:T.LOCK, tipo:'mc', c:0,
 q:'En la barbería pasada a Java, ¿con qué método se escribe "si no hay banco libre, el cliente se va"?',
 o:[['`tryAcquire()`','Correcta: no bloquea. Si no hay permiso devuelve `false` y el cliente se va.'],
    ['`acquire()`','Falso: bloquearía al cliente hasta que se libere un banco, y la consigna dice que se va.'],
    ['`acquireUninterruptibly()`','Falso: también bloquea, y además ignora las interrupciones.'],
    ['`release()`','Falso: `release()` devuelve un permiso, no lo pide.']]},

/* ======================= INTERRUPCIÓN, SLEEP Y JOIN ======================= */
{tema:T.INT, tipo:'vf', v:false,
 q:'`interrupt()` detiene al hilo inmediatamente, en el punto donde esté.',
 e:'`interrupt()` sólo levanta una bandera. El hilo puede ignorarla. El que mataba al hilo en el momento era `Thread.stop()`, y está deprecado justamente por no dejarle liberar recursos.'},
{tema:T.INT, tipo:'vf', v:true,
 q:'Cuando `sleep()` lanza `InterruptedException`, la bandera de interrupción queda en `false`.',
 e:'Verdadero: la bandera se borra al lanzar la excepción. Por eso, si el `catch` no sale del bucle, el hilo sigue funcionando como si no lo hubieran interrumpido.'},
{tema:T.INT, tipo:'vf', v:true,
 q:'Cuando se cumple el plazo de `sleep()`, el hilo no ejecuta enseguida: pasa a listo y espera CPU.',
 e:'Verdadero: de TIMED_WAITING se vuelve a RUNNABLE, y el hilo sigue cuando el planificador le da tiempo de procesador.'},
{tema:T.INT, tipo:'mc', c:2,
 q:'En `FileSearch`, con `buscador.run()` el archivo se encuentra y con `hilo.start()` no. ¿Cuál es el problema?',
 o:[['`interrupt()` borra los resultados de la búsqueda.','Falso: la interrupción sólo corta la búsqueda. Lo que pasa es que `main` no espera a que termine.'],
    ['La recursión no funciona en hilos secundarios.','Falso: la recursión funciona igual en cualquier hilo.'],
    ['`main` no espera al hilo. Falta un `join()`.','Correcta: con `run()` todo corre en orden en `main`. Con `start()`, `main` sigue de largo sin esperar a que termine la búsqueda.'],
    ['`listFiles()` no es thread safe.','Falso: nadie más está recorriendo esos directorios.']]},
{tema:T.INT, tipo:'mc', c:1,
 q:'¿Por qué `FileSearch` lanza `InterruptedException` en vez de simplemente cortar con un `return`?',
 o:[['Porque `run()` está obligado a declarar `throws`.','Falso: `run()` no puede declarar `throws` de excepciones checked.'],
    ['Para que la excepción suba por la recursión hasta `run()`.','Correcta: así toda la pila de llamadas se deshace de forma limpia y la interrupción se atiende en un solo `catch`.'],
    ['Porque sin la excepción la bandera nunca se levanta.','Falso: la bandera la levanta `interrupt()`, sin importar qué haga el código después.'],
    ['Porque el `return` no está permitido en métodos recursivos.','Falso: `return` se puede usar en cualquier método.']]},
{tema:T.INT, tipo:'mc', c:0,
 q:'¿En qué estado queda un hilo que llama a `otro.join()` sin plazo?',
 o:[['WAITING','Correcta: espera sin límite de tiempo a que termine el otro. Con `join(ms)` quedaría en TIMED_WAITING.'],
    ['BLOCKED','Falso: BLOCKED se usa sólo cuando se espera un monitor de `synchronized`.'],
    ['TERMINATED','Falso: el que termina es el otro hilo. El que llama sigue vivo, esperando.'],
    ['RUNNABLE','Falso: el hilo se suspende hasta que el otro termina.']]},
{tema:T.INT, tipo:'mc', c:3,
 q:'En el ejemplo de los loaders (sleep de 4 s y de 6 s), ¿qué pasa si no hay ningún `join()`?',
 o:[['El programa no compila.','Falso: `join()` no es obligatorio. Sin él, simplemente no hay espera.'],
    ['"Fin del programa" sale después de los dos loaders.','Falso: eso sólo se asegura con los dos `join()`.'],
    ['Se lanza `InterruptedException` en `main`.','Falso: nadie interrumpe a nadie.'],
    ['"Fin del programa" sale enseguida, antes que los loaders.','Correcta: `main` sigue apenas termina de hacer los `start()`. Es el mismo error de `FileSearch`.']]},

/* ======================= EXCEPCIONES, DAEMON, THREADLOCAL, LATCH ======================= */
{tema:T.UTIL, tipo:'vf', v:false,
 q:'Una excepción unchecked que sale de `run()` sin capturarse termina todo el programa.',
 e:'Termina sólo el hilo que la lanzó, después de imprimir el stack trace. El resto del programa sigue, y eso puede ser peor, porque el sistema queda a medio hacer sin que nadie se entere.'},
{tema:T.UTIL, tipo:'vf', v:false,
 q:'`setDaemon(true)` se puede llamar en cualquier momento, incluso después de `start()`.',
 e:'Sólo se puede llamar antes de `start()`. Una vez que el hilo arrancó, su condición de daemon ya no cambia, y llamarlo lanza `IllegalThreadStateException`.'},
{tema:T.UTIL, tipo:'vf', v:false,
 q:'Un `CountDownLatch` se puede reiniciar para usarlo en otra ronda.',
 e:'Es de un solo uso. Cuando el contador llega a 0 se queda en 0, y los `countDown()` que vengan después no hacen nada. Para otra ronda hay que crear otro latch.'},
{tema:T.UTIL, tipo:'vf', v:true,
 q:'Cuando los únicos hilos vivos son daemon, la JVM los termina y cierra el programa.',
 e:'Verdadero: la JVM no espera a los daemon. Por eso se usan sólo para servicios en segundo plano y nunca para tareas importantes.'},
{tema:T.UTIL, tipo:'mc', c:1,
 q:'¿En qué orden busca la JVM un manejador para una excepción no controlada?',
 o:[['El default de la JVM, después el del `ThreadGroup` y por último el del hilo.','Falso: el orden va del más específico al más general, no al revés.'],
    ['El del hilo, después el del `ThreadGroup` y por último el default.','Correcta: primero el que se puso con `setUncaughtExceptionHandler()`, después el del grupo y al final `Thread.setDefaultUncaughtExceptionHandler()`.'],
    ['Sólo el del hilo. Si no tiene uno, el programa termina.','Falso: si el hilo no tiene, se sigue buscando en el grupo y en el default.'],
    ['El del `ThreadGroup` primero, porque es más general.','Falso: primero se mira el del propio `Thread`.']]},
{tema:T.UTIL, tipo:'mc', c:2,
 q:'¿Por qué dentro de `run()` hay que manejar sí o sí las excepciones checked?',
 o:[['Porque la JVM las convierte en unchecked.','Falso: la JVM no convierte ninguna excepción.'],
    ['Porque las atrapa el `UncaughtExceptionHandler`.','Falso: el handler es para las unchecked que se escapan. Una checked sin manejar ni siquiera compila.'],
    ['Porque `run()` no admite `throws` en su firma.','Correcta: la firma de `Runnable.run()` no declara excepciones checked, así que hay que usar `try/catch`.'],
    ['Porque de lo contrario el hilo queda en BLOCKED.','Falso: es un error de compilación, no algo que pase al ejecutar.']]},
{tema:T.UTIL, tipo:'mc', c:0,
 q:'¿Por qué se corrompe `startDate` en `UnsafeTask`?',
 o:[['Porque los tres hilos comparten el mismo `Runnable`.','Correcta: hay un solo objeto `tarea` y por lo tanto un solo campo, y el último hilo que escribe pisa a los demás.'],
    ['Porque la clase `Date` no es serializable.','Falso: la serialización no tiene nada que ver con esto.'],
    ['Porque `sleep()` modifica los atributos del objeto.','Falso: `sleep()` sólo le da tiempo a otro hilo para pisar el campo.'],
    ['Porque los hilos se crearon con prioridades distintas.','Falso: el problema está en el estado compartido, no en la prioridad.']]},
{tema:T.UTIL, tipo:'mc', c:3,
 q:'¿Qué hace `initialValue()` en un `ThreadLocal`?',
 o:[['Le da el mismo valor inicial a todos los hilos, compartido entre ellos.','Falso: cada hilo recibe su propia copia, no una compartida.'],
    ['Reinicia el valor cada vez que se llama a `set()`.','Falso: `set()` guarda el valor que se le pasa. `initialValue()` no interviene ahí.'],
    ['Crea un hilo nuevo con ese valor ya cargado.','Falso: `ThreadLocal` no crea hilos. Guarda un valor por cada hilo que ya existe.'],
    ['Da el valor del primer `get()` de cada hilo que no hizo `set()`.','Correcta: se llama de forma perezosa, una vez por hilo, en su primer `get()`.']]},
{tema:T.UTIL, tipo:'mc', c:1,
 q:'¿Qué hace `await()` si el `CountDownLatch` ya está en 0?',
 o:[['Bloquea para siempre, porque nadie va a volver a llamar a `countDown()`.','Falso: con el contador en 0 no hay nada que esperar.'],
    ['Vuelve inmediatamente.','Correcta: el latch se queda en 0 y cualquier `await()` posterior pasa derecho.'],
    ['Lanza `IllegalStateException`.','Falso: no lanza ninguna excepción. Es el comportamiento normal.'],
    ['Reinicia el contador a su valor original.','Falso: el latch no se puede reiniciar.']]},
{tema:T.UTIL, tipo:'mc', c:2,
 q:'Para `CountDownLatch`, ¿cuál de estas afirmaciones es correcta?',
 o:[['Protege una sección crítica igual que un `Lock`.','Falso: no da exclusión mutua. Sirve para sincronizar el final de varias tareas.'],
    ['Sólo puede esperar a hilos que terminaron completos.','Falso: espera N eventos, que no tienen por qué ser hilos completos. Eso lo diferencia de `join()`.'],
    ['El aviso lo hace el código con `countDown()`.','Correcta: con `join()` la JVM avisa sola cuando termina `run()`. Acá lo hace el programador de forma explícita.'],
    ['Se puede incrementar con `countUp()`.','Falso: ese método no existe. El contador sólo baja.']]},
{tema:T.UTIL, tipo:'mc', c:0,
 q:'Con 12 escritores (un evento por segundo cada uno) y un daemon que borra los eventos de más de 10 s, ¿qué pasa con la cola?',
 o:[['Llega a unos 120 y después se queda estable, oscilando.','Correcta: en 10 s no se borra nada (12 × 10 = 120). Después se borran 12 por segundo y entran 12 por segundo.'],
    ['Crece sin límite, porque el daemon casi nunca tiene CPU.','Falso: en la corrida de ejemplo el daemon sí limpia y el tamaño se mantiene entre 108 y 119.'],
    ['Queda siempre vacía, porque el daemon limpia cada segundo.','Falso: el daemon sólo borra los eventos de más de 10 s.'],
    ['Queda fija en exactamente 120.','Falso: oscila, porque la escritura y la limpieza no están perfectamente sincronizadas.']]},

/* ======================= REDES DE PETRI ======================= */
{tema:T.RDP, tipo:'vf', v:false,
 q:'Una transición sensibilizada tiene que dispararse inmediatamente.',
 e:'Que esté sensibilizada sólo quiere decir que puede dispararse. Nada la obliga, y de ahí viene el no determinismo. Lo que sí se sabe es que el próximo cambio de marcado va a ser el disparo de alguna de las transiciones habilitadas.'},
{tema:T.RDP, tipo:'vf', v:false,
 q:'Las redes de Petri coloreadas pueden expresar más cosas que las redes ordinarias.',
 e:'No suman poder expresivo, suman compacidad. Al desplegar completa una red coloreada se obtiene una única red ordinaria equivalente.'},
{tema:T.RDP, tipo:'vf', v:true,
 q:'El grafo de accesibilidad de una red de Petri es un autómata: los estados son marcados y las transiciones son disparos.',
 e:'Verdadero. Por eso la red no hace desaparecer la explosión de estados, la deja para después: permite razonar con álgebra (invariantes) sin armar el grafo completo.'},
{tema:T.RDP, tipo:'vf', v:true,
 q:'Un grafo de estado marcado con exactamente un token se comporta como un autómata clásico.',
 e:'Verdadero: el token indica el estado actual. Con dos o más tokens ya no es equivalente: 3 lugares con 2 tokens dan 6 marcados, algo que un autómata de 3 estados no puede representar.'},
{tema:T.RDP, tipo:'mc', c:3,
 q:'¿Cuándo una red de Petri es un grafo de eventos?',
 o:[['Cuando cada transición tiene exactamente un lugar de entrada y uno de salida.','Falso: esa es la definición de grafo de estado, que es el dual.'],
    ['Cuando no tiene transiciones fuente ni sumidero.','Falso: esa condición no define ninguna de las dos subclases.'],
    ['Cuando todos sus lugares tienen una ficha.','Falso: la definición es estructural y no depende del marcado.'],
    ['Cuando cada lugar tiene exactamente una transición de entrada y una de salida.','Correcta: por eso las transiciones no entran nunca en conflicto.']]},
{tema:T.RDP, tipo:'mc', c:1,
 q:'¿Qué propiedad caracteriza a un grafo de eventos?',
 o:[['Siempre tiene un solo token.','Falso: un grafo de eventos puede tener cualquier cantidad de tokens.'],
    ['Sus transiciones nunca entran en conflicto.','Correcta: cada lugar alimenta a una sola transición, así que no hay nada que elegir, sólo distintas planificaciones.'],
    ['Siempre es no acotado.','Falso: la cantidad de tokens de cada circuito elemental es invariante.'],
    ['Es equivalente a un autómata finito.','Falso: esa equivalencia vale para el grafo de estado con un solo token.']]},
{tema:T.RDP, tipo:'mc', c:0,
 q:'En la red de exclusión mutua con el lugar `mutex`, ¿qué invariante prueba que nunca hay dos procesos en la sección crítica?',
 o:[['p2 + p4 + mutex = 1','Correcta: como todos los términos son ≥ 0, se deduce que p2 + p4 ≤ 1. Se prueba sin recorrer ningún estado.'],
    ['p1 + p3 = 2','Falso: no es un invariante. Cuando un proceso entra a la sección crítica, p1 + p3 baja a 1.'],
    ['p2 + p4 = mutex','Falso: al principio da 0 = 1. No se cumple.'],
    ['p1 + p2 + p3 + p4 = 1','Falso: los dos procesos empiezan con una ficha cada uno, así que la suma es 2.']]},
{tema:T.RDP, tipo:'mc', c:2,
 q:'¿Qué es una transición fuente?',
 o:[['Una transición que no tiene lugares de salida.','Falso: esa es una transición sumidero, que consume fichas y no produce ninguna.'],
    ['La primera transición que se dispara desde M₀.','Falso: no tiene que ver con el orden de disparo.'],
    ['Una transición sin lugares de entrada.','Correcta: siempre está sensibilizada y crea fichas de la nada.'],
    ['La transición que comparte lugares con todas las demás.','Falso: esa no es la definición.']]},
{tema:T.RDP, tipo:'mc', c:3,
 q:'Un semáforo de tránsito pasa de verde a ámbar 60 s después de habilitarse la transición. ¿Qué tipo de red es?',
 o:[['Autónoma.','Falso: una red autónoma no dice cuándo se dispara nada.'],
    ['Sincronizada.','Falso: una sincronizada dispara con un evento externo, como la orden de arrancar un motor.'],
    ['Coloreada.','Falso: los colores distinguen fichas y no tienen relación con el tiempo.'],
    ['Temporizada.','Correcta: el disparo lo controla el tiempo. Es el ejemplo de la filmina.']]},
{tema:T.RDP, tipo:'mc', c:0,
 q:'Pre(P1,T) = 1, Pre(P2,T) = 2 y M = (2, 5, 0). ¿Cuántas veces seguidas puede dispararse T?',
 o:[['2','Correcta: P1 alcanza para 2 disparos (2/1) y P2 también para 2 (⌊5/2⌋). El grado de habilitación es el menor, 2.'],
    ['5','Falso: se miró sólo P2 y sin dividir por el peso del arco.'],
    ['1','Falso: después del primer disparo quedan (1, 3), que todavía alcanza para otro.'],
    ['3','Falso: después de dos disparos P1 queda en 0 y T se deshabilita.']]},
{tema:T.RDP, tipo:'mc', c:1,
 q:'¿Qué ventaja tiene la semántica de orden parcial sobre la de interleaving?',
 o:[['Obliga a fijar un orden total entre todos los disparos.','Falso: eso es lo que hace la semántica de interleaving.'],
    ['No ordena eventos independientes, así que no genera las n! intercalaciones.','Correcta: dos disparos que no compiten por fichas quedan sin comparar entre sí.'],
    ['Elimina el no determinismo de la red.','Falso: los conflictos entre transiciones siguen estando.'],
    ['Sólo sirve para redes que no tienen conflictos.','Falso: se puede aplicar a cualquier red.']]},
{tema:T.RDP, tipo:'mc', c:2,
 q:'En el buffer acotado, ¿cómo queda bloqueado el productor cuando el buffer está lleno?',
 o:[['Con un `if` escrito dentro de la transición producir.','Falso: una red de Petri no tiene código. Todo está en su estructura.'],
    ['Con un arco inhibidor desde el lugar "ocupados".','Falso: el modelo básico del apunte no usa arcos inhibidores.'],
    ['"Producir" toma de "libres", y con "libres" en 0 no se sensibiliza.','Correcta: el bloqueo sale solo del modelo. Además libres + ocupados = capacidad.'],
    ['Consumir se dispara primero porque tiene prioridad.','Falso: las redes básicas no tienen prioridades.']]},

/* ======================= PROPIEDADES DE RDP ======================= */
{tema:T.PROP, tipo:'vf', v:true,
 q:'Toda red segura es acotada, pero no toda red acotada es segura.',
 e:'Verdadero: segura es el caso k = 1 de acotada. Una red donde algún lugar llega a 3 fichas y nunca pasa de ahí es acotada (k = 3) pero no segura.'},
{tema:T.PROP, tipo:'vf', v:true,
 q:'Si una red es viva, entonces está libre de deadlock.',
 e:'Verdadero: desde un deadlock no se puede disparar ninguna transición, así que ninguna estaría viva. La vivacidad implica que no hay deadlock.'},
{tema:T.PROP, tipo:'vf', v:false,
 q:'Si una red está libre de deadlock, entonces es viva.',
 e:'Al revés no vale. Una red puede no trabarse nunca y tener igual alguna transición que ya no se puede volver a disparar. Eso la deja libre de deadlock, pero no viva.'},
{tema:T.PROP, tipo:'vf', v:false,
 q:'Un sifón que se quedó sin fichas puede volver a recibirlas más adelante.',
 e:'Una vez vacío, queda vacío para siempre: toda transición que le da fichas también le saca, y ninguna de esas puede habilitarse sin fichas. Es un problema de diseño que no se arregla solo.'},
{tema:T.PROP, tipo:'vf', v:true,
 q:'El árbol de cobertura siempre tiene una cantidad finita de vértices, aunque la red no sea acotada.',
 e:'Verdadero: las componentes que crecen sin límite se marcan con ω. Lo que se paga es que se pierde información, porque no siempre se puede saber si un marcado exacto es alcanzable.'},
{tema:T.PROP, tipo:'vf', v:false,
 q:'Si T está viva para M₀, también lo está para cualquier M₁ ≥ M₀.',
 e:'No se hereda. Agregar fichas puede desequilibrar un conflicto y hacer que una transición no vuelva a habilitarse. Lo que sí se hereda al agregar fichas es la quasi-vivacidad.'},
{tema:T.PROP, tipo:'vf', v:true,
 q:'Dos secuencias de disparo con el mismo vector característico llevan siempre a la misma marca.',
 e:'Verdadero, por la ecuación fundamental m_k = m_i + C·s: el resultado depende de s y no del orden. Al revés no vale, porque se puede llegar a la misma marca con vectores distintos.'},
{tema:T.PROP, tipo:'vf', v:true,
 q:'La quasi-vivacidad y la ausencia de deadlock son propiedades independientes.',
 e:'Verdadero: una red puede ser quasi-viva y trabarse (cada transición dispara una vez y después todo se frena), y puede no trabarse nunca sin ser quasi-viva (una transición que no dispara jamás).'},
{tema:T.PROP, tipo:'mc', c:2,
 q:'¿Cuándo se dice que una red es "bien comportada" (well-behaved)?',
 o:[['Cuando es segura y reversible.','Falso: no hace falta que sea reversible, y segura (k = 1) es más de lo que se pide.'],
    ['Cuando es quasi-viva y persistente.','Falso: quasi-viva es una condición más débil que viva, y la persistencia no es parte de la definición.'],
    ['Cuando es viva y acotada.','Correcta: sin acotación no se puede implementar con recursos finitos, y sin vivacidad puede perder funcionalidad para siempre.'],
    ['Cuando no tiene sifones.','Falso: la barbería tiene un sifón y está bien comportada. Lo que importa es que ningún sifón se vacíe.']]},
{tema:T.PROP, tipo:'mc', c:1,
 q:'¿Cuál es la definición de sifón, con P′ un conjunto de lugares?',
 o:[['P′• ⊆ •P′','Falso: esa es la trampa. Toda transición que le saca fichas también le da.'],
    ['•P′ ⊆ P′•','Correcta: toda transición que le da fichas a P′ también le saca, así que sólo puede perder fichas.'],
    ['•P′ = ∅','Falso: eso diría que ninguna transición le da fichas, un caso muy particular.'],
    ['P′ tiene al menos una ficha en M₀','Falso: sifón y trampa son conceptos estructurales y no dependen del marcado.']]},
{tema:T.PROP, tipo:'mc', c:0,
 q:'¿Cuándo hay conflicto efectivo entre T1 y T2, que comparten el lugar Pi?',
 o:[['Cuando las fichas de Pi no alcanzan para disparar las dos.','Correcta: ahí disparar una le quita de verdad la posibilidad a la otra.'],
    ['Siempre que compartan un lugar de entrada.','Falso: ese es el conflicto estructural. Para que sea efectivo también hay que mirar el marcado.'],
    ['Cuando las dos están habilitadas y Pi tiene fichas de sobra.','Falso: en ese caso el conflicto no es efectivo y las transiciones son concurrentes.'],
    ['Cuando ninguna de las dos está habilitada.','Falso: si no hay nada habilitado, no hay por qué competir.']]},
{tema:T.PROP, tipo:'mc', c:3,
 q:'¿Qué significa que una red sea persistente?',
 o:[['Que siempre puede volver a M₀.','Falso: eso es ser reversible (M₀ es un home state).'],
    ['Que ningún lugar supera una ficha.','Falso: eso es ser segura.'],
    ['Que todas sus transiciones están vivas.','Falso: eso es ser viva. Una red persistente no tiene por qué ser viva.'],
    ['Que una transición habilitada sólo se deshabilita al dispararse.','Correcta: ninguna otra transición puede quitarle la habilitación disparándose antes.']]},
{tema:T.PROP, tipo:'mc', c:2,
 q:'¿Qué es un P-invariante?',
 o:[['Un vector y tal que C·y = 0.','Falso: ese es un T-invariante, que se define sobre las transiciones.'],
    ['Una transición que siempre está habilitada.','Falso: eso se parece a una transición fuente, no a un invariante.'],
    ['Un vector x ≥ 0 tal que xᵀ·C = 0.','Correcta: la suma de fichas pesada por x es la misma en todos los marcados alcanzables.'],
    ['El marcado inicial de la red.','Falso: el invariante es un vector de pesos, no un marcado.']]},
{tema:T.PROP, tipo:'mc', c:1,
 q:'¿Qué ocurre al disparar completo un componente repetitivo (asociado a un T-invariante)?',
 o:[['La red queda en deadlock.','Falso: es lo contrario, porque la red puede volver a arrancar el ciclo.'],
    ['La red vuelve a la misma marca.','Correcta: C·y = 0 hace que el efecto neto sobre el marcado sea nulo.'],
    ['Todos los lugares quedan vacíos.','Falso: el marcado final es igual al inicial, no cero.'],
    ['Aparece ω en el árbol de cobertura.','Falso: ω aparece cuando alguna componente crece sin límite, no cuando se vuelve a la misma marca.']]},
{tema:T.PROP, tipo:'mc', c:0,
 q:'¿Qué dice el teorema de Commoner para redes de libre elección extendida ordinarias?',
 o:[['Es viva si cada sifón contiene una trampa marcada en M₀.','Correcta: si esa trampa nunca se vacía, el sifón que la contiene tampoco, y la red no pierde transiciones.'],
    ['Es acotada si tiene un P-invariante positivo.','Falso: esa es otra propiedad (componente conservador), no el teorema de Commoner.'],
    ['Es viva si no tiene ningún sifón.','Falso: el teorema no exige que no haya sifones, sino que estén protegidos por trampas.'],
    ['Es persistente si no tiene conflicto estructural.','Falso: eso es cierto, pero es un resultado distinto sobre persistencia.']]},
{tema:T.PROP, tipo:'mc', c:3,
 q:'En la barbería, ¿qué prueba el invariante M(bancos) + M(esperando) = m?',
 o:[['Que la red no tiene conflictos.','Falso: `llega` y `se va` están en conflicto, y es efectivo cuando bancos = 0.'],
    ['Que los clientes se atienden en orden de llegada.','Falso: el enunciado dice que se atienden sobre demanda, sin orden.'],
    ['Que siempre hay un barbero libre.','Falso: eso lo cubre el otro invariante, y además no se cumple siempre.'],
    ['Que nunca esperan más de m clientes.','Correcta: la regla "si no hay banco se va" sale de la estructura de la red, no de un `if`.']]}
];

/* ---------- Estado ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let temasActivos = new Set(Object.values(T));
let tipoFiltro = 'all';
let ronda = [];          // preguntas de la ronda actual, con opciones mezcladas
let respuestas = {};     // idx -> {ok:boolean}
let falladas = new Set();

function prepararPregunta(p, id) {
  if (p.tipo === 'vf') {
    return { ...p, id, opciones: [
      { x: 'Verdadero', ok: p.v === true },
      { x: 'Falso', ok: p.v === false }
    ]};
  }
  const ops = p.o.map((o, i) => ({ x: o[0], e: o[1], ok: i === p.c }));
  return { ...p, id, opciones: shuffle(ops) };
}

function armarRonda(soloIds) {
  let base = BANCO.map((p, i) => ({ p, i }))
    .filter(({ p }) => temasActivos.has(p.tema))
    .filter(({ p }) => tipoFiltro === 'all' || p.tipo === tipoFiltro);
  if (soloIds) base = base.filter(({ i }) => soloIds.has(i));
  ronda = shuffle(base).map(({ p, i }) => prepararPregunta(p, i));
  respuestas = {};
  render();
}

function render() {
  const list = $('#list');
  list.innerHTML = '';
  $('#summary').innerHTML = '';
  if (!ronda.length) {
    list.innerHTML = '<p class="sub">No hay preguntas con estos filtros.</p>';
  }
  ronda.forEach((p, n) => list.appendChild(tarjeta(p, n)));
  actualizarStats();
  window.scrollTo({ top: 0 });
}

function tarjeta(p, n) {
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = `
    <div class="qhead"><span class="num">${n + 1}.</span>
      <span class="tag">${p.tipo === 'vf' ? 'Verdadero / Falso' : 'Opción múltiple'}</span>
      <span class="tag">${esc(p.tema)}</span></div>
    <p class="qtext">${fmt(p.q)}</p>
    <div class="opts ${p.tipo === 'vf' ? 'vf' : ''}"></div>
    <div class="fb" hidden></div>`;
  const opts = el.querySelector('.opts');
  p.opciones.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${p.tipo === 'vf' ? (o.x[0]) : 'ABCD'[k]}</span><span>${fmt(o.x)}</span>`;
    b.onclick = () => responder(p, n, k, el);
    opts.appendChild(b);
  });
  return el;
}

function responder(p, n, k, el) {
  if (respuestas[n]) return;
  const elegida = p.opciones[k];
  respuestas[n] = { ok: elegida.ok, tema: p.tema };
  if (elegida.ok) falladas.delete(p.id); else falladas.add(p.id);

  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    const o = p.opciones[i];
    if (o.ok) b.classList.add('ok');
    else if (i === k) b.classList.add('bad');
    else b.classList.add('dim');
  });

  const fb = el.querySelector('.fb');
  const verdict = elegida.ok
    ? '<div class="verdict ok">✔ Correcto</div>'
    : '<div class="verdict bad">✘ Incorrecto</div>';

  if (p.tipo === 'vf') {
    const txt = p.v ? 'VERDADERA' : 'FALSA';
    fb.innerHTML = `${verdict}
      <h4>La afirmación es ${txt}</h4>
      <ul><li class="good"><p>${fmt(p.e)}</p></li></ul>
      <h4>Por qué la otra opción no va</h4>
      <ul><li class="wrong"><p>${p.v
        ? 'Marcar "Falso" implica negar algo que el apunte afirma tal cual. El argumento de arriba muestra por qué se cumple.'
        : 'Marcar "Verdadero" implica aceptar el error que tiene la afirmación. El argumento de arriba muestra qué parte está mal y cuál es la versión correcta.'}</p></li></ul>`;
  } else {
    const correcta = p.opciones.find(o => o.ok);
    const malas = p.opciones.map((o, i) => ({ o, i })).filter(({ o }) => !o.ok);
    fb.innerHTML = `${verdict}
      <h4>Por qué la correcta es correcta</h4>
      <ul><li class="good"><p><b>${'ABCD'[p.opciones.indexOf(correcta)]}.</b> ${fmt(correcta.e)}</p></li></ul>
      <h4>Por qué las demás son incorrectas</h4>
      <ul>${malas.map(({ o, i }) => `<li class="wrong"><p><b>${'ABCD'[i]}.</b> ${fmt(o.e)}</p></li>`).join('')}</ul>`;
  }
  fb.hidden = false;
  actualizarStats();
  if (Object.keys(respuestas).length === ronda.length) resumen();
}

function actualizarStats() {
  const vals = Object.values(respuestas);
  const ok = vals.filter(r => r.ok).length;
  $('#sAns').textContent = vals.length;
  $('#sTot').textContent = ronda.length;
  $('#sOk').textContent = ok;
  $('#sBad').textContent = vals.length - ok;
  $('#sPct').textContent = vals.length ? Math.round(100 * ok / vals.length) + '%' : '—';
  $('#pbar').style.width = ronda.length ? (100 * vals.length / ronda.length) + '%' : '0';
  $('#retry').disabled = falladas.size === 0;
  $('#retry').textContent = `Repetir sólo las falladas (${falladas.size})`;
}

function resumen() {
  const porTema = {};
  Object.values(respuestas).forEach(r => {
    porTema[r.tema] = porTema[r.tema] || { ok: 0, n: 0 };
    porTema[r.tema].n++; if (r.ok) porTema[r.tema].ok++;
  });
  const vals = Object.values(respuestas), ok = vals.filter(r => r.ok).length;
  const filas = Object.entries(porTema)
    .sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n)
    .map(([t, v]) => `<div class="row"><div>${esc(t)}<div class="mini"><div style="width:${100 * v.ok / v.n}%"></div></div></div><b>${v.ok}/${v.n}</b></div>`).join('');
  $('#summary').innerHTML = `<div class="summary"><h2>Resultado: ${ok}/${vals.length} (${Math.round(100 * ok / vals.length)}%)</h2>
    <p class="sub" style="margin-bottom:8px">Por tema, de más flojo a más firme:</p>${filas}</div>`;
}

/* ---------- Controles ---------- */
function chips() {
  const c = $('#chips');
  c.innerHTML = '';
  Object.values(T).forEach(t => {
    const b = document.createElement('button');
    const n = BANCO.filter(p => p.tema === t).length;
    b.className = 'chip' + (temasActivos.has(t) ? ' on' : '');
    b.textContent = `${t} (${n})`;
    b.onclick = () => {
      temasActivos.has(t) ? temasActivos.delete(t) : temasActivos.add(t);
      if (!temasActivos.size) temasActivos = new Set(Object.values(T));
      chips(); armarRonda();
    };
    c.appendChild(b);
  });
}
function marcarTipo() {
  ['all', 'vf', 'mc'].forEach(k => $('#type-' + k).classList.toggle('primary', tipoFiltro === k));
  $('#reset').classList.add('primary');
}
$('#reset').onclick = () => armarRonda();
$('#retry').onclick = () => armarRonda(new Set(falladas));
['all', 'vf', 'mc'].forEach(k => $('#type-' + k).onclick = () => { tipoFiltro = k; marcarTipo(); armarRonda(); });
$('#theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

chips(); marcarTipo(); armarRonda();
</script>
</body>
</html>
