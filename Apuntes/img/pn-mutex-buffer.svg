<text x="20.0" y="320.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Con 1 ficha: exclusión mutua estricta. Con 3 fichas, hasta</text>
<text x="20.0" y="337.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">tres procesos a la vez. Invariante: M(SC izq) + M(SC der) +</text>
<text x="20.0" y="354.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">M(recursos) = 3.</text>
