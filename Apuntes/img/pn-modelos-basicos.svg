<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 13.5px; font-weight: 600; }
    .cap { font-size: 11.5px; }
    .lb  { font-size: 11.5px; text-anchor: middle; }
    .pl  { fill: none; stroke: #78829a; stroke-width: 1.8; }
    .tr  { fill: none; stroke: #f0883e; stroke-width: 2.2; }
    .tk  { fill: #4c8dff; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.5; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/>
    </marker>
  </defs>

  <text class="tit" x="20" y="28" fill="#3fb950">Co-begin / co-end</text>
  <text class="cap" x="20" y="46">Arranque en paralelo y terminación sincronizada</text>

  <circle class="pl" cx="140" cy="86" r="20"/>
  <circle class="tk" cx="140" cy="86" r="5"/>

  <rect class="tr" x="126" y="126" width="28" height="9"/>
  <text class="lb" x="196" y="136" fill="#f0883e">co-begin</text>

  <circle class="pl" cx="100" cy="180" r="20"/>
  <circle class="pl" cx="180" cy="180" r="20"/>
  <text class="lb" x="60" y="184">A</text>
  <text class="lb" x="220" y="184">B</text>

  <rect class="tr" x="126" y="226" width="28" height="9"/>
  <text class="lb" x="192" y="236" fill="#f0883e">co-end</text>

  <circle class="pl" cx="140" cy="276" r="20"/>

  <line class="edge" x1="140" y1="108" x2="140" y2="120"/>
  <line class="edge" x1="131" y1="137" x2="106" y2="158"/>
  <line class="edge" x1="149" y1="137" x2="174" y2="158"/>
  <line class="edge" x1="106" y1="202" x2="131" y2="220"/>
  <line class="edge" x1="174" y1="202" x2="149" y2="220"/>
  <line class="edge" x1="140" y1="237" x2="140" y2="252"/>

  <text class="cap" x="20" y="316">Co-end sólo dispara cuando A y B tienen ficha: es una barrera.</text>

  <line x1="300" y1="20" x2="300" y2="320" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <text class="tit" x="330" y="28" fill="#4c8dff">Sincronización por señal</text>
  <text class="cap" x="330" y="46">P2 no puede avanzar hasta que P1 le avise</text>

  <circle class="pl" cx="380" cy="86" r="20"/>
  <circle class="tk" cx="380" cy="86" r="5"/>
  <text class="lb" x="348" y="80">P1</text>

  <rect class="tr" x="366" y="126" width="28" height="9"/>

  <circle class="pl" cx="380" cy="180" r="20"/>

  <circle class="pl" cx="470" cy="150" r="20"/>
  <text class="lb" x="470" y="122">señal</text>

  <circle class="pl" cx="560" cy="86" r="20"/>
  <circle class="tk" cx="560" cy="86" r="5"/>
  <text class="lb" x="592" y="80">P2</text>

  <rect class="tr" x="546" y="206" width="28" height="9"/>

  <circle class="pl" cx="560" cy="262" r="20"/>

  <line class="edge" x1="380" y1="108" x2="380" y2="120"/>
  <line class="edge" x1="380" y1="137" x2="380" y2="158"/>
  <line class="edge" x1="396" y1="133" x2="450" y2="146"/>
  <line class="edge" x1="490" y1="156" x2="546" y2="203"/>
  <line class="edge" x1="560" y1="108" x2="560" y2="200"/>
  <line class="edge" x1="560" y1="217" x2="560" y2="240"/>

  <text class="cap" x="330" y="316">La transición de P2 tiene DOS entradas: su propio lugar y la señal.</text>
</svg>
