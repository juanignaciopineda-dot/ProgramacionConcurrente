<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" version="1.1">
<style>text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }</style>
<defs><marker id="ah-78829a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/></marker></defs>
<text x="20.0" y="26.0" text-anchor="start" style="font-size:13.5px;fill:#ff6b6b;font-weight:600">AFND: reconoce las cadenas que terminan en «ab»</text>
<text x="20.0" y="46.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Desde q0 con una a se puede ir a q0 o a q1: la transición no es determinista.</text>
<circle cx="110" cy="140" r="22" fill="none" stroke="#78829a" stroke-width="1.8"/>
<text x="110" y="145" text-anchor="middle" style="font-size:13px;fill:#78829a">q0</text>
<circle cx="280" cy="140" r="22" fill="none" stroke="#78829a" stroke-width="1.8"/>
<text x="280" y="145" text-anchor="middle" style="font-size:13px;fill:#78829a">q1</text>
<circle cx="450" cy="140" r="22" fill="none" stroke="#78829a" stroke-width="1.8"/>
<circle cx="450" cy="140" r="26" fill="none" stroke="#78829a" stroke-width="1.8"/>
<text x="450" y="145" text-anchor="middle" style="font-size:13px;fill:#78829a">q2</text>
<line x1="48" y1="140" x2="88" y2="140" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<path d="M 99.7 120.6 C 71.1 84.2 148.9 84.2 120.3 120.6" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="110.0" y="86.3" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">a, b</text>
<path d="M 132.0 140.0 L 258.0 140.0" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="195.0" y="132.0" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">a</text>
<path d="M 302.0 140.0 L 424.0 140.0" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="363.0" y="132.0" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">b</text>
<line x1="20.0" y1="195.0" x2="620.0" y2="195.0" stroke="#78829a" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="20.0" y="225.0" text-anchor="start" style="font-size:13.5px;fill:#4c8dff;font-weight:600">Construcción de subconjuntos</text>
<line x1="40.0" y1="245.0" x2="360.0" y2="245.0" stroke="#78829a" stroke-width="1.4"/>
<text x="50.0" y="262.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">subconjunto</text>
<text x="180.0" y="262.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">a</text>
<text x="270.0" y="262.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">b</text>
<line x1="40.0" y1="272.0" x2="360.0" y2="272.0" stroke="#78829a" stroke-width="1.4"/>
<text x="50.0" y="294.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">A = {q0}</text>
<text x="180.0" y="294.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0, q1} = B</text>
<text x="270.0" y="294.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0} = A</text>
<text x="50.0" y="316.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">B = {q0, q1}</text>
<text x="180.0" y="316.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0, q1} = B</text>
<text x="270.0" y="316.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0, q2} = C</text>
<text x="50.0" y="338.0" text-anchor="start" style="font-size:12.5px;fill:#3fb950">C = {q0, q2}</text>
<text x="180.0" y="338.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0, q1} = B</text>
<text x="270.0" y="338.0" text-anchor="start" style="font-size:12.5px;fill:#78829a">{q0} = A</text>
<line x1="40.0" y1="350.0" x2="360.0" y2="350.0" stroke="#78829a" stroke-width="1.4"/>
<text x="390.0" y="294.0" text-anchor="start" style="font-size:11.5px;fill:#3fb950">C es final porque contiene a q2, que era</text>
<text x="390.0" y="311.2" text-anchor="start" style="font-size:11.5px;fill:#3fb950">final en el AFND.</text>
<line x1="20.0" y1="372.0" x2="620.0" y2="372.0" stroke="#78829a" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="20.0" y="400.0" text-anchor="start" style="font-size:13.5px;fill:#3fb950;font-weight:600">AFD equivalente: reconoce exactamente el mismo lenguaje</text>
<circle cx="110" cy="480" r="22" fill="none" stroke="#78829a" stroke-width="1.8"/>
<text x="110" y="485" text-anchor="middle" style="font-size:13px;fill:#78829a">A</text>
