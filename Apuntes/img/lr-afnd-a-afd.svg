<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 14px; font-weight: 600; }
    .cap { font-size: 11.5px; }
    .st  { font-size: 13px; text-anchor: middle; }
    .lb  { font-size: 13px; text-anchor: middle; fill: #f0883e; }
    .tb  { font-size: 12.5px; }
    .node { fill: none; stroke: #78829a; stroke-width: 1.7; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.6; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/>
    </marker>
  </defs>

  <text class="tit" x="20" y="26" fill="#ff6b6b">AFND — reconoce las cadenas que terminan en “ab”</text>
  <text class="cap" x="20" y="46">Desde q0 con una a se puede ir a q0 o a q1: la transición no es determinista.</text>

  <line class="edge" x1="42" y1="120" x2="76" y2="120"/>
  <circle class="node" cx="100" cy="120" r="24"/>
  <text class="st" x="100" y="125">q0</text>
  <circle class="node" cx="270" cy="120" r="24"/>
  <text class="st" x="270" y="125">q1</text>
  <circle class="node" cx="440" cy="120" r="24"/>
  <circle class="node" cx="440" cy="120" r="18"/>
  <text class="st" x="440" y="125">q2</text>

  <path class="edge" d="M 82 104 C 66 62 134 62 118 104"/>
  <text class="lb" x="100" y="56">a, b</text>

  <line class="edge" x1="125" y1="120" x2="243" y2="120"/>
  <text class="lb" x="184" y="110">a</text>
  <line class="edge" x1="295" y1="120" x2="413" y2="120"/>
  <text class="lb" x="354" y="110">b</text>

  <line x1="20" y1="176" x2="600" y2="176" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <text class="tit" x="20" y="204" fill="#4c8dff">Construcción de subconjuntos</text>

  <line x1="40" y1="220" x2="360" y2="220" stroke="#78829a" stroke-width="1.2"/>
  <text class="tb" x="50"  y="240">subconjunto</text>
  <text class="tb" x="180" y="240">a</text>
  <text class="tb" x="270" y="240">b</text>
  <line x1="40" y1="250" x2="360" y2="250" stroke="#78829a" stroke-width="1.2"/>

  <text class="tb" x="50"  y="272">A = {q0}</text>
  <text class="tb" x="180" y="272">{q0, q1} = B</text>
  <text class="tb" x="270" y="272">{q0} = A</text>

  <text class="tb" x="50"  y="294">B = {q0, q1}</text>
  <text class="tb" x="180" y="294">{q0, q1} = B</text>
  <text class="tb" x="270" y="294">{q0, q2} = C</text>

  <text class="tb" x="50"  y="316" fill="#3fb950">C = {q0, q2}</text>
  <text class="tb" x="180" y="316">{q0, q1} = B</text>
  <text class="tb" x="270" y="316">{q0} = A</text>
  <line x1="40" y1="328" x2="360" y2="328" stroke="#78829a" stroke-width="1.2"/>

  <text class="cap" x="380" y="272" fill="#3fb950">C es final porque</text>
  <text class="cap" x="380" y="290" fill="#3fb950">contiene a q2, que</text>
  <text class="cap" x="380" y="308" fill="#3fb950">era final en el AFND.</text>

  <line x1="20" y1="352" x2="600" y2="352" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <text class="tit" x="20" y="380" fill="#3fb950">AFD equivalente — reconoce exactamente el mismo lenguaje</text>

  <line class="edge" x1="46" y1="440" x2="80" y2="440"/>
  <circle class="node" cx="104" cy="440" r="24"/>
  <text class="st" x="104" y="445">A</text>
  <circle class="node" cx="264" cy="440" r="24"/>
  <text class="st" x="264" y="445">B</text>
  <circle class="node" cx="424" cy="440" r="24"/>
  <circle class="node" cx="424" cy="440" r="18"/>
  <text class="st" x="424" y="445">C</text>

  <path class="edge" d="M 86 424 C 70 382 138 382 122 424"/>
  <text class="lb" x="104" y="376">b</text>
  <path class="edge" d="M 246 424 C 230 382 298 382 282 424"/>
  <text class="lb" x="264" y="376">a</text>

  <line class="edge" x1="129" y1="440" x2="237" y2="440"/>
  <text class="lb" x="183" y="430">a</text>
  <line class="edge" x1="289" y1="440" x2="397" y2="440"/>
  <text class="lb" x="353" y="430">b</text>

  <path class="edge" d="M 408 459 Q 344 500 280 459"/>
  <text class="lb" x="344" y="514">a</text>

  <path class="edge" d="M 416 462 Q 264 548 112 462"/>
  <text class="lb" x="264" y="540">b</text>

  <text class="cap" x="20" y="556">Todo AFND tiene un AFD equivalente: L(AFD) = L(AFND). El precio es que el AFD puede tener hasta 2ⁿ estados.</text>
</svg>
