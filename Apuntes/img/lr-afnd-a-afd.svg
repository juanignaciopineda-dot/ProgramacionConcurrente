<text x="195.0" y="472.0" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">a</text>
<path d="M 302.0 480.0 L 424.0 480.0" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="363.0" y="472.0" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">b</text>
<path d="M 427.7 493.4 Q 365.0 531.0 298.9 491.3" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="364.5" y="503.7" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">a</text>
<path d="M 427.7 493.4 Q 280.0 582.0 128.9 491.3" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="278.8" y="555.2" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">b</text>
<text x="20.0" y="585.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Todo AFND tiene un AFD equivalente: L(AFD) = L(AFND). El precio es que el AFD puede tener hasta 2ⁿ estados.</text>
</svg>
