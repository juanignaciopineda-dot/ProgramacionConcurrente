<text x="280" y="485" text-anchor="middle" style="font-size:13px;fill:#78829a">B</text>
<circle cx="450" cy="480" r="22" fill="none" stroke="#78829a" stroke-width="1.8"/>
<circle cx="450" cy="480" r="26" fill="none" stroke="#78829a" stroke-width="1.8"/>
<text x="450" y="485" text-anchor="middle" style="font-size:13px;fill:#78829a">C</text>
<line x1="48" y1="480" x2="88" y2="480" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<path d="M 99.7 460.6 C 71.1 424.2 148.9 424.2 120.3 460.6" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="110.0" y="426.3" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">b</text>
<path d="M 269.7 460.6 C 241.1 424.2 318.9 424.2 290.3 460.6" fill="none" stroke="#78829a" stroke-width="1.5" marker-end="url(#ah-78829a)"/>
<text x="280.0" y="426.3" text-anchor="middle" style="font-size:12.5px;fill:#f0883e">a</text>
