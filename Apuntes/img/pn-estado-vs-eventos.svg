<text x="360.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#78829a;font-weight:600">Grafo de eventos (grafo marcado)</text>
<text x="360.0" y="48.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Cada PLAZA tiene exactamente una transición de entrada</text>
<text x="360.0" y="65.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">y una de salida.</text>
