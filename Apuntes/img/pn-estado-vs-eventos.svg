<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 13.5px; font-weight: 600; }
    .cap { font-size: 11.5px; }
    .lb  { font-size: 11.5px; text-anchor: middle; }
    .pl  { fill: none; stroke: #78829a; stroke-width: 1.8; }
    .tr  { fill: none; stroke: #f0883e; stroke-width: 2.2; }
    .tk  { fill: #4c8dff; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.5; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/>
    </marker>
  </defs>

  <text class="tit" x="20" y="28" fill="#3fb950">Grafo de estado</text>
  <text class="cap" x="20" y="46">Cada TRANSICIÓN tiene exactamente un lugar de entrada y uno de salida</text>

  <circle class="pl" cx="120" cy="115" r="20"/>
  <circle class="tk" cx="120" cy="115" r="5"/>
  <text class="lb" x="120" y="88">P1</text>
  <circle class="pl" cx="185" cy="227" r="20"/>
  <text class="lb" x="216" y="248">P3</text>
  <circle class="pl" cx="55" cy="227" r="20"/>
  <text class="lb" x="24" y="248">P2</text>

  <rect class="tr" x="180" y="139" width="9" height="27" transform="rotate(60 184.9 152.5)"/>
  <rect class="tr" x="115" y="251" width="9" height="27" transform="rotate(180 120 265)"/>
  <rect class="tr" x="50"  y="139" width="9" height="27" transform="rotate(300 55 152.5)"/>

  <line class="edge" x1="137.3" y1="125" x2="173.7" y2="146"/>
  <line class="edge" x1="185" y1="165.5" x2="185" y2="207"/>
  <line class="edge" x1="167.6" y1="237.5" x2="131.3" y2="258.5"/>
  <line class="edge" x1="108.7" y1="258.5" x2="72.3" y2="237.5"/>
  <line class="edge" x1="55" y1="207" x2="55" y2="165.5"/>
  <line class="edge" x1="66.3" y1="146" x2="102.7" y2="125"/>

  <text class="cap" x="20" y="316">Con EXACTAMENTE UN token equivale a un autómata</text>
  <text class="cap" x="20" y="334">de 3 estados: el token es "el estado en que estoy".</text>
  <text class="cap" x="20" y="356" fill="#ff6b6b">Con dos tokens ya NO equivale: la red admite 6</text>
  <text class="cap" x="20" y="374" fill="#ff6b6b">marcados distintos, cosa que un autómata de 3</text>
  <text class="cap" x="20" y="392" fill="#ff6b6b">estados no puede representar.</text>

  <line x1="300" y1="20" x2="300" y2="400" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <text class="tit" x="330" y="28" fill="#4c8dff">Grafo de eventos</text>
  <text class="cap" x="330" y="46">Cada LUGAR tiene exactamente una transición de entrada y una de salida</text>

  <circle class="pl" cx="420" cy="82" r="20"/>
  <circle class="tk" cx="420" cy="82" r="5"/>
  <text class="lb" x="386" y="72">P0</text>

  <rect class="tr" x="406" y="126" width="28" height="9"/>
  <text class="lb" x="386" y="136" fill="#f0883e">T1</text>

  <circle class="pl" cx="365" cy="185" r="20"/>
  <text class="lb" x="332" y="180">P1</text>
  <circle class="pl" cx="475" cy="185" r="20"/>
  <text class="lb" x="508" y="180">P2</text>

  <rect class="tr" x="351" y="226" width="28" height="9"/>
  <rect class="tr" x="461" y="226" width="28" height="9"/>
  <text class="lb" x="332" y="236" fill="#f0883e">T2</text>
  <text class="lb" x="508" y="236" fill="#f0883e">T3</text>

  <circle class="pl" cx="365" cy="280" r="20"/>
  <text class="lb" x="332" y="276">P3</text>
  <circle class="pl" cx="475" cy="280" r="20"/>
  <text class="lb" x="508" y="276">P4</text>

  <rect class="tr" x="406" y="330" width="28" height="9"/>
  <text class="lb" x="386" y="340" fill="#f0883e">T4</text>

  <line class="edge" x1="420" y1="104" x2="420" y2="120"/>
  <line class="edge" x1="410" y1="137" x2="374" y2="163"/>
  <line class="edge" x1="430" y1="137" x2="466" y2="163"/>
  <line class="edge" x1="365" y1="207" x2="365" y2="220"/>
  <line class="edge" x1="475" y1="207" x2="475" y2="220"/>
  <line class="edge" x1="365" y1="237" x2="365" y2="256"/>
  <line class="edge" x1="475" y1="237" x2="475" y2="256"/>
  <line class="edge" x1="374" y1="300" x2="410" y2="326"/>
  <line class="edge" x1="466" y1="300" x2="430" y2="326"/>
  <path class="edge" d="M 438 336 Q 560 210 438 88"/>

  <text class="cap" x="330" y="374">Nunca hay conflicto: un lugar es entrada de una</text>
  <text class="cap" x="330" y="392">sola transición. No hay elección, sólo paralelismo.</text>
</svg>
