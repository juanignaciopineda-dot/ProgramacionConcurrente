<text x="20.0" y="355.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Con EXACTAMENTE UNA ficha equivale a un autómata</text>
<text x="20.0" y="372.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">de 3 estados: la ficha es el estado actual. Con dos</text>
<text x="20.0" y="389.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">fichas ya no, porque la red admite 6 marcados distintos.</text>
