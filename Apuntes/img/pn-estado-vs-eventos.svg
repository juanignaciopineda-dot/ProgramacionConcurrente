<text x="360.0" y="412.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Nunca hay conflicto: cada plaza alimenta a una sola</text>
<text x="360.0" y="429.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">transición. Hay paralelismo y sincronización, pero no</text>
<text x="360.0" y="446.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">elección.</text>
