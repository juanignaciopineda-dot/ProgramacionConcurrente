<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 14px; font-weight: 600; }
    .cap { font-size: 11.5px; }
    .st  { font-size: 13px; text-anchor: middle; }
    .lb  { font-size: 13px; text-anchor: middle; }
    .in  { fill: #4c8dff; }
    .out { fill: #f0883e; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.6; marker-end: url(#ah); }
    .node { fill: none; stroke: #78829a; stroke-width: 1.8; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/>
    </marker>
  </defs>

  <!-- ============ MEALY ============ -->
  <text class="tit" x="24" y="30" fill="#f0883e">Mealy — la salida está en el ARCO</text>
  <text class="cap" x="24" y="50">g : E × Q → S    ·    la salida depende del estado y de la entrada</text>

  <line class="edge" x1="72" y1="150" x2="112" y2="150"/>
  <text class="cap" x="60" y="140" text-anchor="middle">inicio</text>

  <circle class="node" cx="150" cy="150" r="30"/>
  <text class="st" x="150" y="155">q0</text>
  <circle class="node" cx="330" cy="150" r="30"/>
  <text class="st" x="330" y="155">q1</text>

  <path class="edge" d="M 176 134 Q 240 96 304 134"/>
  <text class="lb" x="240" y="88"><tspan class="in">a</tspan> / <tspan class="out">0</tspan></text>

  <path class="edge" d="M 304 166 Q 240 204 176 166"/>
  <text class="lb" x="240" y="224"><tspan class="in">b</tspan> / <tspan class="out">1</tspan></text>

  <path class="edge" d="M 133 124 C 118 78 182 78 167 124"/>
  <text class="lb" x="150" y="70"><tspan class="in">b</tspan> / <tspan class="out">0</tspan></text>

  <path class="edge" d="M 313 124 C 298 78 362 78 347 124"/>
  <text class="lb" x="330" y="70"><tspan class="in">a</tspan> / <tspan class="out">0</tspan></text>

  <text class="cap" x="410" y="146">Emite 1 en el instante</text>
  <text class="cap" x="410" y="164">en que llega la b que</text>
  <text class="cap" x="410" y="182">completa “ab”.</text>
  <text class="cap" x="410" y="206" fill="#3fb950">2 estados</text>

  <line x1="24" y1="258" x2="596" y2="258" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- ============ MOORE ============ -->
  <text class="tit" x="24" y="296" fill="#4c8dff">Moore — la salida está en el ESTADO</text>
  <text class="cap" x="24" y="316">g : Q → S    ·    la salida depende sólo del estado en que se está</text>

  <line class="edge" x1="46" y1="410" x2="86" y2="410"/>
  <text class="cap" x="40" y="400" text-anchor="middle">inicio</text>

  <circle class="node" cx="120" cy="410" r="32"/>
  <text class="st" x="120" y="408">q0 /</text>
  <text class="st" x="120" y="424"><tspan class="out">0</tspan></text>

  <circle class="node" cx="280" cy="410" r="32"/>
  <text class="st" x="280" y="408">q1 /</text>
  <text class="st" x="280" y="424"><tspan class="out">0</tspan></text>

  <circle class="node" cx="440" cy="410" r="32"/>
  <circle class="node" cx="440" cy="410" r="26"/>
  <text class="st" x="440" y="408">q2 /</text>
  <text class="st" x="440" y="424"><tspan class="out">1</tspan></text>

  <line class="edge" x1="153" y1="410" x2="245" y2="410"/>
  <text class="lb" x="199" y="400"><tspan class="in">a</tspan></text>

  <line class="edge" x1="313" y1="410" x2="405" y2="410"/>
  <text class="lb" x="359" y="400"><tspan class="in">b</tspan></text>

  <path class="edge" d="M 103 385 C 88 339 152 339 137 385"/>
  <text class="lb" x="120" y="332"><tspan class="in">b</tspan></text>

  <path class="edge" d="M 263 436 C 248 482 312 482 297 436"/>
  <text class="lb" x="280" y="500"><tspan class="in">a</tspan></text>

  <path class="edge" d="M 421 384 Q 360 336 299 384"/>
  <text class="lb" x="360" y="328"><tspan class="in">a</tspan></text>

  <path class="edge" d="M 432 441 Q 280 580 128 441"/>
  <text class="lb" x="280" y="556"><tspan class="in">b</tspan></text>

  <text class="cap" x="500" y="392">Hace falta un</text>
  <text class="cap" x="500" y="410">estado extra (q2)</text>
  <text class="cap" x="500" y="428">para colgarle la</text>
  <text class="cap" x="500" y="446">salida 1.</text>
  <text class="cap" x="500" y="470" fill="#ff6b6b">3 estados</text>

  <text class="cap" x="24" y="588">Las dos máquinas son igualmente expresivas: ambas reconocen exactamente los lenguajes regulares.</text>
</svg>
