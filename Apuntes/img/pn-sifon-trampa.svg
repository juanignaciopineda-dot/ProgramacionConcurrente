<text x="20.0" y="205.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Si dispara T2, la ficha sale del sifón para siempre: vacío, ninguna de sus transiciones de salida vuelve a habilitarse.</text>
<line x1="20.0" y1="236.0" x2="640.0" y2="236.0" stroke="#78829a" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="20.0" y="264.0" text-anchor="start" style="font-size:13.5px;fill:#78829a;font-weight:600">Trampa {P4, P5}: sólo puede GANAR fichas</text>
<text x="20.0" y="284.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">{P4, P5}• = {T3, T4} ⊆ •{P4, P5} = {T3, T4, T5}: toda transición que le saca fichas también le da.</text>
