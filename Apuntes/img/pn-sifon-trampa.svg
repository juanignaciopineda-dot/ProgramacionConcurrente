<text x="450.0" y="340.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Una vez que la trampa tiene una</text>
<text x="450.0" y="357.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">ficha, nunca vuelve a vaciarse.</text>
