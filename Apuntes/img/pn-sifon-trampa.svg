<text x="20.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#78829a;font-weight:600">Sifón {P1, P2}: sólo puede PERDER fichas</text>
<text x="20.0" y="48.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">•{P1, P2} = {T1} ⊆ {P1, P2}• = {T1, T2}: toda transición que le da fichas también le saca.</text>
<circle cx="80" cy="120" r="20" fill="none" stroke="#78829a" stroke-width="1.8"/>
