<text x="360.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">T1 se parte en T1' y T1'' con una plaza nueva P1' en el</text>
<text x="360.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">medio. Ninguna plaza es entrada y salida de la misma</text>
<text x="360.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">transición, y C alcanza para reconstruir la red.</text>
