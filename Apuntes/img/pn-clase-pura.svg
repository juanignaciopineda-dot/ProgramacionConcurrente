<text x="20.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#ff6b6b;font-weight:600">✗ Impura</text>
<text x="20.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">P1 es entrada y salida de T1 (auto-loop). En C la entrada</text>
<text x="20.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">(P1, T1) da 1 − 1 = 0, así que la matriz de incidencia no</text>
<text x="20.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">registra el arco.</text>
