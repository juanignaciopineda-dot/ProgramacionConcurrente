<text x="20.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#3fb950;font-weight:600">✓ Libre elección</text>
<text x="20.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">T1 y T2 están en conflicto por P1 y no tienen otra</text>
<text x="20.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">entrada: si una está habilitada, la otra también. T3</text>
<text x="20.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">sincroniza P3 con P4 sin conflicto.</text>
