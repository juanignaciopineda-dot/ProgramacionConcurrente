<text x="20.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">P1• = {T1, T2} ⊆ P2• = {T1, T2, T3}: los conjuntos de</text>
<text x="20.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">salida están anidados. No es simple, porque T1 y T2</text>
<text x="20.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">están en dos conflictos.</text>
