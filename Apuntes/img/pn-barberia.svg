<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 13.5px; font-weight: 600; }
    .cap { font-size: 11px; }
    .lb  { font-size: 10.5px; text-anchor: middle; }
    .pl  { fill: none; stroke: #78829a; stroke-width: 1.7; }
    .tr  { fill: none; stroke: #f0883e; stroke-width: 2.1; }
    .tk  { fill: #4c8dff; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.4; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#78829a"/>
    </marker>
  </defs>

  <text class="tit" x="20" y="24">Problema de la barbería — n=2 barberos, m=3 bancos, 1 caja</text>

  <!-- llegada -->
  <circle class="pl" cx="45" cy="90" r="20"/>
  <circle class="tk" cx="45" cy="90" r="5"/>
  <text class="lb" x="45" y="60">fuera</text>

  <rect class="tr" x="90" y="76" width="9" height="28"/>
  <text class="lb" x="94" y="66" fill="#f0883e">llega</text>

  <!-- bancos -->
  <circle class="pl" cx="170" cy="90" r="22"/>
  <text class="lb" x="170" y="55">bancos libres</text>
  <text class="lb" x="170" y="128" fill="#4c8dff">M₀=3</text>

  <!-- se va sin atender -->
  <rect class="tr" x="165" y="150" width="28" height="9"/>
  <text class="lb" x="220" y="158" fill="#f0883e">se va (lleno)</text>

  <line class="edge" x1="65" y1="90" x2="86" y2="90"/>
  <line class="edge" x1="99" y1="90" x2="148" y2="90"/>

  <!-- esperando -->
  <circle class="pl" cx="270" cy="90" r="22"/>
  <text class="lb" x="270" y="55">esperando</text>

  <rect class="tr" x="215" y="76" width="9" height="28"/>
  <text class="lb" x="219" y="66" fill="#f0883e">se sienta</text>
  <line class="edge" x1="192" y1="90" x2="211" y2="90"/>
  <line class="edge" x1="224" y1="90" x2="248" y2="90"/>

  <line class="edge" x1="270" y1="112" x2="200" y2="150"/>
  <line class="edge" x1="182" y1="159" x2="45" y2="112"/>

  <!-- barberos libres -->
  <circle class="pl" cx="270" cy="220" r="22"/>
  <circle class="tk" cx="262" cy="214" r="4.5"/>
  <circle class="tk" cx="278" cy="214" r="4.5"/>
  <text class="lb" x="270" y="182" fill="#4c8dff">M₀=2</text>
  <text class="lb" x="330" y="220">barberos libres</text>

  <!-- llama al siguiente -->
  <rect class="tr" x="255" y="255" width="28" height="9"/>
  <text class="lb" x="215" y="264" fill="#f0883e">llama al siguiente</text>

  <line class="edge" x1="270" y1="112" x2="270" y2="242"/>
  <text class="lb" x="290" y="130">*</text>
  <line class="edge" x1="270" y1="198" x2="270" y2="150"/>

  <!-- cortando -->
  <circle class="pl" cx="270" cy="330" r="22"/>
  <text class="lb" x="330" y="330">cortando pelo</text>

  <line class="edge" x1="270" y1="264" x2="270" y2="308"/>

  <!-- termina de cortar -->
  <rect class="tr" x="255" y="365" width="28" height="9"/>
  <text class="lb" x="330" y="373" fill="#f0883e">termina de cortar</text>
  <line class="edge" x1="270" y1="352" x2="270" y2="361"/>

  <!-- cliente cortado -->
  <circle class="pl" cx="170" cy="400" r="20"/>
  <text class="lb" x="120" y="405">a pagar</text>
  <line class="edge" x1="255" y1="382" x2="192" y2="396"/>

  <!-- barbero disponible para cobrar -->
  <line class="edge" x1="255" y1="376" x2="150" y2="330"/>
  <text class="lb" x="200" y="330" fill="#78829a">(barbero</text>
  <text class="lb" x="200" y="342" fill="#78829a">queda libre)</text>
  <path class="edge" d="M 150 322 Q 90 280 254 224"/>

  <!-- caja -->
  <circle class="pl" cx="450" cy="400" r="20"/>
  <circle class="tk" cx="450" cy="400" r="5"/>
  <text class="lb" x="450" y="368" fill="#4c8dff">M₀=1 (caja libre)</text>

  <rect class="tr" x="330" y="386" width="28" height="9"/>
  <text class="lb" x="345" y="376" fill="#f0883e">cobra</text>
  <line class="edge" x1="190" y1="400" x2="326" y2="400"/>
  <line class="edge" x1="430" y1="400" x2="362" y2="400"/>

  <!-- barbero cobrando -->
  <circle class="pl" cx="450" cy="300" r="20"/>
  <text class="lb" x="500" y="300">barbero en caja</text>
  <line class="edge" x1="450" y1="380" x2="450" y2="320"/>
  <text class="lb" x="470" y="350">*</text>

  <rect class="tr" x="435" y="255" width="28" height="9"/>
  <text class="lb" x="500" y="248" fill="#f0883e">termina de cobrar</text>
  <line class="edge" x1="450" y1="280" x2="450" y2="264"/>
  <path class="edge" d="M 450 255 Q 450 220 285 224"/>
  <text class="lb" x="470" y="230">a barberos libres</text>

  <!-- salida cliente -->
  <rect class="tr" x="330" y="390" width="0" height="0"/>
  <circle class="pl" cx="580" cy="400" r="20"/>
  <text class="lb" x="580" y="368">se va contento</text>
  <line class="edge" x1="470" y1="400" x2="560" y2="400"/>

  <text class="cap" x="20" y="440">Invariante 1 (bancos): M(bancos) + M(esperando) = 3 — nunca hay más de 3 clientes esperando.</text>
  <text class="cap" x="20" y="456">Invariante 2 (barberos): M(libres) + M(cortando) + M(en caja) = 2 — nunca cortan/cobran más de 2 a la vez.</text>
  <text class="cap" x="20" y="472">"llega" es conflicto con la capacidad de bancos; "llama al siguiente" es sincronización barbero+cliente (como el co-begin).</text>
</svg>
