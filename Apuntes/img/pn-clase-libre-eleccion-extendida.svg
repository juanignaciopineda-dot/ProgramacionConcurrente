<text x="20.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">P1• = P2• = {T1, T2}. Las dos transiciones del conflicto</text>
<text x="20.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">tienen el mismo conjunto de entradas, así que se</text>
<text x="20.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">habilitan siempre juntas.</text>
