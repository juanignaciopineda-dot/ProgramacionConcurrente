<text x="360.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">P1• = {T1, T2} y P2• = {T2} comparten T2 sin ser</text>
<text x="360.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">iguales: P2 puede habilitar a T2 y no a T1. Sí es simple.</text>
