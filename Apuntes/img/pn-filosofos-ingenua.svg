<text x="20.0" y="672.0" text-anchor="start" style="font-size:11.5px;fill:#ff6b6b">Marcado de deadlock: los cinco filósofos tomaron el tenedor de su lado izquierdo.</text>
<text x="20.0" y="690.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">No quedan tenedores libres, así que ninguna toma derecha puede disparar.</text>
<text x="20.0" y="708.0" style="font-size:11.5px"><tspan style="fill:#78829a">Plazas de cada filósofo: </tspan><tspan style="fill:#3fb950">pensando</tspan><tspan style="fill:#78829a">, </tspan><tspan style="fill:#ff6b6b">con uno</tspan><tspan style="fill:#78829a"> (al centro) y </tspan><tspan style="fill:#4c8dff">comiendo</tspan><tspan style="fill:#78829a">.</tspan></text>
