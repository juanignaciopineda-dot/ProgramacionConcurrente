<text x="20.0" y="285.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Sensibilizada: cada plaza de entrada tiene al menos tantas fichas como el peso de su arco (P1 necesita 1 y P2</text>
<text x="20.0" y="302.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">necesita 2). Al disparar, T1 consume las fichas de todas sus entradas y produce en todas sus salidas. El disparo es</text>
<text x="20.0" y="319.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">indivisible y dura cero.</text>
