<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" version="1.1">
<style>text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }</style>
<defs></defs>
<text x="20.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#78829a;font-weight:600">Vivacidad y deadlock</text>
<text x="20.0" y="48.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Quasi-vivas y libres de deadlock se cruzan, y las vivas están en la intersección.</text>
<rect x="20.0" y="66.0" width="620.0" height="278.0" rx="10" fill="none" stroke="#ff6b6b" stroke-width="2"/>
<text x="36.0" y="88.0" text-anchor="start" style="font-size:12px;fill:#ff6b6b;font-weight:600">Todas las RdP</text>
<ellipse cx="250" cy="212" rx="165" ry="108" fill="none" stroke="#4c8dff" stroke-width="2"/>
<ellipse cx="410" cy="212" rx="165" ry="108" fill="none" stroke="#f0883e" stroke-width="2"/>
<text x="150.0" y="200.0" text-anchor="middle" style="font-size:12.5px;fill:#4c8dff;font-weight:600">Quasi-vivas</text>
<text x="150.0" y="219.0" text-anchor="middle" style="font-size:11px;fill:#78829a">cada transición</text>
<text x="150.0" y="235.5" text-anchor="middle" style="font-size:11px;fill:#78829a">dispara alguna vez</text>
<text x="510.0" y="200.0" text-anchor="middle" style="font-size:12.5px;fill:#f0883e;font-weight:600">Libres de deadlock</text>
<text x="510.0" y="219.0" text-anchor="middle" style="font-size:11px;fill:#78829a">siempre queda alguna</text>
<text x="510.0" y="235.5" text-anchor="middle" style="font-size:11px;fill:#78829a">transición sensibilizada</text>
<circle cx="330" cy="215" r="50" fill="none" stroke="#3fb950" stroke-width="2"/>
<text x="330.0" y="200.0" text-anchor="middle" style="font-size:12.5px;fill:#3fb950;font-weight:600">Vivas</text>
<text x="330.0" y="217.0" text-anchor="middle" style="font-size:10px;fill:#78829a">cada transición</text>
<text x="330.0" y="230.0" text-anchor="middle" style="font-size:10px;fill:#78829a">siempre puede</text>
<text x="330.0" y="243.0" text-anchor="middle" style="font-size:10px;fill:#78829a">volver a disparar</text>
<text x="20.0" y="370.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Quasi-viva ⇏ libre de deadlock: puede disparar cada transición una vez y después trabarse.</text>
<text x="20.0" y="387.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">Libre de deadlock ⇏ quasi-viva: una transición puede no disparar nunca y el resto seguir funcionando.</text>
<text x="20.0" y="404.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">Viva ⇒ quasi-viva y libre de deadlock. Todo depende de M₀, y agregar fichas no siempre ayuda.</text>
</svg>
