<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .tit { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; }
    .ej  { font-size: 11.5px; font-style: italic; }
    .cap { font-size: 11.5px; fill: #78829a; }
  </style>

  <rect x="12" y="12" width="636" height="408" rx="14" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text class="tit" x="30" y="38" fill="#ff6b6b">Tipo 0 · Sin restricciones (estructura de frase)</text>
  <text class="sub" x="30" y="56" fill="#ff6b6b">Lenguajes recursivamente enumerables — Máquina de Turing</text>

  <rect x="46" y="70" width="568" height="336" rx="12" fill="none" stroke="#f0883e" stroke-width="2"/>
  <text class="tit" x="64" y="96" fill="#f0883e">Tipo 1 · Sensibles al contexto</text>
  <text class="sub" x="64" y="114" fill="#f0883e">Autómata lineal acotado (LBA)</text>

  <rect x="80" y="128" width="500" height="264" rx="10" fill="none" stroke="#4c8dff" stroke-width="2"/>
  <text class="tit" x="98" y="154" fill="#4c8dff">Tipo 2 · Libres de contexto</text>
  <text class="sub" x="98" y="172" fill="#4c8dff">Autómata de pila (PDA)</text>

  <rect x="114" y="186" width="432" height="192" rx="8" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text class="tit" x="132" y="212" fill="#3fb950">Tipo 3 · Regulares</text>
  <text class="sub" x="132" y="230" fill="#3fb950">Autómata finito (AF) — expresiones regulares</text>

  <line x1="132" y1="244" x2="528" y2="244" stroke="#3fb950" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <text class="ej" x="132" y="266" fill="#78829a">A → aB    |    A → a</text>
  <text class="ej" x="132" y="288" fill="#78829a">Ej.: L = { aⁿ bᵐ | n, m ≥ 1 } = a a* b b*</text>

  <text class="cap" x="132" y="316">Cada clase está estrictamente contenida en la siguiente:</text>
  <text class="cap" x="132" y="334">aⁿbⁿ es de tipo 2 pero no es regular, y aⁿbⁿcⁿ es de tipo 1</text>
  <text class="cap" x="132" y="352">pero no es libre de contexto.</text>

  <text class="cap" x="16" y="446" fill="#78829a">La jerarquía es de inclusión: regular ⊂ libre de contexto ⊂ sensible al contexto ⊂ sin restricciones.</text>
</svg>
