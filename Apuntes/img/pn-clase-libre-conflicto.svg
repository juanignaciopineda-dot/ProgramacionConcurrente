<text x="20.0" y="28.0" text-anchor="start" style="font-size:13.5px;fill:#3fb950;font-weight:600">✓ Libre de conflicto</text>
<text x="20.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Cada plaza tiene a lo sumo una transición de salida. P3</text>
<text x="20.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">tiene dos de entrada (eso se permite) y T3 sincroniza P3</text>
<text x="20.0" y="346.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">con P4. No es grafo de eventos, por P3.</text>
