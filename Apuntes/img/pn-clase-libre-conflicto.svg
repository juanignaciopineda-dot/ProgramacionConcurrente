<text x="360.0" y="312.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">P1 tiene dos transiciones de salida, así que T1 y T2</text>
<text x="360.0" y="329.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">compiten por su ficha. Es un conflicto estructural, pero la</text>
