<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" version="1.1">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #78829a; }
    .tit { font-size: 13.5px; font-weight: 600; }
    .cap { font-size: 11.5px; }
    .lb  { font-size: 11.5px; text-anchor: middle; }
    .pl  { fill: none; stroke: #78829a; stroke-width: 1.8; }
    .tr  { fill: none; stroke: #f0883e; stroke-width: 2.2; }
    .edge { fill: none; stroke: #78829a; stroke-width: 1.5; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#78829a"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#c86bd8"/>
    </marker>
  </defs>

  <text class="tit" x="20" y="28">Red de Petri ordinaria (desplegada)</text>
  <text class="cap" x="20" y="46">Un lugar y una transición por cada color</text>

  <circle class="pl" cx="80" cy="100" r="20"/>
  <circle cx="80" cy="100" r="5.5" fill="#4c8dff"/>
  <text class="lb" x="80" y="74">P1b</text>
  <rect class="tr" x="66" y="146" width="28" height="9"/>
  <text class="lb" x="42" y="156" fill="#f0883e">T1b</text>
  <circle class="pl" cx="80" cy="200" r="20"/>
  <text class="lb" x="80" y="236">P2b</text>
  <line class="edge" x1="80" y1="122" x2="80" y2="140"/>
  <line class="edge" x1="80" y1="157" x2="80" y2="176"/>

  <circle class="pl" cx="200" cy="100" r="20"/>
  <circle cx="200" cy="100" r="5.5" fill="#3fb950"/>
  <text class="lb" x="200" y="74">P1g</text>
  <rect class="tr" x="186" y="146" width="28" height="9"/>
  <text class="lb" x="238" y="156" fill="#f0883e">T1g</text>
  <circle class="pl" cx="200" cy="200" r="20"/>
  <text class="lb" x="200" y="236">P2g</text>
  <line class="edge" x1="200" y1="122" x2="200" y2="140"/>
  <line class="edge" x1="200" y1="157" x2="200" y2="176"/>

  <line x1="290" y1="20" x2="290" y2="290" stroke="#78829a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <path d="M 320 132 L 400 132" fill="none" stroke="#c86bd8" stroke-width="2" marker-end="url(#ahb)"/>
  <text class="lb" x="360" y="124" fill="#c86bd8">plegado</text>
  <path d="M 400 168 L 320 168" fill="none" stroke="#c86bd8" stroke-width="2" marker-end="url(#ahb)"/>
  <text class="lb" x="360" y="190" fill="#c86bd8">despliegue</text>

  <text class="tit" x="440" y="28" fill="#c86bd8">Red coloreada (plegada)</text>
  <text class="cap" x="440" y="46">Los colores viajan en las fichas</text>

  <circle class="pl" cx="520" cy="100" r="22"/>
  <circle cx="512" cy="100" r="5.5" fill="#4c8dff"/>
  <circle cx="528" cy="100" r="5.5" fill="#3fb950"/>
  <text class="lb" x="520" y="72">P1 = {P1b, P1g}</text>
  <rect class="tr" x="506" y="146" width="28" height="9"/>
  <text class="lb" x="474" y="156" fill="#f0883e">T1</text>
  <circle class="pl" cx="520" cy="200" r="22"/>
  <text class="lb" x="520" y="238">P2 = {P2b, P2g}</text>
  <line class="edge" x1="520" y1="122" x2="520" y2="140"/>
  <line class="edge" x1="520" y1="157" x2="520" y2="174"/>
  <text class="cap" x="546" y="130">id</text>
  <text class="cap" x="546" y="172">id</text>

  <text class="cap" x="20" y="278">Los arcos llevan FUNCIONES. Acá la función identidad: para disparar en el color &lt;b&gt; hace falta al menos una ficha &lt;b&gt; en P1,</text>
  <text class="cap" x="20" y="296">y el disparo saca una &lt;b&gt; de P1 y pone una &lt;b&gt; en P2 — exactamente el disparo de T1b en la red desplegada.</text>
  <text class="cap" x="20" y="318" fill="#3fb950">El despliegue completo de una red coloreada da siempre UNA red ordinaria única. Un color puede ser una n-tupla.</text>
</svg>
