<text x="20.0" y="315.0" text-anchor="start" style="font-size:11.5px;fill:#78829a">Los arcos llevan FUNCIONES. Con la función identidad, disparar T1 en el color &lt;b&gt; pide al menos una ficha &lt;b&gt; en P1,</text>
<text x="20.0" y="332.2" text-anchor="start" style="font-size:11.5px;fill:#78829a">la saca y pone una &lt;b&gt; en P2: exactamente el disparo de T1b en la red desplegada. El despliegue completo de una red</text>
<text x="20.0" y="349.5" text-anchor="start" style="font-size:11.5px;fill:#78829a">coloreada da siempre UNA red ordinaria única.</text>
